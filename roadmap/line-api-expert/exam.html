rn off signature verification for redelivered events", "Reply with HTTP 500 so LINE stops redelivering"], "correct": 1, "explanation": "Each webhook event has a unique <code>webhookEventId<\/code>, and redelivered events are marked with <code>deliveryContext.isRedelivery: true<\/code>. Store processed IDs and skip repeats so the side effects run only once.", "references": [{"label": "Receiving messages (webhook)", "url": "https://developers.line.biz/en/docs/messaging-api/receiving-messages/"}]}, {"id": "1.2-1", "section": 1, "subtopic": "1.2", "type": "single", "prompt": "A user sends a question and your bot answers it right away. Which API is the cheapest choice for that answer?", "options": ["Push message to the user's ID", "Reply message with the <code>replyToken<\/code> from the webhook event", "Broadcast message", "Multicast message with one recipient"], "correct": 1, "explanation": "Reply messages answer an event with its reply token and do not count toward the monthly message quota; push, multicast, narrowcast and broadcast do. A reply token can be used once and only for a short time after the event.", "references": [{"label": "Sending messages", "url": "https://developers.line.biz/en/docs/messaging-api/sending-messages/"}]}, {"id": "1.2-2", "section": 1, "subtopic": "1.2", "type": "single", "prompt": "You need to send the same message to 1,200 specific users whose user IDs you know. What is the right way?", "options": ["One broadcast request", "Multicast, split into requests of at most 500 user IDs each", "One multicast request with all 1,200 IDs", "1,200 reply messages"], "correct": 1, "explanation": "Multicast accepts up to 500 user IDs per request, so 1,200 users need three requests. Broadcast goes to every friend, not a chosen list, and reply needs a reply token from each user's event.", "references": [{"label": "Messaging API reference", "url": "https://developers.line.biz/en/reference/messaging-api/"}]}, {"id": "1.2-3", "section": 1, "subtopic": "1.2", "type": "single", "prompt": "Your bot must show 8 products in one reply, each with an image, price and a Buy button. Which design fits the API limits?", "options": ["8 separate Flex Messages in one reply request", "One Flex Message carousel with 8 bubbles", "8 image messages followed by a text message", "One text message with 8 links"], "correct": 1, "explanation": "A reply or push request can carry at most 5 message objects, so 8 separate messages are rejected. A Flex carousel holds up to 12 bubbles and counts as one message.", "references": [{"label": "Using Flex Messages", "url": "https://developers.line.biz/en/docs/messaging-api/using-flex-messages/"}, {"label": "Messaging API reference", "url": "https://developers.line.biz/en/reference/messaging-api/"}]}, {"id": "1.2-4", "section": 1, "subtopic": "1.2", "type": "single", "prompt": "A button must send an order ID to your server without posting any text into the chat as the user. Which action do you use?", "options": ["Message action", "URI action", "Postback action", "Camera action"], "correct": 2, "explanation": "A postback action delivers its <code>data<\/code> string to your webhook as a postback event. Showing text in the chat is optional (<code>displayText<\/code>). A message action sends visible text as if the user typed it.", "references": [{"label": "Action objects", "url": "https://developers.line.biz/en/docs/messaging-api/actions/"}]}, {"id": "1.3-1", "section": 1, "subtopic": "1.3", "type": "single", "prompt": "VIP customers must see a different rich menu from everyone else. What do you do?", "options": ["Create a second rich menu and link it to each VIP user ID", "Replace the default rich menu every time a VIP opens the chat", "Create a second LINE Official Account for VIPs", "Send the VIP menu as a Flex Message each day"], "correct": 0, "explanation": "Rich menus can be linked to individual users (one at a time or in bulk). A per-user rich menu takes priority over the default rich menu.", "references": [{"label": "Using rich menus", "url": "https://developers.line.biz/en/docs/messaging-api/using-rich-menus/"}]}, {"id": "1.3-2", "section": 1, "subtopic": "1.3", "type": "single", "prompt": "Your rich menu needs tabs (Shop / Account) that switch instantly without your server doing anything. What does LINE provide for this?", "options": ["A postback action that your server answers by linking a new menu", "Rich menu aliases and the rich menu switch action", "Imagemap messages", "LIFF in Compact size"], "correct": 1, "explanation": "Give each rich menu an alias and use the <code>richmenuswitch<\/code> action. The LINE app switches the menu itself, with no round trip to your server.", "references": [{"label": "Using rich menus", "url": "https://developers.line.biz/en/docs/messaging-api/using-rich-menus/"}]}, {"id": "1.3-3", "section": 1, "subtopic": "1.3", "type": "single", "prompt": "A push request times out, so you don't know whether LINE accepted it. How do you retry without risking a duplicate message?", "options": ["Retry immediately without changes", "Retry with the same <code>X-Line-Retry-Key<\/code> UUID you sent the first time", "Generate a new <code>X-Line-Retry-Key<\/code> for the retry", "Switch to the reply API for the retry"], "correct": 1, "explanation": "Send a UUID in <code>X-Line-Retry-Key<\/code> and reuse it on retries. If the first request was already accepted, the retry returns 409 Conflict instead of sending the message again.", "references": [{"label": "Retrying failed API requests", "url": "https://developers.line.biz/en/docs/messaging-api/retrying-api-request/"}]}, {"id": "2.1-1", "section": 2, "subtopic": "2.1", "type": "single", "prompt": "What does the <code>state<\/code> parameter in the LINE Login authorization request protect against?", "options": ["Cross-site request forgery: your callback checks that the returned state matches the one you stored for this session", "Token theft from your database", "Replay of an ID token", "Users denying permission"], "correct": 0, "explanation": "Generate a random <code>state<\/code>, keep it in the user's session, and reject the callback if the returned value differs. That stops an attacker from completing a login in someone else's browser.", "references": [{"label": "Integrating LINE Login with your web app", "url": "https://developers.line.biz/en/docs/line-login/integrate-line-login/"}]}, {"id": "2.1-2", "section": 2, "subtopic": "2.1", "type": "single", "prompt": "Which description of PKCE with LINE Login is correct?", "options": ["Send the code verifier in the authorization request and the code challenge in the token request", "Send <code>code_challenge<\/code> = Base64URL(SHA-256(code_verifier)) with <code>code_challenge_method=S256<\/code> in the authorization request, then send the <code>code_verifier<\/code> in the token request", "PKCE replaces the <code>state<\/code> parameter, so state is no longer needed", "PKCE only applies to the Messaging API"], "correct": 1, "explanation": "The client keeps a random code verifier, sends its S256 challenge when asking for authorization, and proves possession by sending the verifier when exchanging the code. An intercepted authorization code alone is then useless.", "references": [{"label": "Integrating PKCE with LINE Login", "url": "https://developers.line.biz/en/docs/line-login/integrate-pkce/"}]}, {"id": "2.1-3", "section": 2, "subtopic": "2.1", "type": "single", "prompt": "Why do you send a <code>nonce<\/code> in the authorization request?", "options": ["To choose which scopes to request", "It appears in the ID token, so you can check it matches and reject replayed tokens", "To set the session timeout", "To pick the language of the consent screen"], "correct": 1, "explanation": "The nonce is copied into the ID token. Comparing it with the value you stored stops an attacker from replaying an old ID token.", "references": [{"label": "Integrating LINE Login with your web app", "url": "https://developers.line.biz/en/docs/line-login/integrate-line-login/"}, {"label": "Verify ID tokens", "url": "https://developers.line.biz/en/docs/line-login/verify-id-token/"}]}, {"id": "2.2-1", "section": 2, "subtopic": "2.2", "type": "single", "prompt": "Your SPA calls your API with <code>{ \"userId\": \"U123...\" }<\/code> taken from the client. How should the backend identify the user instead?", "options": ["Trust the userId; it comes from LINE", "Have the client send the ID token, verify it on the server (for example via the verify endpoint with your channel ID), and use the <code>sub<\/code> claim", "Look up the user by display name", "Send the channel secret to the client so it can sign the user ID"], "correct": 1, "explanation": "Anything the client sends can be forged. Verify the ID token on the server (POST <code>https://api.line.me/oauth2/v2.1/verify<\/code> with <code>id_token<\/code> and <code>client_id<\/code>) and use its <code>sub<\/code> as the user ID.", "references": [{"label": "Verify ID tokens", "url": "https://developers.line.biz/en/docs/line-login/verify-id-token/"}]}, {"id": "2.2-2", "section": 2, "subtopic": "2.2", "type": "multi", "prompt": "Which checks belong to verifying a LINE Login ID token yourself? (Choose 3)", "options": ["<code>iss<\/code> is <code>https://access.line.me<\/code>", "<code>aud<\/code> equals your LINE Login channel ID", "<code>exp<\/code> is in the future", "The <code>email<\/code> claim is present", "<code>sub<\/code> equals your Messaging API channel ID"], "correct": [0, 1, 2], "explanation": "Check the signature, issuer, audience (your channel ID), expiry and nonce. <code>email<\/code> only appears when you request the email scope and have email permission, and <code>sub<\/code> is the user's ID, not a channel ID.", "references": [{"label": "Verify ID tokens", "url": "https://developers.line.biz/en/docs/line-login/verify-id-token/"}]}, {"id": "2.2-3", "section": 2, "subtopic": "2.2", "type": "single", "prompt": "You need the user's email address from LINE Login. What is required?", "options": ["Nothing; email is always in the ID token", "Request the <code>openid<\/code> and <code>email<\/code> scopes, and apply for email address permission for the channel in the LINE Developers Console", "Call the Messaging API profile endpoint", "Use the <code>profile<\/code> scope only"], "correct": 1, "explanation": "Email comes in the ID token only with the <code>email<\/code> scope, and the channel must first be granted email permission in the console. The user can also decline.", "references": [{"label": "Integrating LINE Login with your web app", "url": "https://developers.line.biz/en/docs/line-login/integrate-line-login/"}]}, {"id": "2.3-1", "section": 2, "subtopic": "2.3", "type": "single", "prompt": "In the account-linking flow, how does your server know which of your own users a LINE user just linked?", "options": ["From the link token alone", "Your service creates a nonce tied to its own user ID; the <code>accountLink<\/code> webhook event returns that nonce", "From the user's display name in the webhook", "By asking the user to type their member number into the chat"], "correct": 1, "explanation": "After the user logs in to your service, you create a nonce mapped to your user ID and redirect to the LINE account-link URL with the link token and nonce. The <code>accountLink<\/code> event returns the nonce, so you can join the LINE user ID to your user.", "references": [{"label": "Linking user accounts", "url": "https://developers.line.biz/en/docs/messaging-api/linking-accounts/"}]}, {"id": "2.3-2", "section": 2, "subtopic": "2.3", "type": "single", "prompt": "Which statement about the link token used for account linking is correct?", "options": ["It never expires", "It is valid for a short time (10 minutes) and can be used once", "It is the same as the channel access token", "It can be issued without a user ID"], "correct": 1, "explanation": "You issue a link token for a specific user ID; it is valid for 10 minutes and can be used only once. Issue a new one if the user starts again.", "references": [{"label": "Linking user accounts", "url": "https://developers.line.biz/en/docs/messaging-api/linking-accounts/"}]}, {"id": "2.3-3", "section": 2, "subtopic": "2.3", "type": "single", "prompt": "You want the LINE Login consent screen to offer adding your LINE Official Account as a friend. What is needed?", "options": ["Link the Official Account to the LINE Login channel in the console and set <code>bot_prompt<\/code> (<code>normal<\/code> or <code>aggressive<\/code>)", "Send a push message asking users to add the account", "Add the <code>friends<\/code> scope", "Nothing; it is shown by default"], "correct": 0, "explanation": "Link the Official Account to the LINE Login channel, then use <code>bot_prompt=normal<\/code> (an option on the consent screen) or <code>aggressive<\/code> (a separate screen after consent). The callback tells you whether friendship changed.", "references": [{"label": "Add a LINE Official Account as a friend when logged in", "url": "https://developers.line.biz/en/docs/line-login/link-a-bot/"}]}, {"id": "3.1-1", "section": 3, "subtopic": "3.1", "type": "single", "prompt": "Your LIFF app calls <code>liff.getProfile()<\/code> right on page load and it fails at random. What is the fix?", "options": ["Call it inside a <code>setTimeout<\/code> of 1 second", "Wait for the promise from <code>liff.init({ liffId })<\/code> to resolve before calling other LIFF methods", "Call <code>liff.login()<\/code> before <code>liff.init()<\/code>", "Load the SDK twice"], "correct": 1, "explanation": "Most LIFF methods may only be used after <code>liff.init()<\/code> has resolved. Run your app logic in its <code>.then()<\/code> or after <code>await<\/code>.", "references": [{"label": "Developing a LIFF app", "url": "https://developers.line.biz/en/docs/liff/developing-liff-apps/"}]}, {"id": "3.1-2", "section": 3, "subtopic": "3.1", "type": "single", "prompt": "A booking form should cover about half of the screen so the chat stays visible. Which LIFF size do you set?", "options": ["Full", "Tall", "Compact", "Popup"], "correct": 2, "explanation": "LIFF has three sizes: Compact (about 50% of the screen), Tall (about 80%) and Full (100%).", "references": [{"label": "Developing a LIFF app", "url": "https://developers.line.biz/en/docs/liff/developing-liff-apps/"}]}, {"id": "3.1-3", "section": 3, "subtopic": "3.1", "type": "single", "prompt": "Users open <code>https://liff.line.me/{liffId}/orders/42<\/code> but always land on your home page. What is the likely cause?", "options": ["The LIFF ID is wrong", "Your router changes or strips the URL before <code>liff.init()<\/code> finishes processing <code>liff.state<\/code>", "Deep paths are not supported by LIFF", "The size must be Full for deep links"], "correct": 1, "explanation": "The extra path arrives at your endpoint as the <code>liff.state<\/code> query parameter; <code>liff.init()<\/code> then redirects to the real path. Don't rewrite the URL before init resolves.", "references": [{"label": "Developing a LIFF app", "url": "https://developers.line.biz/en/docs/liff/developing-liff-apps/"}]}, {"id": "3.2-1", "section": 3, "subtopic": "3.2", "type": "single", "prompt": "<code>liff.sendMessages()<\/code> works inside LINE but fails when the same page is opened in Safari. Why?", "options": ["The SDK version is too old", "It only works when the LIFF app is opened in the LINE app from a chat, and needs the <code>chat_message.write<\/code> scope", "Safari blocks HTTPS", "It needs Full size"], "correct": 1, "explanation": "<code>liff.sendMessages()<\/code> sends to the chat the LIFF app was opened from, so it can't run in an external browser. Use <code>liff.isInClient()<\/code> to hide the feature outside LINE.", "references": [{"label": "LIFF API reference", "url": "https://developers.line.biz/en/reference/liff/"}]}, {"id": "3.2-2", "section": 3, "subtopic": "3.2", "type": "single", "prompt": "Users should be able to send a coupon card to friends and groups they pick themselves. Which LIFF feature fits?", "options": ["<code>liff.sendMessages()<\/code>", "<code>liff.shareTargetPicker()<\/code>", "<code>liff.openWindow()<\/code>", "<code>liff.getFriendship()<\/code>"], "correct": 1, "explanation": "The share target picker lets the user choose friends or groups and sends your messages to them. Turn it on for the LIFF app in the console first.", "references": [{"label": "Developing a LIFF app", "url": "https://developers.line.biz/en/docs/liff/developing-liff-apps/"}, {"label": "LIFF API reference", "url": "https://developers.line.biz/en/reference/liff/"}]}, {"id": "3.2-3", "section": 3, "subtopic": "3.2", "type": "single", "prompt": "Your LIFF app must read a QR code printed on a store table. Which method do you call?", "options": ["<code>liff.scanCodeV2()<\/code>", "<code>liff.getContext()<\/code>", "<code>liff.permanentLink.createUrlBy()<\/code>", "<code>liff.ready<\/code>"], "correct": 0, "explanation": "<code>liff.scanCodeV2()<\/code> opens a two-dimensional code reader and returns the scanned value. Enable the scan feature for the LIFF app in the console.", "references": [{"label": "LIFF API reference", "url": "https://developers.line.biz/en/reference/liff/"}]}, {"id": "3.3-1", "section": 3, "subtopic": "3.3", "type": "single", "prompt": "Your LIFF frontend posts the user's profile to your API to award points. How do you stop a user from claiming points as someone else?", "options": ["Trust <code>liff.getProfile()<\/code>, because it runs inside LINE", "Send <code>liff.getIDToken()<\/code> (or the access token) and verify it on the server before using the user ID", "Hide the API URL in the JavaScript", "Check the User-Agent for \"Line\""], "correct": 1, "explanation": "Profile data in the browser can be changed. Verify the ID token (or access token) on the server and take the user ID from the verified result.", "references": [{"label": "Developing a LIFF app", "url": "https://developers.line.biz/en/docs/liff/developing-liff-apps/"}, {"label": "Verify ID tokens", "url": "https://developers.line.biz/en/docs/line-login/verify-id-token/"}]}, {"id": "3.3-2", "section": 3, "subtopic": "3.3", "type": "single", "prompt": "A layout bug only appears inside LINE's in-app browser on a phone. Which tool lets you inspect it with Chrome DevTools?", "options": ["LIFF Inspector", "Flex Message Simulator", "LINE Official Account Manager", "Rich menu editor"], "correct": 0, "explanation": "The LIFF Inspector plugin connects the LIFF app running on a device to Chrome DevTools. LIFF Mock helps you test without the LINE app.", "references": [{"label": "LIFF plugins (LIFF Inspector, LIFF Mock)", "url": "https://developers.line.biz/en/docs/liff/liff-plugin/"}]}, {"id": "3.3-3", "section": 3, "subtopic": "3.3", "type": "single", "prompt": "A user opens your LIFF URL in a desktop browser and <code>liff.isLoggedIn()<\/code> is false. What should the app do?", "options": ["Show an error and stop", "Call <code>liff.login()<\/code> (or init with <code>withLoginOnExternalBrowser: true<\/code>)", "Call <code>liff.sendMessages()<\/code>", "Redirect to the LINE Official Account"], "correct": 1, "explanation": "Inside LINE the user is logged in automatically. In an external browser you start LINE Login with <code>liff.login()<\/code>, or let <code>liff.init()<\/code> do it with <code>withLoginOnExternalBrowser<\/code>.", "references": [{"label": "LIFF API reference", "url": "https://developers.line.biz/en/reference/liff/"}]}, {"id": "4.1-1", "section": 4, "subtopic": "4.1", "type": "single", "prompt": "What is a LINE MINI App built on?", "options": ["A native iOS/Android SDK", "LIFF: the same web SDK and APIs as a LIFF app", "Flex Messages only", "The LINE Things SDK"], "correct": 1, "explanation": "A LINE MINI App is a web app that runs on LIFF, so your LIFF skills carry over. It adds its own channel type, review and features such as service messages.", "references": [{"label": "LINE MINI App overview", "url": "https://developers.line.biz/en/docs/line-mini-app/discover/overview/"}]}, {"id": "4.1-2", "section": 4, "subtopic": "4.1", "type": "single", "prompt": "Which message is a proper use of LINE MINI App service messages?", "options": ["A weekly promotion to every user", "A reservation confirmation right after the user books in the MINI App", "A newsletter to users who never opened the app", "A survey to all friends of the Official Account"], "correct": 1, "explanation": "Service messages are transactional notices tied to something the user just did in the MINI App, such as an order or booking confirmation. They are not for advertising.", "references": [{"label": "LINE MINI App overview", "url": "https://developers.line.biz/en/docs/line-mini-app/discover/overview/"}]}, {"id": "4.2-1", "section": 4, "subtopic": "4.2", "type": "single", "prompt": "Which beacon webhook event type fires when a user's phone comes into range of your LINE Beacon?", "options": ["<code>enter<\/code>", "<code>join<\/code>", "<code>follow<\/code>", "<code>memberJoined<\/code>"], "correct": 0, "explanation": "Beacon events carry the beacon's <code>hwid<\/code> and a type: <code>enter<\/code> when the user comes into range, plus <code>banner<\/code> and <code>stay<\/code> for those features.", "references": [{"label": "Using beacons", "url": "https://developers.line.biz/en/docs/messaging-api/using-beacons/"}]}, {"id": "4.2-2", "section": 4, "subtopic": "4.2", "type": "single", "prompt": "Your bot never receives beacon events in the store. Which condition is needed for them to arrive?", "options": ["The user has added your Official Account as a friend and has Bluetooth and LINE Beacon turned on", "The user has opened a LIFF app in the last hour", "The bot uses a long-lived channel access token", "The rich menu has a beacon button"], "correct": 0, "explanation": "LINE sends beacon events only for users who are friends of the account linked to the beacon and who have Bluetooth and the LINE Beacon setting on. The beacon's hardware ID must also be linked to your bot.", "references": [{"label": "Using beacons", "url": "https://developers.line.biz/en/docs/messaging-api/using-beacons/"}]}, {"id": "4.3-1", "section": 4, "subtopic": "4.3", "type": "single", "prompt": "Your AI agent needs about 20 seconds to answer. How do you show the user that it is working?", "options": ["Send a text \"Please wait\" with push", "Call the loading animation API with the user's ID as <code>chatId<\/code> and <code>loadingSeconds<\/code> of 20", "Change the rich menu", "Open a LIFF app"], "correct": 1, "explanation": "The loading animation shows in one-on-one chats for 5–60 seconds (in steps of 5) and disappears as soon as your bot sends a message. It doesn't cost a message.", "references": [{"label": "Display a loading animation", "url": "https://developers.line.biz/en/docs/messaging-api/use-loading-indicator/"}]}, {"id": "4.3-2", "section": 4, "subtopic": "4.3", "type": "single", "prompt": "Your bot should quote the exact user message it is answering. What do you use?", "options": ["The <code>replyToken<\/code>", "The <code>quoteToken<\/code> from the message event, set on your text message", "The message ID in the URL", "A postback action"], "correct": 1, "explanation": "Message events include a <code>quoteToken<\/code>. Put it on a text (or sticker) message you send to show the user's message as a quote.", "references": [{"label": "Messaging API reference", "url": "https://developers.line.biz/en/reference/messaging-api/"}]}, {"id": "4.3-3", "section": 4, "subtopic": "4.3", "type": "single", "prompt": "LINE notification messages (formerly LINE Official Notification) let a business notify users who are not friends of its account. How is the recipient identified?", "options": ["By the user's LINE user ID", "By the user's phone number (hashed)", "By email address", "By display name"], "correct": 1, "explanation": "These messages target users by phone number, need a separate application and approval, and are only for notices the user is expecting, such as delivery or payment updates.", "references": [{"label": "LINE Developers documentation", "url": "https://developers.line.biz/en/docs/"}]}, {"id": "5.1-1", "section": 5, "subtopic": "5.1", "type": "single", "prompt": "During a flash sale your webhook handler calls an LLM and a database before answering, and LINE starts seeing timeouts. What is the fix?", "options": ["Increase the server's CPU", "Verify the signature, put the event on a queue (Cloud Tasks / Pub/Sub), return 200 at once, and process it in a worker", "Turn off webhook redelivery", "Return 202 only for slow events"], "correct": 1, "explanation": "Webhook handlers should answer fast. Doing slow work after the HTTP response (in a queue worker) keeps the endpoint healthy under bursts; idempotency by <code>webhookEventId<\/code> covers redeliveries.", "references": [{"label": "Receiving messages (webhook)", "url": "https://developers.line.biz/en/docs/messaging-api/receiving-messages/"}]}, {"id": "5.1-2", "section": 5, "subtopic": "5.1", "type": "single", "prompt": "A campaign sends many pushes and the API starts returning 429. What should your sender do?", "options": ["Retry immediately in a tight loop", "Throttle through a queue, back off and retry, reusing each message's <code>X-Line-Retry-Key<\/code>", "Switch to broadcast for every message", "Issue more channel access tokens"], "correct": 1, "explanation": "429 means you hit a rate limit. Slow down, back off, and retry with the same retry key so no user gets the message twice.", "references": [{"label": "Messaging API rate limits", "url": "https://developers.line.biz/en/reference/messaging-api/#rate-limits"}, {"label": "Retrying failed API requests", "url": "https://developers.line.biz/en/docs/messaging-api/retrying-api-request/"}]}, {"id": "5.1-3", "section": 5, "subtopic": "5.1", "type": "single", "prompt": "Before a big push campaign you want to know how many messages you can still send this month. Which endpoints help?", "options": ["Get the target limit (quota) and the number of messages sent this month", "Get profile", "Get rich menu list", "Get webhook endpoint"], "correct": 0, "explanation": "The quota endpoints return the monthly message limit and how many messages have been used, so you can check before sending.", "references": [{"label": "Get the message quota", "url": "https://developers.line.biz/en/reference/messaging-api/#get-quota"}]}, {"id": "5.2-1", "section": 5, "subtopic": "5.2", "type": "single", "prompt": "Which describes a channel access token v2.1?", "options": ["Issued from the console only, never expires", "Issued with a JWT you sign with your own private key (public key registered in the console); you choose an expiry of up to 30 days", "Valid for 15 minutes and cannot be revoked", "The same thing as the channel secret"], "correct": 1, "explanation": "v2.1 tokens are issued with a signed JWT assertion. You set the expiry (up to 30 days) and can revoke them. The 15-minute, non-revocable token is the stateless channel access token.", "references": [{"label": "Channel access tokens", "url": "https://developers.line.biz/en/docs/basics/channel-access-token/"}]}, {"id": "5.2-2", "section": 5, "subtopic": "5.2", "type": "single", "prompt": "A short-lived serverless function needs a token for each run and can't store state between runs. Which token fits best?", "options": ["Long-lived channel access token pasted in the code", "Stateless channel access token, issued per run", "The channel secret", "A LINE Login access token"], "correct": 1, "explanation": "Stateless channel access tokens are valid for 15 minutes and you can issue as many as you need, so each run can get a fresh one without storing it.", "references": [{"label": "Channel access tokens", "url": "https://developers.line.biz/en/docs/basics/channel-access-token/"}]}, {"id": "5.2-3", "section": 5, "subtopic": "5.2", "type": "single", "prompt": "Where should the channel secret and the private key for token v2.1 live?", "options": ["In the Git repository so CI can use them", "In a secret manager (for example Google Secret Manager), read by the server at runtime", "In the LIFF frontend", "In the rich menu metadata"], "correct": 1, "explanation": "Secrets must stay on the server and out of source control. A secret manager gives access control, audit logs and rotation.", "references": [{"label": "Channel access tokens", "url": "https://developers.line.biz/en/docs/basics/channel-access-token/"}]}, {"id": "5.3-1", "section": 5, "subtopic": "5.3", "type": "single", "prompt": "LINE support asks for something that identifies a failed API call. Which value should your logs keep for every request?", "options": ["The channel secret", "The <code>X-Line-Request-Id<\/code> response header", "The user's display name", "The full channel access token"], "correct": 1, "explanation": "Every Messaging API response has an <code>X-Line-Request-Id<\/code>. Log it with the error, and never log secrets or tokens.", "references": [{"label": "Messaging API error responses", "url": "https://developers.line.biz/en/reference/messaging-api/#error-responses"}]}, {"id": "5.3-2", "section": 5, "subtopic": "5.3", "type": "single", "prompt": "How do you test signature verification and webhook handling in CI without calling LINE?", "options": ["Turn off verification in CI", "Sign fixture payloads with a test channel secret in the test, and mock the Messaging API endpoints", "Point CI at the production channel", "Skip webhook tests"], "correct": 1, "explanation": "Compute the HMAC-SHA256 signature of your fixture bodies with a test secret and stub the API calls. The real verification code then runs in CI.", "references": [{"label": "Verifying webhook signatures", "url": "https://developers.line.biz/en/docs/messaging-api/receiving-messages/#verifying-signature"}]}, {"id": "6.1-1", "section": 6, "subtopic": "6.1", "type": "single", "prompt": "Which piece of work best shows hands-on LINE API expertise to the community?", "options": ["A list of certificates", "An open-source project used in production, with a write-up of the architecture and the problems it solved", "Screenshots of a bot", "A long list of followers"], "correct": 1, "explanation": "Running code that others can use, plus an honest write-up of design choices and pitfalls, shows both skill and willingness to share.", "references": [{"label": "LINE Developers Community", "url": "https://developers.line.biz/en/community/"}]}, {"id": "6.1-2", "section": 6, "subtopic": "6.1", "type": "single", "prompt": "You publish a tutorial with a sample LINE bot repo. What must it never contain?", "options": ["A README", "Version numbers of the SDK", "Real channel secrets or access tokens", "A license file"], "correct": 2, "explanation": "Secrets in a public repo can be abused within minutes. Use environment variables and an example <code>.env<\/code> with placeholders.", "references": [{"label": "Channel access tokens", "url": "https://developers.line.biz/en/docs/basics/channel-access-token/"}]}, {"id": "6.2-1", "section": 6, "subtopic": "6.2", "type": "single", "prompt": "In a community group someone posts a screenshot showing their channel access token. What is the most useful advice?", "options": ["Delete the screenshot; that is enough", "Revoke or reissue the token right away, then keep secrets out of code and screenshots", "Change the bot's display name", "Wait and see whether it is abused"], "correct": 1, "explanation": "Anyone who saw the token can send messages as the bot. Revoke or reissue it first, then fix how secrets are stored.", "references": [{"label": "Channel access tokens", "url": "https://developers.line.biz/en/docs/basics/channel-access-token/"}]}, {"id": "6.2-2", "section": 6, "subtopic": "6.2", "type": "single", "prompt": "You run a 2-hour hands-on workshop on building a LINE bot. What prevents most lost time?", "options": ["Live-coding everything with no prepared steps", "Asking attendees to create providers and channels before the session and giving them a working starter repo with a public webhook option", "Skipping the webhook part", "Using one shared channel for every attendee"], "correct": 1, "explanation": "Console setup and exposing a webhook are the usual blockers. Prepare them in advance so the session is spent building.", "references": [{"label": "LINE Developers Community", "url": "https://developers.line.biz/en/community/"}]}]}</script>
