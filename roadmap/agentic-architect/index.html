<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Architect Learning Roadmap · Learning Roadmaps</title>
<link rel="icon" type="image/svg+xml" href="../../images/shared/logos/b-favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../../images/shared/logos/b-favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../../images/shared/logos/b-favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="../../images/shared/logos/b-favicon-180.png">
<link href="../../fonts/fonts.css" rel="stylesheet">
<link href="../assets/doc.css" rel="stylesheet">
<script>try{var t=localStorage.getItem("doc-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link href="../assets/roadmap.css" rel="stylesheet">
</head>
<body data-slug="roadmap" data-roadmap="agentic-architect" class="hand">
<header class="topbar">
  <button class="tb-btn menu-btn" id="menu-btn" type="button" aria-label="Open menu">☰</button>
  <a class="brand" id="brand-link" href="../index.html"><img id="brand-logo" src="../../images/shared/logos/googlecloud.svg" alt=""><span id="brand-title">Learning Roadmaps</span></a>
  <span class="sp"></span>
  <button class="tb-btn" id="theme-btn" type="button">Light / dark</button>
</header>
<div class="shell">
<nav id="sidebar" aria-label="Modules"></nav>
<div class="page" style="grid-template-columns:minmax(0,1fr)">
<main>
  <nav class="rm-switcher" id="rm-switcher" aria-label="Switch roadmap"></nav>

  <div class="rm-head">
    <div class="kicker" id="rm-kicker">Step-by-step journey</div>
    <h1 id="_top">Learning Roadmap</h1>
    <p id="rm-intro"></p>
  </div>

  <div class="rm-bar">
    <div class="rm-prog"><div class="track"><div class="fill" id="fill"></div></div><b id="count">0 / 0 done</b></div>
    <div class="legend" id="rm-legend"></div>
    <button class="tb-btn rm-reset" id="reset" type="button">Reset progress</button>
  </div>

  <div class="rm" id="rm">
    <svg class="wires" id="wires" aria-hidden="true"></svg>
    <div class="cap-row"><a class="cap" id="start" href="index.html">▶ Start</a></div>
    <div id="stages"></div>
    <div class="cap-row end"><a class="cap" id="finish" href="index.html">🎓 Finish</a></div>
    <p class="tip" id="rm-tip"></p>
  </div>
</main>
</div>
</div>


<script src="../assets/doc.js"></script>
<script src="data.js"></script>
<script src="../assets/roadmaps.js"></script>
<script src="../assets/roadmap.js"></script>
</body>
</html>
