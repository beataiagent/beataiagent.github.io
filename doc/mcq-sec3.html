<script>
(function() {
  const QUESTIONS = [
    {
      id: 1, sec: "3.1", multi: false,
      arch: "[Parent Coordinator LlmAgent] --(Inspects Child 'description' Only)--> [Selects Target Sub-Agent]",
      stem: "Rosku Bank's root Coordinator LlmAgent delegates user requests to three sub-agents: CardAgent, MortgageAgent, and WireAgent. After a prompt update, the Coordinator repeatedly routes mortgage refinancing queries to CardAgent. Engineers verify that MortgageAgent's 'instruction' parameter contains detailed refinancing rules, while its 'description' is set to 'Handles general retail banking products'. How should you fix the routing issue?",
      opts: [
        "A. Prepend a high-priority refinancing routing directive to the top of MortgageAgent's instruction.",
        "B. Update MortgageAgent's description parameter to explicitly state its refinancing capabilities.",
        "C. Set disallow_transfer_to_peers=True on CardAgent so it rejects misrouted refinancing requests.",
        "D. Configure an output_key on the Coordinator LlmAgent that writes user intent to session.state."
      ],
      ans: [1],
      exp: "Correct (B): When a parent LlmAgent evaluates sub_agents for dynamic routing, it inspects only each child's name and description—never the child's internal instruction string.",
      hood: "Architecture rule: Parent routing relies on 'description'; internal agent behavior relies on 'instruction'."
    },
    {
      id: 2, sec: "3.1", multi: false,
      arch: "[Agent 1: Calls Tool + Saves to output_key] --> [Agent 2: No Tools + Applies output_schema=PydanticModel]",
      stem: "You are configuring an ADK LlmAgent that must invoke a custom Python tool (fetch_credit_report) and return its final response conforming strictly to a Pydantic BaseModel class (CreditSummarySchema). When you configure both tools=[fetch_credit_report] and output_schema=CreditSummarySchema on the same LlmAgent, tool execution fails. Which architecture resolves this constraint?",
      opts: [
        "A. Wrap fetch_credit_report in a LongRunningFunctionTool on the same agent with output_schema.",
        "B. Replace output_schema with an after_tool_callback that mutates llm_request schemas dynamically.",
        "C. Use a SequentialAgent: Agent 1 calls the tool and saves to output_key; Agent 2 sets output_schema.",
        "D. Set include_contents='none' and temperature=0.0 on the single agent so JSON runs after tools."
      ],
      ans: [2],
      exp: "Correct (C): Setting output_schema on an LlmAgent constrains model decoding to strict JSON immediately and disables tool calling on that agent. Chaining a tool-calling agent (saving to output_key) with a schema-formatting agent inside a SequentialAgent solves the conflict.",
      hood: "Architecture rule: Never combine tools and output_schema on the same LlmAgent."
    },
    {
      id: 3, sec: "3.1", multi: false,
      arch: "[Downstream Formatter LlmAgent] + [include_contents='none' + '{raw_data}' in instruction] --> [Zero Chat History Bloat]",
      stem: "In a 4-stage underwriting pipeline, the final stage is a stateless JSON normalizer LlmAgent that only needs to format the string stored in session.state['underwriting_notes']. However, because customers often chat for 40+ turns before underwriting runs, the normalizer agent is consuming 35,000 input tokens of prior conversation history on every invocation. How should you eliminate this token overhead?",
      opts: [
        "A. Set include_contents='none' on the normalizer agent and inject {underwriting_notes} in instruction.",
        "B. Prefix the state variable as temp:underwriting_notes so the Runner prunes prior chat history.",
        "C. Set disallow_transfer_to_parent=True on the normalizer agent and lower max_output_tokens to 512.",
        "D. Attach a BuiltInPlanner with thinking_budget=0 to the normalizer agent with default contents."
      ],
      ans: [0],
      exp: "Correct (A): Setting include_contents='none' strips prior conversation history turns from the LLM request while still interpolating {state_key} placeholders inside the agent's instruction.",
      hood: "Architecture rule: Use include_contents='none' + {state_key} templating for stateless worker sub-agents."
    },
    {
      id: 4, sec: "3.1", multi: false,
      arch: "[instruction='Assist client. Promo code: {promo_code?}'] --> [Trailing '?' Safely Ignores Missing Key on Turn 1]",
      stem: "Your ADK LlmAgent instruction includes the template string: 'Assist the customer with their loan. Apply promotional tier: {promo_code}.' When a new customer starts Turn 1 without a promotional code in session.state, the agent throws a KeyError during instruction interpolation. You want the agent to render an empty string gracefully when 'promo_code' is absent without writing a custom Python function. What should you change?",
      opts: [
        "A. Change the placeholder syntax to {temp:promo_code} inside the LlmAgent instruction string.",
        "B. Change the placeholder syntax to {promo_code?} with a trailing question mark in instruction.",
        "C. Set output_key='promo_code' on the LlmAgent so ADK initializes the state key to None at boot.",
        "D. Escape the placeholder using double curly braces {{promo_code}} in the instruction string."
      ],
      ans: [1],
      exp: "Correct (B): In ADK dynamic instruction templating, appending a trailing question mark ({key?}) marks the state variable as optional, rendering an empty string if the key does not exist in session.state.",
      hood: "Architecture rule: Standard {key} requires the key to exist; {key?} makes state injection optional."
    },
    {
      id: 5, sec: "3.1", multi: true,
      arch: "[Instruction Has Literal JSON Braces + Needs Custom Logic] --> [Pass Callable InstructionProvider(ctx: ReadonlyContext) -> str]",
      stem: "A developer wants to embed a 50-line literal JSON example containing curly braces inside an LlmAgent's system prompt while also dynamically injecting the current day of the week and reading session.state['user:tier']. When they pass a raw string to 'instruction', ADK attempts to parse the literal JSON curly braces as state variable names and fails. Which two behaviors apply when passing a callable function (InstructionProvider) to 'instruction' instead? (Choose two.)",
      opts: [
        "A. The callable function receives a ReadonlyContext object providing read access to session.state.",
        "B. The callable function must return an LlmResponse object to short-circuit the Gemini API call.",
        "C. ADK skips automatic {brace} state interpolation on the string returned by the callable function.",
        "D. Passing a callable function to instruction automatically disables all tools on the LlmAgent.",
        "E. The callable function is executed once at container boot and cached globally across all users."
      ],
      ans: [0, 2],
      exp: "Correct (A, C): When you pass a callable InstructionProvider function to instruction, ADK invokes it on each turn with ReadonlyContext (A) and uses the returned string verbatim without running automatic {brace} template interpolation (C).",
      hood: "Architecture rule: Use an InstructionProvider callable when prompts contain literal curly braces or require custom Python logic."
    },
    {
      id: 6, sec: "3.1", multi: false,
      arch: "[Specialist Sub-Agent Must Complete Task Without Bouncing Back] --> [disallow_transfer_to_parent=True + disallow_transfer_to_peers=True]",
      stem: "In a hierarchical ADK system, a root Concierge Agent transfers complex tax questions to a TaxSpecialist LlmAgent. However, whenever a user asks a slightly ambiguous follow-up question, TaxSpecialist prematurely invokes transfer_to_agent to bounce the user back to the Concierge Agent or sideways to the BillingAgent. Which LlmAgent parameters prevent TaxSpecialist from initiating autonomous transfers?",
      opts: [
        "A. Set include_contents='none' and output_key='tax_locked' on the TaxSpecialist LlmAgent class.",
        "B. Configure PlanReActPlanner(disallow_handoff=True) on the root Concierge LlmAgent definition.",
        "C. Wrap the root Concierge Agent inside an AgentTool and attach it to TaxSpecialist's tool list.",
        "D. Set disallow_transfer_to_parent=True and disallow_transfer_to_peers=True on TaxSpecialist."
      ],
      ans: [3],
      exp: "Correct (D): Setting disallow_transfer_to_parent=True and disallow_transfer_to_peers=True on an LlmAgent removes the transfer_to_agent tool pathways for parent and sibling agents, forcing the specialist to complete the turn.",
      hood: "Architecture rule: Control dynamic handoff boundaries with disallow_transfer_to_parent and disallow_transfer_to_peers."
    },
    {
      id: 7, sec: "3.1", multi: false,
      arch: "[Model Doesn't Support Native Gemini Thinking] + [Needs Structured Plan-Act-Observe Reasoning] --> [PlanReActPlanner]",
      stem: "You are configuring an ADK LlmAgent to solve multi-step portfolio rebalancing problems. You want the agent to explicitly structure its output into a Planning phase, an Action (tool call) phase, and an Observation/Reasoning phase, even when running on a model endpoint that does not use native Gemini Thinking tokens. Which ADK planner class should you attach to the LlmAgent's 'planner' parameter?",
      opts: [
        "A. Attach BuiltInPlanner(thinking_config=types.ThinkingConfig(include_thoughts=True)) to planner.",
        "B. Attach SequentialAgent(sub_agents=[PlanAgent, ActAgent, ObserveAgent]) to the planner field.",
        "C. Attach PlanReActPlanner() to the planner parameter of the portfolio rebalancing LlmAgent.",
        "D. Attach ToolTrajectoryCriterion(match_type=MatchType.IN_ORDER) to the planner parameter field."
      ],
      ans: [2],
      exp: "Correct (C): PlanReActPlanner instructs the LlmAgent via structured prompt directives to follow an explicit Plan -> Action -> Reasoning/Observation loop regardless of whether native model thinking tokens (BuiltInPlanner) are used.",
      hood: "Architecture rule: BuiltInPlanner leverages native Gemini ThinkingConfig; PlanReActPlanner enforces prompt-based Plan-ReAct-Observe loops."
    },
    {
      id: 8, sec: "3.1", multi: false,
      arch: "[Gemini 2.5 Pro Native Thinking Budget Control] --> [BuiltInPlanner(thinking_config=types.ThinkingConfig(thinking_budget=2048))]",
      stem: "Rosku Bank's BondPricing LlmAgent uses Gemini 2.5 Pro to evaluate complex yield curves. You want to enable native model thinking tokens so the model reasons through multi-step bond math before calling tools, while capping the internal thinking token budget at 2,048 tokens to control latency. How should you configure the LlmAgent?",
      opts: [
        "A. Set planner=BuiltInPlanner(thinking_config=types.ThinkingConfig(include_thoughts=True, thinking_budget=2048)).",
        "B. Set max_output_tokens=2048 inside GenerateContentConfig and attach PlanReActPlanner() to the agent.",
        "C. Set output_key='thinking_budget_2048' and include_contents='none' on the BondPricing LlmAgent.",
        "D. Configure ContextCacheConfig(min_tokens=2048) on the parent SequentialAgent workflow wrapper."
      ],
      ans: [0],
      exp: "Correct (A): BuiltInPlanner wraps google.genai.types.ThinkingConfig, allowing you to enable native Gemini thinking tokens (include_thoughts=True) and bound reasoning latency/cost via thinking_budget.",
      hood: "Architecture rule: Native Gemini thinking token budgets are configured via BuiltInPlanner(thinking_config=types.ThinkingConfig(...))."
    },
    {
      id: 9, sec: "3.1", multi: false,
      arch: "[Injecting Text Artifact Contents Directly into LlmAgent instruction] --> [Use {artifact.filename} Placeholder]",
      stem: "An upstream tool saves a plain-text employment verification letter as an artifact named 'emp_letter.txt' in ArtifactService. You want the downstream Underwriter LlmAgent to automatically inject the text content of that artifact directly into its system instruction without writing a custom before_model_callback or tool. Which placeholder syntax inside 'instruction' accomplishes this?",
      opts: [
        "A. Use the {state:emp_letter.txt} placeholder syntax inside the LlmAgent instruction string.",
        "B. Use the {artifact.emp_letter.txt} placeholder syntax inside the LlmAgent instruction string.",
        "C. Use the {temp:artifact_emp_letter} placeholder syntax inside the LlmAgent instruction string.",
        "D. Use the {file://emp_letter.txt} placeholder syntax inside the LlmAgent instruction string."
      ],
      ans: [1],
      exp: "Correct (B): In ADK instruction templating, prefixing a placeholder with 'artifact.' (e.g., {artifact.emp_letter.txt}) instructs the Runner to load the named artifact from ArtifactService and inject its text content into the prompt.",
      hood: "Architecture rule: {key} injects session.state['key']; {artifact.name} injects the text of artifact 'name'."
    },
    {
      id: 10, sec: "3.1", multi: false,
      arch: "[Deterministic Classification & Tool Selection] --> [generate_content_config=types.GenerateContentConfig(temperature=0.0)]",
      stem: "Your Triage LlmAgent occasionally exhibits non-deterministic routing choices when given identical customer prompts across test runs. Where in the ADK LlmAgent definition should you set 'temperature=0.0' and 'max_output_tokens=512' to maximize routing determinism?",
      opts: [
        "A. Pass temperature=0.0 and max_output_tokens=512 in generate_content_config=GenerateContentConfig(...).",
        "B. Pass temperature=0.0 and max_output_tokens=512 directly inside the LlmAgent description string.",
        "C. Pass temperature=0.0 and max_output_tokens=512 inside ToolTrajectoryCriterion in test_config.json.",
        "D. Pass temperature=0.0 and max_output_tokens=512 inside EventActions(state_delta={'temp': 0.0})."
      ],
      ans: [0],
      exp: "Correct (A): Model sampling parameters (temperature, top_p, top_k, max_output_tokens, safety_settings) are configured on an LlmAgent by passing a google.genai.types.GenerateContentConfig instance to generate_content_config.",
      hood: "Architecture rule: Use generate_content_config=types.GenerateContentConfig(temperature=0.0) for deterministic routing and extraction."
    },
    {
      id: 11, sec: "3.2", multi: false,
      arch: "[ParallelAgent: 3 Concurrent Branches] --> [Assign Unique output_key per Branch] --> [Zero State Overwrites]",
      stem: "Rosku Bank uses an ADK ParallelAgent to run three sub-agents concurrently: EquifaxAgent, TransUnionAgent, and ExperianAgent. All three sub-agents are configured with output_key='bureau_score'. In production, downstream agents reading session.state['bureau_score'] only see data from whichever credit bureau responded last. How should you fix this bug while preserving concurrent execution?",
      opts: [
        "A. Replace the ParallelAgent with a SequentialAgent while keeping output_key='bureau_score'.",
        "B. Assign a distinct output_key to each branch ('equifax_score', 'tu_score', 'experian_score').",
        "C. Prefix the shared key as temp:bureau_score so ParallelAgent merges the three outputs into a list.",
        "D. Set include_contents='none' on all three sub-agents so state writes run in isolated memory."
      ],
      ans: [1],
      exp: "Correct (B): All branches inside a ParallelAgent share the same InvocationContext and session.state dictionary concurrently. Giving each branch a unique output_key prevents race-condition overwrites.",
      hood: "Architecture rule: Every sub-agent inside a ParallelAgent must write to a unique output_key."
    },
    {
      id: 12, sec: "3.2", multi: false,
      arch: "[LoopAgent(sub_agents=[Drafter, Critic], max_iterations=5)] --> [Critic Tool Sets tool_context.actions.escalate = True]",
      stem: "You configure an ADK LoopAgent with max_iterations=5 containing a Drafter LlmAgent and a ComplianceCritic LlmAgent. When the draft passes compliance on Iteration 2, ComplianceCritic outputs the text 'COMPLIANCE_PASSED'—yet the LoopAgent continues executing Iterations 3, 4, and 5 unnecessarily. How should you configure ComplianceCritic to terminate the LoopAgent immediately upon approval?",
      opts: [
        "A. Configure ComplianceCritic with output_key='escalate' and instruct it to output the string 'True'.",
        "B. Set disallow_transfer_to_peers=True on ComplianceCritic so control returns to the parent runner.",
        "C. Give ComplianceCritic a FunctionTool that sets tool_context.actions.escalate = True when approved.",
        "D. Attach an output_schema to ComplianceCritic containing a boolean field named terminate_loop=True."
      ],
      ans: [2],
      exp: "Correct (C): LoopAgent is a deterministic workflow controller that does not parse natural-language text outputs to decide termination. It exits early only when a sub-agent or tool emits an Event with EventActions(escalate=True) (such as setting tool_context.actions.escalate = True).",
      hood: "Architecture rule: Break a LoopAgent early by emitting EventActions(escalate=True) alongside a safety max_iterations cap."
    },
    {
      id: 13, sec: "3.2", multi: false,
      arch: "[Root Wealth Advisor Must Stay in Control & Synthesize Reply] --> [Wrap Specialist in AgentTool(agent=tax_agent)]",
      stem: "Rosku Bank's WealthAdvisor LlmAgent needs to consult a specialized TaxCalculator LlmAgent mid-turn to compute capital gains, then combine that tax figure with portfolio data and write the final response to the client itself. When the team attaches TaxCalculator via WealthAdvisor's sub_agents=[...] list, TaxCalculator takes over the conversation and replies directly to the client. What should you change?",
      opts: [
        "A. Wrap TaxCalculator in AgentTool(agent=TaxCalculator) and pass it in WealthAdvisor's tools list.",
        "B. Place both WealthAdvisor and TaxCalculator inside a ParallelAgent with a shared session.state.",
        "C. Set include_contents='none' on TaxCalculator while keeping it in WealthAdvisor's sub_agents list.",
        "D. Expose TaxCalculator as a parameterized MCP Toolbox SQL query inside tools.yaml instead of ADK."
      ],
      ans: [0],
      exp: "Correct (A): Attaching an agent via sub_agents=[...] uses transfer_to_agent, which hands conversation control over to the child. Wrapping the specialist in AgentTool(agent=...) lets the parent invoke it like a function tool, receive the output back, and retain full control of the turn.",
      hood: "Architecture rule: Hand off the conversation = sub_agents; consult a specialist and keep parent control = AgentTool."
    },
    {
      id: 14, sec: "3.2", multi: false,
      arch: "[Deterministic Python if/else Branching on session.state] --> [Subclass BaseAgent and Override _run_async_impl(ctx)]",
      stem: "Your compliance architecture requires a 100% deterministic branching rule: if session.state['loan_amount'] exceeds 1000000, the workflow must run SeniorUnderwriterAgent; otherwise, it must skip SeniorUnderwriterAgent and run StandardUnderwriterAgent. You are not allowed to use an LLM call to make this routing decision. How should you implement this orchestrator in ADK?",
      opts: [
        "A. Configure a SequentialAgent containing both agents and set temperature=0.0 on each sub-agent.",
        "B. Subclass BaseAgent (CustomAgent) and implement the Python if/else check in _run_async_impl(ctx).",
        "C. Configure a ParallelAgent and use an after_model_callback to discard the unused branch output.",
        "D. Use a root LlmAgent router with an explicit if/else rule written inside its system instruction."
      ],
      ans: [1],
      exp: "Correct (B): SequentialAgent always runs all sub-agents in order, and LlmAgent uses probabilistic LLM routing. Subclassing BaseAgent and overriding _run_async_impl(ctx) lets you write imperative Python if/else control flow over ctx.session.state with zero LLM calls.",
      hood: "Architecture rule: For custom deterministic conditional branching in code, subclass BaseAgent (_run_async_impl)."
    },
    {
      id: 15, sec: "3.2", multi: false,
      arch: "[MapReduce / Fan-Out-Gather] = [SequentialAgent(sub_agents=[ParallelAgent([A, B, C]), SynthesizerAgent])]",
      stem: "You need to design a composite ADK workflow that first executes three independent risk-assessment sub-agents concurrently, waits for all three to finish writing their findings to distinct state keys, and then immediately runs a final ExecutiveSummaryAgent that synthesizes all three findings. Which agent composition hierarchy achieves this with zero unnecessary LLM routing calls?",
      opts: [
        "A. A ParallelAgent containing the three risk sub-agents and ExecutiveSummaryAgent as a fourth branch.",
        "B. A root LlmAgent coordinator with all four specialist agents attached in its sub_agents=[...] list.",
        "C. A LoopAgent with max_iterations=1 containing the three risk sub-agents wrapped as AgentTool items.",
        "D. A SequentialAgent with ParallelAgent (3 risk agents) as Step 1 and ExecutiveSummaryAgent as Step 2."

      hood: "Architecture rule: Know the 3 A2A Message/Artifact Part types: TextPart, DataPart (JSON), and FilePart (files/URI)."
    },
    {
      id: 59, sec: "3.6", multi: false,
      arch: "[A2A Identifiers: taskId (Single Stateful Unit of Work) vs. contextId (Groups Related Tasks Across a Session)]",
      stem: "In the A2A protocol, a Client Agent executes three sequential tasks with a Remote Wealth Agent for the same customer session (task-1: portfolio audit, task-2: tax harvesting, task-3: rebalancing order). Which A2A identifier links task-1, task-2, and task-3 together under the same shared conversational context on the remote server?",
      opts: [
        "A. Pass the same shared contextId across all three tasks while giving each task a unique taskId.",
        "B. Pass the exact same taskId for all three completed tasks and leave the contextId field null.",
        "C. Overwrite the semantic version field in /.well-known/agent.json before starting each new task.",
        "D. Store a temp:task_group key inside the Client Agent's local InMemorySessionService instance."
      ],
      ans: [0],
      exp: "Correct (A): In A2A, taskId uniquely identifies a single stateful unit of work (moving from submitted to completed), whereas contextId groups multiple related Task executions and messages together across an ongoing multi-task interaction.",
      hood: "Architecture rule: taskId = 1 specific unit of work; contextId = shared conversational session grouping multiple tasks."
    },
    {
      id: 60, sec: "3.6", multi: true,
      arch: "[Layered Enterprise Blueprint] = [1. Cross-Department Peer Delegation via A2A] + [2. Private Database Access per Agent via MCP Toolbox]",
      stem: "You are designing the target reference architecture for Rosku Bank's enterprise agent platform spanning Retail, Wealth, and Fraud departments. Which two architectural decisions properly combine A2A and MCP? (Choose two.)",
      opts: [
        "A. Use A2A (RemoteA2aAgent and Agent Registry) for peer delegation between Retail and Fraud agents.",
        "B. Expose internal Cloud SQL tables to partners by putting DB passwords in /.well-known/agent.json.",
        "C. Use MCP Toolbox (tools.yaml) inside the Fraud boundary so Fraud Agent queries AlloyDB safely.",
        "D. Replace all stateful multi-turn partner agents with stateless MCP tools/list discovery calls.",
        "E. Disable Agent Gateway and Model Armor screening on all internal A2A and MCP network traffic."
      ],
      ans: [0, 2],
      exp: "Correct (A, C): In a layered enterprise architecture, A2A handles horizontal peer-to-peer delegation between autonomous cross-department or partner agents (A), while MCP (MCP Toolbox for Databases) handles vertical agent-to-tool/database execution within each agent's private boundary (C).",
      hood: "Architecture rule: A2A = horizontal Agent-to-Agent collaboration; MCP = vertical Agent-to-Tool/Database execution."
    }
  ];

  const STORAGE_KEY = "agenticaivantage_paac_sec3_v8_60q";
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch (e) { saved = {}; }
  let pendingMulti = [];
  let filter = "all";
  let currentIdx = 0;

  function isCorrect(q, userPick) {
    if (!Array.isArray(userPick) || userPick.length !== q.ans.length) return false;
    const s1 = [...userPick].sort();
    const s2 = [...q.ans].sort();
    return s1.every((val, i) => val === s2[i]);
  }

  function getFilteredList() {
    if (filter === "all") return QUESTIONS;
    if (filter === "missed") {
      const missed = QUESTIONS.filter(q => saved[q.id] !== undefined && !isCorrect(q, saved[q.id]));
      return missed.length ? missed : QUESTIONS;
    }
    return QUESTIONS.filter(q => q.sec === filter);
  }

  function updateScoreBadge() {
    const keys = Object.keys(saved);
    let correctCount = 0;
    keys.forEach(k => {
      const q = QUESTIONS.find(item => item.id === parseInt(k, 10));
      if (q && isCorrect(q, saved[k])) correctCount++;
    });
    document.getElementById("sim-score").textContent = "Score: " + correctCount + " / " + keys.length + " (of 60)";
  }

  function renderQuestion() {
    const list = getFilteredList();
    if (currentIdx >= list.length) currentIdx = 0;
    if (currentIdx < 0) currentIdx = list.length - 1;
    const q = list[currentIdx];
    const userPick = saved[q.id];

    document.getElementById("q-domain").textContent = "Checkpoint " + q.sec + " | Q#" + q.id;
    document.getElementById("q-type").textContent = q.multi ? "Choose Two (select 2)" : "Single choice";
    document.getElementById("q-counter").textContent = "Showing " + (currentIdx + 1) + " of " + list.length;
    document.getElementById("q-stem").textContent = q.stem;

    const optContainer = document.getElementById("q-options");
    optContainer.innerHTML = "";

    q.opts.forEach((optText, idx) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "sim-opt";
      if (userPick !== undefined) {
        if (q.ans.includes(idx)) btn.classList.add("correct");
        else if (userPick.includes(idx)) btn.classList.add("wrong");
      } else if (q.multi && pendingMulti.includes(idx)) {
        btn.classList.add("selected-pending");
      }
      btn.textContent = optText;
      btn.addEventListener("click", () => {
        if (!q.multi) {
          saved[q.id] = [idx];
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(saved)); } catch (e) {}
          renderQuestion();
        } else {
          if (userPick !== undefined) {
            delete saved[q.id];
            pendingMulti = [idx];
            renderQuestion();
            return;
          }
          if (pendingMulti.includes(idx)) pendingMulti = pendingMulti.filter(i => i !== idx);
          else pendingMulti.push(idx);
          if (pendingMulti.length === 2) {
            saved[q.id] = [...pendingMulti];
            pendingMulti = [];
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(saved)); } catch (e) {}
          }
          renderQuestion();
        }
      });
      optContainer.appendChild(btn);
    });

    const expBox = document.getElementById("q-explain");
    if (userPick !== undefined) {
      expBox.classList.add("visible");
      document.getElementById("q-arch").textContent = "Architecture flow: " + q.arch;
      document.getElementById("q-exp-text").textContent = q.exp;
      document.getElementById("q-hood").textContent = q.hood;
    } else {
      expBox.classList.remove("visible");
    }

    const grid = document.getElementById("q-grid");
    grid.innerHTML = "";
    list.forEach((item, i) => {
      const gBtn = document.createElement("button");
      gBtn.type = "button";
      gBtn.className = "sim-num-btn";
      if (i === currentIdx) gBtn.classList.add("current");
      if (saved[item.id] !== undefined) {
        gBtn.classList.add(isCorrect(item, saved[item.id]) ? "ans-ok" : "ans-bad");
      }
      gBtn.textContent = item.id;
      gBtn.addEventListener("click", () => {
        pendingMulti = [];
        currentIdx = i;
        renderQuestion();
      });
      grid.appendChild(gBtn);
    });

    updateScoreBadge();
  }

  document.querySelectorAll(".sim-chip[data-filter]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".sim-chip[data-filter]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      filter = btn.getAttribute("data-filter") || "all";
      pendingMulti = [];
      currentIdx = 0;
      renderQuestion();
    });
  });

  document.getElementById("q-prev")?.addEventListener("click", () => { pendingMulti = []; currentIdx--; renderQuestion(); });
  document.getElementById("q-next")?.addEventListener("click", () => { pendingMulti = []; currentIdx++; renderQuestion(); });
  document.getElementById("sim-reset")?.addEventListener("click", () => {
    saved = {};
    pendingMulti = [];
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    renderQuestion();
  });

  renderQuestion();
})();
</script></div><footer class="sl-flex"><div class="meta sl-flex"></div><div class="pagination-links print:hidden" dir="ltr"><a href="sec3-qa.html" rel="prev"><svg aria-hidden="true" class="astro-b5raizh3" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="--sl-icon-size: 1.5rem;"><path d="M17 11H9.41l3.3-3.29a1.004 1.004 0 1 0-1.42-1.42l-5 5a1 1 0 0 0-.21.33 1 1 0 0 0 0 .76 1 1 0 0 0 .21.33l5 5a1.002 1.002 0 0 0 1.639-.325 1 1 0 0 0-.219-1.095L9.41 13H17a1 1 0 0 0 0-2Z"/></svg><span>Previous<br><span class="link-title">3.8 Section 3 Q&amp;A</span></span></a><a href="sec4-exam-guide.html" rel="next"><svg aria-hidden="true" class="astro-b5raizh3" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="--sl-icon-size: 1.5rem;"><path d="M17.92 11.62a1.001 1.001 0 0 0-.21-.33l-5-5a1.003 1.003 0 1 0-1.42 1.42l3.3 3.29H7a1 1 0 0 0 0 2h7.59l-3.3 3.29a1.002 1.002 0 0 0 .325 1.639 1 1 0 0 0 1.095-.219l5-5a1 1 0 0 0 .21-.33 1 1 0 0 0 0-.76Z"/></svg><span>Next<br><span class="link-title">4.0 Domain 4 Roadmap</span></span></a></div></footer></div></div>
