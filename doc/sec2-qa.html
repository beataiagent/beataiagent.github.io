<div class="content-panel"><div class="sl-container"><h1 id="_top">2.5 Section 2 Q&amp;A: AI-assisted development, rules, skills, and sandboxing</h1></div></div><div class="content-panel"><div class="sl-container"><div class="sl-markdown-content"><style>

<div class="qa-wrap"><div class="qa-top-bar"><span class="qa-count">16 essential Section 2 questions (click any question to reveal the answer)</span><div class="qa-btn-row"><button id="qa-expand-all" class="qa-chip" type="button">Expand all</button><button id="qa-collapse-all" class="qa-chip" type="button">Collapse all</button></div></div><div id="qa-container" class="qa-list"></div></div>
<script>
(function() {
  const CARDS = [
    {
      id: 1,
      q: "1. What are the 4 YAML frontmatter trigger modes in Google Antigravity (.agents/rules/*.md)?",
      arch: "always_on (Every Turn) | glob (File Pattern Match) | model_decision (Semantic Match) | manual (@-Mention Only)",
      bullets: [
        "Modular rule files in .agents/rules/*.md support four YAML frontmatter triggers: always_on (loaded on every turn), glob (loaded only when editing matching file patterns like globs: ['**/*.tf']), model_decision (loaded when the task semantically matches the rule description), and manual (loaded only when explicitly @-mentioned in chat).",
        "Scoping domain-specific rules with glob, model_decision, or manual prevents prompt bloat on unrelated tasks."
      ]
    },
    {
      id: 2,
      q: "2. How does progressive disclosure work in .agents/skills/<name>/SKILL.md—and how do you migrate legacy workflows?",
      arch: "Phase 1: Load 1-Line YAML Description at Startup ──► Phase 2: Load Full SKILL.md + Scripts On Demand",
      bullets: [
        "At session startup, the coding agent reads only the lightweight name and description from each SKILL.md frontmatter header; the full markdown instructions, helper scripts, and templates are loaded into context only when invoked.",
        "Deprecated .agents/workflows/*.md files are upgraded to .agents/skills/<name>/SKILL.md packages using the built-in /migrate-workflows command."
      ]
    },
    {
      id: 3,
      q: "3. How does the 3-tier context hierarchy resolve conflicting instructions across directories?",
      arch: "1. Global (~/.gemini/) ──► 2. Repo Root (GEMINI.md / CLAUDE.md) ──► 3. Subdirectory (More Specific Wins!)",
      bullets: [
        "Context files cascade from the developer's global home directory (~/.gemini/) to the repository root, down to package-level subdirectories.",
        "When a rule in a closer subdirectory conflicts with a broader rule in the repository root, the more specific subdirectory rule takes precedence for files inside that folder."
      ]
    },
    {
      id: 4,
      q: "4. How do synchronous lifecycle hooks in hooks.json block destructive commands and automate post-edit formatting?",
      arch: "PreToolUse / BeforeTool (Regex Matcher 'Bash' + Non-Zero Exit = BLOCK) | PostToolUse ('Edit|Write' = Run Formatter)",
      bullets: [
        "Configured in .agents/hooks.json (or ~/.gemini/config/hooks.json and .gemini/hooks/), PreToolUse / BeforeTool hooks intercept tool calls using regex matchers and deterministically block execution when the hook script exits with a non-zero code.",
        "PostToolUse hooks match file-edit tools (Edit|WriteFile) to run deterministic formatters and linters (like ruff format and mypy) automatically at zero LLM token cost."
      ]
    },
    {
      id: 5,
      q: "5. How do you package and distribute skills, rules, hooks, subagents, and MCP configs across 50+ repositories?",
      arch: "[plugin.json Manifest] ──► Bundles skills + rules + hooks.json + subagents + mcpServers into 1 Versioned Extension",
      bullets: [
        "Instead of manually copying markdown files across repositories, bundle your enterprise assets into a versioned plugin defined by a plugin.json manifest.",
        "A single plugin.json declaratively packages .agents/skills/, .agents/rules/, .agents/hooks.json, custom subagents, and mcp_config.json for 1-command installation across teams."
      ]
    },
    {
      id: 6,
      q: "6. Why do English instructions in GEMINI.md fail to protect local .env secrets—and what is the proper fix?",
      arch: "Natural-Language Prompt Rule = Probabilistic | .geminiignore + .aiexclude + PreToolUse Deny Hook = Deterministic Block",
      bullets: [
        "Prompt instructions cannot prevent workspace indexing or grep tools from reading local .env files or service-account JSON keys into the context window.",
        "Add sensitive file patterns and noisy build/vendor folders (node_modules/, dist/, .venv/) to .geminiignore and .aiexclude, reinforced by PreToolUse file-read deny rules."
      ]
    },
    {
      id: 7,
      q: "7. What is the difference between Antigravity CLI (agy) and Google Cloud Agents CLI (agents-cli)?",
      arch: "agy = Antigravity Workspace/Terminal CLI | agents-cli = 7 Built-In Skills for End-to-End ADK Lifecycle",
      bullets: [
        "Antigravity CLI (agy) is the command-line binary for launching Google Antigravity workspaces, managing plugins, and running scripted or headless IDE tasks from the terminal.",
        "Google Cloud Agents CLI (agents-cli) ships with 7 built-in progressive skills (build, evaluate, deploy, scale, govern, optimize) that augment Antigravity, Gemini CLI, and Claude Code with authoritative ADK and Gemini Enterprise patterns."
      ]
    },
    {
      id: 8,
      q: "8. How do custom subagents (define_subagent) cure 'context rot' during a 50-file refactoring?",
      arch: "[Root Coordinator] ──(Delegates to Isolated Context Windows)──► [Explorer / Implementer / Verifier Subagents]",
      bullets: [
        "Running massive multi-file searches, edits, and test stack traces inside a single conversation thread causes context rot—degrading model attention and breaking earlier edits.",
        "Decomposing work across custom subagents (via define_subagent or .agents/ manifests) gives each subagent a clean, isolated context window that returns only a concise summary to the parent thread."
      ]
    },
    {
      id: 9,
      q: "9. How should you scope Explorer, Parallel Implementer, and Independent Verifier subagents?",
      arch: "Explorer (Read-Only Tools) ──► Parallel Implementers (Disjoint Folders) ──► Verifier (Fresh Context: Spec + Diff + Pytest)",
      bullets: [
        "Restrict Explorer subagents to read-only search tools so raw grep noise stays out of the main thread, and assign Parallel Implementer subagents strictly to non-overlapping (disjoint) file directories to prevent write race conditions.",
        "Use an Independent Verifier subagent in a fresh context window (given only the written spec, git diff, and test runner) to audit code without self-review confirmation bias."
      ]
    },
    {
      id: 10,
      q: "10. How do you prevent a coding assistant from hallucinating BigQuery or AlloyDB column names—and how do you govern MCP access?",
      arch: "[IDE / CLI mcp_config.json] ──(Read-Only Dev Credentials + Env Vars)──► [Database MCP Server]",
      bullets: [
        "Attach a read-only database MCP server (such as MCP Toolbox for Databases) in your IDE/CLI settings so the coding agent inspects live table schemas and metadata on demand.",
        "Always scope developer MCP credentials strictly to read-only metadata or non-production environments, and commit sanitized configs using environment-variable placeholders rather than plaintext secrets."
      ]
    },
    {
      id: 11,
      q: "11. Why should teams enforce a Spec -> Plan -> Act -> Verify loop with a human review gate on the Plan?",
      arch: "[1. Spec] ──► [2. Plan (Human Architect Review Gate!)] ──► [3. Incremental Act] ──► [4. Automated Verify]",
      bullets: [
        "One-shot coding prompts on complex features frequently modify dozens of files using the wrong library or architecture, taking hours to untangle.",
        "Requiring the coding agent to generate a concise implementation plan first—and having a human architect review that 20-line plan before any files are edited—catches architectural flaws in 60 seconds."
      ]
    },
    {
      id: 12,
      q: "12. How do you prevent a headless CLI coding agent from hanging indefinitely inside a Cloud Build or GitHub Actions pipeline?",
      arch: "[CI/CD Pipeline] ──► [Run agy / gemini in Non-Interactive Headless Mode + Read-Only Tool Allowlist + JSON Output]",
      bullets: [
        "CI/CD runners have no human at the terminal to answer interactive [y/N] tool confirmation prompts, causing standard interactive runs to hang until timeout.",
        "Invoke the CLI in non-interactive headless mode with an explicit allowlist of read-only analysis tools and structured JSON output (--output-format json) so downstream scripts can parse severity and fail the build deterministically."
      ]
    },
    {
      id: 13,
      q: "13. Why is generating unit tests and golden evalsets solely from implementation code a critical anti-pattern?",
      arch: "AI Reads Buggy Code Only ──► Codifies Bug as 'Expected'! | Fix: Anchor Test Synthesis on Written Spec + Human Review",
      bullets: [
        "When an AI coding assistant synthesizes unit tests or *.evalset.json trajectories solely by inspecting newly written code, it codifies any off-by-one or logic bugs in that code as the expected ground truth.",
        "Always anchor test and evalset synthesis on the written requirements specification and require human curation of all ground-truth assertions."
      ]
    },
    {
      id: 14,
      q: "14. How do you protect a CI/CD pull-request review agent from indirect prompt injection in untrusted PR diffs?",
      arch: "[Untrusted PR Diff] ──► [Network-Restricted Sandbox + Read-Only Diff Tools Only + Zero Privileged Secrets]",
      bullets: [
        "External pull requests can hide malicious prompt-injection instructions inside code comments or docstrings to trick a review agent into exfiltrating CI secrets.",
        "Run the PR review agent inside a network-restricted sandbox with arbitrary shell execution disabled (read-only diff tools only) and zero production credentials or repo-write tokens mounted."
      ]
    },
    {
      id: 15,
      q: "15. What is 'slopsquatting' during AI-assisted coding, and how does a 3-tier command policy prevent it?",
      arch: "Allowlist (Safe Reads/Pytest) | Ask / HITL (Package Installs & File Writes) + Vetted Artifact Registry | Deny (rm -rf)",
      bullets: [
        "Slopsquatting occurs when an LLM hallucinates a non-existent package name (e.g., pip install gcp-adk-fast-helper) that an attacker registers on public PyPI with malware.",
        "Enforce a 3-tier workstation policy that auto-allows safe reads/tests, blocks destructive commands via PreToolUse hooks, and requires Human-in-the-Loop (HITL) approval on all dependency installs routed through a vetted Artifact Registry mirror."
      ]
    },
    {
      id: 16,
      q: "16. When should you run agent code execution on GKE Agent Sandbox—and what are its two core capabilities?",
      arch: "[Untrusted Code / Shell Execution] ──► [GKE Agent Sandbox: 1. gVisor / Kata microVMs + 2. Pre-Warmed Sandbox Pools]",
      bullets: [
        "Select Agent Sandbox on Google Kubernetes Engine (GKE) whenever autonomous coding or data-science agents execute dynamically generated, untrusted Python or bash scripts at scale.",
        "It provides kernel-level isolation via gVisor (user-space kernel) or Kata microVMs so exploits cannot escape the pod, paired with pre-warmed sandbox pod pools and snapshots for sub-second startup."
      ]
    }
  ];

  const container = document.getElementById("qa-container");

  function render() {
    container.innerHTML = CARDS.map(c => {
      const bulletsHtml = c.bullets.map(b => "<li>" + b + "</li>").join("");
      return (
        "<details class='qa-card'>" +
          "<summary class='qa-summary'>" +
            "<span class='qa-question'>" + c.q + "</span>" +
            "<span class='qa-reveal-hint'>Answer</span>" +
          "</summary>" +
          "<div class='qa-body'>" +
            "<div class='qa-arch'>" + c.arch + "</div>" +
            "<ul>" + bulletsHtml + "</ul>" +
          "</div>" +
        "</details>"
      );
    }).join("");
  }

  document.getElementById("qa-expand-all")?.addEventListener("click", () => {
    container.querySelectorAll("details.qa-card").forEach(d => { d.open = true; });
  });
  document.getElementById("qa-collapse-all")?.addEventListener("click", () => {
    container.querySelectorAll("details.qa-card").forEach(d => { d.open = false; });
  });

  render();
})();
</script></div><footer class="sl-flex"><div class="meta sl-flex"></div><div class="pagination-links print:hidden" dir="ltr"><a href="sec2-takeaway.html" rel="prev"><svg aria-hidden="true" class="astro-b5raizh3" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="--sl-icon-size: 1.5rem;"><path d="M17 11H9.41l3.3-3.29a1.004 1.004 0 1 0-1.42-1.42l-5 5a1 1 0 0 0-.21.33 1 1 0 0 0 0 .76 1 1 0 0 0 .21.33l5 5a1.002 1.002 0 0 0 1.639-.325 1 1 0 0 0-.219-1.095L9.41 13H17a1 1 0 0 0 0-2Z"/></svg><span>Previous<br><span class="link-title">2.4 Section 2 Master Takeaway</span></span></a><a href="mcq-sec2.html" rel="next"><svg aria-hidden="true" class="astro-b5raizh3" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="--sl-icon-size: 1.5rem;"><path d="M17.92 11.62a1.001 1.001 0 0 0-.21-.33l-5-5a1.003 1.003 0 1 0-1.42 1.42l3.3 3.29H7a1 1 0 0 0 0 2h7.59l-3.3 3.29a1.002 1.002 0 0 0 .325 1.639 1 1 0 0 0 1.095-.219l5-5a1 1 0 0 0 .21-.33 1 1 0 0 0 0-.76Z"/></svg><span>Next<br><span class="link-title">Section 2 Practice Questions</span></span></a></div></footer></div></div>
