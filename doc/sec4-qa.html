<div class="content-panel"><div class="sl-container"><h1 id="_top">4.6 Section 4 Q&amp;A: Evaluation, runtimes, CI/CD, and observability</h1></div></div><div class="content-panel"><div class="sl-container"><div class="sl-markdown-content"><style>

<div class="qa-wrap"><div class="qa-top-bar"><span class="qa-count">16 essential Section 4 questions (click any question to reveal the answer)</span><div class="qa-btn-row"><button id="qa-expand-all" class="qa-chip" type="button">Expand all</button><button id="qa-collapse-all" class="qa-chip" type="button">Collapse all</button></div></div><div id="qa-container" class="qa-list"></div></div>
<script>
(function() {
  const CARDS = [
    {
      id: 1,
      q: "1. When should you use EXACT, IN_ORDER, or ANY_ORDER in ADK trajectory evaluation (ToolTrajectoryCriterion)?",
      arch: "EXACT (Strict 1-to-1 Match) | IN_ORDER (Ordered Subset, Extra Tools OK) | ANY_ORDER (Concurrent / Unordered Tools)",
      bullets: [
        "Use MatchType.EXACT for strict compliance sequences where no extra tool calls are permitted. Use MatchType.IN_ORDER when mandatory steps must occur in sequence (e.g., verify_kyc before approve_loan) but optional helper lookups are allowed in between.",
        "Use MatchType.ANY_ORDER when evaluating ParallelAgent branches or independent lookups (like fetching weather, news, and stock prices) where tool execution order does not matter."
      ]
    },
    {
      id: 2,
      q: "2. Why do lexical metrics (ROUGE / BLEU) fail on creative or conversational agent responses—and what should you use instead?",
      arch: "Lexical Overlap (ROUGE/BLEU) Fails on Valid Paraphrasing ──► Use RubricBasedCriterion (LLM-as-a-Judge Autorater)",
      bullets: [
        "Reference-based lexical metrics like ROUGE and BLEU penalize valid natural-language paraphrasing whenever the agent uses different words than the static golden string.",
        "Use RubricBasedCriterion (e.g., rubric_based_final_response_quality_v1 and rubric_based_tool_use_quality_v1) with explicit pass/fail RubricContent(text_property=...) statements evaluated by a judge model."
      ]
    },
    {
      id: 3,
      q: "3. How do you reduce judge variance in RubricBasedCriterion and catch intermediate sub-agent hallucinations?",
      arch: "JudgeModelOptions(judge_model='gemini-2.5-pro', num_samples=3) + LlmAsAJudgeCriterion(evaluate_intermediate_nl_responses=True)",
      bullets: [
        "Configure JudgeModelOptions with a strong reasoning model (gemini-2.5-pro) and num_samples (e.g., 3 or 5) so the autorater aggregates majority-vote scores across multiple judge samples.",
        "In multi-agent pipelines, enable evaluate_intermediate_nl_responses=True on hallucinations_v1 (LlmAsAJudgeCriterion) to audit intermediate sub-agent outputs, not just the final reply."
      ]
    },
    {
      id: 4,
      q: "4. How do PointwiseMetric, RubricBasedMetric, and PairwiseMetric differ in the Vertex AI GenAI Evaluation SDK (EvalTask)?",
      arch: "PointwiseMetric (Fixed Custom Scale) | RubricBasedMetric (Dynamic Per-Prompt Rubrics) | PairwiseMetric (v2 vs. v1 A/B Win Rate)",
      bullets: [
        "PointwiseMetric grades a single agent's response against a fixed custom rating_rubric. RubricBasedMetric uses RubricGenerationConfig to dynamically generate custom pass/fail verification questions tailored to each individual prompt before critiquing the response.",
        "PairwiseMetric compares a candidate agent (v2) head-to-head against a baseline_model (v1) to compute win/loss/tie preference rates before promotion."
      ]
    },
    {
      id: 5,
      q: "5. How do you choose between Agent Runtime (Vertex AI Agent Engine), Cloud Run, and GKE Agent Sandbox?",
      arch: "Turnkey ADK + Managed Sessions/Memory = Agent Runtime | Serverless Containers = Cloud Run | Untrusted Code / GPU / K8s = GKE",
      bullets: [
        "Choose Agent Runtime (Vertex AI Agent Engine) for turnkey deployment of ADK agents with built-in managed SessionService, Memory Bank, and telemetry with zero container boilerplate.",
        "Choose Cloud Run for stateless serverless container microservices with scale-to-zero economics, and choose GKE (with Agent Sandbox gVisor/Kata microVMs) when executing untrusted AI-generated code, custom GPU node pools, or deep Kubernetes networking."
      ]
    },
    {
      id: 6,
      q: "6. Why do multi-instance Cloud Run agents forget conversation history on Turn 2—and how do you fix it?",
      arch: "InMemorySessionService (Lost Across Containers!) ──► Switch to DatabaseSessionService / VertexAiSessionService",
      bullets: [
        "InMemorySessionService stores session history in local container RAM; when Cloud Run load-balances Turn 2 to a different container instance (or scales down to zero), that local memory is lost.",
        "Configure an external persistent session store—such as VertexAiSessionService or DatabaseSessionService backed by AlloyDB or Cloud SQL—so any container instance can load the session."
      ]
    },
    {
      id: 7,
      q: "7. How do you eliminate cold-start latency spikes and 429 quota errors during high-volume traffic bursts?",
      arch: "Container Cold Starts = Cloud Run min-instances | Model Quota 429s = Vertex AI Provisioned Throughput (Reserved GSUs)",
      bullets: [
        "Set min-instances >= 1 on Cloud Run to keep warm container instances ready and eliminate container initialization cold starts.",
        "Purchase Vertex AI Provisioned Throughput to reserve dedicated Generative AI Serving Units (GSUs) with guaranteed token throughput and predictable latency during peak banking hours."
      ]
    },
    {
      id: 8,
      q: "8. What does the Google Cloud Agent Starter Pack provide for production agent engineering?",
      arch: "[Agent Starter Pack CLI] ──► Scaffolds Terraform IaC + CI/CD Pipelines + AgentEvaluator Gates + OpenTelemetry Tracing",
      bullets: [
        "Agent Starter Pack is Google Cloud's official production scaffolding toolkit for agentic systems.",
        "It generates pre-wired Terraform Infrastructure-as-Code, Cloud Build or GitHub Actions CI/CD pipelines, automated evaluation test harnesses, and OpenTelemetry instrumentation out of the box."
      ]
    },
    {
      id: 9,
      q: "9. Why are traditional unit tests (pytest) insufficient as the sole CI/CD gate for AI agents?",
      arch: "Stage 1: Fast Unit Tests & Linters ──► Stage 2: AgentEvaluator Trajectory & Rubric Gate (*.evalset.json) ──► Deploy",
      bullets: [
        "Standard unit tests only verify deterministic Python syntax and mocked helper functions—they cannot detect when a prompt edit causes the LLM to call the wrong tool or hallucinate policy terms.",
        "A production agent CI/CD pipeline must enforce a blocking AgentEvaluator gate against golden *.evalset.json trajectories and rubric thresholds before promoting to staging or production."
      ]
    },
    {
      id: 10,
      q: "10. Why must multi-turn Canary deployments use session-pinned routing (session affinity) instead of random per-request splitting?",
      arch: "[Canary Traffic Split (90% v1 / 10% v2)] + [Pin by session_id] ──► Prevents Mid-Conversation Schema & Prompt Drift!",
      bullets: [
        "If a load balancer splits traffic randomly per HTTP request, Turn 1 of a conversation might run on Agent v1 while Turn 2 lands on Agent v2—causing crashes when v1 and v2 expect different session.state keys or system prompts.",
        "Routing traffic consistently by session_id guarantees that an entire multi-turn conversation stays on the exact same agent version from start to finish."
      ]
    },
    {
      id: 11,
      q: "11. What are the 4 core OpenTelemetry span types emitted by ADK in Cloud Trace?",
      arch: "invocation (Root Turn) ──► agent_run (Sub-Agent Step) ──► call_llm (Gemini Prefill/Decode) & execute_tool (Tool I/O)",
      bullets: [
        "ADK instruments every turn with a hierarchical trace tree in Cloud Trace: invocation (the top-level runner turn), agent_run (each individual agent or workflow step), call_llm (model inference latency and token counts), and execute_tool (external tool or MCP execution).",
        "Inspecting call_llm versus execute_tool spans immediately reveals whether a 12-second delay is caused by a slow database query or an oversized Gemini prompt."
      ]
    },
    {
      id: 12,
      q: "12. How do you detect silent semantic drift and real-world edge cases in production after deployment?",
      arch: "[Production Traffic] ──(Async 5% Trace Sampling)──► [Online Rubric Autorater] ──(Failed Traces)──► [Golden *.evalset.json]",
      bullets: [
        "Cloud infrastructure metrics (CPU, memory, HTTP 200) stay green even when an agent's reasoning quality degrades due to shifting user queries or external API changes.",
        "Sample a percentage of anonymized production conversations asynchronously to run background Rubric Autoraters, and feed low-scoring traces back into your golden *.evalset.json CI/CD dataset."
      ]
    },
    {
      id: 13,
      q: "13. How do you prevent runaway token loops and unbounded retry storms in production agents?",
      arch: "1. LoopAgent max_iterations Cap + 2. GenerateContentConfig max_output_tokens + 3. Tool Circuit Breakers",
      bullets: [
        "Always enforce a finite max_iterations ceiling on every LoopAgent, cap max_output_tokens inside GenerateContentConfig, and enforce a maximum tool-call turn limit.",
        "In custom tools and callbacks, implement circuit breakers that stop retrying failing downstream APIs after a bounded number of attempts."
      ]
    },
    {
      id: 14,
      q: "14. How do you version prompts, models, and agent configurations for instant 1-click rollback?",
      arch: "Immutable Container Image + Pinned Model Version ('gemini-2.5-pro-001') + Versioned Prompt/Config Artifacts in Git",
      bullets: [
        "Never edit production prompts live in an unversioned console or point production traffic to floating model aliases without testing.",
        "Version system instructions, tool schemas, and pinned model IDs in Git alongside your container image so Cloud Run or Agent Runtime can roll back to the previous revision in seconds."
      ]
    },
    {
      id: 15,
      q: "15. How do you test an agent safely in CI/CD when its tools normally mutate production databases or charge credit cards?",
      arch: "[CI/CD AgentEvaluator Run] ──► [Mocked / Sandboxed Tool Fixtures or Read-Only Staging MCP Server]",
      bullets: [
        "Never let automated CI/CD evaluation runs execute live write operations against production banking or ticketing systems.",
        "Inject deterministic mock tool responses or point MCP Toolbox to an isolated, seeded staging database during AgentEvaluator pipeline runs."
      ]
    },
    {
      id: 16,
      q: "16. What is the closed-loop FinOps workflow for cutting latency and token costs on a deployed multi-agent system?",
      arch: "1. Profile Cloud Trace Spans ──► 2. Tier to Flash + include_contents='none' + Context Caching ──► 3. Verify via AgentEvaluator",
      bullets: [
        "First, inspect call_llm spans in Cloud Trace to identify which sub-agents consume the most input tokens and latency. Next, tier router/formatter agents to Gemini Flash, set include_contents='none' on stateless steps, and enable Context Caching on large static manuals.",
        "Finally, run your golden *.evalset.json suite in AgentEvaluator (and PairwiseMetric) to prove that the optimizations caused zero quality regression."
      ]
    }
  ];

  const container = document.getElementById("qa-container");

  function render() {
    container.innerHTML = CARDS.map(c => {
      const bulletsHtml = c.bullets.map(b => "<li>" + b + "</li>").join("");
      return (
        "<details class='qa-card'>" +
          "<summary class='qa-summary'>" +
            "<span class='qa-question'>" + c.q + "</span>" +
            "<span class='qa-reveal-hint'>Answer</span>" +
          "</summary>" +
          "<div class='qa-body'>" +
            "<div class='qa-arch'>" + c.arch + "</div>" +
            "<ul>" + bulletsHtml + "</ul>" +
          "</div>" +
        "</details>"
      );
    }).join("");
  }

  document.getElementById("qa-expand-all")?.addEventListener("click", () => {
    container.querySelectorAll("details.qa-card").forEach(d => { d.open = true; });
  });
  document.getElementById("qa-collapse-all")?.addEventListener("click", () => {
    container.querySelectorAll("details.qa-card").forEach(d => { d.open = false; });
  });

  render();
})();
</script></div><footer class="sl-flex"><div class="meta sl-flex"></div><div class="pagination-links print:hidden" dir="ltr"><a href="sec4-takeaway.html" rel="prev"><svg aria-hidden="true" class="astro-b5raizh3" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="--sl-icon-size: 1.5rem;"><path d="M17 11H9.41l3.3-3.29a1.004 1.004 0 1 0-1.42-1.42l-5 5a1 1 0 0 0-.21.33 1 1 0 0 0 0 .76 1 1 0 0 0 .21.33l5 5a1.002 1.002 0 0 0 1.639-.325 1 1 0 0 0-.219-1.095L9.41 13H17a1 1 0 0 0 0-2Z"/></svg><span>Previous<br><span class="link-title">4.5 Section 4 Master Takeaway</span></span></a><a href="mcq-sec4.html" rel="next"><svg aria-hidden="true" class="astro-b5raizh3" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="--sl-icon-size: 1.5rem;"><path d="M17.92 11.62a1.001 1.001 0 0 0-.21-.33l-5-5a1.003 1.003 0 1 0-1.42 1.42l3.3 3.29H7a1 1 0 0 0 0 2h7.59l-3.3 3.29a1.002 1.002 0 0 0 .325 1.639 1 1 0 0 0 1.095-.219l5-5a1 1 0 0 0 .21-.33 1 1 0 0 0 0-.76Z"/></svg><span>Next<br><span class="link-title">Section 4 Practice Questions</span></span></a></div></footer></div></div>
