      arch: "[Structured ISO-8583 JSON Events + Fixed Rules + <50ms SLA] --> [Deterministic Stream Processing (Dataflow / Workflows)]",
      stem: "Rosku Bank ingests 25,000 ISO-8583 payment clearing events per second from Pub/Sub. Every event conforms to a strict JSON schema, and business rules state that any transaction with a non-USD currency code must be converted using a fixed reference table and written to BigQuery within 50 milliseconds. An engineering team proposes an ADK SequentialAgent using Gemini Flash to inspect and transform each event. Which architectural recommendation should you make?",

      ans: [1],
      exp: "Correct (B): When inputs follow a strict schema, rules are 100% deterministic, and a sub-50ms high-throughput SLA applies, deterministic stream processing (Dataflow) delivers exact repeatability at zero LLM token cost. Options A, C, and D introduce unnecessary LLM inference latency and per-token billing.",
