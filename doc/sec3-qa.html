<div class="content-panel"><div class="sl-container"><h1 id="_top">3.8 Section 3 Q&amp;A: ADK agents, workflows, MCP, RAG, state, and A2A</h1></div></div><div class="content-panel"><div class="sl-container"><div class="sl-markdown-content"><style>

<div class="qa-wrap"><div class="qa-top-bar"><span class="qa-count">24 essential Section 3 questions (click any question to reveal the answer)</span><div class="qa-btn-row"><button id="qa-expand-all" class="qa-chip" type="button">Expand all</button><button id="qa-collapse-all" class="qa-chip" type="button">Collapse all</button></div></div><div id="qa-container" class="qa-list"></div></div>
<script>
(function() {
  const CARDS = [
    {
      id: 1,
      q: "1. What is the difference between 'description' and 'instruction' on an ADK LlmAgent?",
      arch: "Parent Coordinator Reads ONLY 'description' (Routing) | Agent's Own LLM Reads 'instruction' (Internal Brain)",
      bullets: [
        "When a parent coordinator agent decides which sub-agent should handle a request, it inspects only each child agent's name and description—never its instruction.",
        "The instruction parameter governs the agent's own internal reasoning, persona, and state templating ({state_key}) after the agent has been selected."
      ]
    },
    {
      id: 2,
      q: "2. Why does enabling 'output_schema' on an ADK LlmAgent disable tool calling—and how do you fix it?",
      arch: "[Step 1: Tool-Calling Agent (output_key='raw')] ──► [Step 2: Formatter Agent (include_contents='none', output_schema=JSON)]",
      bullets: [
        "Configuring output_schema (with a Pydantic BaseModel) forces the model's decoder to emit strict JSON immediately, which disables intermediate tool calls and agent transfers during that turn.",
        "Solve this with a 2-step SequentialAgent: Agent 1 calls the tools and writes findings to output_key; Agent 2 (with no tools and include_contents='none') reads that state key and applies output_schema."
      ]
    },
    {
      id: 3,
      q: "3. How does 'include_contents=none' reduce token usage while still receiving upstream agent data?",
      arch: "[Formatter LlmAgent: include_contents='none' + instruction='Format: {raw_data}'] ──► [Zero Chat History Bloat!]",
      bullets: [
        "Setting include_contents='none' strips prior multi-turn conversation history from the LLM request so stateless worker or formatting sub-agents do not re-read thousands of chat tokens.",
        "Even when include_contents='none' is active, ADK still interpolates {state_key} placeholders inside the agent's instruction string from session.state."
      ]
    },
    {
      id: 4,
      q: "4. How do you handle optional state keys ({key?}), text artifacts ({artifact.name}), and literal JSON braces in 'instruction'?",
      arch: "{promo?} = Optional State Key | {artifact.doc.txt} = Artifact Text | Callable InstructionProvider = Skips Brace Parsing",
      bullets: [
        "Adding a trailing question mark ({promo_code?}) safely renders an empty string if the key is missing in session.state, while {artifact.filename} injects the text content of a named artifact from ArtifactService.",
        "If your system prompt contains literal JSON curly braces that should not be parsed as state variables, pass a callable Python function (InstructionProvider(ctx: ReadonlyContext) -> str) to instruction."
      ]
    },
    {
      id: 5,
      q: "5. How do BuiltInPlanner, PlanReActPlanner, and transfer restriction flags work on an LlmAgent?",
      arch: "BuiltInPlanner (Gemini ThinkingConfig) vs. PlanReActPlanner (Prompt Loop) | disallow_transfer_to_parent / peers = True",
      bullets: [
        "BuiltInPlanner wraps native Gemini ThinkingConfig (such as include_thoughts=True and thinking_budget), whereas PlanReActPlanner enforces a structured Plan -> Action -> Observation prompt loop on any model.",
        "Setting disallow_transfer_to_parent=True and disallow_transfer_to_peers=True prevents a specialist sub-agent from prematurely bouncing control back to the coordinator or sibling agents."
      ]
    },
    {
      id: 6,
      q: "6. How do ADK Workflow Agents (SequentialAgent, ParallelAgent, LoopAgent) differ from LlmAgent orchestrators?",
      arch: "Workflow Agents = Deterministic Code Control Flow (0 LLM Routing Calls) + Shared InvocationContext / session.state",
      bullets: [
        "SequentialAgent, ParallelAgent, and LoopAgent orchestrate execution deterministically in Python without making any LLM calls to decide which sub-agent runs next.",
        "All sub-agents inside a Workflow Agent share the same InvocationContext and session.state dictionary."
      ]
    },
    {
      id: 7,
      q: "7. How do you prevent race-condition overwrites in a ParallelAgent and implement a Fan-Out / Gather pipeline?",
      arch: "SequentialAgent([ ParallelAgent([BranchA(output_key='a'), BranchB(output_key='b')]), SynthesizerAgent('{a} + {b}') ])",
      bullets: [
        "Because all concurrent branches in a ParallelAgent write to the same shared session.state dictionary, you must assign a unique output_key to every parallel sub-agent.",
        "To synthesize parallel results, place the ParallelAgent as Step 1 and a Synthesizer LlmAgent as Step 2 inside a parent SequentialAgent."
      ]
    },
    {
      id: 8,
      q: "8. Why doesn't a LoopAgent stop when a sub-agent outputs the text 'APPROVED'—and how do you terminate it early?",
      arch: "[LoopAgent(sub_agents=[Drafter, Critic], max_iterations=5)] ──► Stops ONLY on EventActions(escalate=True) OR max_iterations",
      bullets: [
        "LoopAgent is a deterministic controller that never parses natural-language text strings to decide termination.",
        "To break a LoopAgent early when quality criteria pass, equip the Critic agent with a tool that sets tool_context.actions.escalate = True (emitting EventActions(escalate=True)), always paired with a finite max_iterations safety cap."
      ]
    },
    {
      id: 9,
      q: "9. When should you use 'sub_agents' transfer versus wrapping a specialist in 'AgentTool' (and 'skip_summarization=True')?",
      arch: "sub_agents = Child Takes Over Chat (transfer_to_agent) | AgentTool = Child Returns Answer to Parent Orchestrator",
      bullets: [
        "Attaching children via sub_agents=[...] allows the LLM to call transfer_to_agent, handing active conversation control over to the target child agent.",
        "Wrapping a specialist in AgentTool(agent=...) invokes the child like a function tool and returns its output back to the parent agent (and setting skip_summarization=True returns the child's reply directly without an extra parent LLM call)."
      ]
    },
    {
      id: 10,
      q: "10. When should you subclass BaseAgent (CustomAgent) instead of using SequentialAgent or LlmAgent?",
      arch: "[CustomAgent(BaseAgent): async def _run_async_impl(ctx)] ──► Deterministic Python if/else Branching on session.state",
      bullets: [
        "SequentialAgent always executes every child in its list, while LlmAgent uses probabilistic LLM routing.",
        "Subclass BaseAgent and override _run_async_impl(ctx) whenever you need deterministic imperative Python control flow—such as if/else branching across sub-agents based on ctx.session.state values."
      ]
    },
    {
      id: 11,
      q: "11. How does MCP Toolbox for Databases solve connection exhaustion and SQL injection—and what are the 3 keys in tools.yaml?",
      arch: "[ADK Agents] ──► [MCP Toolbox: tools.yaml (1. sources, 2. tools, 3. toolsets)] ──► [Pooled AlloyDB / Cloud SQL / BigQuery]",
      bullets: [
        "MCP Toolbox for Databases manages centralized connection pooling, Cloud IAM/OAuth authentication, and pre-defined parameterized SQL outside agent containers—eliminating SQL injection and allowing zero-downtime hot-reloading when SQL changes.",
        "Its declarative tools.yaml file is organized into three top-level sections: sources (database connections), tools (parameterized SQL statements), and toolsets (role-specific tool bundles loaded via toolset_name)."
      ]
    },
    {
      id: 12,
      q: "12. How does ADK handle 'tool_context: ToolContext' in custom Python FunctionTools?",
      arch: "def my_tool(id: str, tool_context: ToolContext) -> dict: ──► Injected by ADK at Runtime (Omit from Docstring!)",
      bullets: [
        "Adding tool_context: ToolContext to a Python tool signature gives your code access to tool_context.state, save_artifact/load_artifact, and tool_context.actions.escalate = True.",
        "Never document tool_context in the function's docstring Args block—ADK strips it from the LLM schema automatically and injects the live object at runtime."
      ]
    },
    {
      id: 13,
      q: "13. How do you combine Gemini built-in tools (google_search or BuiltInCodeExecutor) with custom FunctionTools?",
      arch: "[Root Agent: Custom Tools + AgentTool(SearchSpecialist)] ──► [SearchSpecialist LlmAgent: tools=[google_search]]",
      bullets: [
        "A single LlmAgent cannot mix native Gemini built-in tools (google_search, BuiltInCodeExecutor) directly with custom FunctionTools or MCP toolsets in the same agent definition.",
        "Isolate the built-in tool inside a dedicated specialist LlmAgent and attach that specialist to your root coordinator using the AgentTool wrapper."
      ]
    },
    {
      id: 14,
      q: "14. When should you use OpenAPIToolset, LongRunningFunctionTool, and 'async def' coroutines in ADK?",
      arch: "OpenAPIToolset = Auto-Generate REST Tools | LongRunningFunctionTool = Async Job Ticket | async def = Non-Blocking I/O",
      bullets: [
        "Use OpenAPIToolset to automatically generate callable RestApiTool operations from an existing OpenAPI v3 YAML/JSON spec, and use LongRunningFunctionTool for multi-minute batch or human-approval jobs so the tool immediately returns a pending ticket ID without timing out.",
        "Define network-bound FunctionTools with async def and non-blocking HTTP clients (like httpx.AsyncClient) so slow I/O never freezes the Python event loop."
      ]
    },
    {
      id: 15,
      q: "15. How do you choose between Agent Search, Vertex AI RAG Engine, and Gemini Context Caching?",
      arch: "SaaS Connectors + ACLs = Agent Search | Custom Chunking + Reranker = RAG Engine | Repeated 32k+ Static Prefix = Context Caching",
      bullets: [
        "Select Agent Search for turnkey enterprise SaaS connectors (SharePoint, Drive, Confluence, Jira) with automatic query-time document ACL enforcement. Select Vertex AI RAG Engine when engineers need granular programmatic control over chunk_size, chunk_overlap, custom embeddings, and semantic reranking.",
        "Select Gemini Context Caching (CachedContent or ADK ContextCacheConfig) when an agent repeatedly queries the exact same large static payload (32k+ tokens of PDFs, codebases, or videos) across many turns."
      ]
    },
    {
      id: 16,
      q: "16. How do you fix mid-sentence clause truncation, noisy vector matches, and exact SKU lookup failures in RAG?",
      arch: "Mid-Clause Cutoff = Increase chunk_size/overlap | Noisy Top-K = Semantic Reranker + vector_distance_threshold | Exact SKUs = Hybrid Search",
      bullets: [
        "If retrieved passages cut off legal exceptions mid-thought, increase chunk_size and chunk_overlap in ChunkingConfig (or enable layout-aware parsing). To eliminate low-relevance vector noise, add a Semantic Reranker (Ranking API) and set vector_distance_threshold.",
        "If pure dense vector search misses exact alphanumeric form codes or SKUs (like Form-1099-DIV), enable Hybrid Search combining dense semantic embeddings with sparse keyword/BM25 matching."
      ]
    },
    {
      id: 17,
      q: "17. What are the 4 'session.state' key prefixes in ADK and how long does each scope persist?",
      arch: "temp:key (1 Turn Only) | Unprefixed key (Current Session) | user:key (All User Sessions) | app:key (Global App-Wide)",
      bullets: [
        "temp:key is an invocation-scoped scratchpad wiped automatically as soon as the current single turn finishes. Unprefixed keys persist across turns within the current session_id only.",
        "user:key persists across all sessions belonging to a specific user_id, and app:key is shared globally across all users and sessions of the application (when backed by a persistent SessionService)."
      ]
    },
    {
      id: 18,
      q: "18. Why are direct mutations on a detached 'get_session()' object lost—and how does ADK commit state changes?",
      arch: "Mutate via output_key, tool_context.state, or callback_context.state ──► Emits EventActions(state_delta=...) to SessionService",
      bullets: [
        "ADK persists state updates by appending Event objects containing EventActions(state_delta=...) to the session log during Runner execution; mutating a detached session copy outside the Runner bypasses event logging.",
        "Always mutate state via output_key, tool_context.state['k'] = 'v', callback_context.state['k'] = 'v', or by yielding Event(..., actions=EventActions(state_delta={'k': 'v'})) from a CustomAgent."
      ]
    },
    {
      id: 19,
      q: "19. How does Memory Bank differ from session.state—and how do PreloadMemoryTool and LoadMemoryTool work?",
      arch: "[add_session_to_memory] ──► [Memory Bank: LLM Fact Extraction & Consolidation] ──► [PreloadMemoryTool vs. LoadMemoryTool]",
      bullets: [
        "While user: state stores known structured key-value flags, Memory Bank ingests completed sessions (add_session_to_memory) and uses an LLM to extract, deduplicate, and update evolving unstructured user facts across sessions.",
        "PreloadMemoryTool automatically retrieves relevant memories at the start of every turn, whereas LoadMemoryTool exposes a callable tool so the LLM searches Memory Bank reactively only when needed."
      ]
    },
    {
      id: 20,
      q: "20. How does ArtifactService (GcsArtifactService) handle binary files, versioning, and cross-session user scoping?",
      arch: "save_artifact('contract.pdf', part) ──► Versions v0, v1, v2 in GCS | Prefix 'user:passport.pdf' ──► Shared Across User Sessions",
      bullets: [
        "Never store large binary files (PDFs, images, audio) as Base64 strings in session.state! GcsArtifactService stores google.genai.types.Part blobs in Cloud Storage and increments integer revisions (v0, v1, v2...) on every save_artifact() call.",
        "Calling load_artifact(name) fetches the latest version (or pass version=0 for the original), and prefixing the filename with 'user:' (e.g., 'user:kyc.pdf') shares the artifact across all sessions for that user."
      ]
    },
    {
      id: 21,
      q: "21. What is the architectural boundary between Model Context Protocol (MCP) and Agent2Agent (A2A) protocol?",
      arch: "Stateless Deterministic Tool / DB Query = MCP | Autonomous Stateful Peer Agent with Opaque Reasoning = A2A",
      bullets: [
        "Use MCP (vertical agent-to-tool integration) when invoking a stateless, deterministic function, REST wrapper, or parameterized database query with a fixed JSON Schema.",
        "Use A2A (horizontal peer-to-peer delegation) when collaborating across team, framework, or organization boundaries with an autonomous agent that maintains its own opaque reasoning loop, private tools, and multi-turn Task state."
      ]
    },
    {
      id: 22,
      q: "22. What is published inside an A2A Agent Card (/.well-known/agent.json), and how do 'to_a2a()' and 'RemoteA2aAgent' work?",
      arch: "[to_a2a(adk_agent) Publishes /.well-known/agent.json] ◄──(A2A Protocol)──► [Client Coordinator with RemoteA2aAgent]",
      bullets: [
        "An A2A Agent Card at /.well-known/agent.json publishes the remote agent's endpoint URL, version, capabilities (streaming, pushNotifications), skills, supported MIME modalities, and securitySchemes—while hiding internal prompts and private tools.",
        "In ADK, to_a2a(agent) exposes an ADK agent as an A2A server, and RemoteA2aAgent wraps an external A2A endpoint so a parent ADK coordinator can delegate to it like a local sub-agent."
      ]
    },
    {
      id: 23,
      q: "23. When should you use A2A SSE streaming versus Push Notification Webhooks—and how does 'tasks/resubscribe' work?",
      arch: "Connected Seconds/Minutes = SSE (TaskStatusUpdateEvent / TaskArtifactUpdateEvent) | Disconnected Hours = PushNotificationConfig",
      bullets: [
        "Use Server-Sent Events (SSE via SendStreamingMessage) when the client stays connected and wants real-time TaskStatusUpdateEvent progress and TaskArtifactUpdateEvent deliverable chunks; if the SSE socket drops mid-task, call tasks/resubscribe with the existing taskId.",
        "Use Push Notification Webhooks (PushNotificationConfig) for multi-hour or multi-day tasks where holding an open HTTP connection is impossible, allowing the remote server to POST signed updates asynchronously."
      ]
    },
    {
      id: 24,
      q: "24. How do you resume an A2A task paused in 'input-required', and what are the 3 A2A Part types and 2 IDs?",
      arch: "Paused in 'input-required' ──► Reply with EXACT SAME taskId + contextId | Parts: TextPart, DataPart (JSON), FilePart",
      bullets: [
        "When a remote A2A agent needs missing information from the caller mid-workflow, it pauses the Task in state input-required; the client resumes that exact stateful workflow by sending a follow-up Message carrying the same taskId (unit of work) and contextId (shared session context).",
        "Every A2A Message or Artifact payload is composed of typed Part objects: TextPart (plain text prose), DataPart (structured JSON dictionaries), and FilePart (binary files or URI pointers)."
      ]
    }
  ];

  const container = document.getElementById("qa-container");

  function render() {
    container.innerHTML = CARDS.map(c => {
      const bulletsHtml = c.bullets.map(b => "<li>" + b + "</li>").join("");
      return (
        "<details class='qa-card'>" +
          "<summary class='qa-summary'>" +
            "<span class='qa-question'>" + c.q + "</span>" +
            "<span class='qa-reveal-hint'>Answer</span>" +
          "</summary>" +
          "<div class='qa-body'>" +
            "<div class='qa-arch'>" + c.arch + "</div>" +
            "<ul>" + bulletsHtml + "</ul>" +
          "</div>" +
        "</details>"
      );
    }).join("");
  }

  document.getElementById("qa-expand-all")?.addEventListener("click", () => {
    container.querySelectorAll("details.qa-card").forEach(d => { d.open = true; });
  });
  document.getElementById("qa-collapse-all")?.addEventListener("click", () => {
    container.querySelectorAll("details.qa-card").forEach(d => { d.open = false; });
  });

  render();
})();
</script></div><footer class="sl-flex"><div class="meta sl-flex"></div><div class="pagination-links print:hidden" dir="ltr"><a href="sec3-takeaway.html" rel="prev"><svg aria-hidden="true" class="astro-b5raizh3" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="--sl-icon-size: 1.5rem;"><path d="M17 11H9.41l3.3-3.29a1.004 1.004 0 1 0-1.42-1.42l-5 5a1 1 0 0 0-.21.33 1 1 0 0 0 0 .76 1 1 0 0 0 .21.33l5 5a1.002 1.002 0 0 0 1.639-.325 1 1 0 0 0-.219-1.095L9.41 13H17a1 1 0 0 0 0-2Z"/></svg><span>Previous<br><span class="link-title">3.7 Section 3 Master Takeaway</span></span></a><a href="mcq-sec3.html" rel="next"><svg aria-hidden="true" class="astro-b5raizh3" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="--sl-icon-size: 1.5rem;"><path d="M17.92 11.62a1.001 1.001 0 0 0-.21-.33l-5-5a1.003 1.003 0 1 0-1.42 1.42l3.3 3.29H7a1 1 0 0 0 0 2h7.59l-3.3 3.29a1.002 1.002 0 0 0 .325 1.639 1 1 0 0 0 1.095-.219l5-5a1 1 0 0 0 .21-.33 1 1 0 0 0 0-.76Z"/></svg><span>Next<br><span class="link-title">Section 3 Practice Questions</span></span></a></div></footer></div></div>
