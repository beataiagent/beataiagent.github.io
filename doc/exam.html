<script id="quiz-data" type="application/json">{"meta": {"title": "Professional Agentic Architect", "subtitle": "Practice exam · 120 questions, every answer traced to a Google documentation page", "passScore": 70, "citationNote": "Every question links to the exact Google documentation page the fact came from — read live from docs.cloud.google.com, antigravity.google and adk.dev in September 2026, not from memory. Questions were written only from facts stated on those pages."}, "sections": [{"id": 1, "code": "1", "title": "Building agents using low-code tools", "weight": 13, "color": "s1", "subtopics": [{"code": "1.1", "title": "Configuring agentic workflows and behavior using low-code tools"}, {"code": "1.2", "title": "Connecting enterprise data to Gemini Enterprise"}]}, {"id": 2, "code": "2", "title": "Using coding agents for application development", "weight": 17, "color": "s2", "subtopics": [{"code": "2.1", "title": "Using coding agents effectively"}, {"code": "2.2", "title": "Customizing coding agents for enterprise workflows"}]}, {"id": 3, "code": "3", "title": "Developing custom agents", "weight": 33, "color": "s3", "subtopics": [{"code": "3.1", "title": "Designing and building agentic workflows in code"}, {"code": "3.2", "title": "Integrating enterprise domain knowledge"}, {"code": "3.3", "title": "Orchestrating and coordinating agentic workflows"}]}, {"id": 4, "code": "4", "title": "Evaluating and deploying agentic workflows", "weight": 22, "color": "s4", "subtopics": [{"code": "4.1", "title": "Evaluating agents in development and in production"}, {"code": "4.2", "title": "Deploying and scaling production workloads"}]}, {"id": 5, "code": "5", "title": "Securing and governing agentic workflows", "weight": 15, "color": "s5", "subtopics": [{"code": "5.1", "title": "Configuring agent security and governance"}, {"code": "5.2", "title": "Implementing secure agent behavior and execution"}]}], "questions": [{"id": "1.1-1", "section": 1, "subtopic": "1.1", "type": "single", "prompt": "In a Dialogflow CX flow, a builder needs a state handler that fires as soon as a collected parameter satisfies a numeric threshold, without requiring the end user to say anything that matches a particular intent. Which handler does that describe?", "options": ["An intent route, because every route must declare an intent requirement", "An event handler bound to a built-in event", "A condition route — a route whose only requirement is a condition", "A form parameter's fulfillment, which is the only handler type able to read parameter values"], "correct": 2, "explanation": "Routes are called when end-user input matches an intent and/or a condition is met: a route with an intent requirement is an intent route, and a route with only a condition is a condition route. Event handlers are a different handler type, called only when an event is invoked; fulfillment is one of the three data types a handler carries, not a handler type.", "references": [{"code": "R_CX_HANDLER", "label": "Dialogflow CX — State handlers", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/handler", "verified": true}]}, {"id": "1.1-2", "section": 1, "subtopic": "1.1", "type": "single", "prompt": "A Dialogflow CX agent has routes and event handlers defined at flow level, page level, and on form parameters. In what order does the agent process state handlers on a conversational turn?", "options": ["Scope, then evaluation, then call", "Evaluation, then scope, then call", "Call, then scope, then evaluation", "Scope, then call, then evaluation"], "correct": 0, "explanation": "State handler processing has three steps in the order scope, evaluation, call. Scope comes first because it depends on whether the handler is applied to a flow, a page, or a form parameter, and whether that flow or page is active or the agent is currently filling that form parameter.", "references": [{"code": "R_CX_HANDLER", "label": "Dialogflow CX — State handlers", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/handler", "verified": true}]}, {"id": "1.1-3", "section": 1, "subtopic": "1.1", "type": "single", "prompt": "A condition route is defined on the active flow, but the conversation is currently on a page of that flow that is not the flow's start page, and the route never fires. Per the state-handler scoping rules, why?", "options": ["Condition routes are only ever evaluated on form parameters during parameter filling, never on a flow or a page", "Routes defined on a flow go out of scope as soon as any page of that flow becomes active, including the start page", "A flow-level route is in scope only while its own flow is inactive and some other flow is handling the current turn", "Routes on the active flow are in scope on a non-start page only if they have an intent requirement, and this one has only a condition"], "correct": 3, "explanation": "Routes applied to the active flow are in scope if the current page is the flow start page; if the current page is not the start page, they are in scope only if they have an intent requirement. A condition-only route therefore never comes into scope there.", "references": [{"code": "R_CX_HANDLER", "label": "Dialogflow CX — State handlers", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/handler", "verified": true}]}, {"id": "1.1-4", "section": 1, "subtopic": "1.1", "type": "single", "prompt": "A designer wants a route's transition target to jump straight to an arbitrary mid-flow page that belongs to a different, currently inactive flow. What does Dialogflow CX actually permit for a transition target?", "options": ["Any page in any flow of the agent may be named as a transition target", "The next page can only be a flow start page or a page within the currently active flow", "Only pages inside the currently active flow are valid; the start pages of other flows are not valid targets", "Only event handlers, not routes, are allowed to specify a transition target"], "correct": 1, "explanation": "The documented restriction is that the next page can only be a flow start page or a page within the currently active flow, so an arbitrary mid-flow page of another flow is not reachable. Transition target is one of the three data types any state handler can carry, so it is not limited to event handlers.", "references": [{"code": "R_CX_HANDLER", "label": "Dialogflow CX — State handlers", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/handler", "verified": true}]}, {"id": "1.1-5", "section": 1, "subtopic": "1.1", "type": "multi", "prompt": "A Dialogflow CX agent is being hardened against conversational dead ends using built-in events. Which two situations invoke a built-in event, triggering an event handler rather than a route? (Select two.)", "options": ["The agent receives unexpected end-user input", "End-user input matches a route's intent requirement", "A condition on a route evaluates to true", "A webhook call returns an error", "The agent transitions to a flow start page"], "correct": [0, 3], "explanation": "Built-in events are triggered by unexpected end-user input or by a webhook error; you can also define custom events. Matching an intent or satisfying a condition invokes a route, not an event handler.", "references": [{"code": "R_CX_HANDLER", "label": "Dialogflow CX — State handlers", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/handler", "verified": true}]}, {"id": "1.1-6", "section": 1, "subtopic": "1.1", "type": "single", "prompt": "A team with limited coding capacity wants to visually map an agent's workflow and experiment with configurations, seeing responses in real time, before they commit to deploying the agent or transitioning it to code. Which offering is described?", "options": ["Agent Garden, a curated library of prebuilt agent samples and templates", "Agent Registry, the central catalog for governance and inventory", "Agent Studio, the low-code visual designer inside the Google Cloud console", "Example Store, which holds labeled input-output pairs"], "correct": 2, "explanation": "Agent Studio is the low-code visual designer in the Google Cloud console (Preview) that lets you visually map agent workflows, test responses in real time, and experiment with configurations before deploying or transitioning to code. Agent Garden supplies prebuilt samples and Agent Registry is a governance catalog, neither of which is a visual designer.", "references": [{"code": "R_AGENT_STUDIO", "label": "Design agents in Agent Studio", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/agent-studio/design-agents", "verified": true}]}, {"id": "1.1-7", "section": 1, "subtopic": "1.1", "type": "single", "prompt": "A low-code agent occasionally responds in the wrong shape, so the team adds labeled input-output pairs as few-shot examples to demonstrate the expected response. What does adding these examples actually do?", "options": ["It updates the pretrained model's parameters so the corrected behavior becomes permanent in the model", "It steers behavior through in-context learning without updating the pretrained model's parameters", "It expands the LLM's breadth of knowledge with the facts contained in the examples", "It converts the examples into hard output filters that block any non-conforming response"], "correct": 1, "explanation": "Few-shot examples are a form of in-context learning: they do not update the pretrained model's parameters and do not affect the LLM's breadth of knowledge, which makes them a lightweight way to correct or improve behavior.", "references": [{"code": "R_EXAMPLE_STORE", "label": "Example Store overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/optimize/example-store/overview", "verified": true}]}, {"id": "1.1-8", "section": 1, "subtopic": "1.1", "type": "single", "prompt": "A Dialogflow CX designer is debugging why a handler never fires. Which sequence describes how a state handler is processed on each conversational turn?", "options": ["Scope, then evaluation, then call", "Evaluation, then scope, then call", "Call, then scope, then evaluation", "Scope, then call, then evaluation"], "correct": 0, "explanation": "Processing a state handler has three steps in order: the handler must be in scope, it is then evaluated against its requirements, and only if it passes is it called. A handler that is never in scope is never evaluated, which is the usual cause of a handler that appears to do nothing.", "references": [{"code": "R_CX_HANDLER", "label": "Dialogflow CX — State handlers", "url": "https://docs.cloud.google.com/dialogflow/cx/docs/concept/handler", "verified": true}]}, {"id": "1.2-1", "section": 1, "subtopic": "1.2", "type": "single", "prompt": "An architect is inventorying which enterprise systems can be ingested directly into a custom Agent Search data store. Which set contains only supported ingestion sources?", "options": ["BigQuery, Cloud Storage, Cloud Composer, and Google Calendar", "Cloud SQL, Spanner, Firestore, Bigtable, and AlloyDB for PostgreSQL", "Google Drive, Gmail, Google Sites, and Cloud Logging", "Cloud Storage, Google Groups, Pub/Sub, and Firestore"], "correct": 1, "explanation": "The supported ingestion sources for a custom search data store include website content, BigQuery, Cloud Storage, Google Drive, Gmail, Google Sites, Google Calendar, Google Groups, Cloud SQL, Spanner, Firestore, Bigtable, and AlloyDB for PostgreSQL, plus structured JSON via the API and Terraform. Cloud Composer, Cloud Logging, and Pub/Sub are not on that list, so every other set is contaminated.", "references": [{"code": "R_AS_DATASTORE", "label": "Agent Search — Create a search data store", "url": "https://docs.cloud.google.com/generative-ai-app-builder/docs/create-data-store-es", "verified": true}]}, {"id": "1.2-2", "section": 1, "subtopic": "1.2", "type": "single", "prompt": "A team is connecting a mixed repository of HTML pages, PDF, DOCX, PPTX, and XLSX files to Agent Search. The corpus is dense with tables, lists, and section headings, and will be used for RAG. Which parser configuration does the documentation recommend?", "options": ["The digital parser, since it is on by default and detects every structural element", "The OCR parser for PDFs, applied across all five file types", "Bring your own parsed document, the only option that preserves tables", "The layout parser, turned on for HTML, PDF, DOCX, PPTX, and XLSX"], "correct": 3, "explanation": "The layout parser is recommended when content has rich structural elements, and the docs say to turn it on for HTML, PDF, DOCX, PPTX, and XLSX when using Agent Search for RAG; it detects paragraph, table, image, list, title, and heading elements. The digital parser detects only paragraph elements, and the OCR parser is not applicable to HTML or DOCX.", "references": [{"code": "R_AS_PARSE", "label": "Agent Search — Parse and chunk documents", "url": "https://docs.cloud.google.com/generative-ai-app-builder/docs/parse-chunk-documents", "verified": true}]}, {"id": "1.2-3", "section": 1, "subtopic": "1.2", "type": "single", "prompt": "A data store is loaded with scanned PDFs whose text sits inside page images. No parser was specified when the data store was created, and retrieval quality is poor. Which statement explains the situation and gives the lower-cost fix?", "options": ["The digital parser is applied by default to all file types; switch to the OCR parser for PDFs, which is the lower-cost alternative to the layout parser for scanned PDFs", "No parser runs at all unless one is specified; enable the digital parser, which performs OCR on scanned pages", "The layout parser is applied by default and cannot read scanned documents, so bring your own parsed document is the only remaining route", "The OCR parser is applied by default to PDFs, so the only way to improve results is the layout parser"], "correct": 0, "explanation": "The digital parser is on by default for all file types unless another parser is specified, and it detects only paragraph elements. The OCR parser for PDFs is documented as a lower-cost alternative to the layout parser for scanned PDFs or PDFs with text inside images; the layout parser can also OCR scanned documents, but it is not the default and not the cheaper option.", "references": [{"code": "R_AS_PARSE", "label": "Agent Search — Parse and chunk documents", "url": "https://docs.cloud.google.com/generative-ai-app-builder/docs/parse-chunk-documents", "verified": true}]}, {"id": "1.2-4", "section": 1, "subtopic": "1.2", "type": "single", "prompt": "Before connecting a large document corpus that will feed an LLM, an architect is asked to justify turning on document chunking in Agent Search. What does chunking accomplish?", "options": ["It removes the need to select a parser, because chunking replaces parsing", "It indexes whole documents instead of fragments, so the LLM always receives the complete file", "It indexes the data as chunks, which improves relevance and decreases the computational load for LLMs", "It compresses the data store to reduce storage cost, with no effect on relevance"], "correct": 2, "explanation": "Turning on document chunking indexes the data as chunks to improve relevance and decrease computational load for LLMs. Parsing is still required — in fact the layout parser improves how documents are chunked, because it detects elements such as headings and lists.", "references": [{"code": "R_AS_PARSE", "label": "Agent Search — Parse and chunk documents", "url": "https://docs.cloud.google.com/generative-ai-app-builder/docs/parse-chunk-documents", "verified": true}]}, {"id": "1.2-5", "section": 1, "subtopic": "1.2", "type": "multi", "prompt": "A team is standing up a website data store for Agent Search and is weighing whether to enable Advanced website indexing. Which two statements are true? (Select two.)", "options": ["Advanced website indexing is provided at no additional cost", "The website data store must be attached to an app that has Enterprise features turned on in order to be used", "Domain ownership verification is not required for the sites being indexed", "The indexing options chosen when the data store is created can be changed later from the console", "Once Advanced website indexing is turned on, it cannot be turned off later"], "correct": [1, 4], "explanation": "A website data store must be attached to an app with Enterprise features turned on, and Advanced website indexing cannot be turned off once enabled. Advanced website indexing also incurs additional cost and requires verifying domain ownership, and the indexing options cannot be changed later either.", "references": [{"code": "R_AS_DATASTORE", "label": "Agent Search — Create a search data store", "url": "https://docs.cloud.google.com/generative-ai-app-builder/docs/create-data-store-es", "verified": true}]}, {"id": "1.2-6", "section": 1, "subtopic": "1.2", "type": "single", "prompt": "A website data store was created with Automatic URL Discovery & Continuous Updates. Content editors report that a brand-new landing page never appears in results and that some indexed pages show outdated content. What explains both symptoms?", "options": ["This option indexes the specified URLs only if those pages are already known to Google, and refreshes on a best-effort basis", "This option indexes only the URLs listed in a submitted sitemap and refreshes every one of them exactly once every 24 hours", "This option leaves Automatic Refresh disabled and Sitemap Mode set to Discovery, so refreshes must be triggered by hand", "The digital parser cannot process HTML documents, so newly published landing pages are skipped entirely during indexing"], "correct": 0, "explanation": "Automatic URL Discovery & Continuous Updates indexes specified URLs only if those pages are already known to Google — a very new page will not be, because Google's crawler has not crawled it — and then discovers and refreshes on a best-effort basis, which can leave relatively stale pages. This option sets Automatic Refresh to Enabled and Sitemap Mode to Discovery, so neither a disabled refresh nor a sitemap-only rule is the cause.", "references": [{"code": "R_AS_DATASTORE", "label": "Agent Search — Create a search data store", "url": "https://docs.cloud.google.com/generative-ai-app-builder/docs/create-data-store-es", "verified": true}]}, {"id": "1.2-7", "section": 1, "subtopic": "1.2", "type": "single", "prompt": "An operations team wants to refresh a structured Agent Search data store from BigQuery after the source table gained two new fields, with all existing fields unchanged. What determines whether the refresh is permitted?", "options": ["Any schema change is permitted as long as the refresh runs from Cloud Storage rather than BigQuery", "Refreshes require a byte-for-byte identical schema, so adding fields forces a rebuild of the data store", "Structured data stores cannot be refreshed at all; only unstructured data stores can", "The refresh is permitted, because adding only new fields to an existing schema is backward compatible"], "correct": 3, "explanation": "A structured data store can be refreshed only if the schema is the same as, or backward compatible with, the schema already in the data store, and adding only new fields to an existing schema is explicitly backward compatible. The rule is about schema compatibility, not about which of Cloud Storage or BigQuery is the source.", "references": [{"code": "R_AS_REFRESH", "label": "Agent Search — Refresh structured and unstructured data", "url": "https://docs.cloud.google.com/generative-ai-app-builder/docs/refresh-data", "verified": true}]}, {"id": "1.2-8", "section": 1, "subtopic": "1.2", "type": "single", "prompt": "An engineer is automating a periodic refresh of an Agent Search data store from Cloud Storage through the REST API instead of the console. Which method and setting does the documentation specify?", "options": ["The dataStores.patch method, with a refresh interval configured on the data store", "The documents.purge method, followed by re-creating the data store from scratch", "The documents.import method, specifying the appropriate reconciliationMode", "The documents.import method, which accepts only BigQuery as a refresh source"], "correct": 2, "explanation": "To refresh data via REST you use the documents.import method and specify the appropriate reconciliationMode. Refreshing is supported from either Cloud Storage or BigQuery, so the option restricting documents.import to BigQuery is wrong.", "references": [{"code": "R_AS_REFRESH", "label": "Agent Search — Refresh structured and unstructured data", "url": "https://docs.cloud.google.com/generative-ai-app-builder/docs/refresh-data", "verified": true}]}, {"id": "2.1-1", "section": 2, "subtopic": "2.1", "type": "single", "prompt": "A platform team is evaluating Antigravity's Terminal Sandbox for isolating shell commands run by coding agents. Developers complain that other tools they tried added noticeable start-up latency to every command. How does Terminal Sandbox achieve isolation?", "options": ["It builds a Docker image for each project and runs every shell command in a fresh container from that image.", "It provisions a lightweight virtual machine per workspace that is kept warm between commands to hide the boot time.", "It uses native OS primitives — Linux kernel namespaces and macOS Seatbelt profiles — so there are no VMs or Docker images.", "It forwards each shell command to a remote Code Execution sandbox and streams the output back to the terminal."], "correct": 2, "explanation": "Terminal Sandbox is built on native OS primitives: kernel namespaces on Linux and sandbox-exec / Seatbelt profiles (SBPL) on macOS. Because it uses no VMs or Docker images, there is no start-up delay.", "references": [{"code": "R_AG_SANDBOX", "label": "Antigravity — Terminal Sandbox", "url": "https://antigravity.google/docs/sandbox/", "verified": true}]}, {"id": "2.1-2", "section": 2, "subtopic": "2.1", "type": "single", "prompt": "An Antigravity permission configuration places command(*) on the Ask list and command(git) on the Allow list. A developer expects git commands to run without interruption. What actually happens when the agent tries to run git status?", "options": ["git commands run without prompting, because the Allow entry is more specific than the Ask entry.", "The agent prompts for approval before every command, git included, because precedence is strictly Deny > Ask > Allow.", "git commands are denied outright, because a target appearing on two lists is treated as a conflict and blocked.", "The two entries cancel each other out and the agent falls back to the default behaviour for unlisted actions."], "correct": 1, "explanation": "Permission precedence is strictly Deny > Ask > Allow, and specificity does not override it. With command(*) on Ask, the agent prompts before every command even though command(git) is on the Allow list.", "references": [{"code": "R_AG_PERMISSIONS", "label": "Antigravity — Agent Permissions", "url": "https://antigravity.google/docs/permissions/", "verified": true}]}, {"id": "2.1-3", "section": 2, "subtopic": "2.1", "type": "single", "prompt": "A data-analysis agent builds up in-memory objects in a Code Execution sandbox over a multi-day investigation and needs to resume from that state on later days rather than recomputing. What does Code Execution provide?", "options": ["Execution state is discarded as soon as the current request completes.", "Sandboxes retain execution state for up to 24 hours, which cannot be changed.", "Sandboxes retain execution state indefinitely until the sandbox is explicitly deleted.", "Sandboxes maintain execution state (memory) for up to 14 days, with a configurable TTL."], "correct": 3, "explanation": "Code Execution sandboxes maintain execution state (memory) for up to 14 days, and the TTL is configurable — so a long-running investigation can resume from prior state.", "references": [{"code": "R_CODE_EXEC", "label": "Code Execution (sandbox)", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/code-execution-overview", "verified": true}]}, {"id": "2.1-4", "section": 2, "subtopic": "2.1", "type": "single", "prompt": "A coding agent running in a Managed Agents API sandbox must install packages from a small set of external repositories. Given the sandbox's documented defaults, what has to be configured?", "options": ["An explicit network allowlist, because the sandbox has no external network access by default", "Nothing, because the sandbox already has outbound internet access by default", "A persistent file system, because network access is granted only to sandboxes with persistent storage", "A Private Service Connect endpoint, because sandboxes cannot reach public repositories at all"], "correct": 0, "explanation": "Managed Agents API sandboxes operate with network isolation by default, so the documented way to reach external resources is to explicitly declare a network allowlist. Persistent file systems and Private Service Connect endpoints are separate concerns and do not enable this.", "references": [{"code": "R_MANAGED_SANDBOX", "label": "Managed Agents API sandbox environment", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/managed-agents/sandbox-environment", "verified": true}]}, {"id": "2.1-5", "section": 2, "subtopic": "2.1", "type": "single", "prompt": "A security engineer is planning CodeMender scans of a large monorepo with cm find and wants to follow the documented guidance on scan granularity. What should the engineer do?", "options": ["Scan targeted modules or batches of 10-50 files at a time.", "Scan the entire repository in a single cm find invocation so no file is missed.", "Scan in batches of 100-500 files to amortize the reasoning engine's fixed cost.", "Scan strictly one file per invocation so each finding maps to exactly one command."], "correct": 0, "explanation": "The documented recommendation for cm find is to scan targeted modules or batches of 10-50 files at a time; the other batch sizes and whole-repository scans are not the guidance given.", "references": [{"code": "R_CM_SCAN", "label": "CodeMender — Scan and verify code vulnerabilities", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/codemender/scan-and-verify", "verified": true}]}, {"id": "2.1-6", "section": 2, "subtopic": "2.1", "type": "single", "prompt": "During cm fix FINDING_ID, CodeMender has generated a patch candidate, applied it to a copy of the source in the local sandbox, and confirmed the project compiles and the unit tests pass using the configured build.command. What is the next step in the validation sequence?", "options": ["Write the patch to the working tree so the developer can inspect it with git diff.", "Re-run the verified proof-of-concept exploit to confirm the vulnerability is no longer exploitable.", "Regenerate a second patch candidate and compare the two diffs for consistency.", "Re-run cm find over the affected module to confirm the finding has disappeared."], "correct": 1, "explanation": "The fourth and final step of the cm fix validation sequence is re-running the verified PoC exploit against the patched copy to confirm the vulnerability is no longer exploitable. Writing to disk happens after validation and is gated by a per-file confirmation prompt.", "references": [{"code": "R_CM_FIX", "label": "CodeMender — Fix vulnerabilities and manage diffs", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/codemender/fix-and-patch", "verified": true}]}, {"id": "2.1-7", "section": 2, "subtopic": "2.1", "type": "single", "prompt": "A team runs cm fix in a repository where every write must be reviewed, but a separate batch job needs the same command to run unattended. What does the documentation say about CodeMender's default write behaviour and how to change it?", "options": ["By default CodeMender prompts to confirm each file modification, and -y auto-approves writes", "By default CodeMender writes all files immediately, and --review enables confirmation prompts", "By default CodeMender only prints a diff, and --apply is required to write anything", "By default CodeMender commits the patch to git, and --no-commit leaves it unstaged"], "correct": 0, "explanation": "CodeMender prompts you to confirm each file modification before writing it to disk by default; the -y (--yes) flag auto-approves those writes for unattended runs. The other described defaults and flags are not what the documentation specifies.", "references": [{"code": "R_CM_FIX", "label": "CodeMender — Fix vulnerabilities and manage diffs", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/codemender/fix-and-patch", "verified": true}]}, {"id": "2.1-8", "section": 2, "subtopic": "2.1", "type": "multi", "prompt": "A team is deciding whether Code Execution fits an agent that runs on a third-party framework and must process moderately large files. Which two statements about Code Execution are accurate? (Select two.)", "options": ["The agent must first be deployed to Agent Platform before it can use Code Execution.", "File I/O of up to 100 MB is supported per request and response.", "Sandboxes typically take up to a minute to provision before the first execution can run.", "The sandbox provides a limited file system and no network access.", "It works only with agents built on ADK and running Gemini models."], "correct": [1, 3], "explanation": "Code Execution supports file I/O up to 100 MB per request and response, and the sandbox offers a limited file system with no network access. Sandboxes are created and executing code in under a second, the agent need not be deployed to Agent Platform, and it works with any agent framework and any generative model.", "references": [{"code": "R_CODE_EXEC", "label": "Code Execution (sandbox)", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sandbox/code-execution-overview", "verified": true}]}, {"id": "2.1-9", "section": 2, "subtopic": "2.1", "type": "single", "prompt": "A consultancy wants to use CodeMender to scan a client's proprietary codebase and also to probe a competitor's public binary distribution for weaknesses. Which statement reflects the documented usage restrictions?", "options": ["Any publicly reachable repository may be scanned, because scanning with cm find is read-only and does not modify code.", "Any code may be analysed as long as the team only runs cm find and never applies a fix.", "Use is restricted to code you own or are authorized to modify, or OSI-licensed open source, and solely for legitimate security defense.", "Third-party code may be analysed provided the client holds an active support contract covering that software."], "correct": 2, "explanation": "CodeMender use is restricted to code you own or are authorized to work on, or OSI-licensed open source, and solely for legitimate security defense purposes — not unauthorized testing or exploitation. Probing a competitor's distribution falls outside that.", "references": [{"code": "R_CODEMENDER", "label": "CodeMender overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/codemender", "verified": true}]}, {"id": "2.1-10", "section": 2, "subtopic": "2.1", "type": "single", "prompt": "An administrator adds write_file(src/**) to the Allow list in Antigravity's agent permissions so the agent can edit application source. A colleague asks whether a matching read_file(src/**) entry is also required for the agent to open those files.", "options": ["No — granting write_file implicitly grants read_file for the same target.", "Yes — read_file must be listed separately, because each action is evaluated independently.", "Yes — reads are treated as sensitive and stay on the Ask list until explicitly allowed.", "No — permission resources apply only to shell commands, so file actions are never evaluated."], "correct": 0, "explanation": "Permission resources take the form action(target), and write_file implicitly grants read_file for the same target, so no separate read entry is needed.", "references": [{"code": "R_AG_PERMISSIONS", "label": "Antigravity — Agent Permissions", "url": "https://antigravity.google/docs/permissions/", "verified": true}]}, {"id": "2.1-11", "section": 2, "subtopic": "2.1", "type": "single", "prompt": "A build team must disable CodeMender's local process-level sandbox using --sandbox=false in config.yaml (or --unrestricted) because their toolchain cannot run under it. What does Google recommend in that situation?", "options": ["Add -y to the command so approval prompts do not block the unsandboxed run.", "Restrict the run to batches of 10-50 files so the blast radius stays small.", "Skip PoC exploit verification, since it cannot be executed safely outside the sandbox.", "Run the CodeMender CLI inside an isolated VM or container."], "correct": 3, "explanation": "When the local process-level sandbox is bypassed with --sandbox=false or --unrestricted, Google recommends running the CLI in an isolated VM or container. The -y flag only skips interactive approval prompts and provides no isolation.", "references": [{"code": "R_CM_SCAN", "label": "CodeMender — Scan and verify code vulnerabilities", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/codemender/scan-and-verify", "verified": true}]}, {"id": "2.1-12", "section": 2, "subtopic": "2.1", "type": "multi", "prompt": "A security reviewer is documenting what an agent can and cannot touch when its shell commands run under Antigravity's Terminal Sandbox. Which two statements are correct? (Select two.)", "options": ["Sensitive files such as ~/.ssh and .env are blocked from the agent.", "Read access to system paths such as /usr and /etc is blocked.", "Network access is limited to a set of approved domains.", "The agent cannot write to project folders, temporary directories, or build caches.", "Each command is isolated by launching a fresh Docker container from a hardened base image."], "correct": [0, 2], "explanation": "Terminal Sandbox blocks sensitive files such as ~/.ssh and .env and limits network access to approved domains. It does allow reads of /usr and /etc and writes to project folders, temp directories, and build caches, and it uses native OS primitives rather than Docker.", "references": [{"code": "R_AG_SANDBOX", "label": "Antigravity — Terminal Sandbox", "url": "https://antigravity.google/docs/sandbox/", "verified": true}]}, {"id": "2.2-1", "section": 2, "subtopic": "2.2", "type": "single", "prompt": "A team wants an Antigravity rules file that automatically constrains the agent whenever it edits JavaScript files, and nowhere else. The draft rules file is long and still growing. Which configuration matches the documentation?", "options": ["Set the activation mode to Always On and keep the file under 4,000 characters.", "Set the activation mode to Glob with a pattern such as *.js and keep the file within the 12,000-character limit.", "Set the activation mode to Manual and have developers @mention the rule on each JavaScript task; the file may be any length.", "Set the activation mode to Model Decision and keep the file within the 2,000-character limit."], "correct": 1, "explanation": "Glob activation applies a rule to files matching a pattern such as *.js, which is exactly the requested behaviour, and rules files are limited to 12,000 characters each. Always On applies everywhere and Manual requires an @mention, so neither is automatic-and-scoped.", "references": [{"code": "R_AG_RULES", "label": "Antigravity — Rules", "url": "https://antigravity.google/docs/rules-workflows/", "verified": true}]}, {"id": "2.2-2", "section": 2, "subtopic": "2.2", "type": "single", "prompt": "An enterprise has published about 40 skills into .agents/skills across its repositories and is worried that every conversation will start with an enormous prompt. How does the Antigravity skills mechanism handle this?", "options": ["The full contents of every SKILL.md are loaded into the system prompt at the start of the conversation, so the total number of skills must be kept small.", "Only skills belonging to an installed plugin are loaded; loose skill folders are ignored.", "Progressive disclosure — the agent initially sees only the list of skill names and descriptions, and reads a skill's full instructions only if it looks relevant.", "Developers must @mention each skill by name before the agent can see that it exists."], "correct": 2, "explanation": "Skills use progressive disclosure: the agent initially sees only skill names and descriptions and reads the full SKILL.md instructions only when a skill looks relevant to the task.", "references": [{"code": "R_AG_SKILLS", "label": "Antigravity — Skills (SKILL.md)", "url": "https://antigravity.google/docs/skills/", "verified": true}]}, {"id": "2.2-3", "section": 2, "subtopic": "2.2", "type": "single", "prompt": "An enterprise wants its house linter to run automatically every time the agent finishes a file-editing tool call, so violations are caught immediately rather than at the end of the task. Which hooks.json event should be configured?", "options": ["PostToolUse, with a matcher selecting the edit tool and a command that invokes the linter.", "PreInvocation, with a matcher on the edit tool so the linter runs before the model is called.", "Stop, so the linter runs once when the agent finishes the whole task.", "PostInvocation, so the linter runs after each model response rather than after each tool call."], "correct": 0, "explanation": "Hooks run custom scripts or shell commands at specific points in Antigravity's execution loop, and PostToolUse is the documented handler list that runs after a tool completes. Hooks are configured in hooks.json in the customization directory.", "references": [{"code": "R_AG_HOOKS", "label": "Antigravity — Hooks", "url": "https://antigravity.google/docs/hooks/", "verified": true}]}, {"id": "2.2-4", "section": 2, "subtopic": "2.2", "type": "single", "prompt": "A lead wants to dispatch a subagent to attempt a risky refactor concurrently, without that subagent's edits appearing in the working tree the parent agent is using. Which subagent workspace option should be chosen?", "options": ["inherit, so the subagent operates in the same workspace as the parent.", "share, so both agents coordinate edits to the same files.", "inherit combined with a PreToolUse hook that rejects writes outside a scratch directory.", "branch, which gives the subagent an isolated Git worktree."], "correct": 3, "explanation": "The branch workspace option runs the subagent in an isolated Git worktree, so its edits do not touch the parent's working tree; inherit and share both place the subagent in the parent's workspace.", "references": [{"code": "R_AG_SUBAGENTS", "label": "Antigravity — Asynchronous Subagents", "url": "https://antigravity.google/docs/subagents/", "verified": true}]}, {"id": "2.2-5", "section": 2, "subtopic": "2.2", "type": "single", "prompt": "A platform team wants to distribute one installable unit that carries the company's skills, rules, MCP server definitions, and hooks together, under a single namespace. What should they build, and what file is required?", "options": ["A skill folder whose SKILL.md references the rules, MCP servers, and hooks as subfolders.", "A Skill Registry skill revision, which packages instructions, executable code, and documentation.", "A hooks.json manifest that lists the other assets so they are installed alongside the hooks.", "An Antigravity plugin — a namespaced bundle of skills, rules, MCP servers, and hooks — which requires a plugin.json marker file."], "correct": 3, "explanation": "Plugins are namespaced bundles that group skills, rules, MCP servers, and hooks into one package, and plugin.json is the required marker file (with mcp_config.json, hooks.json, skills/ and rules/ optional).", "references": [{"code": "R_AG_PLUGINS", "label": "Antigravity — Plugins", "url": "https://antigravity.google/docs/plugins/", "verified": true}]}, {"id": "2.2-6", "section": 2, "subtopic": "2.2", "type": "multi", "prompt": "A DevOps engineer is wiring agy -p into a CI job that captures the agent's answer for a downstream step. Which two statements about Antigravity CLI headless (print) mode are correct? (Select two.)", "options": ["The agent's response is written to stdout, while diagnostics, errors, authentication prompts, and progress go to stderr.", "Headless mode keeps the session open so later pipeline steps can send follow-up prompts to the same run.", "Headless mode automatically approves every tool permission request for the duration of the run.", "It relies on cached credentials, so the CI run exits with an authentication error unless an interactive login has already been performed.", "Headless mode works by prepending /plan to the prompt so the agent outlines steps before acting."], "correct": [0, 3], "explanation": "In headless (print) mode the response goes to stdout and diagnostics, errors, auth prompts, and progress go to stderr, which is what makes the output pipeable. It uses cached credentials, so an interactive authentication must happen first or the CI run exits with an auth error. Prepending /plan is the plan execution mode, not headless mode.", "references": [{"code": "R_AG_CLI_HEADLESS", "label": "Antigravity CLI — headless mode", "url": "https://antigravity.google/docs/cli/headless/", "verified": true}]}, {"id": "2.2-7", "section": 2, "subtopic": "2.2", "type": "single", "prompt": "A developer switches the Antigravity CLI to accept-edits mode to stop reviewing every diff, and asks whether shell commands will now also run without approval. What is the correct answer?", "options": ["Yes — accept-edits auto-approves every tool the agent invokes, including run_command and network calls.", "No — accept-edits auto-approves file edits and creations, but permission rules still govern run_command in all modes.", "No — run_command is blocked entirely while accept-edits is active, so shell work requires switching to default mode.", "Yes for read-only shell commands; tool permission rules are only evaluated while the CLI is in plan mode."], "correct": 1, "explanation": "accept-edits auto-approves file edits and creations (mkdir, touch, writes), but tool permission rules continue to govern shell commands (run_command) across all execution modes.", "references": [{"code": "R_AG_CLI_MODES", "label": "Antigravity CLI — execution modes", "url": "https://antigravity.google/docs/cli/modes/", "verified": true}]}, {"id": "2.2-8", "section": 2, "subtopic": "2.2", "type": "single", "prompt": "While working in the Antigravity CLI, an engineer has several background subagents running concurrently and needs to inspect them and terminate one that has gone off track. What should the engineer use?", "options": ["The /permissions command, which lists the agent's active tool sessions and revokes the ones that have gone off track.", "The /plan command, which pauses every running subagent so that its outlined steps can be reviewed before continuing.", "The /agents command, which opens the Agent Manager Panel for monitoring, inspecting and terminating background subagents.", "agy -p with a stop prompt, which sends a headless print-mode signal telling the running subagents to exit."], "correct": 2, "explanation": "The /agents command opens the Agent Manager Panel, which handles both custom agent selection or discovery and monitoring, inspecting, and terminating concurrently running background subagents.", "references": [{"code": "R_AG_CLI_AGENTS", "label": "Antigravity CLI — /agents command", "url": "https://antigravity.google/docs/cli/commands/agents/", "verified": true}]}, {"id": "3.1-1", "section": 3, "subtopic": "3.1", "type": "single", "prompt": "A platform team standardizes on Go for its backend services and wants to write custom agents in the same language, without introducing a second runtime. Which statement about ADK language support is correct?", "options": ["ADK is Python-only, so a Go team must call it through a REST wrapper service.", "ADK is available in Python, TypeScript, Go, and Java, so the agent can be written in Go.", "ADK is available in Python and Java only.", "ADK is available in Python, TypeScript, and C#."], "correct": 1, "explanation": "ADK is an open-source framework that is available in Python, TypeScript, Go, and Java, so a Go team can build the agent natively.", "references": [{"code": "R_ADK", "label": "Agent Development Kit (Agent Platform)", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/adk", "verified": true}]}, {"id": "3.1-2", "section": 3, "subtopic": "3.1", "type": "single", "prompt": "A regulated claims-processing agent must run the same validation steps in the same order on every execution, and auditors require the execution path to be predictable. Which ADK orchestration approach fits?", "options": ["Define the pipeline with ADK workflow agents, which give predictable, pre-defined execution.", "Use agent-coordinated dynamic routing so the model chooses the next step adaptively at run time.", "Package each step as a skill so the agent can discover and load steps based on user intent.", "Deploy the agent on GKE so the container orchestrator fixes the order in which the steps run."], "correct": 0, "explanation": "ADK offers two orchestration styles: predictable pipelines built from workflow agents, and agent-coordinated dynamic routing for adaptive behavior. A fixed, auditable order calls for workflow agents.", "references": [{"code": "R_ADK", "label": "Agent Development Kit (Agent Platform)", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/adk", "verified": true}]}, {"id": "3.1-3", "section": 3, "subtopic": "3.1", "type": "single", "prompt": "A developer wants to build and debug an ADK agent on a laptop and later scale the same agent in production without changing frameworks. Which statement about where ADK agents can run is correct?", "options": ["ADK agents can only run inside Agent Runtime; local execution requires a different framework.", "ADK agents run locally only; production hosting requires porting the agent to Agent Studio.", "ADK agents can run locally, or be scaled using Agent Runtime, Cloud Run, or GKE.", "ADK agents can be scaled only on GKE, because Cloud Run does not support them."], "correct": 2, "explanation": "ADK agents can be run locally and then scaled using Agent Runtime, Cloud Run, or GKE, so the same framework covers development and production.", "references": [{"code": "R_ADK", "label": "Agent Development Kit (Agent Platform)", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/adk", "verified": true}]}, {"id": "3.1-4", "section": 3, "subtopic": "3.1", "type": "single", "prompt": "An ADK agent writes a customer's stated dietary preference into session.state. Two weeks later the customer starts a brand-new session and the preference is gone. What is the documented explanation and the right fix?", "options": ["session.state persists indefinitely across sessions, so the value was lost only because the Event log was truncated.", "session.state is shared across all of a user's sessions, so a concurrent conversation must have overwritten the preference.", "session.state is stored per skill revision, so publishing a new immutable skill revision cleared the stored preference.", "session.state holds temporary data relevant only to the current conversation; cross-session personalization belongs in Memory Bank."], "correct": 3, "explanation": "State is temporary data relevant only to the current conversation. Memory Bank generates long-term memories that persist across multiple sessions, which is what personalization requires.", "references": [{"code": "R_ADK_SESSIONS", "label": "ADK — Session, State, and Memory", "url": "https://adk.dev/sessions/", "verified": true}, {"code": "R_MEMORY_BANK", "label": "Agent Platform Memory Bank", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/memory-bank", "verified": true}]}, {"id": "3.1-5", "section": 3, "subtopic": "3.1", "type": "multi", "prompt": "Which two statements about the core concepts in Agent Platform Sessions are correct? (Select two.)", "options": ["Memory holds data that is discarded when the current session ends.", "State holds temporary data relevant only during the current conversation.", "A Session is an immutable snapshot of a specific agent version.", "An Event captures content along with actions such as function calls.", "State is the definitive store for information that must persist across multiple sessions."], "correct": [1, 3], "explanation": "Sessions define Session, Event (content plus actions such as function calls), State (temporary data for the current conversation only), and Memory (personalized information across multiple sessions) — so Memory, not State, is the cross-session concept.", "references": [{"code": "R_SESSIONS", "label": "Agent Platform Sessions overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sessions", "verified": true}]}, {"id": "3.1-6", "section": 3, "subtopic": "3.1", "type": "single", "prompt": "A team deploys an ADK agent to the platform and asks whether they must write code that calls the Sessions API to create and track each session. What is correct?", "options": ["They must always call the Sessions API directly; automatic handling exists only for Agent Studio agents.", "Sessions are created automatically only after Memory Bank is enabled for the agent.", "With ADK deployed to the platform, session management is handled automatically; direct API calls are for cases that do not use that path.", "Sessions must be created manually because the platform persists only Events, not Sessions."], "correct": 2, "explanation": "When an ADK agent is deployed to the platform, session management is handled automatically; you interact with the Sessions API directly only when you are not using that deployment path.", "references": [{"code": "R_SESSIONS", "label": "Agent Platform Sessions overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/sessions", "verified": true}]}, {"id": "3.1-7", "section": 3, "subtopic": "3.1", "type": "single", "prompt": "Rather than starting from an empty project, a team wants a working prebuilt RAG agent sample whose source they can inspect on GitHub and customize deeply. Which resource does the documentation describe for this?", "options": ["Agent Garden, a curated library of prebuilt agent samples and templates with GitHub source.", "Example Store, which stores labeled input-output pairs used as few-shot examples.", "Skill Registry, which stores immutable snapshots of agent source code.", "Agent Registry, which publishes prebuilt agent samples for teams to copy."], "correct": 0, "explanation": "Agent Garden is the curated library of prebuilt agent samples and templates, including a RAG sample, with GitHub source available for deep customization.", "references": [{"code": "R_AGENT_GARDEN", "label": "Agent Garden", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/agent-garden", "verified": true}]}, {"id": "3.1-8", "section": 3, "subtopic": "3.1", "type": "single", "prompt": "A single ADK agent serves thousands of end users, and long-term memories generated for one user must never surface for another. How does Memory Bank address this?", "options": ["It stores one global collection per project and relies on the agent's prompt to filter by user.", "It isolates memories per session, so every new session starts from an empty collection.", "It isolates memories by skill revision, so publishing a new revision separates users.", "It maintains an isolated collection of memories for each scope, for example a scope defined by agent_name and user."], "correct": 3, "explanation": "Memory Bank keeps an isolated collection of memories for each scope; an example scope is agent_name plus user, which prevents one user's memories from surfacing for another.", "references": [{"code": "R_MEMORY_BANK", "label": "Agent Platform Memory Bank", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/memory-bank", "verified": true}]}, {"id": "3.1-9", "section": 3, "subtopic": "3.1", "type": "single", "prompt": "A latency-sensitive assistant generates long-term memories from every conversation, and the team is worried that users will wait while those memories are produced. Which Memory Bank capability addresses this?", "options": ["Asynchronous memory generation, which runs in the background so the agent does not have to wait.", "Memory generation is always synchronous; reduce latency by extracting fewer memories per turn.", "Memory generation runs only after a human in the loop approves each candidate memory.", "Memory generation is performed by the ranking API, which completes in under 100 ms."], "correct": 0, "explanation": "Memory Bank supports asynchronous generation: memories are generated in the background so the agent does not have to wait for the process to complete.", "references": [{"code": "R_MEMORY_BANK", "label": "Agent Platform Memory Bank", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/memory-bank", "verified": true}]}, {"id": "3.1-10", "section": 3, "subtopic": "3.1", "type": "single", "prompt": "Compliance requires that certain customer facts are reviewed and curated by human analysts before they become long-term memories for an agent. Which documented Memory Bank capability supports feeding those curated facts in?", "options": ["Memory extraction, which retains only the most meaningful information from a conversation.", "Memory consolidation, which can consolidate pre-extracted memories supplied by an agent or by a human in the loop.", "Asynchronous generation, which pauses the agent until a reviewer approves each memory.", "Scope isolation, which restricts the memories to the reviewing analyst's own collection."], "correct": 1, "explanation": "Memory consolidation merges new information with existing memories and can also consolidate pre-extracted memories provided by an agent or by a human in the loop.", "references": [{"code": "R_MEMORY_BANK", "label": "Agent Platform Memory Bank", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/memory-bank", "verified": true}]}, {"id": "3.1-11", "section": 3, "subtopic": "3.1", "type": "multi", "prompt": "Which two capabilities does Memory Bank provide for turning conversations into long-term memories? (Select two.)", "options": ["Memory extraction, which retains only the most meaningful information from a conversation.", "Automatic payload validation on every create and update.", "Memory consolidation, which merges new information with existing memories so they evolve over time.", "Reciprocal Rank Fusion of candidate memories followed by VertexRanker rescoring.", "Temporary per-conversation storage that is cleared when the conversation ends."], "correct": [0, 2], "explanation": "Memory Bank features include memory generation, memory extraction (only the most meaningful information) and memory consolidation (merging new information with existing memories). Automatic payload validation belongs to Skill Registry, and RRF plus VertexRanker belongs to Agent Retrieval.", "references": [{"code": "R_MEMORY_BANK", "label": "Agent Platform Memory Bank", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/memory-bank", "verified": true}]}, {"id": "3.1-12", "section": 3, "subtopic": "3.1", "type": "single", "prompt": "An ADK agent runs very long sessions, and after each turn the team wants to append only the newest events to the MemoryService instead of re-ingesting the whole session. Which MemoryService operation does that?", "options": ["add_session_to_memory, which re-ingests the entire completed session including every earlier turn.", "list_skills, which enumerates the events currently held by the session and adds the new ones.", "Writing the newest turn to session.state, which the MemoryService then reads and archives directly.", "add_events_to_memory, which appends a delta of events such as the latest turn, without re-ingesting the session."], "correct": 3, "explanation": "BaseMemoryService exposes add_session_to_memory to ingest a completed session and add_events_to_memory to append a delta of events, such as the latest turn.", "references": [{"code": "R_ADK_MEMORY", "label": "ADK — Memory (MemoryService)", "url": "https://adk.dev/sessions/memory/", "verified": true}]}, {"id": "3.1-13", "section": 3, "subtopic": "3.1", "type": "single", "prompt": "An architect is explaining to developers what they must actually produce when they publish a capability to Skill Registry. According to the documentation, what does a single skill package contain?", "options": ["Structural instructions, executable code, and documentation", "A trained model checkpoint together with its evaluation dataset", "An OpenAPI specification and a signed container image", "A Terraform module plus the IAM bindings the skill needs"], "correct": 0, "explanation": "Skill Registry describes each skill as a self-contained package that includes structural instructions, executable code, and documentation. Model checkpoints, API specifications and Terraform modules are not what a skill package is defined to hold.", "references": [{"code": "R_SKILL_REGISTRY", "label": "Skill Registry overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/skill-registry", "verified": true}]}, {"id": "3.1-14", "section": 3, "subtopic": "3.1", "type": "single", "prompt": "An architect is packaging a reusable capability in Skill Registry so agents can dynamically discover and load it based on user intent. What does a single skill package contain?", "options": ["Only a natural-language description of the tool and its parameters.", "A self-contained package of structural instructions, executable code, and documentation.", "A container image plus a runtime contract manifest.", "A set of labeled input-output pairs used as few-shot examples."], "correct": 1, "explanation": "In Skill Registry each skill is a self-contained package containing structural instructions, executable code, and documentation, which lets agents dynamically discover and load the most relevant capabilities based on user intent.", "references": [{"code": "R_SKILL_REGISTRY", "label": "Skill Registry overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/skill-registry", "verified": true}]}, {"id": "3.1-15", "section": 3, "subtopic": "3.1", "type": "single", "prompt": "Production agents must be pinned to an exact, unchanging version of a skill while developers keep editing that skill. Which Skill Registry entities make this possible?", "options": ["Skill is the mutable top-level entity, and a Skill revision is an immutable snapshot of a specific version that agents can pin to.", "Both Skill and Skill revision are mutable, so pinning requires copying the skill into another project.", "Skill is immutable and Skill revision is mutable, so agents should pin to the Skill.", "Skill Registry keeps only the current version; immutable snapshots are kept in Agent Registry."], "correct": 0, "explanation": "Skill Registry has two API entities: Skill, the mutable top-level entity holding metadata, default revision and content, and Skill revision, an immutable snapshot of a specific version.", "references": [{"code": "R_SKILL_REGISTRY", "label": "Skill Registry overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/skill-registry", "verified": true}]}, {"id": "3.1-16", "section": 3, "subtopic": "3.1", "type": "single", "prompt": "A team is defining a release process for skills and asks when a skill's payload is checked for validity. What does the documentation state?", "options": ["Nothing is checked automatically; a separate validation job must be run before publishing.", "The payload is validated only at load time, when an agent selects the skill.", "Skill payload validation runs automatically when a skill is created or updated.", "The payload is validated by Model Armor before the skill is stored."], "correct": 2, "explanation": "Skill Registry runs skill payload validation automatically on create and update, so invalid payloads are caught at publish time.", "references": [{"code": "R_SKILL_REGISTRY", "label": "Skill Registry overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/skill-registry", "verified": true}]}, {"id": "3.1-17", "section": 3, "subtopic": "3.1", "type": "single", "prompt": "An agent is exposed to several hundred tool descriptions at once, and its responses become slower, more expensive, and less accurate. What does the documentation say is happening, and what pattern is recommended?", "options": ["The model has exceeded its hard function-calling limit of 128 tools; shard the tools across several Google Cloud projects.", "The latency comes from the Agent Platform ranking API; switch to the LLM reranker, which scores each tool description faster.", "The agent lacks few-shot examples; add labeled input-output pairs so the pretrained model's parameters are updated for tool choice.", "Context bloat increases token cost and latency and degrades the LLM's reasoning; use progressive disclosure, loading skill packages when relevant."], "correct": 3, "explanation": "Exposing an agent to a very large number of tool descriptions causes context bloat, which increases token cost and latency and degrades reasoning. Agent Skills implement progressive disclosure of tools as the mitigation.", "references": [{"code": "R_GOVERN_SKILLS", "label": "Governing Agent Skills", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/policies/govern-agent-skills", "verified": true}]}, {"id": "3.1-18", "section": 3, "subtopic": "3.1", "type": "single", "prompt": "A security team wants policy control over which skills an agent may discover and load at run time. Which documented fact about ADK skill tools makes that possible?", "options": ["Skill loading bypasses tool calls entirely, so it can only be controlled with IAM roles on the Skill Registry API.", "ADK skill tools include list_skills, and because skill loading uses tool calls, Semantic governance policy can govern the skill lifecycle.", "Skills are loaded by the Agent Platform ranking API, which enforces governance policy on every RAG Engine request.", "Skill discovery is performed by Agent Gateway, which validates each skill payload automatically on create and update."], "correct": 1, "explanation": "ADK skill tools include list_skills, and because skill loading is carried out through tool calls, Semantic governance policy can govern the entire skill lifecycle.", "references": [{"code": "R_GOVERN_SKILLS", "label": "Governing Agent Skills", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/policies/govern-agent-skills", "verified": true}]}, {"id": "3.2-1", "section": 3, "subtopic": "3.2", "type": "single", "prompt": "An enterprise assistant answers questions about internal policies but frequently invents details that do not exist in those policies. What does RAG Engine provide to address this?", "options": ["It fine-tunes the model on the private policy corpus so the invented details are removed at the weight level.", "It replaces the model's system instructions with the full policy text at deployment time so nothing else is needed.", "It is a data framework for context-augmented LLM applications, enriching the context with private information to reduce hallucinations.", "It screens prompts and responses for policy violations and blocks them before they can reach the end user."], "correct": 2, "explanation": "RAG Engine is a data framework for context-augmented LLM applications; enriching the model's context with private information reduces hallucinations and improves accuracy. Screening prompts and responses is Model Armor's role.", "references": [{"code": "R_RAG_OVERVIEW", "label": "RAG Engine overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/rag-engine/rag-overview", "verified": true}]}, {"id": "3.2-2", "section": 3, "subtopic": "3.2", "type": "single", "prompt": "A regulated customer asks which enterprise security controls RAG Engine supports before approving it for a knowledge-grounding project. Which statement is correct?", "options": ["VPC Service Controls and CMEK are supported, but data residency and Access Transparency (AXT) are not.", "Data residency and Access Transparency are supported, but CMEK is not.", "VPC Service Controls, CMEK, data residency, and Access Transparency are all supported.", "None of these controls apply, because RAG Engine has no configurable security controls."], "correct": 0, "explanation": "RAG Engine supports VPC Service Controls and CMEK; data residency and AXT security controls are not supported.", "references": [{"code": "R_RAG_OVERVIEW", "label": "RAG Engine overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/rag-engine/rag-overview", "verified": true}]}, {"id": "3.2-3", "section": 3, "subtopic": "3.2", "type": "single", "prompt": "A customer-facing RAG agent must rerank retrieved chunks while adding as little latency as possible. Which reranker option does the documentation describe, and with what latency?", "options": ["The LLM reranker, which calls Gemini and adds under 100 ms per request.", "The Agent Platform ranking API, a standalone semantic reranker with very low latency, under 100 ms.", "The Agent Platform ranking API, which calls Gemini and adds 1 to 2 seconds per request.", "VertexRanker, the only reranker RAG Engine supports, priced per RAG Engine request."], "correct": 1, "explanation": "RAG Engine's Agent Platform ranking API is a standalone semantic reranker with very low latency, under 100 ms; the LLM reranker is the one that adds 1 to 2 seconds.", "references": [{"code": "R_RAG_RERANK", "label": "Reranking for RAG Engine", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/rag-engine/retrieval-and-ranking", "verified": true}]}, {"id": "3.2-4", "section": 3, "subtopic": "3.2", "type": "single", "prompt": "A team is weighing the LLM reranker against the Agent Platform ranking API for a RAG Engine corpus. Which description of the LLM reranker matches the documentation?", "options": ["It is billed per RAG Engine request and adds under 100 ms of latency.", "It requires the Discovery Engine API to be enabled and returns a deterministic relevance score per chunk.", "It runs server-side inside Agent Retrieval using Reciprocal Rank Fusion.", "It calls Gemini separately to assess chunk relevance, adds 1 to 2 seconds of latency, and uses LLM token pricing."], "correct": 3, "explanation": "The LLM reranker makes a separate Gemini call to assess chunk relevance, has high latency of 1 to 2 seconds, and uses LLM token pricing; per-RAG-Engine-request pricing and sub-100 ms latency belong to the Agent Platform ranking API.", "references": [{"code": "R_RAG_RERANK", "label": "Reranking for RAG Engine", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/rag-engine/retrieval-and-ranking", "verified": true}]}, {"id": "3.2-5", "section": 3, "subtopic": "3.2", "type": "single", "prompt": "A team configures the Agent Platform ranking API as the reranker for a RAG Engine corpus, but requests fail. Which documented prerequisite is most likely missing?", "options": ["The Spanner deployment mode must be selected for the corpus.", "A Private Service Connect endpoint to the ranking API must be created.", "The Discovery Engine API must be enabled for the ranking API.", "RagManagedDb must be replaced with a self-managed vector database."], "correct": 2, "explanation": "Using the Agent Platform ranking API with RAG Engine requires enabling the Discovery Engine API.", "references": [{"code": "R_RAG_RERANK", "label": "Reranking for RAG Engine", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/rag-engine/retrieval-and-ranking", "verified": true}]}, {"id": "3.2-6", "section": 3, "subtopic": "3.2", "type": "single", "prompt": "A team prototyping a RAG application wants to avoid provisioning and managing a vector database while still having both exact and approximate search available. What does the documentation recommend?", "options": ["Vector Search, which is the default vector database for RAG Engine and requires deploying an index endpoint first.", "RagManagedDb, the default vector database, which needs no additional provisioning and offers both KNN and ANN search plus a basic tier.", "Spanner, which is the default vector database for all RAG Engine corpora and the recommended starting point.", "RagManagedDb, the default vector database, which supports only ANN search and offers no tier aimed at prototyping."], "correct": 1, "explanation": "RagManagedDb is the default vector database for RAG Engine: enterprise-ready with no additional provisioning or managing, offering both KNN and ANN search options and a basic tier for prototyping.", "references": [{"code": "R_RAG_VECTORDB", "label": "Vector database choices in RAG Engine", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/rag-engine/vector-db-choices", "verified": true}]}, {"id": "3.2-7", "section": 3, "subtopic": "3.2", "type": "single", "prompt": "A RAG Engine deployment currently runs in Serverless mode, and the team plans to switch it to Spanner mode. What does the documentation say happens to the data?", "options": ["Data is automatically migrated between the two modes when the switch is made.", "Switching modes is not supported once a corpus already contains indexed data.", "Both modes share the same underlying storage, so no data movement or isolation occurs.", "You can switch between modes seamlessly, but the data in each mode remains isolated from the other."], "correct": 3, "explanation": "RAG Engine offers Serverless and Spanner deployment modes; you can switch between them seamlessly, but data in each mode remains isolated from the other.", "references": [{"code": "R_RAG_MODES", "label": "RAG Engine deployment modes", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/rag-engine/deployment-modes", "verified": true}]}, {"id": "3.2-8", "section": 3, "subtopic": "3.2", "type": "single", "prompt": "An architect must explain to a technical review board what underpins Vector Search. According to the documentation, what is it built on?", "options": ["ScaNN, the Google Research algorithm behind Google Search, YouTube, and Play.", "Reciprocal Rank Fusion applied across multiple embedding models.", "VertexRanker semantic rescoring applied to every candidate.", "Exhaustive brute-force KNN scanning of the full corpus for each query."], "correct": 0, "explanation": "Vector Search is built on the ScaNN algorithm from Google Research, the same technology used behind Google Search, YouTube, and Play.", "references": [{"code": "R_VECTOR_SEARCH", "label": "Vector Search (ScaNN)", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/vector-search/overview", "verified": true}]}, {"id": "3.2-9", "section": 3, "subtopic": "3.2", "type": "single", "prompt": "Engineers search an internal parts catalog with both natural-language questions and exact part numbers, and pure embedding search keeps missing the exact identifiers. Which documented approach improves quality here?", "options": ["Raise top_n on the VertexRanker so that up to 1,000 fused candidates are rescored.", "Switch the corpus from Serverless deployment mode to Spanner mode.", "Use hybrid search, which combines semantic (embedding) search with keyword or token-based search.", "Add the part numbers to Example Store as few-shot examples so the model memorizes them."], "correct": 2, "explanation": "Hybrid search combines semantic embedding search with keyword or token-based search, which is the documented way to get higher-quality results when exact tokens matter.", "references": [{"code": "R_HYBRID", "label": "About hybrid search", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/vector-search/about-hybrid-search", "verified": true}]}, {"id": "3.2-10", "section": 3, "subtopic": "3.2", "type": "multi", "prompt": "Which two statements about configuring reranking in Agent Retrieval are correct? (Select two.)", "options": ["VertexRanker runs client-side, after the results are returned to the caller.", "Only Reciprocal Rank Fusion is supported as the primary ranker.", "The combine.ranker.rrf.weights field is optional and defaults to equal weights.", "The top_n value is capped at 100 candidates.", "The top_n value is valid from 1 to 1000."], "correct": [1, 4], "explanation": "In Agent Retrieval, only RRF is supported as the primary ranker, combine.ranker.rrf.weights is required, top_n is valid from 1 to 1000, and the whole pipeline runs server-side via BatchSearchDataObjects.", "references": [{"code": "R_AGENT_RETRIEVAL", "label": "Agent Retrieval — reranking with VertexRanker", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/vector-search-2/query-search/reranking", "verified": true}]}, {"id": "3.2-11", "section": 3, "subtopic": "3.2", "type": "single", "prompt": "How does Agent Retrieval, the new name for Vector Search 2.0, produce a reranked result set for a natural-language query?", "options": ["It rescores every candidate with VertexRanker first, then fuses the rescored lists with Reciprocal Rank Fusion in the client.", "It retrieves and fuses candidates using Reciprocal Rank Fusion, then VertexRanker rescores the merged candidates server-side.", "It calls Gemini once per candidate chunk and sorts the chunks by the relevance score that each of those calls returns.", "It applies the Agent Platform ranking API per RAG Engine request before any Reciprocal Rank Fusion takes place."], "correct": 1, "explanation": "Agent Retrieval first retrieves and fuses candidates with RRF, then VertexRanker rescores the merged candidates against the natural-language query with a dedicated semantic model, all server-side through BatchSearchDataObjects.", "references": [{"code": "R_AGENT_RETRIEVAL", "label": "Agent Retrieval — reranking with VertexRanker", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/vector-search-2/query-search/reranking", "verified": true}]}, {"id": "3.2-12", "section": 3, "subtopic": "3.2", "type": "single", "prompt": "Teams across an organization keep rebuilding the same tool integrations because nobody can find what already exists. Which capability is documented as the central hub for governance and inventory that solves fragmented tool access and redundant implementations?", "options": ["Agent Garden, a curated library of prebuilt agent samples and templates with GitHub source for deep customization.", "Agent Gateway, the network entry and exit point for all agent interactions, which keeps the inventory of tools.", "Example Store, a repository of labeled input-output pairs that also indexes every MCP server in the organization.", "Agent Registry, a unified catalog for storing, discovering and managing MCP servers, tools, skills and agents org-wide."], "correct": 3, "explanation": "Agent Registry is the central hub for governance and inventory — a unified catalog of MCP servers, tools, standalone skills and AI agents — and is described as solving fragmented tool access, isolated data, and redundant implementations.", "references": [{"code": "R_AGENT_REGISTRY", "label": "Agent Registry", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-registry", "verified": true}]}, {"id": "3.2-13", "section": 3, "subtopic": "3.2", "type": "multi", "prompt": "Which two capabilities of Agent Registry are described in the documentation? (Select two.)", "options": ["It automatically reranks tool results using Reciprocal Rank Fusion.", "It stores long-term user memories in collections scoped by agent_name and user.", "You can register endpoints as target destinations, to centrally govern the external APIs and services agents may connect to.", "Its catalog supports keyword, prefix, and semantic searches.", "Agents must always be registered manually; automatic registration from supported runtimes is not available."], "correct": [2, 3], "explanation": "Agent Registry lets you register agents (automatically from supported runtimes, or manually for custom deployments), MCP servers, endpoints as governed target destinations, and skills, and its search supports keyword, prefix, and semantic queries. Scoped long-term memories are Memory Bank, and RRF is Agent Retrieval.", "references": [{"code": "R_AGENT_REGISTRY", "label": "Agent Registry", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-registry", "verified": true}]}, {"id": "3.2-14", "section": 3, "subtopic": "3.2", "type": "single", "prompt": "A merchandising team using Agent Search wants specific documents pushed up or down in results, and some result URIs redirected, without retraining anything. Which documented Agent Search capability covers this?", "options": ["Result controls such as boost and bury, filters, and URI redirects", "Deployment modes that switch the index between Serverless and Spanner", "Reciprocal Rank Fusion weights applied before the semantic reranker", "Hybrid search combining semantic and token-based retrieval"], "correct": 0, "explanation": "Agent Search documents controls for search results including boost and bury, filters, and URI redirects. Deployment modes belong to RAG Engine, RRF weighting belongs to Agent Retrieval, and hybrid search is a retrieval technique rather than a result-control feature.", "references": [{"code": "R_AGENT_SEARCH", "label": "About Agent Search", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/vertex-ai-search", "verified": true}]}, {"id": "3.3-1", "section": 3, "subtopic": "3.3", "type": "single", "prompt": "An architect must guarantee that the orchestration order of a multi-agent pipeline is never influenced by model output. What does the documentation say about ADK template workflow agents?", "options": ["They ask the model to choose the next sub-agent at each step, which makes the order adaptive but not predictable.", "They are deterministic only when a single sub-agent is configured in the list; two or more reintroduce model choice.", "They consult the model only when a LoopAgent has to decide whether its termination condition has been met.", "They determine execution order by their type — sequential, parallel or loop — without consulting an AI model."], "correct": 3, "explanation": "Template workflow agents orchestrate sub-agents and determine execution order by their type without consulting an AI model, so their behavior is deterministic and predictable.", "references": [{"code": "R_ADK_WORKFLOWS", "label": "ADK — Template agent workflows", "url": "https://adk.dev/agents/workflow-agents/", "verified": true}]}, {"id": "3.3-2", "section": 3, "subtopic": "3.3", "type": "single", "prompt": "A Python team upgrading to ADK 2.0 asks what the framework now offers in place of template workflow agents. What does the documentation state?", "options": ["Template workflows are removed entirely in ADK 2.0 across all four supported languages — Python, TypeScript, Go and Java.", "Starting in ADK 2.0 for Python and Go, template workflows are superseded by graph-based workfl
