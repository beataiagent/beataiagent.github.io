ows and dynamic workflows.", "ADK 2.0 replaces template workflows with A2A AgentExecutors, which read sub-agent execution order from the AgentCard.", "ADK 2.0 replaces template workflows with Agent Gateway protocol mediation across MCP, A2A, REST and gRPC endpoints."], "correct": 1, "explanation": "Starting in ADK 2.0 for Python and Go, template workflows are superseded by graph-based workflows and dynamic workflows that give more control and flexibility.", "references": [{"code": "R_ADK_WORKFLOWS", "label": "ADK — Template agent workflows", "url": "https://adk.dev/agents/workflow-agents/", "verified": true}]}, {"id": "3.3-3", "section": 3, "subtopic": "3.3", "type": "single", "prompt": "A pipeline must fetch a web page's contents and only then summarize that page, always in that strict order. Which ADK workflow agent fits, and how does it decide the order?", "options": ["LoopAgent, which repeats the sub-agents until a termination condition is met.", "ParallelAgent, which runs the sub-agents concurrently and merges their outputs in order.", "SequentialAgent, which executes its sub-agents in the order specified in a list.", "An LlmAgent, which prompts the model to decide which of the two steps runs first."], "correct": 2, "explanation": "SequentialAgent executes sub-agents in the order specified in a list, and is the documented choice when execution must occur in a fixed, strict order such as get page contents then summarize page.", "references": [{"code": "R_ADK_SEQ", "label": "ADK — Sequential workflow (SequentialAgent)", "url": "https://adk.dev/agents/workflow-agents/sequential-agents/", "verified": true}]}, {"id": "3.3-4", "section": 3, "subtopic": "3.3", "type": "single", "prompt": "An architect plans to run three retrieval sub-agents concurrently with a ParallelAgent, each querying a different data source. What requirement does the documentation place on those sub-agents?", "options": ["Each sub-agent must be able to operate without depending on the others.", "Each sub-agent must write to the same session.state key so its results can be merged.", "Each sub-agent must declare its own termination condition.", "Each sub-agent must be published as an immutable skill revision before it can run."], "correct": 0, "explanation": "ParallelAgent executes sub-agents concurrently, and each sub-agent must be able to operate without depending on the others — which is why multi-source retrieval is a good fit.", "references": [{"code": "R_ADK_PAR", "label": "ADK — Parallel workflow (ParallelAgent)", "url": "https://adk.dev/agents/workflow-agents/parallel-agents/", "verified": true}]}, {"id": "3.3-5", "section": 3, "subtopic": "3.3", "type": "single", "prompt": "A document-refinement agent should keep revising a draft until a quality check passes, but must also be able to stop after a bounded number of attempts. Which ADK workflow agent supports both stopping rules?", "options": ["SequentialAgent, by listing the refinement step several times in the list.", "ParallelAgent, by running several refinement attempts concurrently and keeping the highest-scoring draft.", "AgentExecutor, which repeats the task until the calling A2A client cancels it.", "LoopAgent, which runs sub-agents for a specified number of iterations or until a termination condition is met."], "correct": 3, "explanation": "LoopAgent runs sub-agents in a loop for a specified number of iterations or until a termination condition is met, and is the documented pattern for iterative refinement of code or documents.", "references": [{"code": "R_ADK_LOOP", "label": "ADK — Loop workflow (LoopAgent)", "url": "https://adk.dev/agents/workflow-agents/loop-agents/", "verified": true}]}, {"id": "3.3-6", "section": 3, "subtopic": "3.3", "type": "multi", "prompt": "Which two statements about the components of an Agent2Agent (A2A) agent are correct? (Select two.)", "options": ["The AgentCard is a metadata document describing the agent's capabilities, used by other agents for discovery.", "The AgentCard contains the agent's task-handling logic and runs each task that another agent submits to it.", "A2A is a proprietary Google Cloud protocol that works only between agents deployed on Agent Runtime.", "The AgentExecutor is a metadata document published so that other agents can discover the agent's capabilities.", "The AgentExecutor holds the agent's core logic, that is, how the agent actually handles incoming tasks."], "correct": [0, 4], "explanation": "A2A is an open standard for communication and collaboration between AI agents. The AgentCard is the capability metadata used for discovery — like a business card — while the AgentExecutor holds the agent's core task-handling logic.", "references": [{"code": "R_A2A", "label": "Create an Agent2Agent (A2A) agent", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime/create-an-a2a-agent", "verified": true}]}, {"id": "3.3-7", "section": 3, "subtopic": "3.3", "type": "single", "prompt": "An architect must explain to a review board how MCP and A2A differ in role. Which description matches the documentation?", "options": ["MCP handles agent-to-agent collaboration and capability discovery, while A2A connects agents to databases, file parsers and remote APIs.", "MCP connects agents securely to local development tools, databases, file parsers and remote APIs; A2A is the open standard for communication between AI agents.", "Both describe agent-to-agent messaging, with MCP being the Google-specific variant of A2A used inside Agent Runtime and Gemini Enterprise.", "MCP is the mechanism used to publish an AgentCard so other agents can discover capabilities, while A2A connects agents to local dev tools."], "correct": 1, "explanation": "MCP is the open standard for connecting agents to tools, databases, file parsers and remote APIs, supplying real-time context and execution; A2A is the open standard for communication and collaboration between AI agents.", "references": [{"code": "R_AG_MCP", "label": "Antigravity — Model Context Protocol (MCP)", "url": "https://antigravity.google/docs/mcp/", "verified": true}, {"code": "R_A2A", "label": "Create an Agent2Agent (A2A) agent", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/build/runtime/create-an-a2a-agent", "verified": true}]}, {"id": "3.3-8", "section": 3, "subtopic": "3.3", "type": "single", "prompt": "An enterprise landscape mixes MCP tool servers, A2A agents, REST services, and gRPC backends, and the architect wants one component to bridge them. Which documented Agent Gateway benefit covers this?", "options": ["Reciprocal Rank Fusion applied across the responses returned by each protocol.", "Automatic translation of all agent traffic into a single MCP-only transport before delivery.", "Protocol mediation across MCP, A2A, REST, and gRPC, with automatic mTLS handshake and termination.", "Progressive disclosure, so only a small set of protocols is exposed to the agent at a time."], "correct": 2, "explanation": "Agent Gateway's documented benefits include protocol mediation across MCP, A2A, REST, and gRPC, along with automatic mTLS handshake and termination, and being framework agnostic.", "references": [{"code": "R_GATEWAY", "label": "Agent Gateway overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview", "verified": true}]}, {"id": "4.1-1", "section": 4, "subtopic": "4.1", "type": "single", "prompt": "A platform team is formalizing how it evaluates a customer-support agent and wants its internal runbook to mirror the documented agent evaluation workflow. Which sequence matches the four phases of agent evaluation?", "options": ["Execution → Design → Refinement → Scoring", "Design → Scoring → Execution → Refinement", "Design → Execution → Scoring → Refinement", "Execution → Scoring → Design → Refinement"], "correct": 2, "explanation": "Agent evaluation is documented as four phases: Design (define eval cases), Execution (run inferences), Scoring (compute metrics with automated raters), and Refinement (optimize the agent). Scoring cannot precede Execution because there are no inferences to rate yet.", "references": [{"code": "R_AGENT_EVAL", "label": "Agent evaluation", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/optimize/evaluation/agent-evaluation", "verified": true}]}, {"id": "4.1-2", "section": 4, "subtopic": "4.1", "type": "single", "prompt": "Before the team starts writing evaluation content, an architect has to document precisely what an eval case is. Which description is correct?", "options": ["A specification defining the agent's task, which can include multiple conversation steps, the agent state, and a user-simulation spec.", "A factual, immutable record of the agent's model inputs, responses and tool calls captured during one execution path.", "A reusable metric configuration stored in the Metric Registry and applied consistently to offline and online evaluation.", "An immutable snapshot of the agent's system instructions, tools and model, created in Agent Registry for simulation."], "correct": 0, "explanation": "An eval case is the specification of the agent's task and may contain multiple conversation steps, the conversation context (agent state) and a spec for simulating user responses. The immutable record of inputs, responses and tool calls is a trace, not an eval case.", "references": [{"code": "R_AGENT_EVAL", "label": "Agent evaluation", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/optimize/evaluation/agent-evaluation", "verified": true}]}, {"id": "4.1-3", "section": 4, "subtopic": "4.1", "type": "single", "prompt": "During a post-incident review, two teams disagree about whether the agent actually called a refund tool during a particular run. Which evaluation artifact settles the question?", "options": ["The eval case, which specifies the task the agent was asked to perform.", "The Conversation Plan, the hidden instruction supplied to the simulated user.", "The Metric Registry entry that was used to score the run.", "The trace, which is a factual, immutable record of the agent's model inputs, responses and tool calls."], "correct": 3, "explanation": "A trace is defined as the factual, immutable record of agent behavior — model inputs, responses and tool calls — so it is the authoritative evidence of what the agent did. The eval case only specifies the intended task.", "references": [{"code": "R_AGENT_EVAL", "label": "Agent evaluation", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/optimize/evaluation/agent-evaluation", "verified": true}]}, {"id": "4.1-4", "section": 4, "subtopic": "4.1", "type": "single", "prompt": "An offline evaluation must measure whether a multi-turn booking agent retains context and maintains conversational flow over the course of a whole interaction. Which unit of historical data should the evaluation run over?", "options": ["Traces, because a trace captures the entire multi-turn interaction while a session captures only one execution path.", "Traces, because context retention can only be assessed on a single execution path.", "Individual model inputs and responses, scored turn by turn and then averaged.", "Sessions, because a session is the entire multi-turn interaction whereas a trace is a single execution path."], "correct": 3, "explanation": "Offline evaluation distinguishes a trace (a single execution path) from a session (the entire multi-turn interaction), and sessions are the unit used to evaluate context retention and conversational flow over time. Option 0 inverts the two definitions.", "references": [{"code": "R_EVAL_OFFLINE", "label": "Run offline evaluations", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/optimize/evaluation/evaluate-offline", "verified": true}]}, {"id": "4.1-5", "section": 4, "subtopic": "4.1", "type": "multi", "prompt": "A team is preparing to run its first offline evaluation against historical production data. Which two prerequisites does the documentation require? (Select two.)", "options": ["A deployed Agent Runtime with Cloud Trace enabled.", "An immutable agent version created in Agent Registry.", "A Judge LLM registered in the Metric Registry as a Custom LLM Metric.", "A Cloud Storage bucket to hold the evaluation results.", "An OnlineEvaluator attached to the agent."], "correct": [0, 3], "explanation": "Offline evaluation requires a deployed Agent Runtime with Cloud Trace enabled and a Cloud Storage bucket for results. An immutable agent version in Agent Registry is the prerequisite for simulation, and an OnlineEvaluator belongs to online monitoring.", "references": [{"code": "R_EVAL_OFFLINE", "label": "Run offline evaluations", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/optimize/evaluation/evaluate-offline", "verified": true}]}, {"id": "4.1-6", "section": 4, "subtopic": "4.1", "type": "single", "prompt": "Offline evaluation consumes OpenTelemetry signals emitted by the agent. Which span attributes are listed for the invoke-agent span?", "options": ["gen_ai.agent.id, gen_ai.session.id and gen_ai.trace.id", "gen_ai.agent.name, gen_ai.agent.version and gen_ai.user.id", "gen_ai.agent.name, gen_ai.agent.description and gen_ai.conversation.id", "gen_ai.conversation.id, gen_ai.tool.name and gen_ai.model.name"], "correct": 2, "explanation": "The documentation lists the invoke agent span attributes that must be included for offline evaluation: gen_ai.agent.name, gen_ai.agent.description and gen_ai.conversation.id. These same telemetry requirements apply to online monitors.", "references": [{"code": "R_EVAL_OFFLINE", "label": "Run offline evaluations", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/optimize/evaluation/evaluate-offline", "verified": true}]}, {"id": "4.1-7", "section": 4, "subtopic": "4.1", "type": "single", "prompt": "A production agent's answer quality has degraded slowly over three months as user phrasing shifted and an upstream data feed changed. Which capability is intended to catch this, and what is the documented name of the phenomenon?", "options": ["Simulation, which identifies quality drift before release by generating scenarios and roleplaying as a user.", "Online monitors, which continuously assess quality in production and identify quality drift — a decrease in agent performance over time.", "Offline evaluation, which detects quality drift by replaying current production traffic in real time as it arrives.", "The Metric Registry, which raises a quality drift alert whenever a predefined rater's score distribution changes."], "correct": 1, "explanation": "Online monitoring continuously assesses production quality and identifies quality drift, defined as an observable decrease in agent performance over time caused by changes in user behavior or external data. Offline evaluation works on historical data, not live traffic.", "references": [{"code": "R_EVAL_ONLINE", "label": "Continuous evaluation with online monitors", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/optimize/evaluation/evaluate-online", "verified": true}]}, {"id": "4.1-8", "section": 4, "subtopic": "4.1", "type": "single", "prompt": "A security review flags that online evaluation runs on the project-level service account (P4SA), and that anyone able to create an OnlineEvaluator can attach it to any agent in the same project. What is the documented mitigation?", "options": ["Run every online monitor in DRY_RUN mode so that scores are written to Cloud Audit Logs but never applied.", "Give each agent its own dedicated evaluation service account so the project-level P4SA is never used by a monitor.", "Disable online monitors entirely and rely solely on offline evaluation of historical traces in Cloud Storage.", "Restrict the ability to create an OnlineEvaluator to authorized administrators, since it is otherwise a privilege-escalation path."], "correct": 3, "explanation": "Because online evaluation relies on the P4SA and an OnlineEvaluator can be attached to any agent in the same project, the documentation says creation should be restricted to authorized administrators to avoid privilege escalation. No per-agent evaluation service account or dry-run mode is offered for this.", "references": [{"code": "R_EVAL_ONLINE", "label": "Continuous evaluation with online monitors", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/optimize/evaluation/evaluate-online", "verified": true}]}, {"id": "4.1-9", "section": 4, "subtopic": "4.1", "type": "single", "prompt": "A team is launching a brand-new agent and has no production traffic from which to draw eval cases, but still needs to stress-test its multi-turn logic before release. Which documented approach applies, and what are its two steps?", "options": ["Simulation — Generate Scenarios to produce test specs, then Simulate Sessions to produce behavior traces.", "Offline evaluation — replay historical sessions, then score them with predefined metrics.", "Online monitoring — attach an OnlineEvaluator, then asynchronously score live traces.", "Simulation — Simulate Sessions to capture live user turns, then Generate Scenarios from the resulting traces."], "correct": 0, "explanation": "Simulation lets you build an evaluation suite from scratch with no existing production data, in two steps: Generate Scenarios (test specs) then Simulate Sessions (behavior traces). Option 3 reverses the two steps.", "references": [{"code": "R_EVAL_SIM", "label": "Simulate agent behavior", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/optimize/evaluation/evaluate-simulated", "verified": true}]}, {"id": "4.1-10", "section": 4, "subtopic": "4.1", "type": "single", "prompt": "In a simulated evaluation the LLM roleplays as the end user. What does each eval case consist of?", "options": ["A trace plus the session it belongs to, captured from production.", "A Starting Prompt plus a Judge LLM rubric that grades each simulated turn as it happens.", "A Starting Prompt plus a Conversation Plan, which is the hidden instruction that steers the simulated user.", "A Conversation Plan plus a Cloud Storage URI holding previously recorded user turns to replay."], "correct": 2, "explanation": "For simulation, each eval case is a Starting Prompt and a Conversation Plan — the hidden instruction given to the simulated user. A Judge LLM rubric belongs to Custom LLM Metrics, not to the eval case definition.", "references": [{"code": "R_EVAL_SIM", "label": "Simulate agent behavior", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/optimize/evaluation/evaluate-simulated", "verified": true}]}, {"id": "4.1-11", "section": 4, "subtopic": "4.1", "type": "single", "prompt": "A team wants its simulated evaluation results to be reproducible against a fixed configuration of the agent. What must exist before simulated sessions can be run?", "options": ["A Cloud Trace-enabled Agent Runtime deployment plus a Cloud Storage results bucket.", "An immutable agent version created in Agent Registry, capturing the system instructions, tools and model.", "An OnlineEvaluator bound to the agent's production revision.", "At least one historical production session for every scenario to be simulated."], "correct": 1, "explanation": "Simulation requires an immutable agent version or snapshot created in Agent Registry that fixes the system instructions, tools and model. The Cloud Trace and results-bucket requirements belong to offline evaluation, and simulation exists precisely so that no historical production data is needed.", "references": [{"code": "R_EVAL_SIM", "label": "Simulate agent behavior", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/optimize/evaluation/evaluate-simulated", "verified": true}]}, {"id": "4.1-12", "section": 4, "subtopic": "4.1", "type": "multi", "prompt": "A team needs two things scored: whether the agent's JSON reply contains the required fields, and how well the agent's tone follows a written quality rubric. Which two Metric Registry metric types address these two needs? (Select two.)", "options": ["Predefined Metrics, whose multi-turn raters cover task success, tool use quality and trajectory compliance.", "Custom LLM Metrics, where a Judge LLM grades output against a natural-language rubric.", "Online monitor metrics, which are generated automatically from live traces and cannot be configured.", "Simulation metrics, which are produced by the Conversation Plan.", "Custom Code Metrics, written as Python functions that validate behavior such as output format."], "correct": [1, 4], "explanation": "Custom Code Metrics are Python functions validating behavior such as output format, and Custom LLM Metrics are graded by a Judge LLM against a natural-language rubric. Predefined Metrics are the third real type but cover task success, tool use quality and trajectory compliance, not format checks or a custom rubric.", "references": [{"code": "R_EVAL_METRICS", "label": "Manage evaluation metrics (Metric Registry)", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/optimize/evaluation/manage-metrics", "verified": true}]}, {"id": "4.1-13", "section": 4, "subtopic": "4.1", "type": "single", "prompt": "An ADK team writes unit-test-style assertions that require the agent's final answer to match an exact string, and ignores which steps the agent took. Why does ADK guidance discourage this?", "options": ["Because deterministic assertions are valid only for template workflow agents and never for LLM agents, whatever the output.", "Because the final output must first be scored by a Judge LLM before any code-based assertion is allowed to run.", "Because trajectory is the only meaningful evaluation signal once a model is probabilistic, so outputs are ignored.", "Because models are probabilistic, deterministic pass/fail assertions are often unsuitable, and the trajectory should be evaluated too."], "correct": 3, "explanation": "ADK guidance states that the probabilistic nature of models makes deterministic pass/fail assertions often unsuitable, and that both the final output and the trajectory (the sequence of steps) should be evaluated. Trajectory does not replace the final output — both matter.", "references": [{"code": "R_ADK_EVAL", "label": "ADK — Why evaluate agents", "url": "https://adk.dev/evaluate/", "verified": true}]}, {"id": "4.2-1", "section": 4, "subtopic": "4.2", "type": "single", "prompt": "A team's agent is written in Java, and they need control over the API server that the deployed container exposes. Which Agent Runtime deployment method fits?", "options": ["Source files, which supports agents in any language and lets you replace the API server that the runtime exposes.", "A Dockerfile, which works with any language and gives control of the API server if the container adheres to the runtime contract.", "Developer Connect, which links the Git repository, builds any language automatically, and exposes the API server.", "An execution object, which is required for every non-Python agent and lets you define the container's API server."], "correct": 1, "explanation": "The Dockerfile method is the one documented as working with any language and giving control over the API server, with the requirement that the container adhere to the runtime contract. Developer Connect and Source files are Python only.", "references": [{"code": "R_DEPLOY", "label": "Deploy an agent (Agent Runtime)", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/deploy-an-agent", "verified": true}]}, {"id": "4.2-2", "section": 4, "subtopic": "4.2", "type": "single", "prompt": "An organization wants its Python agent deployed straight from a linked Git repository, with native version control and CI/CD integration. Which deployment method matches?", "options": ["Dockerfile, the only method that integrates with source control.", "Container image from Artifact Registry, which links the Git repository automatically.", "Source files, which requires a Cloud Storage bucket to stage the repository contents.", "Developer Connect, which links a Git repository and is available for Python agents."], "correct": 3, "explanation": "Developer Connect is the Python-only method that links a Git repository and provides native version control and CI/CD. The Source files method explicitly needs no Cloud Storage bucket, and the container-image method pulls from Artifact Registry rather than linking a repository.", "references": [{"code": "R_DEPLOY", "label": "Deploy an agent (Agent Runtime)", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/deploy-an-agent", "verified": true}]}, {"id": "4.2-3", "section": 4, "subtopic": "4.2", "type": "single", "prompt": "A platform team deploys a Python agent from a Terraform-managed CI/CD pipeline and wants to avoid provisioning and maintaining a staging bucket. Which deployment method should they choose?", "options": ["Source files — Python only, suited to CI/CD and Terraform, and requiring no Cloud Storage bucket.", "Developer Connect, which links a Git repository and supports agents written in any language.", "Dockerfile, the only method that deploys without staging anything in a Cloud Storage bucket.", "Container image from Artifact Registry, which is Python only and integrates with Terraform."], "correct": 0, "explanation": "Deploying from source files is documented as well suited to automated workflows such as CI/CD pipelines and Infrastructure as Code tools like Terraform, and it deploys directly from local source code without requiring a Cloud Storage bucket.", "references": [{"code": "R_DEPLOY", "label": "Deploy an agent (Agent Runtime)", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/deploy-an-agent", "verified": true}]}, {"id": "4.2-4", "section": 4, "subtopic": "4.2", "type": "single", "prompt": "A team packages a TypeScript agent with its own Dockerfile so it can keep a custom API server. What obligation does this deployment method place on the container?", "options": ["It must be built by Developer Connect from a linked Git repository.", "It must use a Python-compatible base image.", "It must adhere to the runtime contract defined by Agent Runtime.", "It must disable its own API server so Agent Runtime injects one."], "correct": 2, "explanation": "When deploying with a Dockerfile, the container must adhere to the runtime contract; that is the condition attached to the any-language, self-controlled API server option. Keeping the custom API server is the point of this method, not something to disable.", "references": [{"code": "R_DEPLOY", "label": "Deploy an agent (Agent Runtime)", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/deploy-an-agent", "verified": true}]}, {"id": "4.2-5", "section": 4, "subtopic": "4.2", "type": "single", "prompt": "A team wants to release a new agent version to a small slice of traffic first and increase it gradually as confidence grows. What does Agent Runtime provide, and through which API?", "options": ["Mutable revisions that can be edited in place, through the v1 API.", "Immutable revisions plus traffic splitting to test and gradually increase traffic to new revisions, available through the v1beta1 API.", "Immutable revisions, but traffic must be moved by redeploying the agent because splitting is not supported.", "Traffic splitting configured as Agent Gateway routing rules rather than on revisions."], "correct": 1, "explanation": "Revisions are immutable versions, and traffic splitting lets you test and gradually increase traffic to a new revision; the capability is available through the v1beta1 API. Revisions cannot be edited in place.", "references": [{"code": "R_REVISIONS", "label": "Manage revisions and traffic", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/manage-revisions-and-traffic", "verified": true}]}, {"id": "4.2-6", "section": 4, "subtopic": "4.2", "type": "single", "prompt": "A CI pipeline creates a new agent revision on every merge, and after a year deployments begin to fail. Which statement about revision limits is correct?", "options": ["950 revisions per project per region and 6,000 per agent; both can be raised with a quota request.", "6,000 revisions per project per region and 950 per agent; both can be raised with a quota request.", "Revision creation is automatically disabled once a limit is reached and must be re-enabled in the console per region.", "6,000 revisions per project per region and 950 per agent; the limits are not adjustable, so creation fails until old revisions are deleted."], "correct": 3, "explanation": "The documented limits are 6,000 revisions per project per region and 950 revisions per agent, they are not adjustable, and new revision creation fails until old revisions are deleted. Revision creation itself is always enabled, so there is nothing to re-enable.", "references": [{"code": "R_REVISIONS", "label": "Manage revisions and traffic", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/manage-revisions-and-traffic", "verified": true}]}, {"id": "4.2-7", "section": 4, "subtopic": "4.2", "type": "single", "prompt": "A latency review of an Agent Runtime deployment repeatedly refers to cold starts. Which definition is correct?", "options": ["A request arrives when no idle instance is available, forcing a new instance to start.", "The first request served after a new revision receives 100% of traffic.", "An instance is evicted after exceeding its container memory allocation time.", "An asynchronous worker sits underutilized while its queue backs up."], "correct": 0, "explanation": "A cold start is defined as a request arriving with no idle instance available, so a new instance must be started. Underutilized asynchronous workers are a separate performance topic, not the definition of a cold start.", "references": [{"code": "R_OPTIMIZE_SCALE", "label": "Optimize and scale Agent Runtime performance", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/optimize-and-scale", "verified": true}]}, {"id": "4.2-8", "section": 4, "subtopic": "4.2", "type": "single", "prompt": "A benchmark of 300 concurrent requests against an agent left at the default min_instances=1 shows roughly 4.7 s average latency for cold-started requests versus roughly 0.4 s for warm ones. What result is documented when min_instances is raised to 10?", "options": ["The cold-start average drops to about 0.4 s, matching warm requests", "The cold-start average drops to about 2.4 s, roughly halving it", "The cold-start average drops to about 1.4 s, a substantial reduction", "Cold starts stop occurring at all once ten instances stay warm"], "correct": 2, "explanation": "The measured example reports that setting min_instances=10 reduced the cold-start average latency to about 1.4 s, down from about 4.7 s at the default min_instances=1. It is a reduction, not elimination, and it does not reach the ~0.4 s warm figure.", "references": [{"code": "R_OPTIMIZE_SCALE", "label": "Optimize and scale Agent Runtime performance", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/optimize-and-scale", "verified": true}]}, {"id": "4.2-9", "section": 4, "subtopic": "4.2", "type": "multi", "prompt": "An architect wants to know what monitoring exists for a freshly deployed agent before any instrumentation work is done. Which two metrics are collected automatically for the monitored resource aiplatform.googleapis.com/ReasoningEngine? (Select two.)", "options": ["Request latencies", "Tool call error rate", "Container CPU allocation time", "Token consumption per session", "Quality drift score"], "correct": [0, 2], "explanation": "The built-in metrics collected automatically for aiplatform.googleapis.com/ReasoningEngine are request count, request latencies, container CPU allocation time and container memory allocation time. Tool call error rate, token consumption and quality drift are not in that built-in set.", "references": [{"code": "R_MONITORING", "label": "Agent Runtime — set up monitoring", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/monitoring", "verified": true}]}, {"id": "4.2-10", "section": 4, "subtopic": "4.2", "type": "multi", "prompt": "A team wants the additional OpenTelemetry GenAI metrics, traces and logs from their ADK agent running on Agent Runtime, and their on-call engineer must be able to view the resulting metrics. Which two requirements apply? (Select two.)", "options": ["ADK version 2.0.0 or later, with telemetry enabled in the agent's deployment manifest.", "ADK version 2.6.0 or later, with the GOOGLE_CLOUD_AGENT_ENGINE_ENABLE_TELEMETRY environment variable set.", "The Cloud Trace Agent role (roles/cloudtrace.agent) granted to the project-level service account.", "The Monitoring Viewer role (roles/monitoring.viewer) granted to the engineer.", "An OnlineEvaluator attached to the agent revision to score live traces."], "correct": [1, 3], "explanation": "Extra built-in metrics following the OpenTelemetry GenAI semantic conventions, plus traces and logs, require ADK 2.6.0 or later together with the GOOGLE_CLOUD_AGENT_ENGINE_ENABLE_TELEMETRY environment variable, and viewing metrics requires the Monitoring Viewer role. An OnlineEvaluator is an evaluation construct, not a monitoring prerequisite.", "references": [{"code": "R_MONITORING", "label": "Agent Runtime — set up monitoring", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/monitoring", "verified": true}]}, {"id": "4.2-11", "section": 4, "subtopic": "4.2", "type": "single", "prompt": "An architect wants real-time Model Armor policy interceptions to be visible in the agent's trace data. What instrumentation work does the documentation say is needed?", "options": ["Write a custom OpenTelemetry exporter that wraps every Model Armor call.", "Enable Cloud Trace on the Agent Runtime and then mirror Model Armor logs into it manually.", "Route all traffic through Agent Gateway, because Model Armor interceptions surface only in gateway access logs.", "None — Model Armor natively emits standardized telemetry, so policy interceptions appear in trace data without custom instrumentation."], "correct": 3, "explanation": "Model Armor natively emits standardized telemetry, exposing real-time policy interceptions in trace data with no custom instrumentation. Agents generally must send telemetry in OpenTelemetry format to Google Cloud Observability, but Model Armor is called out as needing no extra work.", "references": [{"code": "R_OBSERVABILITY", "label": "Agent observability overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/optimize/observability/overview", "verified": true}]}, {"id": "4.2-12", "section": 4, "subtopic": "4.2", "type": "single", "prompt": "A platform team plans a rollout that splits traffic between two agent revisions. Which pair of statements matches the documentation on enabling this?", "options": ["Revision creation is always enabled, and revisions and traffic splitting are available through the v1beta1 API", "Revision creation must be enabled per project, and traffic splitting is available in the v1 API", "Revision creation is always enabled, but traffic splitting is only configurable in the Google Cloud console", "Revision creation must be enabled per agent, and traffic splitting requires Developer Connect"], "correct": 0, "explanation": "The documentation states that the ability to create revisions is always enabled and needs no feature toggle, and that revisions and traffic splitting are available through the v1beta1 API at this time.", "references": [{"code": "R_REVISIONS", "label": "Manage revisions and traffic", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/manage-revisions-and-traffic", "verified": true}]}, {"id": "4.2-13", "section": 4, "subtopic": "4.2", "type": "single", "prompt": "A developer can see their agent deployed on Agent Runtime but cannot open its built-in metrics in Metrics Explorer. Which IAM role does the documentation say to ask an administrator for?", "options": ["Monitoring Viewer (roles/monitoring.viewer) on the project", "Logs Writer (roles/logging.logWriter) on the project", "Cloud Trace Agent (roles/cloudtrace.agent) on the project", "Service Account User (roles/iam.serviceAccountUser) on the agent"], "correct": 0, "explanation": "To view an agent's built-in metrics in Metrics Explorer, the documented step is to have an administrator grant the Monitoring Viewer role (roles/monitoring.viewer) on the project. The other roles cover log writing, trace ingestion and service-account impersonation, none of which grant metric visibility.", "references": [{"code": "R_MONITORING", "label": "Agent Runtime — set up monitoring", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/monitoring", "verified": true}]}, {"id": "5.1-1", "section": 5, "subtopic": "5.1", "type": "single", "prompt": "A platform team must give every deployed agent a verifiable identity that downstream services can cryptographically attest, instead of reusing a shared workload credential. What does Agent Identity provide?", "options": ["A per-environment service account whose keys the auth manager rotates automatically.", "A short-lived API key minted by Agent Registry for each agent revision.", "A strongly attested, cryptographic identity for each agent based on the SPIFFE standard.", "An OpenTelemetry resource label that Agent Observability uses to attribute traces to an agent."], "correct": 2, "explanation": "Agent Identity provides a strongly attested cryptographic identity for each agent based on the SPIFFE standard, which the agent uses to authenticate to MCP servers, cloud resources, endpoints and other agents. It is an identity primitive, not a rotated service account key or a telemetry label.", "references": [{"code": "R_AGENT_IDENTITY", "label": "Agent Identity overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-identity-overview", "verified": true}]}, {"id": "5.1-2", "section": 5, "subtopic": "5.1", "type": "single", "prompt": "An agent must reach three external SaaS APIs: one requires an API key, one requires an OAuth client ID and secret, and one requires a delegated end-user OAuth token. Which Agent Identity component acquires, manages and secures these credential configurations?", "options": ["The auth manager, which creates and manages auth providers.", "Agent Registry, which catalogs endpoints for external services agents may connect to.", "Model Armor, which screens credentials out of prompts and responses.", "The Semantic Governance policy engine provisioned inside your VPC network."], "correct": 0, "explanation": "The auth manager creates and manages auth providers — configurations that acquire, manage and secure API keys, OAuth client IDs, OAuth client secrets and delegated end-user OAuth tokens. Agent Registry catalogs endpoints and other assets but does not manage these credentials.", "references": [{"code": "R_AGENT_IDENTITY", "label": "Agent Identity overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-identity-overview", "verified": true}]}, {"id": "5.1-3", "section": 5, "subtopic": "5.1", "type": "single", "prompt": "An agent must create tickets in each individual end user's own Jira account, acting on that user's behalf and inheriting that user's permissions in the external tool. Which authentication model does the Agent Identity guidance specify?", "options": ["The agent's own authority using the cloud-based Agent Identity.", "The agent's own authority using an OAuth 2.0 two-legged flow.", "An API key held in an auth provider and presented on every request.", "User-delegated authority using an OAuth 2.0 three-legged flow."], "correct": 3, "explanation": "The authentication-model table maps user-delegated authority to OAuth 2.0 three-legged for external tools and services such as a user's Jira or GitHub. The cloud-based Agent Identity covers the agent's own authority against Google Cloud services, and two-legged OAuth is the recommendation for machine-to-machine access.", "references": [{"code": "R_AGENT_IDENTITY", "label": "Agent Identity overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-identity-overview", "verified": true}]}, {"id": "5.1-4", "section": 5, "subtopic": "5.1", "type": "multi", "prompt": "Before approving agent deployments on Agent Runtime, your security team asks how agent identities differ from service accounts. Which two statements are accurate? (Select two.)", "options": ["Agent identities can be impersonated by any principal that holds a token-creator role.", "Agent identities do not allow long-lived service account keys.", "Agent identities are shared by multiple workloads by default.", "Access tokens are cryptographically bound to the agent's unique X.509 certificates to prevent token theft.", "Agent identities can be granted Legacy Bucket roles on Cloud Storage."], "correct": [1, 3], "explanation": "Unlike service accounts, agent identities are not shared by multiple workloads by default, cannot be impersonated, and do not allow long-lived service account keys; their access tokens are cryptographically bound to the agent's X.509 certificates to prevent token theft. Agent identities specifically cannot be granted Legacy Bucket roles.", "references": [{"code": "R_AGENT_IDENTITY", "label": "Agent Identity overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-identity-overview", "verified": true}, {"code": "R_AI_RUNTIME", "label": "Use Agent Identity with Agent Runtime", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/agent-identity", "verified": true}]}, {"id": "5.1-5", "section": 5, "subtopic": "5.1", "type": "single", "prompt": "An attacker exfiltrates an access token issued to an agent running on Agent Runtime and replays it from a host outside the runtime. With default credential protection in place, why does the replay fail?", "options": ["Model Armor inspects the outbound request and blocks the leaked credential before it reaches the API.", "A Google-managed Context-Aware Access policy enforces mTLS binding, so certificate-bound tokens work only from their intended runtime.", "Agent Gateway is configured in DRY_RUN, which blocks requests from unrecognized source addresses.", "The Semantic Governance policy engine denies the call because it violates a natural-language constraint on token reuse."], "correct": 1, "explanation": "Credentials are secured by default with a Google-managed Context-Aware Access policy that enforces mTLS binding, so certificate-bound tokens only work from their intended trusted runtime — stolen credentials are un-replayable, protecting against credential theft and account takeover. DRY_RUN logs disallowed communications rather than blocking them.", "references": [{"code": "R_AI_RUNTIME", "label": "Use Agent Identity with Agent Runtime", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/agent-identity", "verified": true}]}, {"id": "5.1-6", "section": 5, "subtopic": "5.1", "type": "single", "prompt": "In an authorization design review, an architect asks what Agent Gateway uses as the principal when deciding whether an agent may reach an MCP server, and where the metadata behind that decision comes from. Which answer is correct?", "options": ["The end user's Google account is the principal, and the metadata comes from Cloud Audit Logs.", "The underlying Cloud Run service account is the principal, and the metadata comes from Model Garden.", "The agent's OpenTelemetry span attributes are the principal, and the metadata comes from Agent Observability.", "The agent identity is the principal, and Agent Gateway looks up Agent Registry metadata to enforce granular access policies."], "correct": 3, "explanation": "Agent Gateway uses agent identity as the principal for authorization decisions and integrates with Agent Registry, looking up registry metadata to enforce granular access policies. Its Agent Observability integration produces telemetry for interactions; it is not the source of authorization metadata.", "references": [{"code": "R_GATEWAY", "label": "Agent Gateway overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/agent-gateway-overview", "verified": true}]}, {"id": "5.1-7", "section": 5, "subtopic": "5.1", "type": "single", "prompt": "A governance lead is mapping the platform's two policy families onto their control requirements. Which family is intended to govern traffic between agents and MCP servers or tools?", "options": ["IAM policies, which govern agentic communication between agent principals.", "Context-Aware Access policies applied to the runtime's mTLS certificates.", "Semantic Governance policies, the natural-language layer over tool invocations.", "Principal access boundary policies bound to the Agent Gateway project."], "correct": 2, "explanation": "The platform offers two policy families: IAM policies to govern agentic communication, and Semantic Governance policies to govern traffic between agents and MCP servers or tools.", "references": [{"code": "R_POLICIES", "label": "Agent Platform — Policies overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/policies/overview-uap", "verified": true}]}, {"id": "5.1-8", "section": 5, "subtopic": "5.1", "type": "single", "prompt": "Your organization wants IAM Access policies for agent-to-agent communication, plus an outer boundary limiting what any resource the agent identity can ever reach. Which statement correctly describes how Agent Gateway enforces this?", "options": ["Agent Gateway uses Identity-Aware Proxy to enforce Access policies, and IAP can also enforce a principal access boundary on the agent identity.", "Agent Gateway delegates enforcement to a VPC Service Controls perimeter drawn around the gateway project.", "Access policies are bound to the organization node and are evaluated by the Semantic Governance policy engine running in your VPC.", "A principal access boundary must be attached to the destination MCP server rather than to the agent identity."], "correct": 0, "explanation": "Agent Gateway uses Identity-Aware Proxy to evaluate and enforce IAM Access policies, and you can additionally create a principal access boundary on the agent identity that IAP enforces. Access policies are bound to the project containing your Agent Gateway instances, and the feature does not support VPC Service Controls.", "references": [{"code": "R_IAM_UAP", "label": "IAM Access policies overview (Agent Gateway)", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/policies/iam-overview-uap", "verified": true}]}, {"id": "5.1-9", "section": 5, "subtopic": "5.1", "type": "single", "prompt": "You are rolling out Access policies in a staging project and need visibility into which agent communications would be rejected, without interrupting ongoing tests. How should Agent Gateway be configured, and what is the effect?", "options": ["ENFORCE mode, which blocks violating communications and writes each one to Cloud Audit Logs.", "DRY_RUN mode, in which IAP logs disallowed communications to Cloud Audit Logs but does not block them.", "DRY_RUN mode, in which IAP blocks disallowed communications but suppresses audit logging.", "The CONTENT_AUTHZ policy profile, which reports payload violations without blocking them."], "correct": 1, "explanation": "Configuring Agent Gateway in DRY_RUN is the recommended staging approach: IAP logs disallowed communications to Cloud Audit Logs without blocking them. Switching to ENFORCE is what actually blocks violating communications.", "references": [{"code": "R_IAM_UAP", "label": "IAM Access policies overview (Agent Gateway)", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/policies/iam-overview-uap", "verified": true}]}, {"id": "5.1-10", "section": 5, "subtopic": "5.1", "type": "single", "prompt": "An agent's tool invocations must comply with business constraints written in natural language, and the security team insists the evaluating infrastructure run inside the company's own network. How do Semantic Governance policies satisfy this?", "options": ["The natural-language constraints are compiled into IAM conditions and evaluated statically before the model runs.", "Model Armor screens the incoming prompt for constraint violations before the model is called.", "Agent Gateway blocks the request at the network layer using DPoP-bound tokens before the model responds.", "A policy engine provisioned inside your VPC network examines each proposed tool call after the model responds and denies violating calls."], "correct": 3, "explanation": "Semantic governance pairs natural-language constraints with a policy engine provisioned inside your VPC network; after the agent's model returns a response, the engine examines each proposed tool call and denies all violating calls. IAM is static, which is precisely the gap semantic governance addresses for non-deterministic LLM behavior.", "references": [{"code": "R_SEMANTIC", "label": "Semantic governance policies overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/policies/semantic-governance-overview", "verified": true}]}, {"id": "5.1-11", "section": 5, "subtopic": "5.1", "type": "multi", "prompt": "Your organization runs models both on Google Cloud and on another cloud provider, and wants one screening layer covering prompt injection and PII leakage. Which two statements about Model Armor are accurate? (Select two.)", "options": ["It proactively screens both incoming prompts and model responses.", "It works only for AI applications deployed in Google Cloud.", "It returns a detailed description of both triggered and untriggered filters.", "It examines each proposed tool call after the model responds and denies the violating ones.", "It asynchronously ingests OpenTelemetry execution traces to detect behavioral anomalies in reasoning."], "correct": [0, 2], "explanation": "Model Armor inspects the incoming prompt before it reaches the LLM and inspects the response before it reaches the user, and returns a detailed description of triggered and untriggered filters. It works whether AI is deployed in Google Cloud or with other cloud providers; tool-call adjudication belongs to Semantic Governance and reasoning-trace analysis to Agent Anomaly Detection.", "references": [{"code": "R_MODEL_ARMOR", "label": "Model Armor overview", "url": "https://docs.cloud.google.com/model-armor/overview", "verified": true}]}, {"id": "5.1-12", "section": 5, "subtopic": "5.1", "type": "single", "prompt": "A responsible-AI review asks how to reduce content and alignment risks for an agent beyond the default, non-configurable filters. Which layered mitigations does the platform's safety guidance describe?", "options": ["Enable DRY_RUN on Agent Gateway so unsafe responses are logged instead of returned to users.", "Require an immutable agent version snapshot in Agent Registry before each release so responses stay consistent.", "System instructions, content filters with thresholds for common harm types, and Gemini as a filter for nuanced cases.", "Provision a Private Service Connect endpoint so all responses are screened at the network layer."], "correct": 2, "explanation": "Beyond the default non-configurable filters, the documented layers are system instructions, content filters with configurable thresholds for common harm types, and using Gemini as a filter for nuanced checkpoints. DRY_RUN concerns IAM Access policy enforcement, not response safety.", "references": [{"code": "R_SAFETY", "label": "Safety (Responsible AI) on Agent Platform", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/safety", "verified": true}]}, {"id": "5.2-1", "section": 5, "subtopic": "5.2", "type": "single", "prompt": "While migrating an agent to agent identity on Agent Runtime, a team plans to keep granting it the same Cloud Storage roles it used with a service account. Which documented limitation must they design around?", "options": ["Agent identities cannot be granted Legacy Bucket roles", "Agent identities cannot be granted any Cloud Storage role at all", "Agent identities can only read from buckets in the agent's own region", "Agent identities lose all bucket access whenever a new revision is deployed"], "correct": 0, "explanation": "The documented limitation is specifically that agent identities cannot be granted Legacy Bucket roles. Storage access as such is not blocked, so the broader claims are wrong.", "references": [{"code": "R_AI_RUNTIME", "label": "Use Agent Identity with Agent Runtime", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/agent-identity", "verified": true}]}, {"id": "5.2-2", "section": 5, "subtopic": "5.2", "type": "single", "prompt": "An auditor investigating an action an agent took on behalf of an employee must establish both who requested the action and which agent carried it out. For user-delegated flows on Agent Runtime, what do the logs show?", "options": ["Only the agent identity, since the agent is the calling principal.", "Only the end-user identity, since the agent's credential is exchanged.", "Neither; attribution requires Agent Anomaly Detection to be enabled.", "Both the user identity and the agent identity that acted on their behalf."], "correct": 3, "explanation": "For user-delegated flows, Agent Runtime logs show both the user identity and the agent identity, so an auditor can attribute the action to the requesting user and the acting agent at the same time.", "references": [{"code": "R_AI_RUNTIME", "label": "Use Agent Identity with Agent Runtime", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/scale/runtime/agent-identity", "verified": true}]}, {"id": "5.2-3", "section": 5, "subtopic": "5.2", "type": "single", "prompt": "A design requirement states that an agent acting with a user's delegated OAuth token must never be able to read the raw credential. Using Agent Gateway with Gemini Enterprise, how is this achieved?", "options": ["End-user credentials are encrypted by the auth manager and decrypted at the gateway, so the agent can never access the raw credential.", "The credential is placed in the agent's session state and redacted by Model Armor before the model sees it.", "Sensitive Data Protection de-identifies the token inside the prompt before it reaches the model.", "The Semantic Governance policy engine strips credentials out of each proposed tool call."], "correct": 0, "explanation": "With Agent Gateway and Gemini Enterprise, end-user credentials are encrypted by the auth manager and decrypted at the gateway, so the raw credential is never exposed to the agent. The other options describe screening or de-identification products that are not the mechanism for this credential handoff.", "references": [{"code": "R_AGENT_IDENTITY", "label": "Agent Identity overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/agent-identity-overview", "verified": true}]}, {"id": "5.2-4", "section": 5, "subtopic": "5.2", "type": "single", "prompt": "You delegate Agent Gateway authorization to Model Armor using Service Extensions, and the decision must be based on deep inspection of the application payload rather than on HTTP request headers. Which policy profile applies?", "options": ["REQUEST_AUTHZ, which performs deeper inspection of application payloads via a gRPC authorization extension.", "DRY_RUN, the payload-inspecting profile that logs violations to Cloud Audit Logs but does not block them.", "CONTENT_AUTHZ, which performs deeper inspection of application payloads, unlike header-based REQUEST_AUTHZ.", "ENFORCE, the profile that relies on HTTP request headers to authorize each request and blocks violations."], "correct": 2, "explanation": "The content-based profile CONTENT_AUTHZ performs deeper inspection of application payloads, while the request-based profile REQUEST_AUTHZ relies on HTTP request headers. DRY_RUN and ENFORCE are IAM Access policy enforcement modes, not Service Extensions policy profiles.", "references": [{"code": "R_DELEGATE_AUTHZ", "label": "Delegate authorization with Service Extensions", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/govern/gateways/delegate-authorization", "verified": true}]}, {"id": "5.2-5", "section": 5, "subtopic": "5.2", "type": "multi", "prompt": "A platform team wants to adopt CodeMender to remediate vulnerabilities in a repository they own. Which two statements about sanctioned, safe use are accurate? (Select two.)", "options": ["cm fix commits each validated patch directly to the repository's default branch.", "Usage is restricted to code you own or are authorized to modify, or OSI-licensed open source, and solely for legitimate security defense purposes.", "Patch candidates are applied to the original source in place so the build can be tested without copying files.", "Verification is skipped for findings the cloud-hosted reasoning engine rates as high confidence.", "By default, cm fix prompts to confirm each file modification before writing to disk."], "correct": [1, 4], "explanation": "CodeMender usage is restricted to code you own or are authorized to work on, or OSI-licensed open source, and solely for legitimate security defense purposes rather than unauthorized testing or exploitation. cm fix keeps a human in the loop by prompting to confirm each file modification before writing to disk, and it applies the candidate patch to a copy of the source in the local sandbox, not in place.", "references": [{"code": "R_CODEMENDER", "label": "CodeMender overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/codemender", "verified": true}, {"code": "R_CM_FIX", "label": "CodeMender — Fix vulnerabilities and manage diffs", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/codemender/fix-and-patch", "verified": true}]}, {"id": "5.2-6", "section": 5, "subtopic": "5.2", "type": "single", "prompt": "Your security team wants oversight that can flag an agent whose live reasoning shows suspicious intent, even when no static code flaw and no perimeter network alert exists. Which capability matches, and how does it operate?", "options": ["Model Armor, which screens prompts and responses inline at the model boundary and flags suspicious reasoning.", "Agent Gateway telemetry export, which records every network-layer interaction and scores the agent's intent.", "Online monitors, which asynchronously score live traces against quality metrics to detect suspicious intent.", "Agent Anomaly Detection, which asynchronously evaluates live reasoning traces, tool interactions and execution flows."], "correct": 3, "explanation": "Agent Anomaly Detection is a reasoning-based oversight layer: unlike tools that scan static code or inspect perimeter network traffic, it evaluates live reasoning traces, tool interactions and execution flows to detect suspicious intent, policy violations and behavioral anomalies, analyzing session activity asynchronously from OpenTelemetry logs and traces. Online monitors also score live traces asynchronously, but they target quality drift rather than suspicious intent.", "references": [{"code": "R_ANOMALY", "label": "Agent Anomaly Detection overview", "url": "https://docs.cloud.google.com/gemini-enterprise-agent-platform/agent-anomalies-overview", "verified": true}]}]}</script>
