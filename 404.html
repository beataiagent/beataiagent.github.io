<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <!-- GitHub Pages serves this file for any missing path: send old doc URLs to their new section, everyone else to the home page -->
  <script>
    // doc/: the old one-page-per-module URLs now live as sections of one page per domain (doc/secN.html#<old-name>)
    var m = location.pathname.match(/\/doc\/((?:mcq-)?sec(\d)[\w-]*)\.html$/);
    location.replace(m ? "/doc/sec" + m[2] + ".html" + (location.hash || "#" + m[1]) : "/");
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
  <link rel="icon" type="image/svg+xml" href="/images/shared/logos/b-favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/shared/logos/b-favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/images/shared/logos/b-favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/shared/logos/b-favicon-180.png">
  <link href="/fonts/fonts.css" rel="stylesheet">
  <style>
    :root { --bg: #202124; --sub: #bdc1c6; --h-blue: #57caff; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: #fff; font-family: "Google Sans", system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    h1 { font-weight: 400; font-size: 64px; margin: 0; }
    p { color: var(--sub); font-family: "Roboto Mono", ui-monospace, monospace; }
    a { color: var(--h-blue); }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Page not found. Taking you <a href="/">home</a>…</p>
  </main>
</body>
</html>
