<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <!-- GitHub Pages serves this file for any missing path: send everyone to the home page (index.html) -->
  <script>location.replace("/");</script>
  <meta http-equiv="refresh" content="0; url=/">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/shared/logos/gdg-favicon-32.png">
  <link href="/fonts/fonts.css" rel="stylesheet">
  <style>
    :root { --bg: #202124; --sub: #bdc1c6; --h-blue: #57caff; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: #fff; font-family: "Google Sans", system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    h1 { font-weight: 400; font-size: 64px; margin: 0; }
    p { color: var(--sub); font-family: "Roboto Mono", ui-monospace, monospace; }
    a { color: var(--h-blue); }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Page not found. Taking you <a href="/">home</a>…</p>
  </main>
</body>
</html>
