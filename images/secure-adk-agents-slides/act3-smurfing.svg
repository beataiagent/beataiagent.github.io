<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 162" width="1088" height="162">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#353840" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7daf"/>
      <stop offset="33%" stop-color="#5cdb6d"/>
      <stop offset="66%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#57caff"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", system-ui, -apple-system, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", system-ui, -apple-system, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="162" fill="#202124"/>

  <circle cx="240" cy="81" r="110" fill="url(#amb-g)"/>
  <circle cx="620" cy="81" r="110" fill="url(#amb-y)"/>
  <circle cx="920" cy="81" r="115" fill="url(#amb-r)"/>

  <!-- Left: Attacker sending repeated $20 coins -->
  <rect x="14" y="20" width="212" height="122" rx="16" fill="url(#glass)" stroke="#ffd427" stroke-width="2.2"/>
  <text x="120" y="44" text-anchor="middle" class="m" font-size="11" fill="#ffd427">8 POLITE TURNS</text>
  <g font-family="Roboto Mono,monospace" font-size="11" fill="#5cdb6d">
    <circle cx="54" cy="78" r="16" fill="#17181b" stroke="#5cdb6d" stroke-width="2"/><text x="54" y="82" text-anchor="middle">$20</text>
    <circle cx="98" cy="78" r="16" fill="#17181b" stroke="#5cdb6d" stroke-width="2"/><text x="98" y="82" text-anchor="middle">$20</text>
    <circle cx="142" cy="78" r="16" fill="#17181b" stroke="#5cdb6d" stroke-width="2"/><text x="142" y="82" text-anchor="middle">$20</text>
    <circle cx="186" cy="78" r="16" fill="#17181b" stroke="#ff7daf" stroke-width="2"/><text x="186" y="82" text-anchor="middle" fill="#ff7daf">$20</text>
  </g>
  <text x="120" y="122" text-anchor="middle" class="sub" font-size="12.5">"Power cable, HDMI..."</text>

  <!-- Stream line through 3 green gates -->
  <path d="M226 81 H748" stroke="url(#grad-by)" stroke-width="3.5" stroke-dasharray="8 5"/>
  <polygon points="746,73 762,81 746,89" fill="#ffd427"/>

  <!-- Gate 1 -->
  <rect x="278" y="34" width="128" height="94" rx="14" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
  <circle cx="342" cy="68" r="16" fill="rgba(92,219,109,0.18)" stroke="#5cdb6d" stroke-width="2.2"/>
  <path d="M335 68 L340 73 L350 63" fill="none" stroke="#5cdb6d" stroke-width="2.6" stroke-linecap="round"/>
  <text x="342" y="106" text-anchor="middle" class="t" font-size="13.5">Model Armor</text>
  <text x="342" y="120" text-anchor="middle" class="m" font-size="10.5" fill="#5cdb6d">PASS</text>

  <!-- Gate 2 -->
  <rect x="436" y="34" width="128" height="94" rx="14" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
  <circle cx="500" cy="68" r="16" fill="rgba(92,219,109,0.18)" stroke="#5cdb6d" stroke-width="2.2"/>
  <path d="M493 68 L498 73 L508 63" fill="none" stroke="#5cdb6d" stroke-width="2.6" stroke-linecap="round"/>
  <text x="500" y="106" text-anchor="middle" class="t" font-size="13.5">Policy Judge</text>
  <text x="500" y="120" text-anchor="middle" class="m" font-size="10.5" fill="#5cdb6d">$20 &lt; $149 ✓</text>

  <!-- Gate 3 -->
  <rect x="594" y="34" width="128" height="94" rx="14" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
  <circle cx="658" cy="68" r="16" fill="rgba(92,219,109,0.18)" stroke="#5cdb6d" stroke-width="2.2"/>
  <path d="M651 68 L656 73 L666 63" fill="none" stroke="#5cdb6d" stroke-width="2.6" stroke-linecap="round"/>
  <text x="658" y="106" text-anchor="middle" class="t" font-size="13.5">KMS Sign</text>
  <text x="658" y="120" text-anchor="middle" class="m" font-size="10.5" fill="#5cdb6d">SIGNED ✓</text>

  <!-- Right: Overflowing Order Beaker -->
  <rect x="772" y="16" width="302" height="130" rx="16" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.5" filter="url(#glow-s)"/>
  <!-- Beaker body -->
  <rect x="794" y="34" width="96" height="94" rx="10" fill="#17181b" stroke="#5f6368" stroke-width="2"/>
  <!-- Liquid fill up to $149 (green) + overflow (pink/red) -->
  <rect x="798" y="54" width="88" height="70" rx="6" fill="rgba(92,219,109,0.34)"/>
  <rect x="798" y="36" width="88" height="18" rx="4" fill="rgba(255,125,175,0.58)"/>
  <!-- $149 limit line -->
  <line x1="786" y1="54" x2="900" y2="54" stroke="#ffd427" stroke-width="2.4" stroke-dasharray="5 3"/>
  <!-- Overflow splash droplets -->
  <circle cx="898" cy="30" r="4.5" fill="#ff7daf" filter="url(#glow-s)"/>
  <circle cx="910" cy="40" r="3.5" fill="#ff7daf"/>
  <!-- Labels -->
  <text x="914" y="58" class="m" font-size="12" fill="#ffd427">$149 LIMIT</text>
  <text x="914" y="88" class="t" font-size="22" fill="#ff7daf">$160 PAID</text>
  <text x="914" y="112" class="sub" font-size="13">Over-refunded by $11</text>

</svg>
