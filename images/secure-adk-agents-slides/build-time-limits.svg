<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 164" width="1088" height="164">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#353840" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7daf"/>
      <stop offset="33%" stop-color="#5cdb6d"/>
      <stop offset="66%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#57caff"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", system-ui, -apple-system, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", system-ui, -apple-system, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="164" fill="#202124"/>

  <circle cx="182" cy="82" r="110" fill="url(#amb-r)"/>
  <circle cx="544" cy="82" r="110" fill="url(#amb-y)"/>
  <circle cx="906" cy="82" r="110" fill="url(#amb-b)"/>

  <!-- Horizontal dashed syntax-only barrier -->
  <line x1="16" y1="82" x2="1072" y2="82" stroke="#ffd427" stroke-width="2.5" stroke-dasharray="10 7" opacity="0.75"/>
  <rect x="256" y="70" width="168" height="24" rx="12" fill="#202124" stroke="#ffd427" stroke-width="1.6"/>
  <text x="340" y="86" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">SYNTAX-ONLY WALL</text>
  <rect x="664" y="70" width="168" height="24" rx="12" fill="#202124" stroke="#ffd427" stroke-width="1.6"/>
  <text x="748" y="86" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">PART 1 RULES</text>

  <!-- 1: Valid SQL slips right through -->
  <rect x="24" y="14" width="314" height="44" rx="12" fill="url(#glass)" stroke="#ff7daf" stroke-width="2"/>
  <text x="40" y="41" class="m" font-size="12" fill="#e8eaed">UPDATE refunds SET amt=120</text>
  <path d="M181 58 V106" stroke="#ff7daf" stroke-width="3" filter="url(#glow-s)"/>
  <polygon points="174,102 181,114 188,102" fill="#ff7daf"/>
  <rect x="116" y="116" width="130" height="34" rx="10" fill="#17181b" stroke="#5cdb6d" stroke-width="1.8"/>
  <text x="181" y="137" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d">SQL Parser ✓</text>

  <!-- 2: Software license slips past regex -->
  <rect x="387" y="14" width="314" height="44" rx="12" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  <text x="544" y="41" text-anchor="middle" class="m" font-size="12" fill="#e8eaed">"Full refund for annual license"</text>
  <path d="M544 58 V106" stroke="#ffd427" stroke-width="3" filter="url(#glow-s)"/>
  <polygon points="537,102 544,114 551,102" fill="#ffd427"/>
  <rect x="479" y="116" width="130" height="34" rx="10" fill="#17181b" stroke="#5cdb6d" stroke-width="1.8"/>
  <text x="544" y="137" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d">Regex ✓</text>

  <!-- 3: 8 x $20 coins slip past single-turn test -->
  <rect x="750" y="14" width="314" height="44" rx="12" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <g font-family="Roboto Mono,monospace" font-size="11" fill="#57caff">
    <circle cx="786" cy="36" r="14" fill="#17181b" stroke="#57caff" stroke-width="1.6"/><text x="786" y="40" text-anchor="middle">$20</text>
    <circle cx="826" cy="36" r="14" fill="#17181b" stroke="#57caff" stroke-width="1.6"/><text x="826" y="40" text-anchor="middle">$20</text>
    <circle cx="866" cy="36" r="14" fill="#17181b" stroke="#57caff" stroke-width="1.6"/><text x="866" y="40" text-anchor="middle">$20</text>
    <circle cx="906" cy="36" r="14" fill="#17181b" stroke="#57caff" stroke-width="1.6"/><text x="906" y="40" text-anchor="middle">$20</text>
    <text x="944" y="40" fill="#bdc1c6">× 8 turns</text>
  </g>
  <path d="M907 58 V106" stroke="#57caff" stroke-width="3" filter="url(#glow-s)"/>
  <polygon points="900,102 907,114 914,102" fill="#57caff"/>
  <rect x="828" y="114" width="158" height="34" rx="10" fill="#17181b" stroke="#5cdb6d" stroke-width="1.8"/>
  <text x="907" y="135" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d">1-Turn Test ✓</text>

</svg>
