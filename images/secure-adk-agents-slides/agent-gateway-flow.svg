<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 146" width="1088" height="146">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#353840" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7daf"/>
      <stop offset="33%" stop-color="#5cdb6d"/>
      <stop offset="66%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#57caff"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", system-ui, -apple-system, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", system-ui, -apple-system, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="146" fill="#202124"/>

  <circle cx="310" cy="73" r="105" fill="url(#amb-b)"/>
  <circle cx="544" cy="73" r="95" fill="url(#amb-y)"/>
  <circle cx="778" cy="73" r="105" fill="url(#amb-g)"/>

  <!-- Clients box -->
  <rect x="12" y="20" width="156" height="106" rx="16" fill="url(#glass)" stroke="#5f6368" stroke-width="2"/>
  <text x="90" y="46" text-anchor="middle" class="m" font-size="11" fill="#9aa0a6">CLIENTS</text>
  <text x="90" y="72" text-anchor="middle" class="t" font-size="15">Web · CLI</text>
  <text x="90" y="94" text-anchor="middle" class="sub" font-size="13">External A2A</text>
  <text x="90" y="114" text-anchor="middle" class="m" font-size="10.5" fill="#57caff">REST · gRPC</text>

  <!-- Arrow Clients -> Ingress -->
  <path d="M168 73 H204" stroke="#57caff" stroke-width="3"/>
  <polygon points="202,66 214,73 202,80" fill="#57caff"/>

  <!-- Ingress Gateway -->
  <rect x="218" y="16" width="194" height="114" rx="16" fill="url(#glass)" stroke="#57caff" stroke-width="2.6" filter="url(#glow-s)"/>
  <rect x="250" y="6" width="130" height="20" rx="10" fill="#57caff"/>
  <text x="315" y="20" text-anchor="middle" font-family="Roboto Mono,monospace" font-weight="700" font-size="10.5" fill="#202124">INGRESS GATEWAY</text>
  <text x="315" y="50" text-anchor="middle" class="t" font-size="15">Client → Agent</text>
  <rect x="234" y="62" width="162" height="24" rx="7" fill="#17181b" stroke="#57caff" stroke-width="1.3"/>
  <text x="315" y="78" text-anchor="middle" class="m" font-size="11" fill="#57caff">IAM · Deny Default</text>
  <rect x="234" y="92" width="162" height="24" rx="7" fill="#17181b" stroke="#ff7daf" stroke-width="1.3"/>
  <text x="315" y="108" text-anchor="middle" class="m" font-size="11" fill="#ff7daf">Model Armor Screen</text>

  <!-- Arrow Ingress -> Agent -->
  <path d="M412 73 H454" stroke="#57caff" stroke-width="3"/>
  <polygon points="452,66 464,73 452,80" fill="#57caff"/>

  <!-- Center ADK Agent -->
  <rect x="468" y="18" width="152" height="110" rx="18" fill="url(#glass)" stroke="#ffd427" stroke-width="2.4"/>
  <g transform="translate(544,70) scale(0.62)">
    <line x1="0" y1="-44" x2="0" y2="-56" stroke="#ffd427" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-60" r="5" fill="#ffd427" filter="url(#glow-s)"/>
    <rect x="-36" y="-44" width="72" height="54" rx="22" fill="#e8eaed" stroke="#ffd427" stroke-width="2.5"/>
    <rect x="-25" y="-33" width="50" height="32" rx="13" fill="#17181b"/>
    <circle cx="-11" cy="-19" r="5" fill="#ffd427" filter="url(#glow-s)"/><circle cx="11" cy="-19" r="5" fill="#ffd427" filter="url(#glow-s)"/>
    <path d="M-8 -8 Q0 -2 8 -8" fill="none" stroke="#ffd427" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-24 14 H24 C28 14 26 42 0 46 C-26 42 -28 14 -24 14 Z" fill="#cfd4dc" stroke="#ffd427" stroke-width="2"/>
    <circle cx="0" cy="28" r="6" fill="#ffd427" opacity="0.88"/>
  </g>
  <text x="544" y="116" text-anchor="middle" class="t" font-size="14">ADK Agent</text>

  <!-- Arrow Agent -> Egress -->
  <path d="M620 73 H662" stroke="#5cdb6d" stroke-width="3"/>
  <polygon points="660,66 672,73 660,80" fill="#5cdb6d"/>

  <!-- Egress Gateway -->
  <rect x="676" y="16" width="194" height="114" rx="16" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.6" filter="url(#glow-s)"/>
  <rect x="708" y="6" width="130" height="20" rx="10" fill="#5cdb6d"/>
  <text x="773" y="20" text-anchor="middle" font-family="Roboto Mono,monospace" font-weight="700" font-size="10.5" fill="#202124">EGRESS GATEWAY</text>
  <text x="773" y="50" text-anchor="middle" class="t" font-size="15">Agent → Anywhere</text>
  <rect x="692" y="62" width="162" height="24" rx="7" fill="#17181b" stroke="#5cdb6d" stroke-width="1.3"/>
  <text x="773" y="78" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d">Semantic Policy</text>
  <rect x="692" y="92" width="162" height="24" rx="7" fill="#17181b" stroke="#ffd427" stroke-width="1.3"/>
  <text x="773" y="108" text-anchor="middle" class="m" font-size="11" fill="#ffd427">MCP Tool Inspect</text>

  <!-- Arrow Egress -> Targets -->
  <path d="M870 73 H906" stroke="#5cdb6d" stroke-width="3"/>
  <polygon points="904,66 916,73 904,80" fill="#5cdb6d"/>

  <!-- Targets box -->
  <rect x="920" y="20" width="156" height="106" rx="16" fill="url(#glass)" stroke="#5f6368" stroke-width="2"/>
  <text x="998" y="46" text-anchor="middle" class="m" font-size="11" fill="#9aa0a6">TARGETS</text>
  <text x="998" y="72" text-anchor="middle" class="t" font-size="15">MCP · SaaS</text>
  <text x="998" y="94" text-anchor="middle" class="sub" font-size="13">Tools &amp; Agents</text>
  <text x="998" y="114" text-anchor="middle" class="m" font-size="10.5" fill="#5cdb6d">Approved only</text>

</svg>
