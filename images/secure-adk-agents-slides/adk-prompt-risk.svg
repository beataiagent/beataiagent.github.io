<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 404 156" width="404" height="156">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#353840" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7daf"/>
      <stop offset="33%" stop-color="#5cdb6d"/>
      <stop offset="66%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#57caff"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", system-ui, -apple-system, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", system-ui, -apple-system, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="404" height="156" fill="#202124"/>

  <circle cx="104" cy="78" r="85" fill="url(#amb-r)"/>
  <circle cx="304" cy="78" r="85" fill="url(#amb-g)"/>

  <!-- Left: Fragile prompt rule -->
  <rect x="10" y="12" width="184" height="132" rx="14" fill="url(#glass)" stroke="#ff7daf" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="102" y="34" text-anchor="middle" class="m" font-size="10.5" fill="#ff7daf">PROMPT-ONLY RULE</text>
  <!-- Bending dashed wall -->
  <path d="M102 48 Q122 80 102 112" fill="none" stroke="#ff7daf" stroke-width="3" stroke-dasharray="5 4"/>
  <!-- Arrow punching straight through -->
  <path d="M28 80 H164" stroke="#ffd427" stroke-width="3" filter="url(#glow-s)"/>
  <polygon points="162,73 176,80 162,87" fill="#ffd427"/>
  <text x="102" y="132" text-anchor="middle" class="sub" font-size="11.5">Words can bend words</text>

  <!-- Right: External guard -->
  <rect x="210" y="12" width="184" height="132" rx="14" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.4"/>
  <text x="302" y="34" text-anchor="middle" class="m" font-size="10.5" fill="#5cdb6d">ZERO-TRUST GUARD</text>
  <!-- Solid shield deflecting arrow -->
  <path d="M316 54 L338.4 65.4 V82.6 C338.4 96.9 325.1 103.9 316 108.1 C306.9 103.9 293.6 96.9 293.6 82.6 V65.4 Z" fill="rgba(92,219,109,0.18)" stroke="#5cdb6d" stroke-width="2.8" filter="url(#glow-s)"/>
  <path d="M308 80 L314 86 L326 73" fill="none" stroke="#5cdb6d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M226 80 H282" stroke="#ff7daf" stroke-width="3"/>
  <path d="M282 80 L268 62 M282 80 L268 98" stroke="#ff7daf" stroke-width="2.2" stroke-dasharray="3 3"/>
  <text x="302" y="132" text-anchor="middle" class="sub" font-size="11.5">Enforced outside LLM</text>

</svg>
