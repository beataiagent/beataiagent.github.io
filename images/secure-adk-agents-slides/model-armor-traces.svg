<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 128" width="1088" height="128">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#353840" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7daf"/>
      <stop offset="33%" stop-color="#5cdb6d"/>
      <stop offset="66%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#57caff"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", system-ui, -apple-system, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", system-ui, -apple-system, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="128" fill="#202124"/>

  <circle cx="240" cy="64" r="100" fill="url(#amb-b)"/>
  <circle cx="840" cy="64" r="100" fill="url(#amb-r)"/>

  <rect x="8" y="8" width="1072" height="112" rx="16" fill="url(#glass)" stroke="#5f6368" stroke-width="1.8"/>
  <!-- Header bar -->
  <text x="26" y="30" class="m" font-size="11" fill="#9aa0a6">CLOUD TRACE WATERFALL</text>
  <text x="410" y="30" class="m" font-size="10.5" fill="#9aa0a6">0 ms</text>
  <text x="640" y="30" class="m" font-size="10.5" fill="#9aa0a6">150 ms</text>
  <text x="870" y="30" class="m" font-size="10.5" fill="#9aa0a6">300 ms</text>
  <line x1="410" y1="36" x2="410" y2="112" stroke="#3c4043" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="640" y1="36" x2="640" y2="112" stroke="#3c4043" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="870" y1="36" x2="870" y2="112" stroke="#3c4043" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Row 1: Parent span -->
  <text x="26" y="55" class="m" font-size="12" fill="#fff">apply_guardrail "Model Armor"</text>
  <rect x="410" y="42" width="636" height="18" rx="9" fill="rgba(255,255,255,0.12)" stroke="#e8eaed" stroke-width="1.5"/>
  <text x="1038" y="55" text-anchor="end" class="m" font-size="10.5" fill="#e8eaed">parent span</text>

  <!-- Row 2: Request Path -->
  <text x="42" y="81" class="m" font-size="12" fill="#57caff">├─ Request Path (input)</text>
  <rect x="410" y="68" width="154" height="18" rx="9" fill="rgba(87,202,255,0.28)" stroke="#57caff" stroke-width="1.8" filter="url(#glow-s)"/>
  <text x="487" y="81" text-anchor="middle" class="m" font-size="10.5" fill="#57caff">ALLOW · 22ms</text>
  <!-- Middle ADK LLM bar -->
  <rect x="572" y="68" width="268" height="18" rx="9" fill="rgba(92,219,109,0.16)" stroke="#5cdb6d" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="706" y="81" text-anchor="middle" class="m" font-size="10.5" fill="#5cdb6d">ADK Agent + Gemini</text>

  <!-- Row 3: Response Path -->
  <text x="42" y="106" class="m" font-size="12" fill="#ff7daf">└─ Response Path (output)</text>
  <rect x="848" y="93" width="198" height="18" rx="9" fill="rgba(255,125,175,0.28)" stroke="#ff7daf" stroke-width="1.8" filter="url(#glow-s)"/>
  <text x="947" y="106" text-anchor="middle" class="m" font-size="10.5" fill="#ff7daf">MODIFY · PII REDACTED</text>

</svg>
