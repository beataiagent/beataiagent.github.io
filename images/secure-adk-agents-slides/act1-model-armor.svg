<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 164" width="420" height="164">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#353840" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7daf"/>
      <stop offset="33%" stop-color="#5cdb6d"/>
      <stop offset="66%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#57caff"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", system-ui, -apple-system, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", system-ui, -apple-system, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="420" height="164" fill="#202124"/>

  <circle cx="204" cy="82" r="95" fill="url(#amb-r)"/>
  <circle cx="350" cy="82" r="75" fill="url(#amb-g)"/>

  <!-- Incoming attack bolt -->
  <rect x="12" y="46" width="110" height="72" rx="12" fill="url(#glass)" stroke="#ff7daf" stroke-width="2"/>
  <text x="67" y="70" text-anchor="middle" class="m" font-size="10.5" fill="#ff7daf">JAILBREAK</text>
  <text x="67" y="92" text-anchor="middle" class="t" font-size="13">$10k + env</text>
  <!-- Red jagged beam -->
  <path d="M122 82 L144 74 L152 88 L174 82" fill="none" stroke="#ff7daf" stroke-width="3.2" filter="url(#glow-s)"/>
  <!-- Shatter sparks -->
  <g stroke="#ffd427" stroke-width="2.2" stroke-linecap="round">
    <line x1="176" y1="68" x2="162" y2="54"/>
    <line x1="176" y1="96" x2="162" y2="112"/>
    <line x1="170" y1="82" x2="156" y2="82"/>
  </g>

  <!-- Model Armor Shield -->
  <path d="M214 36 L251.8 55.4 V84.4 C251.8 108.6 229.4 120.5 214 127.5 C198.6 120.5 176.2 108.6 176.2 84.4 V55.4 Z" fill="url(#glass)" stroke="#ff7daf" stroke-width="3" filter="url(#glow-s)"/>
  <text x="214" y="74" text-anchor="middle" class="m" font-size="10.5" fill="#ff7daf">MODEL</text>
  <text x="214" y="90" text-anchor="middle" class="t" font-size="13">ARMOR</text>
  <rect x="166" y="130" width="96" height="22" rx="11" fill="#ff7daf"/>
  <text x="214" y="145" text-anchor="middle" font-family="Roboto Mono,monospace" font-weight="700" font-size="11" fill="#202124">403 BLOCK</text>

  <!-- Untouched Gemini / Agent -->
  <rect x="292" y="22" width="116" height="120" rx="16" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2" stroke-dasharray="5 4"/>
  <g transform="translate(350,74) scale(0.56)">
    <line x1="0" y1="-44" x2="0" y2="-56" stroke="#5cdb6d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-60" r="5" fill="#5cdb6d" filter="url(#glow-s)"/>
    <rect x="-36" y="-44" width="72" height="54" rx="22" fill="#e8eaed" stroke="#5cdb6d" stroke-width="2.5"/>
    <rect x="-25" y="-33" width="50" height="32" rx="13" fill="#17181b"/>
    <rect x="-16" y="-22" width="10" height="5" rx="2.5" fill="#5cdb6d" filter="url(#glow-s)"/><rect x="6" y="-22" width="10" height="5" rx="2.5" fill="#5cdb6d" filter="url(#glow-s)"/>
    <line x1="-7" y1="-8" x2="7" y2="-8" stroke="#5cdb6d" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-24 14 H24 C28 14 26 42 0 46 C-26 42 -28 14 -24 14 Z" fill="#cfd4dc" stroke="#5cdb6d" stroke-width="2"/>
    <circle cx="0" cy="28" r="6" fill="#5cdb6d" opacity="0.88"/>
  </g>
  <text x="350" y="118" text-anchor="middle" class="t" font-size="12.5" fill="#5cdb6d">0 tokens</text>
  <text x="350" y="133" text-anchor="middle" class="m" font-size="10" fill="#bdc1c6">LLM skipped</text>

</svg>
