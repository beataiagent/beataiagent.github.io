<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 198" width="1088" height="198">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#353840" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7daf"/>
      <stop offset="33%" stop-color="#5cdb6d"/>
      <stop offset="66%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#57caff"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", system-ui, -apple-system, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", system-ui, -apple-system, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="198" fill="#202124"/>

  <circle cx="182" cy="99" r="120" fill="url(#amb-r)"/>
  <circle cx="544" cy="99" r="120" fill="url(#amb-y)"/>
  <circle cx="906" cy="99" r="120" fill="url(#amb-b)"/>

  <!-- Panel 1: Jailbreak -->
  <rect x="12" y="12" width="340" height="174" rx="18" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.2"/>
  <rect x="30" y="28" width="166" height="62" rx="12" fill="#17181b" stroke="#ff7daf" stroke-width="1.8"/>
  <polygon points="196,52 212,60 196,68" fill="#ff7daf"/>
  <text x="42" y="50" class="m" font-size="11" fill="#ff7daf">INJECTED PROMPT</text>
  <text x="42" y="72" class="t" font-size="13">"Ignore rules → $10k"</text>
  <!-- Hypnotic wave -->
  <path d="M214 60 Q224 48 234 60 T254 60" fill="none" stroke="#ff7daf" stroke-width="2.5" filter="url(#glow-s)"/>
  <g transform="translate(298,98) scale(0.72)">
    <line x1="0" y1="-44" x2="0" y2="-56" stroke="#ff7daf" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-60" r="5" fill="#ff7daf" filter="url(#glow-s)"/>
    <rect x="-36" y="-44" width="72" height="54" rx="22" fill="#e8eaed" stroke="#ff7daf" stroke-width="2.5"/>
    <rect x="-25" y="-33" width="50" height="32" rx="13" fill="#17181b"/>
    <circle cx="-11" cy="-19" r="5.5" fill="#ff7daf" filter="url(#glow-s)"/><circle cx="11" cy="-19" r="5.5" fill="#ff7daf" filter="url(#glow-s)"/><circle cx="-11" cy="-19" r="2" fill="#202124"/><circle cx="11" cy="-19" r="2" fill="#202124"/>
    <ellipse cx="0" cy="-7" rx="5.5" ry="4" fill="none" stroke="#ff7daf" stroke-width="2.3"/>
    <path d="M-24 14 H24 C28 14 26 42 0 46 C-26 42 -28 14 -24 14 Z" fill="#cfd4dc" stroke="#ff7daf" stroke-width="2"/>
    <circle cx="0" cy="28" r="6" fill="#ff7daf" opacity="0.88"/>
  </g>
  <rect x="30" y="114" width="186" height="52" rx="10" fill="rgba(255,125,175,0.12)" stroke="#ff7daf" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="44" y="136" class="m" font-size="11.5" fill="#ff7daf">issue_refund($10,000)</text>
  <text x="44" y="155" class="sub" font-size="12">Model complies blindly</text>

  <!-- Panel 2: Secret exfiltration -->
  <rect x="374" y="12" width="340" height="174" rx="18" fill="url(#glass)" stroke="#ffd427" stroke-width="2.2"/>
  <rect x="392" y="28" width="166" height="82" rx="12" fill="#17181b" stroke="#ffd427" stroke-width="1.8"/>
  <text x="404" y="48" class="m" font-size="10.5" fill="#ffd427">format_logs.py</text>
  <text x="404" y="70" class="m" font-size="11" fill="#e8eaed">os.environ.get(</text>
  <text x="404" y="88" class="m" font-size="11" fill="#ff7daf">"STRIPE_API_KEY")</text>
  <!-- Siphon arrow to external cloud -->
  <path d="M558 68 C584 68 584 68 612 68" stroke="#ffd427" stroke-width="3" stroke-dasharray="6 4" filter="url(#glow-s)"/>
  <polygon points="610,60 624,68 610,76" fill="#ffd427"/>
  <!-- Leaked key badge -->
  <rect x="626" y="34" width="72" height="72" rx="14" fill="rgba(255,212,39,0.14)" stroke="#ffd427" stroke-width="2"/>
  <g transform="translate(660,62) scale(0.72)">
    <circle cx="-12" cy="0" r="10" fill="rgba(255,212,39,0.16)" stroke="#ffd427" stroke-width="3" filter="url(#glow-s)"/>
    <circle cx="-12" cy="0" r="3.5" fill="#ffd427"/>
    <path d="M-2 0 H24 M14 0 V8 M21 0 V10" stroke="#ffd427" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="662" y="96" text-anchor="middle" class="m" font-size="10" fill="#ff7daf">LEAKED</text>
  <rect x="392" y="126" width="304" height="40" rx="10" fill="#17181b" stroke="#5f6368" stroke-width="1.4"/>
  <text x="544" y="151" text-anchor="middle" class="m" font-size="12" fill="#ffd427">ENV SECRET → OUTBOUND HTTP</text>

  <!-- Panel 3: Data tampering -->
  <rect x="736" y="12" width="340" height="174" rx="18" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/>
  <!-- DB cylinder -->
  <ellipse cx="806" cy="54" rx="44" ry="14" fill="#2b2d33" stroke="#57caff" stroke-width="2.2"/>
  <path d="M762 54 V126 A44 14 0 0 0 850 126 V54" fill="#1b1d22" stroke="#57caff" stroke-width="2.2"/>
  <path d="M762 90 A44 14 0 0 0 850 90" fill="none" stroke="#57caff" stroke-width="1.4" opacity="0.6"/>
  <text x="806" y="84" text-anchor="middle" class="m" font-size="11" fill="#57caff">LEDGER</text>
  <text x="806" y="114" text-anchor="middle" class="m" font-size="10.5" fill="#bdc1c6">no sig</text>
  <!-- Tampered row -->
  <rect x="868" y="34" width="190" height="84" rx="12" fill="#17181b" stroke="#ff7daf" stroke-width="1.8"/>
  <text x="882" y="56" class="m" font-size="11" fill="#9aa0a6">refund_amount:</text>
  <text x="882" y="80" class="m" font-size="14" fill="#9aa0a6" text-decoration="line-through">$149.00</text>
  <text x="954" y="80" class="m" font-size="14" fill="#ff7daf">→</text>
  <text x="882" y="104" class="t" font-size="18" fill="#ff7daf">$9,999,999</text>
  <!-- Broken seal badge -->
  <rect x="762" y="132" width="296" height="36" rx="10" fill="rgba(87,202,255,0.10)" stroke="#57caff" stroke-width="1.4"/>
  <text x="910" y="155" text-anchor="middle" class="m" font-size="12" fill="#57caff">UNSIGNED WRITE · SILENT CORRUPTION</text>

</svg>
