<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 178" width="1088" height="178">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#353840" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7daf"/>
      <stop offset="33%" stop-color="#5cdb6d"/>
      <stop offset="66%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#57caff"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", system-ui, -apple-system, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", system-ui, -apple-system, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="178" fill="#202124"/>

  <circle cx="170" cy="89" r="120" fill="url(#amb-b)"/>
  <circle cx="520" cy="89" r="100" fill="url(#amb-y)"/>
  <circle cx="900" cy="89" r="120" fill="url(#amb-r)"/>

  <!-- Left: Customer Support ADK Agent -->
  <rect x="14" y="18" width="276" height="142" rx="18" fill="url(#glass)" stroke="#57caff" stroke-width="2.5"/>
  <g transform="translate(76,94) scale(0.78)">
    <line x1="0" y1="-44" x2="0" y2="-56" stroke="#57caff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-60" r="5" fill="#57caff" filter="url(#glow-s)"/>
    <rect x="-36" y="-44" width="72" height="54" rx="22" fill="#e8eaed" stroke="#57caff" stroke-width="2.5"/>
    <rect x="-25" y="-33" width="50" height="32" rx="13" fill="#17181b"/>
    <circle cx="-11" cy="-19" r="5" fill="#57caff" filter="url(#glow-s)"/><circle cx="11" cy="-19" r="5" fill="#57caff" filter="url(#glow-s)"/>
    <path d="M-8 -8 Q0 -2 8 -8" fill="none" stroke="#57caff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-24 14 H24 C28 14 26 42 0 46 C-26 42 -28 14 -24 14 Z" fill="#cfd4dc" stroke="#57caff" stroke-width="2"/>
    <circle cx="0" cy="28" r="6" fill="#57caff" opacity="0.88"/>
  </g>
  <text x="126" y="54" class="m" font-size="11" fill="#57caff">ADK AGENT</text>
  <text x="126" y="78" class="t" font-size="18">Support &amp;</text>
  <text x="126" y="100" class="t" font-size="18">Returns</text>
  <rect x="126" y="114" width="144" height="28" rx="8" fill="#17181b" stroke="#ffd427" stroke-width="1.5"/>
  <text x="198" y="132" text-anchor="middle" class="m" font-size="11.5" fill="#ffd427">Order #99281 · $149</text>

  <!-- Connector branches -->
  <path d="M290 89 H356" stroke="#57caff" stroke-width="3" stroke-dasharray="6 5"/>
  <polygon points="354,82 368,89 354,96" fill="#57caff"/>

  <!-- Tool 1: verify_order -->
  <rect x="372" y="20" width="210" height="138" rx="16" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/>
  <circle cx="406" cy="54" r="16" fill="rgba(87,202,255,0.15)" stroke="#57caff" stroke-width="2"/>
  <circle cx="404" cy="52" r="6" fill="none" stroke="#57caff" stroke-width="2.2"/>
  <line x1="409" y1="57" x2="414" y2="62" stroke="#57caff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="432" y="50" class="m" font-size="11" fill="#57caff">TOOL 1 · READ</text>
  <text x="432" y="68" class="t" font-size="14.5">verify_order</text>
  <rect x="390" y="88" width="174" height="52" rx="10" fill="#17181b" stroke="#3c4043" stroke-width="1.4"/>
  <text x="402" y="109" class="m" font-size="11" fill="#e8eaed">Dock: $29 (hw)</text>
  <text x="402" y="128" class="m" font-size="11" fill="#e8eaed">License: $120 (sw)</text>

  <!-- Arrow 1->2 -->
  <path d="M582 89 H614" stroke="#ffd427" stroke-width="2.6" stroke-dasharray="5 4"/>
  <polygon points="612,82 624,89 612,96" fill="#ffd427"/>

  <!-- Tool 2: calculate_restocking_fee -->
  <rect x="628" y="20" width="206" height="138" rx="16" fill="url(#glass)" stroke="#ffd427" stroke-width="2.2"/>
  <rect x="646" y="38" width="32" height="32" rx="8" fill="rgba(255,212,39,0.16)" stroke="#ffd427" stroke-width="2"/>
  <text x="662" y="59" text-anchor="middle" class="m" font-size="13" fill="#ffd427">f(x)</text>
  <text x="688" y="50" class="m" font-size="11" fill="#ffd427">TOOL 2 · SANDBOX</text>
  <text x="688" y="68" class="t" font-size="13.5">restocking_fee</text>
  <rect x="646" y="88" width="170" height="52" rx="10" fill="#17181b" stroke="#ffd427" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="731" y="110" text-anchor="middle" class="m" font-size="11.5" fill="#ffd427">gVisor isolated</text>
  <text x="731" y="128" text-anchor="middle" class="sub" font-size="11.5">Model-written math</text>

  <!-- Arrow 2->3 -->
  <path d="M834 89 H864" stroke="#ff7daf" stroke-width="2.6" stroke-dasharray="5 4"/>
  <polygon points="862,82 874,89 862,96" fill="#ff7daf"/>

  <!-- Tool 3: issue_refund (ATTACK TARGET) -->
  <rect x="878" y="16" width="196" height="146" rx="16" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.8" filter="url(#glow-s)"/>
  <rect x="932" y="6" width="128" height="22" rx="11" fill="#ff7daf"/>
  <text x="996" y="21" text-anchor="middle" font-family="Roboto Mono,monospace" font-weight="700" font-size="10.5" fill="#202124">ATTACK TARGET</text>
  <g transform="translate(910,56) scale(0.56)">
    <circle cx="-12" cy="0" r="10" fill="rgba(255,212,39,0.16)" stroke="#ff7daf" stroke-width="3" filter="url(#glow-s)"/>
    <circle cx="-12" cy="0" r="3.5" fill="#ff7daf"/>
    <path d="M-2 0 H24 M14 0 V8 M21 0 V10" stroke="#ff7daf" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="938" y="52" class="m" font-size="11" fill="#ff7daf">TOOL 3 · PAYOUT</text>
  <text x="938" y="70" class="t" font-size="15">issue_refund</text>
  <rect x="894" y="88" width="164" height="54" rx="10" fill="#17181b" stroke="#ff7daf" stroke-width="1.5"/>
  <text x="976" y="111" text-anchor="middle" class="m" font-size="11.5" fill="#ff7daf">KMS-signed write</text>
  <text x="976" y="130" text-anchor="middle" class="sub" font-size="11.5">Moves real money</text>

</svg>
