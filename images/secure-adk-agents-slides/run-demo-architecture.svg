<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 154" width="680" height="154">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#353840" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7daf"/>
      <stop offset="33%" stop-color="#5cdb6d"/>
      <stop offset="66%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#57caff"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", system-ui, -apple-system, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", system-ui, -apple-system, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="680" height="154" fill="#202124"/>

  <circle cx="110" cy="77" r="90" fill="url(#amb-b)"/>
  <circle cx="380" cy="77" r="100" fill="url(#amb-g)"/>
  <circle cx="580" cy="77" r="90" fill="url(#amb-r)"/>

  <!-- Local runner box -->
  <rect x="10" y="18" width="166" height="118" rx="15" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/>
  <text x="93" y="42" text-anchor="middle" class="m" font-size="10.5" fill="#57caff">LOCAL MACHINE</text>
  <rect x="24" y="52" width="138" height="30" rx="8" fill="#17181b" stroke="#57caff" stroke-width="1.3"/>
  <text x="93" y="71" text-anchor="middle" class="m" font-size="11" fill="#e8eaed">$ 4-act CLI</text>
  <rect x="24" y="90" width="138" height="30" rx="8" fill="#17181b" stroke="#5cdb6d" stroke-width="1.3"/>
  <text x="93" y="109" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d">:8000 Dashboard</text>

  <!-- Connector -->
  <path d="M176 77 H208" stroke="#57caff" stroke-width="2.8" stroke-dasharray="5 4"/>
  <polygon points="206,70 218,77 206,84" fill="#57caff"/>

  <!-- 4 Act Pipeline container -->
  <rect x="220" y="12" width="450" height="130" rx="16" fill="url(#glass)" stroke="#5f6368" stroke-width="1.8"/>
  <text x="238" y="35" class="m" font-size="10.5" fill="#9aa0a6">FOUR LOCAL STAND-IN MODULES · ZERO CLOUD SETUP</text>

  <!-- 4 module pills -->
  <rect x="236" y="48" width="96" height="78" rx="12" fill="#17181b" stroke="#57caff" stroke-width="2"/>
  <text x="284" y="70" text-anchor="middle" class="m" font-size="10" fill="#57caff">ACT 1</text>
  <text x="284" y="90" text-anchor="middle" class="t" font-size="12.5">Armor</text>
  <text x="284" y="110" text-anchor="middle" class="m" font-size="9.5" fill="#bdc1c6">in / out</text>

  <path d="M332 87 H344" stroke="#bdc1c6" stroke-width="2"/>

  <rect x="344" y="48" width="96" height="78" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="2"/>
  <text x="392" y="70" text-anchor="middle" class="m" font-size="10" fill="#5cdb6d">ACT 2</text>
  <text x="392" y="90" text-anchor="middle" class="t" font-size="12.5">SGP</text>
  <text x="392" y="110" text-anchor="middle" class="m" font-size="9.5" fill="#bdc1c6">judge</text>

  <path d="M440 87 H452" stroke="#bdc1c6" stroke-width="2"/>

  <rect x="452" y="48" width="96" height="78" rx="12" fill="#17181b" stroke="#ffd427" stroke-width="2"/>
  <text x="500" y="70" text-anchor="middle" class="m" font-size="10" fill="#ffd427">ACT 3</text>
  <text x="500" y="90" text-anchor="middle" class="t" font-size="12.5">AAD</text>
  <text x="500" y="110" text-anchor="middle" class="m" font-size="9.5" fill="#bdc1c6">3 signals</text>

  <path d="M548 87 H560" stroke="#bdc1c6" stroke-width="2"/>

  <rect x="560" y="48" width="96" height="78" rx="12" fill="#17181b" stroke="#ff7daf" stroke-width="2"/>
  <text x="608" y="70" text-anchor="middle" class="m" font-size="10" fill="#ff7daf">ACT 4</text>
  <text x="608" y="90" text-anchor="middle" class="t" font-size="12.5">Patch</text>
  <text x="608" y="110" text-anchor="middle" class="m" font-size="9.5" fill="#bdc1c6">loop</text>

</svg>
