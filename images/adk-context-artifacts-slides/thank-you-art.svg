<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="320" height="320" fill="#202124"/>

  <!-- Ambient glows -->
  <circle cx="160" cy="110" r="115" fill="url(#amb-b)"/>
  <circle cx="96" cy="186" r="88" fill="url(#amb-g)"/>
  <circle cx="224" cy="186" r="88" fill="url(#amb-r)"/>
  <circle cx="160" cy="160" r="136" fill="url(#amb-y)"/>

  <!-- Orbital rings -->
  <circle cx="160" cy="160" r="128" fill="none" stroke="#5f6368" stroke-width="2" stroke-dasharray="7 7"/>
  <circle cx="160" cy="160" r="96" fill="none" stroke="#ffd427" stroke-width="1.5" opacity="0.38"/>

  <!-- Halftone satellite dots -->
  <circle cx="160" cy="32" r="9" fill="#ffd427" filter="url(#glow-s)"/>
  <circle cx="288" cy="160" r="8" fill="#ff7daf"/>
  <circle cx="160" cy="288" r="8" fill="#5cdb6d"/>
  <circle cx="32" cy="160" r="8" fill="#57caff"/>

  <!-- Connecting energy lines -->
  <line x1="160" y1="108" x2="104" y2="176" stroke="#5cdb6d" stroke-width="2.2" opacity="0.7"/>
  <line x1="160" y1="108" x2="216" y2="176" stroke="#ff7daf" stroke-width="2.2" opacity="0.7"/>
  <line x1="104" y1="184" x2="216" y2="184" stroke="#ffd427" stroke-width="2" stroke-dasharray="5 4" opacity="0.65"/>

  <!-- TOP NODE: Glowing Compaction Prism -->
  <g transform="translate(160, 96)">
    <polygon points="0,-36 34,-8 22,28 -22,28 -34,-8" fill="url(#glass)" stroke="#57caff" stroke-width="2.6" filter="url(#glow-s)"/>
    <polygon points="0,-26 24,-5 16,20 -16,20 -24,-5" fill="url(#prism)" opacity="0.26"/>
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#ffffff" filter="url(#glow-s)"/>
  </g>

  <!-- BOTTOM-LEFT NODE: Cached Prefix + Lightning -->
  <g transform="translate(100, 182)">
    <rect x="-34" y="-26" width="68" height="52" rx="12" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.4" filter="url(#glow-s)"/>
    <rect x="-24" y="-14" width="48" height="8" rx="3" fill="#5cdb6d" opacity="0.7"/>
    <rect x="-24" y="-1" width="48" height="8" rx="3" fill="#5cdb6d" opacity="0.5"/>
    <rect x="-24" y="12" width="32" height="8" rx="3" fill="#5cdb6d" opacity="0.35"/>
    <polygon points="22,-32 6,-8 16,-8 10,14 30,-12 18,-12" fill="#ffd427" filter="url(#glow-s)"/>
  </g>

  <!-- BOTTOM-RIGHT NODE: Cloud Artifact Vault -->
  <g transform="translate(220, 182)">
    <rect x="-34" y="-26" width="68" height="52" rx="12" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.4" filter="url(#glow-s)"/>
    <rect x="-22" y="-16" width="20" height="24" rx="4" fill="#17181b" stroke="#57caff" stroke-width="1.5"/>
    <rect x="-4" y="-12" width="22" height="26" rx="4" fill="#17181b" stroke="#ff7daf" stroke-width="1.6"/>
    <text x="7" y="4" text-anchor="middle" class="m" font-size="8.5" fill="#ff7daf" font-weight="600">PDF</text>
    <circle cx="22" cy="-16" r="6" fill="#5cdb6d"/>
  </g>

  <!-- Center golden sparkle -->
  <polygon points="160,144 164,154 174,158 164,162 160,172 156,162 146,158 156,154" fill="#ffd427" filter="url(#glow-s)"/>

  <!-- Bottom ribbon -->
  <rect x="46" y="236" width="228" height="32" rx="16" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  <text x="160" y="257" text-anchor="middle" class="m" font-size="12" fill="#ffd427" font-weight="600">COMPACT · CACHE · STORE</text>
</svg>
