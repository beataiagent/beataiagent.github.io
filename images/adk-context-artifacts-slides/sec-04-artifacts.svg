<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="256" height="256" fill="#202124"/>

  <circle cx="128" cy="154" r="96" fill="url(#amb-r)"/>
  <circle cx="128" cy="74" r="80" fill="url(#amb-b)"/>
  <circle cx="128" cy="128" r="102" fill="none" stroke="#ff7daf" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.42"/>

  <!-- Fanned Versioned Artifact Cards (PDF, IMG, WAV) -->
  <g transform="translate(74, 72) rotate(-14)">
    <rect x="-24" y="-30" width="48" height="60" rx="8" fill="url(#glass)" stroke="#ff7daf" stroke-width="2"/>
    <text x="0" y="-4" text-anchor="middle" class="t" font-size="13" fill="#ff7daf">PDF</text>
    <rect x="-15" y="6" width="30" height="14" rx="7" fill="#17181b" stroke="#ff7daf" stroke-width="1.2"/>
    <text x="0" y="16" text-anchor="middle" class="m" font-size="9" fill="#ff7daf">v2</text>
  </g>
  <g transform="translate(182, 72) rotate(14)">
    <rect x="-24" y="-30" width="48" height="60" rx="8" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
    <text x="0" y="-4" text-anchor="middle" class="t" font-size="13" fill="#ffd427">WAV</text>
    <rect x="-15" y="6" width="30" height="14" rx="7" fill="#17181b" stroke="#ffd427" stroke-width="1.2"/>
    <text x="0" y="16" text-anchor="middle" class="m" font-size="9" fill="#ffd427">v0</text>
  </g>
  <g transform="translate(128, 62)">
    <rect x="-26" y="-32" width="52" height="64" rx="9" fill="url(#glass)" stroke="#57caff" stroke-width="2.2" filter="url(#glow-s)"/>
    <text x="0" y="-4" text-anchor="middle" class="t" font-size="13.5" fill="#57caff">PNG</text>
    <rect x="-16" y="7" width="32" height="15" rx="7.5" fill="#17181b" stroke="#57caff" stroke-width="1.2"/>
    <text x="0" y="18" text-anchor="middle" class="m" font-size="9.5" fill="#57caff">v1</text>
  </g>

  <!-- Cloud Storage Vault Base -->
  <path d="M68 192 H188 C206 192 218 179 218 162 C218 147 207 135 193 133 C188 112 170 98 148 98 C131 98 116 107 109 121 C104 119 98 118 92 118 C72 118 56 134 56 154 C56 175 60 192 68 192 Z" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.6" filter="url(#glow-s)"/>

  <!-- Vault lock emblem inside cloud -->
  <rect x="112" y="148" width="32" height="24" rx="6" fill="#17181b" stroke="#5cdb6d" stroke-width="2"/>
  <path d="M119 148 V140 A9 9 0 0 1 137 140 V148" fill="none" stroke="#5cdb6d" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="128" cy="160" r="3" fill="#5cdb6d"/>

  <!-- Bottom label -->
  <text x="128" y="226" text-anchor="middle" class="m" font-size="12" fill="#ff7daf">ARTIFACT VAULT</text>
</svg>
