<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#2ea44f"/>
    </linearGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/>
    </marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="256" height="256" fill="#202124"/>

  <circle cx="128" cy="70" r="85" fill="url(#amb-b)"/>
  <circle cx="128" cy="164" r="95" fill="url(#amb-g)"/>
  <circle cx="128" cy="128" r="102" fill="none" stroke="#5cdb6d" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Top: 4 chat turn blocks -->
  <g>
    <rect x="40" y="34" width="38" height="28" rx="7" fill="url(#glass)" stroke="#57caff" stroke-width="1.8"/>
    <text x="59" y="52" text-anchor="middle" class="m" font-size="11" fill="#57caff">T1</text>

    <rect x="86" y="34" width="38" height="28" rx="7" fill="url(#glass)" stroke="#57caff" stroke-width="1.8"/>
    <text x="105" y="52" text-anchor="middle" class="m" font-size="11" fill="#57caff">T2</text>

    <rect x="132" y="34" width="38" height="28" rx="7" fill="url(#glass)" stroke="#57caff" stroke-width="1.8"/>
    <text x="151" y="52" text-anchor="middle" class="m" font-size="11" fill="#57caff">T3</text>

    <rect x="178" y="34" width="38" height="28" rx="7" fill="url(#glass)" stroke="#ffd427" stroke-width="1.8" stroke-dasharray="4 2"/>
    <text x="197" y="52" text-anchor="middle" class="m" font-size="11" fill="#ffd427">T4</text>
  </g>

  <!-- Converging compression beams -->
  <path d="M59 64 C59 94 114 96 120 114" fill="none" stroke="#57caff" stroke-width="2.2" opacity="0.75"/>
  <path d="M105 64 C105 90 122 96 125 114" fill="none" stroke="#5cdb6d" stroke-width="2.4" opacity="0.9"/>
  <path d="M151 64 C151 90 134 96 131 114" fill="none" stroke="#5cdb6d" stroke-width="2.4" opacity="0.9"/>
  <path d="M197 64 C197 94 142 96 136 114" fill="none" stroke="#ffd427" stroke-width="2.2" opacity="0.75"/>

  <!-- Compression chevrons -->
  <path d="M118 92 L128 102 L138 92" fill="none" stroke="#5cdb6d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-s)"/>

  <!-- Glowing Summary Crystal -->
  <g transform="translate(128, 158)">
    <polygon points="0,-42 42,-12 28,36 -28,36 -42,-12" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.8" filter="url(#glow-s)"/>
    <polygon points="0,-32 30,-8 20,26 -20,26 -30,-8" fill="url(#crystal)" opacity="0.24"/>
    <line x1="0" y1="-42" x2="0" y2="36" stroke="#5cdb6d" stroke-width="1.2" opacity="0.5"/>
    <line x1="-42" y1="-12" x2="42" y2="-12" stroke="#5cdb6d" stroke-width="1.2" opacity="0.5"/>
    <!-- Sparkle inside crystal -->
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="#ffffff" filter="url(#glow-s)"/>
  </g>

  <!-- Bottom label -->
  <text x="128" y="226" text-anchor="middle" class="m" font-size="12" fill="#5cdb6d">COMPACT SUMMARY</text>
</svg>
