<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 250" width="1088" height="250">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#57caff"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#ff7daf"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/>
    </marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="250" fill="#202124"/>

  <circle cx="150" cy="125" r="120" fill="url(#amb-b)"/>
  <circle cx="540" cy="175" r="130" fill="url(#amb-r)"/>
  <circle cx="920" cy="125" r="125" fill="url(#amb-g)"/>

  <!-- LEFT: ADK Agent & ToolContext -->
  <rect x="16" y="22" width="278" height="206" rx="18" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <text x="36" y="52" class="t" font-size="18" fill="#57caff">ADK Agent &amp; Tools</text>
  <text x="36" y="72" class="m" font-size="11.5" fill="#bdc1c6">ToolContext / CallbackContext</text>

  <rect x="34" y="88" width="242" height="58" rx="10" fill="#17181b" stroke="#57caff" stroke-width="1.4"/>
  <text x="46" y="108" class="m" font-size="11" fill="#57caff">session.state (pointer only)</text>
  <text x="46" y="128" class="m" font-size="11" fill="#e8eaed">{"file": "sales.png", "v": 2}</text>

  <rect x="34" y="158" width="242" height="52" rx="10" fill="#17181b" stroke="#ff7daf" stroke-width="1.4"/>
  <text x="46" y="178" class="m" font-size="11" fill="#ff7daf">save_artifact(name, Part)</text>
  <text x="46" y="196" class="m" font-size="10.5" fill="#bdc1c6">Streams raw binary bytes →</text>

  <!-- ARROWS: Left to Center -->
  <path d="M294 82 C328 82 328 64 364 64" fill="none" stroke="#57caff" stroke-width="2.6" marker-end="url(#arr-b)"/>
  <path d="M294 184 H364" fill="none" stroke="#ff7daf" stroke-width="2.6" marker-end="url(#arr-r)"/>

  <!-- CENTER-TOP: SessionService (Lightweight JSON) -->
  <rect x="372" y="18" width="336" height="90" rx="16" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <text x="392" y="45" class="t" font-size="16.5" fill="#57caff">SessionService (State DB)</text>
  <text x="392" y="67" class="sub" font-size="13">Tiny JSON pointers, flags &amp; user prefs</text>
  <rect x="392" y="76" width="296" height="22" rx="6" fill="#17181b" stroke="#3c4043" stroke-width="1.2"/>
  <text x="540" y="91" text-anchor="middle" class="m" font-size="10.5" fill="#57caff">Zero Base64 · Fast DB reads &amp; writes</text>

  <!-- CENTER-BOTTOM: GcsArtifactService (Versioned Binary Vault) -->
  <rect x="372" y="122" width="336" height="110" rx="16" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.2" filter="url(#glow-s)"/>
  <text x="392" y="148" class="t" font-size="16.5" fill="#ff7daf">GcsArtifactService (Cloud Storage)</text>
  <text x="392" y="168" class="m" font-size="11" fill="#bdc1c6">Versioned types.Part binary blobs</text>

  <!-- 3 Versioned Blob Pills -->
  <rect x="392" y="180" width="94" height="38" rx="8" fill="#17181b" stroke="#ff7daf" stroke-width="1.5"/>
  <text x="439" y="197" text-anchor="middle" class="m" font-size="11" fill="#ff7daf" font-weight="600">report.pdf</text>
  <text x="439" y="211" text-anchor="middle" class="m" font-size="9.5" fill="#9aa0a6">v0 · v1</text>

  <rect x="494" y="180" width="94" height="38" rx="8" fill="#17181b" stroke="#57caff" stroke-width="1.5"/>
  <text x="541" y="197" text-anchor="middle" class="m" font-size="11" fill="#57caff" font-weight="600">sales.png</text>
  <text x="541" y="211" text-anchor="middle" class="m" font-size="9.5" fill="#9aa0a6">v0 · v1 · v2</text>

  <rect x="596" y="180" width="94" height="38" rx="8" fill="#17181b" stroke="#ffd427" stroke-width="1.5"/>
  <text x="643" y="197" text-anchor="middle" class="m" font-size="11" fill="#ffd427" font-weight="600">clip.wav</text>
  <text x="643" y="211" text-anchor="middle" class="m" font-size="9.5" fill="#9aa0a6">v0</text>

  <!-- ARROW: GCS to LoadArtifactsTool -->
  <path d="M708 178 H774" fill="none" stroke="#5cdb6d" stroke-width="2.8" stroke-dasharray="6 4" marker-end="url(#arr-g)"/>
  <rect x="712" y="144" width="60" height="22" rx="11" fill="#17181b" stroke="#5cdb6d" stroke-width="1.4"/>
  <text x="742" y="159" text-anchor="middle" class="m" font-size="9.5" fill="#5cdb6d">ON DEMAND</text>

  <!-- RIGHT: LoadArtifactsTool -> Gemini -->
  <rect x="782" y="22" width="290" height="206" rx="18" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2"/>
  <text x="802" y="52" class="t" font-size="18" fill="#5cdb6d">LoadArtifactsTool</text>
  <text x="802" y="72" class="m" font-size="11.5" fill="#bdc1c6">Built-in ADK → Gemini bridge</text>

  <rect x="800" y="88" width="254" height="54" rx="10" fill="#17181b" stroke="#5cdb6d" stroke-width="1.4"/>
  <text x="812" y="108" class="m" font-size="11" fill="#5cdb6d">1. Prompt sees filenames only</text>
  <text x="812" y="128" class="m" font-size="10.5" fill="#bdc1c6">0 bytes bloated until requested</text>

  <rect x="800" y="154" width="254" height="56" rx="10" fill="#17181b" stroke="#ffd427" stroke-width="1.4"/>
  <text x="812" y="174" class="m" font-size="11" fill="#ffd427">2. Gemini calls load_artifacts</text>
  <text x="812" y="194" class="m" font-size="10.5" fill="#e8eaed">Injects native PDF/PNG/WAV Part</text>
</svg>
