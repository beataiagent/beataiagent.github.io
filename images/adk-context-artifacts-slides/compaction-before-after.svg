<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 260" width="1088" height="260">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="sum-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#ffd427"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/>
    </marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="260" fill="#202124"/>

  <circle cx="380" cy="130" r="130" fill="url(#amb-y)"/>
  <circle cx="520" cy="215" r="140" fill="url(#amb-g)"/>

  <!-- TOP LANE: Raw 20-turn bloated history -->
  <rect x="16" y="12" width="1056" height="84" rx="16" fill="url(#glass)" stroke="#5f6368" stroke-width="1.6"/>
  <text x="34" y="34" class="m" font-size="11.5" fill="#ff7daf" font-weight="600">BEFORE · RAW 20-TURN HISTORY SENT TO GEMINI</text>
  <text x="1054" y="34" text-anchor="end" class="m" font-size="12" fill="#ff7daf" font-weight="600">~68K tokens</text>

  <!-- Old turns T1..T17 -->
  <g transform="translate(34, 46)">
    <rect x="0" y="0" width="66" height="38" rx="8" fill="#17181b" stroke="#57caff" stroke-width="1.5"/>
    <text x="33" y="23" text-anchor="middle" class="m" font-size="11.5" fill="#57caff">T1–T4</text>

    <rect x="74" y="0" width="70" height="38" rx="8" fill="#17181b" stroke="#57caff" stroke-width="1.5"/>
    <text x="109" y="23" text-anchor="middle" class="m" font-size="11.5" fill="#57caff">T5–T8</text>

    <rect x="152" y="0" width="76" height="38" rx="8" fill="#17181b" stroke="#ff7daf" stroke-width="1.5"/>
    <text x="190" y="23" text-anchor="middle" class="m" font-size="11.5" fill="#ff7daf">T9–T12</text>

    <rect x="236" y="0" width="84" height="38" rx="8" fill="#17181b" stroke="#ff7daf" stroke-width="1.5"/>
    <text x="278" y="23" text-anchor="middle" class="m" font-size="11.5" fill="#ff7daf">T13–T15</text>

    <rect x="328" y="0" width="72" height="38" rx="8" fill="#17181b" stroke="#57caff" stroke-width="1.5"/>
    <text x="364" y="23" text-anchor="middle" class="m" font-size="11.5" fill="#57caff">Turn 16</text>

    <rect x="408" y="0" width="72" height="38" rx="8" fill="#17181b" stroke="#57caff" stroke-width="1.5"/>
    <text x="444" y="23" text-anchor="middle" class="m" font-size="11.5" fill="#57caff">Turn 17</text>

    <!-- Overlap turn T18 -->
    <rect x="488" y="0" width="122" height="38" rx="8" fill="#17181b" stroke="#ffd427" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text x="549" y="18" text-anchor="middle" class="m" font-size="11.5" fill="#ffd427" font-weight="600">Turn 18</text>
    <text x="549" y="32" text-anchor="middle" class="m" font-size="9.5" fill="#ffd427">overlap boundary</text>

    <!-- Recent turns T19, T20 -->
    <rect x="618" y="0" width="196" height="38" rx="8" fill="#17181b" stroke="#5cdb6d" stroke-width="1.8"/>
    <text x="716" y="18" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d" font-weight="600">Turn 19</text>
    <text x="716" y="32" text-anchor="middle" class="m" font-size="9.5" fill="#bdc1c6">recent verbatim</text>

    <rect x="822" y="0" width="198" height="38" rx="8" fill="#17181b" stroke="#5cdb6d" stroke-width="1.8"/>
    <text x="921" y="18" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d" font-weight="600">Turn 20 (Current)</text>
    <text x="921" y="32" text-anchor="middle" class="m" font-size="9.5" fill="#bdc1c6">active user query</text>
  </g>

  <!-- MIDDLE CONNECTOR: EventsCompactionConfig -->
  <path d="M270 98 V152" stroke="#ffd427" stroke-width="2.5" marker-end="url(#arr-y)"/>
  <path d="M583 98 V152" stroke="#ffd427" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#arr-y)"/>
  <path d="M750 98 V152" stroke="#5cdb6d" stroke-width="2.2" marker-end="url(#arr-g)"/>
  <path d="M955 98 V152" stroke="#5cdb6d" stroke-width="2.2" marker-end="url(#arr-g)"/>

  <rect x="82" y="110" width="464" height="34" rx="17" fill="#17181b" stroke="#ffd427" stroke-width="2" filter="url(#glow-s)"/>
  <text x="314" y="131" text-anchor="middle" class="m" font-size="12" fill="#ffd427" font-weight="600">EventsCompactionConfig · LlmEventSummarizer (overlap=1)</text>

  <!-- BOTTOM LANE: Compacted Summary + Recent Overlap Window -->
  <rect x="16" y="160" width="1056" height="88" rx="16" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
  <text x="34" y="182" class="m" font-size="11.5" fill="#5cdb6d" font-weight="600">AFTER · COMPACT SUMMARY EVENT + VERBATIM RECENT WINDOW</text>
  <text x="1054" y="182" text-anchor="end" class="m" font-size="12" fill="#5cdb6d" font-weight="600">~12K tokens (−82%)</text>

  <g transform="translate(34, 194)">
    <!-- Compacted Summary Event -->
    <rect x="0" y="0" width="480" height="42" rx="10" fill="url(#sum-grad)" stroke="#5cdb6d" stroke-width="2.2" filter="url(#glow-s)"/>
    <text x="240" y="19" text-anchor="middle" class="t" font-size="14.5" fill="#5cdb6d">Compact Summary Event (Turns 1–18)</text>
    <text x="240" y="35" text-anchor="middle" class="m" font-size="11" fill="#e8eaed">Key decisions · order IDs · tool outcomes preserved</text>

    <!-- Overlap Turn 18 -->
    <rect x="488" y="0" width="122" height="42" rx="10" fill="#17181b" stroke="#ffd427" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text x="549" y="19" text-anchor="middle" class="m" font-size="12" fill="#ffd427" font-weight="600">Turn 18</text>
    <text x="549" y="35" text-anchor="middle" class="m" font-size="10" fill="#bdc1c6">kept verbatim</text>

    <!-- Turn 19 -->
    <rect x="618" y="0" width="196" height="42" rx="10" fill="#17181b" stroke="#5cdb6d" stroke-width="1.8"/>
    <text x="716" y="19" text-anchor="middle" class="m" font-size="12" fill="#5cdb6d" font-weight="600">Turn 19</text>
    <text x="716" y="35" text-anchor="middle" class="m" font-size="10" fill="#bdc1c6">kept verbatim</text>

    <!-- Turn 20 -->
    <rect x="822" y="0" width="198" height="42" rx="10" fill="#17181b" stroke="#5cdb6d" stroke-width="1.8"/>
    <text x="921" y="19" text-anchor="middle" class="m" font-size="12" fill="#5cdb6d" font-weight="600">Turn 20 (Current)</text>
    <text x="921" y="35" text-anchor="middle" class="m" font-size="10" fill="#bdc1c6">high-signal context</text>
  </g>
</svg>
