<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="256" height="256" fill="#202124"/>

  <circle cx="110" cy="140" r="92" fill="url(#amb-g)"/>
  <circle cx="164" cy="86" r="84" fill="url(#amb-y)"/>
  <circle cx="128" cy="128" r="102" fill="none" stroke="#ffd427" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.42"/>

  <!-- Cached Green Prompt Prefix Block -->
  <rect x="44" y="72" width="154" height="120" rx="18" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.6" filter="url(#glow-s)"/>
  <text x="60" y="96" class="m" font-size="10.5" fill="#5cdb6d" font-weight="600">STATIC PREFIX</text>

  <!-- Prefix layers inside -->
  <rect x="58" y="106" width="126" height="20" rx="6" fill="#17181b" stroke="#5cdb6d" stroke-width="1.4"/>
  <text x="121" y="120" text-anchor="middle" class="m" font-size="10" fill="#e8eaed">System Instruction</text>

  <rect x="58" y="132" width="126" height="20" rx="6" fill="#17181b" stroke="#5cdb6d" stroke-width="1.4"/>
  <text x="121" y="146" text-anchor="middle" class="m" font-size="10" fill="#e8eaed">Tool Schemas</text>

  <rect x="58" y="158" width="126" height="20" rx="6" fill="#17181b" stroke="#5cdb6d" stroke-width="1.4"/>
  <text x="121" y="172" text-anchor="middle" class="m" font-size="10" fill="#e8eaed">Static Docs</text>

  <!-- Glowing Lightning Bolt striking prefix -->
  <g transform="translate(186, 84)">
    <polygon points="10,-44 -18,4 0,4 -10,44 24,-8 4,-8" fill="#ffd427" stroke="#202124" stroke-width="2" stroke-linejoin="round" filter="url(#glow-s)"/>
  </g>

  <!-- Impact sparks -->
  <circle cx="152" cy="54" r="3.5" fill="#ffd427" filter="url(#glow-s)"/>
  <circle cx="218" cy="112" r="3" fill="#5cdb6d" filter="url(#glow-s)"/>
  <circle cx="144" cy="68" r="2.5" fill="#ffffff"/>

  <!-- Hit badge -->
  <rect x="44" y="42" width="90" height="22" rx="11" fill="#17181b" stroke="#ffd427" stroke-width="1.6"/>
  <text x="89" y="57" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">HIT · -90%</text>

  <!-- Bottom label -->
  <text x="128" y="226" text-anchor="middle" class="m" font-size="12" fill="#ffd427">CACHED PREFIX</text>
</svg>
