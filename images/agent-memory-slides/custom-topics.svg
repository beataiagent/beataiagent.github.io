<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 200" width="1088" height="200">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #fff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
<rect width="1088" height="200" fill="#202124"/>
  <circle cx="520" cy="100" r="110" fill="url(#amb-b)"/>
  <circle cx="880" cy="60" r="100" fill="url(#amb-g)"/>
  <circle cx="880" cy="145" r="100" fill="url(#amb-y)"/>
  <!-- Left chat bubbles -->
  <rect x="16" y="16" width="320" height="44" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <text x="36" y="44" class="t" font-size="16">"I'm vegetarian."</text>
  <rect x="16" y="76" width="320" height="44" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <text x="36" y="104" class="t" font-size="16">"I like walking tours."</text>
  <rect x="16" y="136" width="320" height="44" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <text x="36" y="164" class="t" font-size="16">"Our hotel is in Shinjuku."</text>
  <!-- Curved paths into funnel -->
  <path d="M338 38 C400 38 400 92 456 96" fill="none" stroke="#57caff" stroke-width="2.5"/>
  <path d="M338 98 H456" fill="none" stroke="#57caff" stroke-width="2.5"/>
  <path d="M338 158 C400 158 400 108 456 104" fill="none" stroke="#57caff" stroke-width="2.5"/>
  <!-- Topic router prism -->
  <polygon points="456,56 584,78 584,122 456,144" fill="url(#glass)" stroke="url(#grad-by)" stroke-width="2.5" filter="url(#glow-s)"/>
  <text x="518" y="96" text-anchor="middle" class="m" font-size="12" fill="#fff" font-weight="700">EXTRACT</text>
  <text x="518" y="114" text-anchor="middle" class="m" font-size="11.5" fill="#ffd427">BY TOPIC</text>
  <!-- Split outputs -->
  <path d="M584 90 C630 90 634 56 680 56" fill="none" stroke="#5cdb6d" stroke-width="3"/>
  <polygon points="676,49 690,56 676,63" fill="#5cdb6d"/>
  <path d="M584 110 C630 110 634 146 680 146" fill="none" stroke="#ffd427" stroke-width="3"/>
  <polygon points="676,139 690,146 676,153" fill="#ffd427"/>
  <!-- Topic bucket 1 -->
  <rect x="694" y="14" width="378" height="82" rx="16" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.5"/>
  <text x="714" y="40" class="m" font-size="13.5" fill="#5cdb6d" font-weight="700">travel_preferences</text>
  <text x="714" y="64" class="sub" font-size="15" fill="#fff">• User is vegetarian  ·  • Prefers walking tours</text>
  <!-- Topic bucket 2 -->
  <rect x="694" y="108" width="378" height="76" rx="16" fill="url(#glass)" stroke="#ffd427" stroke-width="2.5"/>
  <text x="714" y="134" class="m" font-size="13.5" fill="#ffd427" font-weight="700">trip_context</text>
  <text x="714" y="160" class="sub" font-size="15" fill="#fff">• Staying in Shinjuku</text>
</svg>