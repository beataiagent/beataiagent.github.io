<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 250" width="1088" height="250">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #fff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
<rect width="1088" height="250" fill="#202124"/>
  <circle cx="170" cy="125" r="130" fill="url(#amb-b)"/>
  <circle cx="544" cy="125" r="150" fill="url(#amb-y)"/>
  <circle cx="918" cy="125" r="130" fill="url(#amb-g)"/>
  <!-- Curved glowing pipes -->
  <path d="M270 125 C325 125 335 125 384 125" stroke="#57caff" stroke-width="4" stroke-dasharray="8 6" filter="url(#glow-s)"/>
  <polygon points="384,116 400,125 384,134" fill="#57caff"/>
  <path d="M688 125 C740 125 752 125 802 125" stroke="#5cdb6d" stroke-width="4" stroke-dasharray="8 6" filter="url(#glow-s)"/>
  <polygon points="802,116 818,125 802,134" fill="#5cdb6d"/>
  <!-- Left card: Agent A -->
  <rect x="20" y="24" width="248" height="202" rx="20" fill="url(#glass)" stroke="#57caff" stroke-width="2.5"/>
  
    <g transform="translate(84,114) scale(0.85)">
      <line x1="0" y1="-44" x2="0" y2="-56" stroke="#57caff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="-60" r="5" fill="#57caff" filter="url(#glow-s)"/>
      <rect x="-36" y="-44" width="72" height="54" rx="22" fill="#e8eaed" stroke="#57caff" stroke-width="2.5"/>
      <rect x="-25" y="-33" width="50" height="32" rx="13" fill="#1b1d22"/>
      <circle cx="-11" cy="-18" r="5.5" fill="#57caff" filter="url(#glow-s)"/>
      <circle cx="11" cy="-18" r="5.5" fill="#57caff" filter="url(#glow-s)"/>
      <path d="M-7 -8 Q0 -3 7 -8" fill="none" stroke="#57caff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-24 14 H24 C28 14 26 42 0 46 C-26 42 -28 14 -24 14 Z" fill="#cfd4dc" stroke="#57caff" stroke-width="2"/>
      <circle cx="0" cy="28" r="6" fill="#57caff" opacity="0.85"/>
    </g>
  <text x="142" y="76" class="m" font-size="12" fill="#57caff">AGENT A</text>
  <text x="142" y="102" class="t" font-size="20">Hotel Finder</text>
  <rect x="140" y="122" width="110" height="28" rx="8" fill="#17181b" stroke="#57caff" stroke-width="1.5"/>
  <text x="195" y="141" text-anchor="middle" class="m" font-size="12.5" fill="#57caff">output_key</text>
  <text x="142" y="178" class="sub" font-size="13">Writes pick →</text>
  <!-- Center clipboard: Session State -->
  <rect x="404" y="18" width="280" height="214" rx="22" fill="url(#glass)" stroke="#ffd427" stroke-width="3" filter="url(#glow-s)"/>
  <rect x="494" y="6" width="100" height="24" rx="10" fill="#ffd427"/>
  <text x="544" y="23" text-anchor="middle" font-family="Roboto Mono,monospace" font-weight="700" font-size="12" fill="#202124">SESSION STATE</text>
  <!-- Hotel badge inside state -->
  <rect x="426" y="56" width="236" height="92" rx="14" fill="#17181b" stroke="#ffd427" stroke-width="1.5"/>
  <rect x="444" y="74" width="38" height="52" rx="6" fill="rgba(255,212,39,0.16)" stroke="#ffd427" stroke-width="2"/>
  <rect x="454" y="84" width="6" height="6" fill="#ffd427"/><rect x="466" y="84" width="6" height="6" fill="#ffd427"/>
  <rect x="454" y="96" width="6" height="6" fill="#ffd427"/><rect x="466" y="96" width="6" height="6" fill="#ffd427"/>
  <rect x="458" y="110" width="10" height="16" fill="#ffd427"/>
  <text x="498" y="94" class="m" font-size="12.5" fill="#ffd427">hotel_choice</text>
  <text x="498" y="118" class="t" font-size="16">"Riverside Grand"</text>
  <text x="544" y="186" text-anchor="middle" class="sub" font-size="14">Shared scratchpad for this chat</text>
  <!-- Right card: Agent B -->
  <rect x="820" y="24" width="248" height="202" rx="20" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.5"/>
  
    <g transform="translate(884,114) scale(0.85)">
      <line x1="0" y1="-44" x2="0" y2="-56" stroke="#5cdb6d" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="-60" r="5" fill="#5cdb6d" filter="url(#glow-s)"/>
      <rect x="-36" y="-44" width="72" height="54" rx="22" fill="#e8eaed" stroke="#5cdb6d" stroke-width="2.5"/>
      <rect x="-25" y="-33" width="50" height="32" rx="13" fill="#1b1d22"/>
      <circle cx="-11" cy="-18" r="5.5" fill="#5cdb6d" filter="url(#glow-s)"/>
      <circle cx="11" cy="-18" r="5.5" fill="#5cdb6d" filter="url(#glow-s)"/>
      <path d="M-7 -8 Q0 -3 7 -8" fill="none" stroke="#5cdb6d" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-24 14 H24 C28 14 26 42 0 46 C-26 42 -28 14 -24 14 Z" fill="#cfd4dc" stroke="#5cdb6d" stroke-width="2"/>
      <circle cx="0" cy="28" r="6" fill="#5cdb6d" opacity="0.85"/>
    </g>
  <text x="942" y="76" class="m" font-size="12" fill="#5cdb6d">AGENT B</text>
  <text x="942" y="102" class="t" font-size="20">Booking</text>
  <rect x="940" y="122" width="114" height="28" rx="8" fill="#17181b" stroke="#5cdb6d" stroke-width="1.5"/>
  <text x="997" y="141" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d">{hotel_choice}</text>
  <text x="942" y="178" class="sub" font-size="13">Reads auto ✓</text>
  <!-- Labels above arrows -->
  <text x="334" y="106" text-anchor="middle" class="m" font-size="12.5" fill="#57caff">writes</text>
  <text x="754" y="106" text-anchor="middle" class="m" font-size="12.5" fill="#5cdb6d">reads</text>
</svg>