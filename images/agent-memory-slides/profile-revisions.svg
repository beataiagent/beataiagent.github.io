<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 175" width="430" height="175">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #fff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
<rect width="430" height="175" fill="#202124"/>
  <circle cx="215" cy="90" r="120" fill="url(#amb-y)"/>
  <!-- Back card v1 -->
  <rect x="54" y="12" width="322" height="118" rx="16" fill="#1d1e22" stroke="#5f6368" stroke-width="1.5" opacity="0.55"/>
  <text x="74" y="34" class="m" font-size="11" fill="#9aa0a6">rev 1 · Mon · dietary: "vegetarian"</text>
  <!-- Mid card v2 -->
  <rect x="34" y="34" width="342" height="118" rx="16" fill="#232429" stroke="#57caff" stroke-width="1.8" opacity="0.8"/>
  <text x="54" y="56" class="m" font-size="11.5" fill="#57caff">rev 2 · Wed · + home_city: "Bangkok"</text>
  <!-- Front current profile card -->
  <rect x="14" y="58" width="362" height="104" rx="16" fill="url(#glass)" stroke="#ffd427" stroke-width="2.5" filter="url(#glow-s)"/>
  <text x="34" y="84" class="m" font-size="12" fill="#ffd427" font-weight="700">CURRENT PROFILE · user_id: "123"</text>
  <rect x="34" y="98" width="102" height="46" rx="10" fill="#17181b" stroke="#57caff" stroke-width="1.5"/>
  <text x="85" y="116" text-anchor="middle" class="m" font-size="10" fill="#57caff">HOME_CITY</text>
  <text x="85" y="135" text-anchor="middle" class="t" font-size="13">Bangkok</text>
  <rect x="146" y="98" width="104" height="46" rx="10" fill="#17181b" stroke="#5cdb6d" stroke-width="1.5"/>
  <text x="198" y="116" text-anchor="middle" class="m" font-size="10" fill="#5cdb6d">DIETARY</text>
  <text x="198" y="135" text-anchor="middle" class="t" font-size="13">Vegetarian</text>
  <rect x="260" y="98" width="100" height="46" rx="10" fill="#17181b" stroke="#ffd427" stroke-width="1.5"/>
  <text x="310" y="116" text-anchor="middle" class="m" font-size="10" fill="#ffd427">REVISIONS</text>
  <text x="310" y="135" text-anchor="middle" class="t" font-size="13">Tracked ✓</text>
</svg>