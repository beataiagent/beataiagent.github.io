<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="540" height="380">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #fff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
<rect width="540" height="380" fill="#202124"/>
  <circle cx="270" cy="176" r="165" fill="url(#amb-y)"/>
  <circle cx="270" cy="176" r="120" fill="url(#amb-g)"/>
  <!-- Outer ring: app: -->
  <ellipse cx="270" cy="172" rx="228" ry="142" fill="rgba(255,212,39,0.06)" stroke="#ffd427" stroke-width="2.5" stroke-dasharray="10 5"/>
  <rect x="210" y="16" width="120" height="26" rx="13" fill="#202124" stroke="#ffd427" stroke-width="2"/>
  <text x="270" y="34" text-anchor="middle" class="m" font-size="13" fill="#ffd427" font-weight="700">app: global</text>
  <!-- Ring 3: user: -->
  <ellipse cx="270" cy="182" rx="172" ry="108" fill="rgba(92,219,109,0.08)" stroke="#5cdb6d" stroke-width="2.5"/>
  <rect x="205" y="62" width="130" height="26" rx="13" fill="#202124" stroke="#5cdb6d" stroke-width="2"/>
  <text x="270" y="80" text-anchor="middle" class="m" font-size="13" fill="#5cdb6d" font-weight="700">user: all chats</text>
  <!-- Ring 2: session -->
  <ellipse cx="270" cy="194" rx="118" ry="72" fill="rgba(87,202,255,0.10)" stroke="#57caff" stroke-width="2.5"/>
  <rect x="206" y="110" width="128" height="24" rx="12" fill="#202124" stroke="#57caff" stroke-width="2"/>
  <text x="270" y="127" text-anchor="middle" class="m" font-size="12.5" fill="#57caff" font-weight="700">session (1 chat)</text>
  <!-- Core: temp: -->
  <ellipse cx="270" cy="206" rx="64" ry="38" fill="rgba(255,125,175,0.18)" stroke="#ff7daf" stroke-width="2.5" filter="url(#glow-s)"/>
  <text x="270" y="203" text-anchor="middle" class="m" font-size="14" fill="#ff7daf" font-weight="700">temp:</text>
  <text x="270" y="222" text-anchor="middle" class="sub" font-size="12" fill="#fff">1 turn only</text>
  <!-- Persistent DB pedestal below -->
  <g transform="translate(150, 318)">
    <path d="M0 16 C0 6 240 6 240 16 V42 C240 52 0 52 0 42 Z" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
    <ellipse cx="120" cy="16" rx="120" ry="10" fill="#2a2b2f" stroke="#5cdb6d" stroke-width="2"/>
    <text x="120" y="39" text-anchor="middle" class="m" font-size="12" fill="#5cdb6d">PERSISTENT SESSION STORE</text>
  </g>
</svg>