<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 136" width="1088" height="136">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #fff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
<rect width="1088" height="136" fill="#202124"/>
  <circle cx="544" cy="68" r="130" fill="url(#amb-b)"/>
  <!-- Step 1: Pydantic Schema -->
  <rect x="14" y="16" width="310" height="104" rx="16" fill="url(#glass)" stroke="#57caff" stroke-width="2.5"/>
  <text x="34" y="44" class="m" font-size="12" fill="#57caff" font-weight="700">1 · PYDANTIC SCHEMA</text>
  <rect x="34" y="58" width="84" height="44" rx="10" fill="#17181b" stroke="#57caff" stroke-width="1.5"/>
  <text x="76" y="85" text-anchor="middle" class="m" font-size="11.5" fill="#fff">home_city</text>
  <rect x="128" y="58" width="82" height="44" rx="10" fill="#17181b" stroke="#5cdb6d" stroke-width="1.5"/>
  <text x="169" y="85" text-anchor="middle" class="m" font-size="11.5" fill="#fff">dietary</text>
  <rect x="220" y="58" width="86" height="44" rx="10" fill="#17181b" stroke="#ffd427" stroke-width="1.5"/>
  <text x="263" y="85" text-anchor="middle" class="m" font-size="11.5" fill="#fff">interests</text>
  <!-- Arrow 1 -->
  <path d="M332 68 H382" stroke="#57caff" stroke-width="3"/>
  <polygon points="378,61 392,68 378,75" fill="#57caff"/>
  <!-- Step 2: JSON Schema Register -->
  <rect x="398" y="16" width="290" height="104" rx="16" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.5"/>
  <text x="418" y="44" class="m" font-size="12" fill="#5cdb6d" font-weight="700">2 · MEMORY BANK CONFIG</text>
  <text x="418" y="74" class="t" font-size="17">Register JSON Schema</text>
  <text x="418" y="98" class="m" font-size="12.5" fill="#bdc1c6">id: "user-profile"</text>
  <!-- Arrow 2 -->
  <path d="M696 68 H746" stroke="#ffd427" stroke-width="3"/>
  <polygon points="742,61 756,68 742,75" fill="#ffd427"/>
  <!-- Step 3: Live User Profile -->
  <rect x="762" y="16" width="312" height="104" rx="16" fill="url(#glass)" stroke="#ffd427" stroke-width="2.5"/>
  <text x="782" y="44" class="m" font-size="12" fill="#ffd427" font-weight="700">3 · STRUCTURED PROFILE</text>
  <text x="782" y="74" class="m" font-size="13.5" fill="#fff">Bangkok · vegetarian</text>
  <text x="782" y="98" class="m" font-size="13.5" fill="#5cdb6d">temples, walking tours</text>
</svg>