<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="256" height="256" fill="#202124"/>

  <circle cx="128" cy="122" r="102" fill="url(#amb-b)"/>
  <circle cx="190" cy="86" r="64" fill="url(#amb-g)"/>
  <circle cx="128" cy="186" r="64" fill="url(#amb-y)"/>
  <circle cx="128" cy="122" r="92" fill="none" stroke="#57caff" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.45"/>

  <!-- Connecting spokes from center toolkit to 3 badges -->
  <path d="M128 118 L72 68" stroke="#57caff" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M128 118 L184 68" stroke="#5cdb6d" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M128 134 L128 176" stroke="#ffd427" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Center glowing Agent Toolkit card -->
  <rect x="86" y="92" width="84" height="58" rx="16" fill="url(#glass-hi)" stroke="#57caff" stroke-width="2.6" filter="url(#glow-s)"/>
  <path d="M110 92 V84 C110 79 114 76 119 76 H137 C142 76 146 79 146 84 V92" fill="none" stroke="#57caff" stroke-width="2.4"/>
  <rect x="102" y="106" width="52" height="30" rx="9" fill="#17181b" stroke="#57caff" stroke-width="1.4" opacity="0.9"/>
  <circle cx="118" cy="121" r="4.2" fill="#57caff" filter="url(#glow-s)"/>
  <circle cx="138" cy="121" r="4.2" fill="#57caff" filter="url(#glow-s)"/>
  <path d="M122 129 Q128 133 134 129" fill="none" stroke="#57caff" stroke-width="2" stroke-linecap="round"/>

  <!-- Badge 1: Function Tool (top-left) -->
  <g transform="translate(68, 56)">
    <rect x="-42" y="-17" width="84" height="34" rx="17" fill="url(#glass)" stroke="#57caff" stroke-width="2" filter="url(#glow-s)"/>
    <text x="0" y="5" text-anchor="middle" class="m" font-size="13" fill="#57caff" font-weight="600">def()</text>
  </g>

  <!-- Badge 2: Built-in Search (top-right) -->
  <g transform="translate(188, 56)">
    <rect x="-44" y="-17" width="88" height="34" rx="17" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2" filter="url(#glow-s)"/>
    <circle cx="-21" cy="-1" r="5.5" fill="none" stroke="#5cdb6d" stroke-width="2"/>
    <line x1="-17" y1="3" x2="-13" y2="7" stroke="#5cdb6d" stroke-width="2" stroke-linecap="round"/>
    <text x="11" y="4.5" text-anchor="middle" class="m" font-size="12" fill="#5cdb6d" font-weight="600">Search</text>
  </g>

  <!-- Badge 3: OpenAPI (bottom) -->
  <g transform="translate(128, 184)">
    <rect x="-54" y="-17" width="108" height="34" rx="17" fill="url(#glass)" stroke="#ffd427" stroke-width="2" filter="url(#glow-s)"/>
    <text x="0" y="4.5" text-anchor="middle" class="m" font-size="12.5" fill="#ffd427" font-weight="600">{ OpenAPI }</text>
  </g>

  <text x="128" y="232" text-anchor="middle" class="m" font-size="12" fill="#57caff" font-weight="600">ADK TOOL SPECTRUM</text>
</svg>
