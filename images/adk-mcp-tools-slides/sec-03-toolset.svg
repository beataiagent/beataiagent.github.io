<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="256" height="256" fill="#202124"/>

  <circle cx="128" cy="116" r="98" fill="url(#amb-y)"/>
  <circle cx="128" cy="186" r="65" fill="url(#amb-g)"/>
  <circle cx="128" cy="126" r="95" fill="none" stroke="#ffd427" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.45"/>

  <!-- Raw incoming tools above funnel -->
  <g>
    <rect x="40" y="38" width="44" height="22" rx="11" fill="url(#glass)" stroke="#ff7daf" stroke-width="1.6"/>
    <text x="62" y="53" text-anchor="middle" class="m" font-size="10" fill="#ff7daf">drop</text>

    <rect x="90" y="30" width="44" height="22" rx="11" fill="url(#glass)" stroke="#5cdb6d" stroke-width="1.6"/>
    <text x="112" y="45" text-anchor="middle" class="m" font-size="10" fill="#5cdb6d">read</text>

    <rect x="140" y="34" width="44" height="22" rx="11" fill="url(#glass)" stroke="#5cdb6d" stroke-width="1.6"/>
    <text x="162" y="49" text-anchor="middle" class="m" font-size="10" fill="#5cdb6d">list</text>

    <rect x="188" y="44" width="38" height="22" rx="11" fill="url(#glass)" stroke="#ff7daf" stroke-width="1.6"/>
    <text x="207" y="59" text-anchor="middle" class="m" font-size="10" fill="#ff7daf">del</text>
  </g>

  <!-- Glowing Funnel -->
  <path d="M54 78 H202 L150 134 V156 L106 164 V134 Z" fill="url(#glass-hi)" stroke="#ffd427" stroke-width="2.6" stroke-linejoin="round" filter="url(#glow-s)"/>
  <text x="128" y="106" text-anchor="middle" class="m" font-size="12.5" fill="#ffd427" font-weight="700">MCPToolset</text>
  <text x="128" y="123" text-anchor="middle" class="m" font-size="10" fill="#e8eaed">tool_filter</text>

  <!-- Filtered output stream -->
  <line x1="128" y1="160" x2="128" y2="178" stroke="#5cdb6d" stroke-width="3" stroke-linecap="round"/>

  <!-- Target ADK card -->
  <rect x="72" y="176" width="112" height="32" rx="12" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2" filter="url(#glow-s)"/>
  <circle cx="90" cy="192" r="5" fill="#5cdb6d"/>
  <text x="134" y="196.5" text-anchor="middle" class="m" font-size="11.5" fill="#ffffff" font-weight="600">ADK Agent</text>

  <text x="128" y="232" text-anchor="middle" class="m" font-size="12" fill="#ffd427" font-weight="600">SCOPED TOOLSET</text>
</svg>
