<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 104" width="1088" height="104">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-bgy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-full" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="35%" stop-color="#5cdb6d"/>
      <stop offset="70%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5f6368" opacity="0.28"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #e8eaed; font-weight: 500; }
      .ms { font-family: "Roboto Mono", ui-monospace, monospace; fill: #9aa0a6; font-weight: 400; }
    </style>
  </defs>
  <rect width="1088" height="104" fill="#202124"/>
  <rect width="1088" height="104" fill="url(#dots)"/>

  <circle cx="200" cy="52" r="95" fill="url(#amb-b)"/>
  <circle cx="540" cy="52" r="95" fill="url(#amb-g)"/>
  <circle cx="900" cy="52" r="105" fill="url(#amb-r)"/>
  <!-- Snap-on Block 1: Text Core -->
  <rect x="20" y="16" width="224" height="72" rx="14" fill="url(#glass-hi)" stroke="#57caff" stroke-width="2.2"/>
  <text x="40" y="42" class="m" font-size="11" fill="#57caff">ALWAYS LOADED</text>
  <text x="40" y="68" class="t" font-size="18">Text Base · 270M</text>
  <!-- Plus connector -->
  <circle cx="272" cy="52" r="14" fill="#202124" stroke="#5cdb6d" stroke-width="2"/><text x="272" y="57" text-anchor="middle" class="t" font-size="16" fill="#5cdb6d">+</text>
  <!-- Snap-on Block 2: Optional Vision -->
  <rect x="300" y="16" width="206" height="72" rx="14" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="320" y="42" class="m" font-size="11" fill="#5cdb6d">OPTIONAL SNAP-ON</text>
  <text x="320" y="68" class="t" font-size="17">Vision · +170M</text>
  <!-- Plus connector -->
  <circle cx="534" cy="52" r="14" fill="#202124" stroke="#ff7daf" stroke-width="2"/><text x="534" y="57" text-anchor="middle" class="t" font-size="16" fill="#ff7daf">+</text>
  <!-- Snap-on Block 3: Optional Audio -->
  <rect x="562" y="16" width="206" height="72" rx="14" fill="url(#glass)" stroke="#ff7daf" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="582" y="42" class="m" font-size="11" fill="#ff7daf">OPTIONAL SNAP-ON</text>
  <text x="582" y="68" class="t" font-size="17">Audio · +300M</text>
  <!-- Arrow into Shared Space -->
  <path d="M776 52 H820" stroke="url(#grad-bg)" stroke-width="3.2"/>
  <polygon points="815,45 827,52 815,59" fill="#5cdb6d"/>
  <!-- Shared Space Socket -->
  <rect x="832" y="16" width="236" height="72" rx="14" fill="#1e2e24" stroke="#5cdb6d" stroke-width="2.4" filter="url(#glow-s)"/>
  <text x="950" y="44" text-anchor="middle" class="t" font-size="16" fill="#5cdb6d">Same 768-d Space</text>
  <text x="950" y="68" text-anchor="middle" class="ms" font-size="11.5">zero re-embedding later</text>

</svg>
