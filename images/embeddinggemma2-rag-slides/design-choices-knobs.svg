<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 136" width="1088" height="136">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-bgy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-full" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="35%" stop-color="#5cdb6d"/>
      <stop offset="70%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5f6368" opacity="0.28"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #e8eaed; font-weight: 500; }
      .ms { font-family: "Roboto Mono", ui-monospace, monospace; fill: #9aa0a6; font-weight: 400; }
    </style>
  </defs>
  <rect width="1088" height="136" fill="#202124"/>
  <rect width="1088" height="136" fill="url(#dots)"/>

  <circle cx="108" cy="68" r="85" fill="url(#amb-b)"/>
  <circle cx="326" cy="68" r="85" fill="url(#amb-g)"/>
  <circle cx="544" cy="68" r="85" fill="url(#amb-y)"/>
  <circle cx="762" cy="68" r="85" fill="url(#amb-r)"/>
  <circle cx="980" cy="68" r="85" fill="url(#amb-b)"/>
  <!-- Console rail connecting all 5 dials -->
  <line x1="108" y1="62" x2="980" y2="62" stroke="#3c4043" stroke-width="3" stroke-dasharray="6 5"/>
  <!-- Dial 1: Chunking (Blue) -->
  <g transform="translate(108,62)">
    <circle r="38" fill="url(#glass-hi)" stroke="#57caff" stroke-width="2.6" filter="url(#glow-s)"/>
    <path d="M-26 22 A34 34 0 1 1 26 22" fill="none" stroke="#57caff" stroke-width="3" stroke-dasharray="105 40"/>
    <line x1="0" y1="0" x2="16" y2="-18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle r="5" fill="#57caff"/>
    <text y="56" text-anchor="middle" class="m" font-size="11.5" fill="#57caff">30–60s clips</text>
  </g>
  <!-- Dial 2: Dimensions (Green) -->
  <g transform="translate(326,62)">
    <circle r="38" fill="url(#glass-hi)" stroke="#5cdb6d" stroke-width="2.6" filter="url(#glow-s)"/>
    <path d="M-26 22 A34 34 0 1 1 26 22" fill="none" stroke="#5cdb6d" stroke-width="3" stroke-dasharray="120 30"/>
    <line x1="0" y1="0" x2="22" y2="-10" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle r="5" fill="#5cdb6d"/>
    <text y="56" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d">512 / 768 d</text>
  </g>
  <!-- Dial 3: Visual Tokens (Yellow) -->
  <g transform="translate(544,62)">
    <circle r="38" fill="url(#glass-hi)" stroke="#ffd427" stroke-width="2.6" filter="url(#glow-s)"/>
    <path d="M-26 22 A34 34 0 1 1 26 22" fill="none" stroke="#ffd427" stroke-width="3" stroke-dasharray="95 45"/>
    <line x1="0" y1="0" x2="0" y2="-24" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle r="5" fill="#ffd427"/>
    <text y="56" text-anchor="middle" class="m" font-size="11.5" fill="#ffd427">70 → 1120 tok</text>
  </g>
  <!-- Dial 4: Vector Store (Red) -->
  <g transform="translate(762,62)">
    <circle r="38" fill="url(#glass-hi)" stroke="#ff7daf" stroke-width="2.6" filter="url(#glow-s)"/>
    <path d="M-26 22 A34 34 0 1 1 26 22" fill="none" stroke="#ff7daf" stroke-width="3" stroke-dasharray="110 35"/>
    <line x1="0" y1="0" x2="-14" y2="-20" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle r="5" fill="#ff7daf"/>
    <text y="56" text-anchor="middle" class="m" font-size="11.5" fill="#ff7daf">FAISS · Vertex</text>
  </g>
  <!-- Dial 5: Evaluate (White/Blue) -->
  <g transform="translate(980,62)">
    <circle r="38" fill="url(#glass-hi)" stroke="#e8eaed" stroke-width="2.6" filter="url(#glow-s)"/>
    <path d="M-26 22 A34 34 0 1 1 26 22" fill="none" stroke="#5cdb6d" stroke-width="3" stroke-dasharray="135 15"/>
    <line x1="0" y1="0" x2="20" y2="10" stroke="#5cdb6d" stroke-width="3" stroke-linecap="round"/>
    <circle r="5" fill="#fff"/>
    <text y="56" text-anchor="middle" class="m" font-size="11.5" fill="#fff">recall@k test</text>
  </g>

</svg>
