<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 106" width="1088" height="106">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-bgy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-full" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="35%" stop-color="#5cdb6d"/>
      <stop offset="70%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5f6368" opacity="0.28"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #e8eaed; font-weight: 500; }
      .ms { font-family: "Roboto Mono", ui-monospace, monospace; fill: #9aa0a6; font-weight: 400; }
    </style>
  </defs>
  <rect width="1088" height="106" fill="#202124"/>
  <rect width="1088" height="106" fill="url(#dots)"/>

  <circle cx="160" cy="53" r="95" fill="url(#amb-b)"/>
  <circle cx="550" cy="53" r="105" fill="url(#amb-g)"/>
  <circle cx="940" cy="53" r="95" fill="url(#amb-y)"/>
  <!-- Package Box -->
  <rect x="20" y="16" width="230" height="74" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <text x="38" y="42" class="m" font-size="11" fill="#57caff">1 · PIP EXTRAS</text>
  <text x="38" y="66" class="t" font-size="14.5">sentence-transformers</text>
  <text x="38" y="82" class="ms" font-size="11">[image, audio, video]</text>
  <path d="M254 53 H294" stroke="#57caff" stroke-width="2.8"/><polygon points="289,47 299,53 289,59" fill="#57caff"/>
  <!-- Loader switch -->
  <rect x="302" y="16" width="440" height="74" rx="14" fill="url(#glass-hi)" stroke="#5cdb6d" stroke-width="2"/>
  <text x="322" y="40" class="m" font-size="11" fill="#5cdb6d">2 · PICK YOUR FOOTPRINT AT LOAD TIME</text>
  <rect x="320" y="50" width="124" height="30" rx="8" fill="#17181b" stroke="#5cdb6d" stroke-width="1.5"/>
  <text x="382" y="69" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d">Full · 740M</text>
  <rect x="456" y="50" width="132" height="30" rx="8" fill="#17181b" stroke="#57caff" stroke-width="1.5"/>
  <text x="522" y="69" text-anchor="middle" class="m" font-size="11.5" fill="#57caff">Txt+Img · 440M</text>
  <rect x="600" y="50" width="126" height="30" rx="8" fill="#17181b" stroke="#bdc1c6" stroke-width="1.5"/>
  <text x="663" y="69" text-anchor="middle" class="m" font-size="11.5">Text · 270M</text>
  <path d="M746 53 H786" stroke="#ffd427" stroke-width="2.8"/><polygon points="781,47 791,53 781,59" fill="#ffd427"/>
  <!-- Precision guard -->
  <rect x="794" y="16" width="274" height="74" rx="14" fill="url(#glass)" stroke="#ffd427" stroke-width="2.2" filter="url(#glow-s)"/>
  <text x="814" y="40" class="m" font-size="11" fill="#ffd427">3 · DTYPE PRECISION</text>
  <rect x="814" y="50" width="116" height="28" rx="8" fill="#1f3526" stroke="#5cdb6d" stroke-width="1.5"/>
  <text x="872" y="68" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d">bf16 / fp32 ✓</text>
  <rect x="940" y="50" width="110" height="28" rx="8" fill="#361f27" stroke="#ff7daf" stroke-width="1.5"/>
  <text x="995" y="68" text-anchor="middle" class="m" font-size="11.5" fill="#ff7daf">fp16 ✗</text>

</svg>
