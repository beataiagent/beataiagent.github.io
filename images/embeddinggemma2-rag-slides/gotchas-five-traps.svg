<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 388 380" width="388" height="380">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-bgy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-full" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="35%" stop-color="#5cdb6d"/>
      <stop offset="70%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5f6368" opacity="0.28"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #e8eaed; font-weight: 500; }
      .ms { font-family: "Roboto Mono", ui-monospace, monospace; fill: #9aa0a6; font-weight: 400; }
    </style>
  </defs>
  <rect width="388" height="380" fill="#202124"/>
  <rect width="388" height="380" fill="url(#dots)"/>

  <circle cx="194" cy="190" r="145" fill="url(#amb-r)"/>
  <text x="194" y="34" text-anchor="middle" class="m" font-size="12" fill="#ff7daf">RETRIEVAL FAILURE CHECKLIST</text>
  <!-- Trap 1 -->
  <rect x="20" y="48" width="348" height="54" rx="12" fill="url(#glass)" stroke="#ff7daf" stroke-width="1.8"/>
  <rect x="34" y="61" width="76" height="28" rx="8" fill="#3a1f28" stroke="#ff7daf" stroke-width="1.4"/>
  <text x="72" y="79" text-anchor="middle" class="m" font-size="12" fill="#ff7daf">fp16 ✗</text>
  <text x="126" y="72" class="t" font-size="13.5">Corrupt activations</text>
  <text x="126" y="90" class="ms" font-size="11">Use bf16 or fp32 instead</text>
  <!-- Trap 2 -->
  <rect x="20" y="112" width="348" height="54" rx="12" fill="url(#glass)" stroke="#ffd427" stroke-width="1.8"/>
  <rect x="34" y="125" width="76" height="28" rx="8" fill="#352f1c" stroke="#ffd427" stroke-width="1.4"/>
  <text x="72" y="143" text-anchor="middle" class="m" font-size="11" fill="#ffd427">no prompt</text>
  <text x="126" y="136" class="t" font-size="13.5">Misaligned text vectors</text>
  <text x="126" y="154" class="ms" font-size="11">SearchQuery ↔ Document</text>
  <!-- Trap 3 -->
  <rect x="20" y="176" width="348" height="54" rx="12" fill="url(#glass)" stroke="#57caff" stroke-width="1.8"/>
  <rect x="34" y="189" width="76" height="28" rx="8" fill="#1c2f3e" stroke="#57caff" stroke-width="1.4"/>
  <text x="72" y="207" text-anchor="middle" class="m" font-size="11.5" fill="#57caff">768 ≠ 256</text>
  <text x="126" y="200" class="t" font-size="13.5">Dimension mismatch</text>
  <text x="126" y="218" class="ms" font-size="11">Match query &amp; doc dims</text>
  <!-- Trap 4 -->
  <rect x="20" y="240" width="348" height="54" rx="12" fill="url(#glass)" stroke="#5cdb6d" stroke-width="1.8"/>
  <rect x="34" y="253" width="76" height="28" rx="8" fill="#1e3425" stroke="#5cdb6d" stroke-width="1.4"/>
  <text x="72" y="271" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d">||v|| ≠ 1</text>
  <text x="126" y="264" class="t" font-size="13.5">Forgot re-normalize</text>
  <text x="126" y="282" class="ms" font-size="11">normalize_embeddings=True</text>
  <!-- Trap 5 -->
  <rect x="20" y="304" width="348" height="54" rx="12" fill="url(#glass)" stroke="#ff7daf" stroke-width="1.8"/>
  <rect x="34" y="317" width="76" height="28" rx="8" fill="#3a1f28" stroke="#ff7daf" stroke-width="1.4"/>
  <text x="72" y="335" text-anchor="middle" class="m" font-size="11" fill="#ff7daf">&gt; 8,192</text>
  <text x="126" y="328" class="t" font-size="13.5">Silent truncation</text>
  <text x="126" y="346" class="ms" font-size="11">Split long calls &amp; videos</text>

</svg>
