<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 142" width="1088" height="142">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-bgy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-full" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="35%" stop-color="#5cdb6d"/>
      <stop offset="70%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5f6368" opacity="0.28"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #e8eaed; font-weight: 500; }
      .ms { font-family: "Roboto Mono", ui-monospace, monospace; fill: #9aa0a6; font-weight: 400; }
    </style>
  </defs>
  <rect width="1088" height="142" fill="#202124"/>
  <rect width="1088" height="142" fill="url(#dots)"/>

  <circle cx="250" cy="71" r="120" fill="url(#amb-g)"/>
  <circle cx="838" cy="71" r="120" fill="url(#amb-b)"/>
  <!-- Left: On-device / Local Shield -->
  <rect x="20" y="16" width="468" height="110" rx="16" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2"/>
  <!-- Laptop icon -->
  <rect x="42" y="38" width="68" height="46" rx="7" fill="#17181b" stroke="#5cdb6d" stroke-width="2"/>
  <path d="M56 56 l8 6 -8 6 M68 68 h16" fill="none" stroke="#5cdb6d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34 88 h84 l-6 8 h-72 z" fill="#3c4043" stroke="#5cdb6d" stroke-width="1.5"/>
  <text x="130" y="48" class="t" font-size="18" fill="#5cdb6d">EmbeddingGemma 2</text>
  <text x="130" y="72" class="sub" font-size="14">Local · Offline · Private · Apache 2.0</text>
  <rect x="130" y="84" width="108" height="24" rx="12" fill="#1f3526" stroke="#5cdb6d" stroke-width="1.4"/>
  <text x="184" y="100" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d">768-d max</text>
  <rect x="248" y="84" width="124" height="24" rx="12" fill="#17181b" stroke="#5f6368" stroke-width="1.4"/>
  <text x="310" y="100" text-anchor="middle" class="m" font-size="11.5">Laptop / Phone</text>
  <!-- Center divider: Separate Spaces Warning -->
  <rect x="500" y="26" width="88" height="90" rx="14" fill="#2c1e24" stroke="#ff7daf" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="544" y="54" text-anchor="middle" class="t" font-size="15" fill="#ff7daf">≠</text>
  <text x="544" y="76" text-anchor="middle" class="m" font-size="10" fill="#ff7daf">Different</text>
  <text x="544" y="92" text-anchor="middle" class="m" font-size="10" fill="#ff7daf">spaces</text>
  <text x="544" y="108" text-anchor="middle" class="ms" font-size="9.5">don't mix</text>
  <!-- Right: Cloud API -->
  <rect x="600" y="16" width="468" height="110" rx="16" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/>
  <!-- Cloud icon -->
  <path d="M624 88 H692 A17 17 0 0 0 690 54 A23 23 0 0 0 644 48 A18 18 0 0 0 624 88 Z" fill="#17181b" stroke="#57caff" stroke-width="2.2" filter="url(#glow-s)"/>
  <path d="M658 58 L661 66 L669 69 L661 72 L658 80 L655 72 L647 69 L655 66 Z" fill="#57caff"/>
  <text x="716" y="48" class="t" font-size="18" fill="#57caff">Gemini Embedding 2</text>
  <text x="716" y="72" class="sub" font-size="14">Hosted Gemini API · Zero GPU Ops</text>
  <rect x="716" y="84" width="114" height="24" rx="12" fill="#1c2f3e" stroke="#57caff" stroke-width="1.4"/>
  <text x="773" y="100" text-anchor="middle" class="m" font-size="11.5" fill="#57caff">3072-d max</text>
  <rect x="840" y="84" width="120" height="24" rx="12" fill="#17181b" stroke="#5f6368" stroke-width="1.4"/>
  <text x="900" y="100" text-anchor="middle" class="m" font-size="11.5">+ Native PDF</text>

</svg>
