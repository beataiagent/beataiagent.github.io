<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 146" width="1088" height="146">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-bgy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-full" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="35%" stop-color="#5cdb6d"/>
      <stop offset="70%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5f6368" opacity="0.28"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #e8eaed; font-weight: 500; }
      .ms { font-family: "Roboto Mono", ui-monospace, monospace; fill: #9aa0a6; font-weight: 400; }
    </style>
  </defs>
  <rect width="1088" height="146" fill="#202124"/>
  <rect width="1088" height="146" fill="url(#dots)"/>

  <circle cx="190" cy="73" r="105" fill="url(#amb-b)"/>
  <circle cx="544" cy="73" r="115" fill="url(#amb-g)"/>
  <circle cx="910" cy="73" r="105" fill="url(#amb-y)"/>
  <!-- Left: Short Query + Long Document -->
  <rect x="20" y="16" width="268" height="48" rx="12" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <text x="36" y="37" class="m" font-size="11" fill="#57caff">QUERY (SHORT)</text>
  <text x="36" y="55" class="sub" font-size="12.5">"What causes northern lights?"</text>
  <rect x="20" y="80" width="268" height="50" rx="12" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
  <text x="36" y="101" class="m" font-size="11" fill="#5cdb6d">DOCUMENT (LONG)</text>
  <text x="36" y="119" class="sub" font-size="12.5">"Charged particles from the sun…"</text>
  <!-- Arrows into task prompt adapters -->
  <path d="M292 40 H334" stroke="#57caff" stroke-width="2.6"/><polygon points="329,35 339,40 329,45" fill="#57caff"/>
  <path d="M292 105 H334" stroke="#5cdb6d" stroke-width="2.6"/><polygon points="329,100 339,105 329,110" fill="#5cdb6d"/>
  <!-- Prompt prefix chips -->
  <rect x="342" y="18" width="212" height="44" rx="12" fill="#17181b" stroke="#57caff" stroke-width="2"/>
  <text x="448" y="45" text-anchor="middle" class="m" font-size="13" fill="#57caff">prompt="SearchQuery"</text>
  <rect x="342" y="82" width="212" height="44" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="2"/>
  <text x="448" y="109" text-anchor="middle" class="m" font-size="13" fill="#5cdb6d">prompt="Document"</text>
  <!-- Converge into aligned vector space -->
  <path d="M558 40 C600 40, 606 66, 646 66" fill="none" stroke="#57caff" stroke-width="2.6"/>
  <path d="M558 105 C600 105, 606 80, 646 80" fill="none" stroke="#5cdb6d" stroke-width="2.6"/>
  <!-- Aligned vector box -->
  <rect x="650" y="16" width="218" height="114" rx="16" fill="url(#glass-hi)" stroke="#5cdb6d" stroke-width="2.2" filter="url(#glow-s)"/>
  <text x="759" y="40" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d">ALIGNED IN SPACE</text>
  <circle cx="728" cy="78" r="10" fill="#57caff"/>
  <circle cx="788" cy="74" r="10" fill="#5cdb6d"/>
  <line x1="738" y1="77" x2="778" y2="75" stroke="#fff" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="759" y="114" text-anchor="middle" class="m" font-size="12" fill="#fff">High Cosine Match ✓</text>
  <!-- Right: Media note -->
  <rect x="888" y="16" width="180" height="114" rx="16" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  <text x="978" y="42" text-anchor="middle" class="m" font-size="11" fill="#ffd427">MEDIA ITEMS</text>
  <text x="978" y="68" text-anchor="middle" class="t" font-size="15">No Prompt</text>
  <text x="978" y="92" text-anchor="middle" class="ms" font-size="11">{"image": path}</text>
  <text x="978" y="110" text-anchor="middle" class="ms" font-size="11">{"audio" / "video"}</text>

</svg>
