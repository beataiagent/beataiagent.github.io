<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 508 142" width="508" height="142">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-bgy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-full" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="35%" stop-color="#5cdb6d"/>
      <stop offset="70%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5f6368" opacity="0.28"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #e8eaed; font-weight: 500; }
      .ms { font-family: "Roboto Mono", ui-monospace, monospace; fill: #9aa0a6; font-weight: 400; }
    </style>
  </defs>
  <rect width="508" height="142" fill="#202124"/>
  <rect width="508" height="142" fill="url(#dots)"/>

  <circle cx="254" cy="71" r="125" fill="url(#amb-g)"/>
  <!-- Node 1: User -->
  <rect x="12" y="34" width="84" height="74" rx="13" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <circle cx="54" cy="59" r="9" fill="#57caff"/>
  <path d="M40 82 c3-7 8-10 14-10 s11 3 14 10" fill="none" stroke="#57caff" stroke-width="2.2" stroke-linecap="round"/>
  <text x="54" y="99" text-anchor="middle" class="m" font-size="10.5" fill="#57caff">User</text>
  <path d="M98 71 H122" stroke="#57caff" stroke-width="2.4"/><polygon points="118,66 126,71 118,76" fill="#57caff"/>
  <!-- Node 2: ADK Agent -->
  <rect x="128" y="22" width="114" height="98" rx="14" fill="url(#glass-hi)" stroke="#ffd427" stroke-width="2.2" filter="url(#glow-s)"/>
  <text x="185" y="47" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">ADK AGENT</text>
  <text x="185" y="72" text-anchor="middle" class="t" font-size="14">support_agent</text>
  <rect x="142" y="84" width="86" height="24" rx="8" fill="#17181b" stroke="#ffd427" stroke-width="1.3"/>
  <text x="185" y="100" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">Gemini</text>
  <!-- Bidirectional arrows -->
  <path d="M244 63 H268" stroke="#5cdb6d" stroke-width="2.2"/><polygon points="264,58 272,63 264,68" fill="#5cdb6d"/>
  <path d="M270 79 H246" stroke="#5cdb6d" stroke-width="2.2"/><polygon points="250,74 242,79 250,84" fill="#5cdb6d"/>
  <!-- Node 3: Tool -->
  <rect x="274" y="28" width="100" height="86" rx="13" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
  <text x="324" y="52" text-anchor="middle" class="m" font-size="10" fill="#5cdb6d">TOOL</text>
  <text x="324" y="73" text-anchor="middle" class="m" font-size="11" fill="#fff">search_</text>
  <text x="324" y="89" text-anchor="middle" class="m" font-size="11" fill="#fff">knowledge()</text>
  <!-- Bidirectional arrows -->
  <path d="M376 63 H398" stroke="#ff7daf" stroke-width="2.2"/><polygon points="394,58 402,63 394,68" fill="#ff7daf"/>
  <path d="M400 79 H378" stroke="#ff7daf" stroke-width="2.2"/><polygon points="382,74 374,79 382,84" fill="#ff7daf"/>
  <!-- Node 4: Index -->
  <rect x="404" y="24" width="92" height="94" rx="13" fill="url(#glass)" stroke="#ff7daf" stroke-width="2"/>
  <text x="450" y="50" text-anchor="middle" class="m" font-size="10" fill="#ff7daf">INDEX</text>
  <text x="450" y="72" text-anchor="middle" class="t" font-size="12.5">Gemma 2</text>
  <text x="450" y="92" text-anchor="middle" class="ms" font-size="10.5">index.pt</text>

</svg>
