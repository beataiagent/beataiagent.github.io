<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="256" height="256" fill="#202124"/>

  <circle cx="110" cy="120" r="95" fill="url(#amb-r)"/>
  <circle cx="176" cy="154" r="76" fill="url(#amb-g)"/>
  <circle cx="128" cy="128" r="98" fill="none" stroke="#ff7daf" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Canary 90/10 Ring Dial (r=56, C=351.86) -->
  <g transform="translate(114, 122)">
    <circle cx="0" cy="0" r="64" fill="url(#glass)" stroke="#3c4043" stroke-width="2"/>
    <!-- 90% Stable Arc (blue) -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#57caff" stroke-width="12" stroke-dasharray="271 31" stroke-dashoffset="75" stroke-linecap="round"/>
    <!-- 10% Canary Arc (yellow/pink) -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#ffd427" stroke-width="12" stroke-dasharray="28 274" stroke-dashoffset="106" stroke-linecap="round" filter="url(#glow-s)"/>
    <text x="0" y="-4" text-anchor="middle" class="t" font-size="22" fill="#fff">90 / 10</text>
    <text x="0" y="16" text-anchor="middle" class="m" font-size="11" fill="#ffd427">CANARY</text>
  </g>

  <!-- Green Health Check Shield -->
  <g transform="translate(182, 162)">
    <path d="M0 -30 L24 -20 V2 C24 18 13 28 0 34 C-13 28 -24 18 -24 2 V-20 Z" fill="url(#glass-hi)" stroke="#5cdb6d" stroke-width="2.4" filter="url(#glow-s)"/>
    <path d="M-9 1 L-2 8 L11 -6" fill="none" stroke="#5cdb6d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Top badges -->
  <g transform="translate(184, 62)">
    <rect x="-32" y="-13" width="64" height="26" rx="13" fill="url(#glass)" stroke="#ff7daf" stroke-width="1.8"/>
    <text x="0" y="4" text-anchor="middle" class="m" font-size="10.5" fill="#ff7daf">5s ROLLBACK</text>
  </g>

  <text x="128" y="232" text-anchor="middle" class="m" font-size="12" fill="#ff7daf">SHIP · SAFE SCALE</text>
</svg>
