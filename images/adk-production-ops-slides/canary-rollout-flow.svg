<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 240" width="1088" height="240">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#57caff"/></marker>
    <marker id="arr-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ffd427"/></marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/></marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ff7daf"/></marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="240" rx="18" fill="#202124"/>

  <circle cx="110" cy="120" r="100" fill="url(#amb-b)"/>
  <circle cx="560" cy="120" r="110" fill="url(#amb-y)"/>
  <circle cx="920" cy="64" r="95" fill="url(#amb-g)"/>
  <circle cx="920" cy="176" r="95" fill="url(#amb-r)"/>

  <!-- 1. Live Traffic Router -->
  <rect x="16" y="64" width="144" height="112" rx="16" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <text x="88" y="102" text-anchor="middle" class="t" font-size="17" fill="#57caff">Cloud Run</text>
  <text x="88" y="124" text-anchor="middle" class="t" font-size="16" fill="#fff">Router</text>
  <rect x="34" y="138" width="108" height="24" rx="12" fill="#17181b" stroke="#57caff" stroke-width="1.2"/>
  <text x="88" y="154" text-anchor="middle" class="m" font-size="10.5" fill="#57caff">100% Traffic</text>

  <!-- Split curves -->
  <path d="M160 104 C196 104 202 64 246 64" fill="none" stroke="#57caff" stroke-width="3.4" marker-end="url(#arr-b)"/>
  <rect x="174" y="50" width="52" height="22" rx="11" fill="#17181b" stroke="#57caff" stroke-width="1.4"/>
  <text x="200" y="65" text-anchor="middle" class="m" font-size="11" fill="#57caff">90%</text>

  <path d="M160 136 C196 136 202 176 246 176" fill="none" stroke="#ffd427" stroke-width="2.8" stroke-dasharray="6 4" marker-end="url(#arr-y)"/>
  <rect x="174" y="166" width="52" height="22" rx="11" fill="#17181b" stroke="#ffd427" stroke-width="1.4"/>
  <text x="200" y="181" text-anchor="middle" class="m" font-size="11" fill="#ffd427">10%</text>

  <!-- 2. Revisions -->
  <rect x="256" y="24" width="212" height="80" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <text x="274" y="54" class="t" font-size="17" fill="#57caff">Stable · Rev-01</text>
  <text x="274" y="76" class="m" font-size="11.5">Current prod prompt &amp; model</text>
  <text x="274" y="94" class="m" font-size="10.5" fill="#5cdb6d">status: pinned baseline</text>

  <rect x="256" y="136" width="212" height="80" rx="14" fill="url(#glass-hi)" stroke="#ffd427" stroke-width="2.2" filter="url(#glow-s)"/>
  <text x="274" y="166" class="t" font-size="17" fill="#ffd427">Canary · Rev-02</text>
  <text x="274" y="188" class="m" font-size="11.5">New prompt / Gemini model</text>
  <text x="274" y="206" class="m" font-size="10.5" fill="#ffd427">tag: canary---app.run.app</text>

  <!-- Feed into Gate -->
  <path d="M468 64 C498 64 504 102 528 108" fill="none" stroke="#57caff" stroke-width="2.4" marker-end="url(#arr-b)"/>
  <path d="M468 176 C498 176 504 138 528 132" fill="none" stroke="#ffd427" stroke-width="2.4" marker-end="url(#arr-y)"/>

  <!-- 3. Eval & Error-rate Gate Diamond -->
  <g transform="translate(620, 120)">
    <polygon points="0,-78 90,0 0,78 -90,0" fill="url(#glass-hi)" stroke="#ffd427" stroke-width="2.6" filter="url(#glow-s)"/>
    <text x="0" y="-14" text-anchor="middle" class="m" font-size="11" fill="#ffd427">QUALITY GATE</text>
    <text x="0" y="10" text-anchor="middle" class="t" font-size="17" fill="#fff">Eval &amp; SLOs</text>
    <text x="0" y="30" text-anchor="middle" class="m" font-size="10.5" fill="#bdc1c6">5xx · P95 · Tok</text>
  </g>

  <!-- Outcomes -->
  <path d="M710 98 C744 74 750 64 790 64" fill="none" stroke="#5cdb6d" stroke-width="3" marker-end="url(#arr-g)"/>
  <rect x="724" y="42" width="56" height="22" rx="11" fill="#17181b" stroke="#5cdb6d" stroke-width="1.4"/>
  <text x="752" y="57" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d">PASS</text>

  <rect x="800" y="24" width="272" height="80" rx="14" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2"/>
  <circle cx="834" cy="64" r="18" fill="#5cdb6d" fill-opacity="0.16" stroke="#5cdb6d" stroke-width="2"/>
  <path d="M826 64 L832 70 L844 57" fill="none" stroke="#5cdb6d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="864" y="56" class="t" font-size="17" fill="#5cdb6d">100% Rollout</text>
  <text x="864" y="78" class="m" font-size="11.5">Promote Rev-02 to all users</text>

  <path d="M710 142 C744 166 750 176 790 176" fill="none" stroke="#ff7daf" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arr-r)"/>
  <rect x="724" y="176" width="56" height="22" rx="11" fill="#17181b" stroke="#ff7daf" stroke-width="1.4"/>
  <text x="752" y="191" text-anchor="middle" class="m" font-size="11" fill="#ff7daf">FAIL</text>

  <rect x="800" y="136" width="272" height="80" rx="14" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.2"/>
  <circle cx="834" cy="176" r="18" fill="#ff7daf" fill-opacity="0.16" stroke="#ff7daf" stroke-width="2"/>
  <path d="M840 168 L828 176 L840 184" fill="none" stroke="#ff7daf" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="864" y="168" class="t" font-size="17" fill="#ff7daf">Instant Rollback</text>
  <text x="864" y="190" class="m" font-size="11.5">Revert 100% Rev-01 in 5s</text>
</svg>
