<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="320" height="320" rx="28" fill="#202124"/>

  <!-- Four-color cloud constellation ambient glows -->
  <circle cx="90" cy="90" r="100" fill="url(#amb-b)"/>
  <circle cx="235" cy="95" r="95" fill="url(#amb-g)"/>
  <circle cx="95" cy="235" r="95" fill="url(#amb-y)"/>
  <circle cx="235" cy="230" r="95" fill="url(#amb-r)"/>

  <!-- Orbital Constellation Rings -->
  <circle cx="160" cy="160" r="126" fill="none" stroke="#57caff" stroke-width="1.6" stroke-dasharray="6 6" opacity="0.4"/>
  <circle cx="160" cy="160" r="94" fill="none" stroke="#ffd427" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.35"/>

  <!-- Constellation Links -->
  <line x1="72" y1="72" x2="160" y2="160" stroke="#57caff" stroke-width="1.6" opacity="0.5"/>
  <line x1="248" y1="72" x2="160" y2="160" stroke="#5cdb6d" stroke-width="1.6" opacity="0.5"/>
  <line x1="72" y1="248" x2="160" y2="160" stroke="#ffd427" stroke-width="1.6" opacity="0.5"/>
  <line x1="248" y1="248" x2="160" y2="160" stroke="#ff7daf" stroke-width="1.6" opacity="0.5"/>

  <!-- 4 Satellite Nodes -->
  <g transform="translate(68, 68)">
    <rect x="-36" y="-16" width="72" height="32" rx="16" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" class="m" font-size="11" fill="#57caff">DEPLOY</text>
  </g>
  <g transform="translate(252, 68)">
    <rect x="-36" y="-16" width="72" height="32" rx="16" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d">PERSIST</text>
  </g>
  <g transform="translate(68, 252)">
    <rect x="-36" y="-16" width="72" height="32" rx="16" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" class="m" font-size="11" fill="#ffd427">OBSERVE</text>
  </g>
  <g transform="translate(252, 252)">
    <rect x="-36" y="-16" width="72" height="32" rx="16" fill="url(#glass)" stroke="#ff7daf" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" class="m" font-size="11" fill="#ff7daf">SCALE</text>
  </g>

  <!-- Central Production Ops Dashboard Card -->
  <g transform="translate(160, 160)">
    <rect x="-78" y="-62" width="156" height="124" rx="18" fill="url(#glass-hi)" stroke="#ffd427" stroke-width="2.4" filter="url(#glow-s)"/>
    <!-- Window dots -->
    <circle cx="-60" cy="-46" r="3.5" fill="#ff7daf"/>
    <circle cx="-48" cy="-46" r="3.5" fill="#ffd427"/>
    <circle cx="-36" cy="-46" r="3.5" fill="#5cdb6d"/>
    <rect x="6" y="-54" width="58" height="16" rx="8" fill="#17181b" stroke="#5cdb6d" stroke-width="1.2"/>
    <text x="35" y="-43" text-anchor="middle" class="m" font-size="8.5" fill="#5cdb6d">99.99% OK</text>

    <!-- Heartbeat Wave -->
    <path d="M-64 -14 H-32 L-22 -30 L-10 4 L2 -22 L12 -14 H64" fill="none" stroke="#5cdb6d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-s)"/>

    <!-- Mini OTel Waterfall -->
    <rect x="-62" y="14" width="124" height="8" rx="4" fill="#57caff"/>
    <rect x="-54" y="27" width="44" height="8" rx="4" fill="#5cdb6d"/>
    <rect x="-6" y="27" width="38" height="8" rx="4" fill="#ffd427"/>
    <rect x="36" y="27" width="24" height="8" rx="4" fill="#ff7daf"/>

    <text x="0" y="51" text-anchor="middle" class="m" font-size="10.5" fill="#e8eaed">ADK PROD OPS</text>
  </g>
</svg>
