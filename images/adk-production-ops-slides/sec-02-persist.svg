<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="256" height="256" fill="#202124"/>

  <circle cx="128" cy="148" r="95" fill="url(#amb-g)"/>
  <circle cx="128" cy="64" r="80" fill="url(#amb-b)"/>
  <circle cx="128" cy="128" r="98" fill="none" stroke="#5cdb6d" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- 3 Stateless Agent Replicas -->
  <g transform="translate(56, 62)">
    <rect x="-24" y="-18" width="48" height="36" rx="10" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" class="m" font-size="11.5" fill="#57caff">R1</text>
  </g>
  <g transform="translate(128, 52)">
    <rect x="-24" y="-18" width="48" height="36" rx="10" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" class="m" font-size="11.5" fill="#57caff">R2</text>
  </g>
  <g transform="translate(200, 62)">
    <rect x="-24" y="-18" width="48" height="36" rx="10" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" class="m" font-size="11.5" fill="#57caff">R3</text>
  </g>

  <!-- Sync paths from replicas to DB -->
  <path d="M56 80 C56 106 96 106 110 124" fill="none" stroke="#5cdb6d" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M128 70 V118" fill="none" stroke="#5cdb6d" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M200 80 C200 106 160 106 146 124" fill="none" stroke="#5cdb6d" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Sync pulse dots -->
  <circle cx="80" cy="103" r="3.5" fill="#5cdb6d" filter="url(#glow-s)"/>
  <circle cx="128" cy="96" r="3.5" fill="#57caff" filter="url(#glow-s)"/>
  <circle cx="176" cy="103" r="3.5" fill="#5cdb6d" filter="url(#glow-s)"/>

  <!-- Glowing Database Cylinder -->
  <g transform="translate(128, 160)">
    <!-- Body -->
    <path d="M-48 -26 V32 C-48 42 -26 50 0 50 C26 50 48 42 48 32 V-26 Z" fill="url(#glass-hi)" stroke="#5cdb6d" stroke-width="2.6" filter="url(#glow-s)"/>
    <!-- Mid tiers -->
    <path d="M-48 -6 C-48 4 -26 12 0 12 C26 12 48 4 48 -6" fill="none" stroke="#5cdb6d" stroke-width="2" opacity="0.85"/>
    <path d="M-48 14 C-48 24 -26 32 0 32 C26 32 48 24 48 14" fill="none" stroke="#5cdb6d" stroke-width="2" opacity="0.85"/>
    <!-- Top cap -->
    <ellipse cx="0" cy="-26" rx="48" ry="16" fill="#262930" stroke="#5cdb6d" stroke-width="2.6"/>
    <ellipse cx="0" cy="-26" rx="28" ry="8" fill="#5cdb6d" fill-opacity="0.18"/>
    <!-- Status LEDs -->
    <circle cx="-26" cy="5" r="3" fill="#57caff"/>
    <circle cx="-15" cy="7" r="3" fill="#5cdb6d"/>
    <circle cx="-26" cy="25" r="3" fill="#5cdb6d"/>
    <circle cx="-15" cy="27" r="3" fill="#ffd427"/>
  </g>

  <text x="128" y="232" text-anchor="middle" class="m" font-size="12" fill="#5cdb6d">PERSIST · STATE</text>
</svg>
