<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 150" width="494" height="150">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7daf"/>
      <stop offset="35%" stop-color="#ffd427"/>
      <stop offset="70%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#57caff"/></marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/></marker>
    <marker id="arr-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ffd427"/></marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ff7daf"/></marker>
    <marker id="arr-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#e8eaed"/></marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="494" height="150" fill="#202124"/>

  <circle cx="88" cy="75" r="80" fill="url(#amb-b)"/>
  <circle cx="385" cy="75" r="95" fill="url(#amb-g)"/>

  <!-- Customer -->
    <g transform="translate(72,72) scale(0.62)">
    <circle cx="0" cy="-18" r="19" fill="#ffe0b2" stroke="#57caff" stroke-width="2.5"/>
    <path d="M-19 -22 C-16 -38 16 -38 19 -22 C12 -28 -12 -28 -19 -22 Z" fill="#3c4043"/>
    <circle cx="-6" cy="-17" r="2.3" fill="#202124"/>
    <circle cx="6" cy="-17" r="2.3" fill="#202124"/>
    <path d="M-5 -9 Q0 -4.5 5 -9" fill="none" stroke="#202124" stroke-width="2.2" stroke-linecap="round"/>
    
    <path d="M-27 42 C-27 16 -16 8 0 8 C16 8 27 16 27 42 Z" fill="url(#glass)" stroke="#57caff" stroke-width="2.5"/>
    
  </g>
  <text x="72" y="132" text-anchor="middle" class="m" font-size="12" fill="#57caff">Customer</text>

  <!-- Agent stepped aside (dimmed top) -->
  <g opacity="0.58">
      <g transform="translate(236,52) scale(0.48)">
    <line x1="0" y1="-44" x2="0" y2="-56" stroke="#5f6368" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-60" r="5.5" fill="#5f6368" filter="url(#glow-s)"/>
    <rect x="-36" y="-44" width="72" height="54" rx="22" fill="#e8eaed" stroke="#5f6368" stroke-width="2.8"/>
    <rect x="-25" y="-33" width="50" height="32" rx="13" fill="#1b1d22"/>
    <circle cx="-11" cy="-18" r="4.5" fill="#bdc1c6"/><circle cx="11" cy="-18" r="4.5" fill="#bdc1c6"/><path d="M-6 -9 L6 -5 M6 -9 L-6 -5" stroke="#ff7daf" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M-24 14 H24 C28 14 26 42 0 46 C-26 42 -28 14 -24 14 Z" fill="#cfd4dc" stroke="#5f6368" stroke-width="2.2"/>
    <circle cx="0" cy="28" r="6" fill="#5f6368" opacity="0.9"/>
  </g>
  </g>
  <rect x="190" y="92" width="92" height="22" rx="11" fill="#17181b" stroke="#ff7daf" stroke-width="1.5"/>
  <text x="236" y="107" text-anchor="middle" class="m" font-size="10.5" fill="#ff7daf">steps aside</text>

  <!-- Direct glowing bridge bypassing robot to Human Support -->
  <path d="M112 78 C176 138 294 138 358 78" fill="none" stroke="#5cdb6d" stroke-width="3.2" filter="url(#glow-s)" marker-end="url(#arr-g)"/>
  <rect x="180" y="122" width="114" height="20" rx="10" fill="#202124" stroke="#5cdb6d" stroke-width="1.5"/>
  <text x="237" y="136" text-anchor="middle" class="m" font-size="10.5" fill="#5cdb6d">direct takeover</text>

  <!-- Human Agent in spotlight -->
  <circle cx="406" cy="72" r="46" fill="#5cdb6d" fill-opacity="0.1" stroke="#5cdb6d" stroke-width="2" stroke-dasharray="5 4"/>
    <g transform="translate(406,72) scale(0.66)">
    <circle cx="0" cy="-18" r="19" fill="#ffe0b2" stroke="#5cdb6d" stroke-width="2.5"/>
    <path d="M-19 -22 C-16 -38 16 -38 19 -22 C12 -28 -12 -28 -19 -22 Z" fill="#3c4043"/>
    <circle cx="-6" cy="-17" r="2.3" fill="#202124"/>
    <circle cx="6" cy="-17" r="2.3" fill="#202124"/>
    <path d="M-5 -9 Q0 -4.5 5 -9" fill="none" stroke="#202124" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M-21 -18 A21 21 0 0 1 21 -18" fill="none" stroke="#5cdb6d" stroke-width="3.2" stroke-linecap="round"/>
    <rect x="-25" y="-21" width="7" height="14" rx="3.5" fill="#5cdb6d"/>
    <rect x="18" y="-21" width="7" height="14" rx="3.5" fill="#5cdb6d"/>
    <path d="M21 -10 Q18 2 6 3" fill="none" stroke="#5cdb6d" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="5" cy="3" r="2.8" fill="#5cdb6d"/>
    <path d="M-27 42 C-27 16 -16 8 0 8 C16 8 27 16 27 42 Z" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.5"/>
    
  </g>
  <text x="406" y="136" text-anchor="middle" class="m" font-size="12" fill="#5cdb6d">Human Agent</text>

</svg>
