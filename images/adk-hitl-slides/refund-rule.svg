<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 192" width="1088" height="192">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7daf"/>
      <stop offset="35%" stop-color="#ffd427"/>
      <stop offset="70%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#57caff"/></marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/></marker>
    <marker id="arr-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ffd427"/></marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ff7daf"/></marker>
    <marker id="arr-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#e8eaed"/></marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="192" fill="#202124"/>

  <circle cx="150" cy="96" r="110" fill="url(#amb-b)"/>
  <circle cx="485" cy="96" r="105" fill="url(#amb-y)"/>
  <circle cx="880" cy="52" r="95" fill="url(#amb-g)"/>
  <circle cx="880" cy="144" r="95" fill="url(#amb-r)"/>

  <!-- Left: Bank support robot calling issue_refund -->
  <rect x="18" y="20" width="290" height="152" rx="18" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
    <g transform="translate(84,96) scale(0.72)">
    <line x1="0" y1="-44" x2="0" y2="-56" stroke="#57caff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-60" r="5.5" fill="#57caff" filter="url(#glow-s)"/>
    <rect x="-36" y="-44" width="72" height="54" rx="22" fill="#e8eaed" stroke="#57caff" stroke-width="2.8"/>
    <rect x="-25" y="-33" width="50" height="32" rx="13" fill="#1b1d22"/>
    <circle cx="-11" cy="-18" r="5" fill="#57caff" filter="url(#glow-s)"/><circle cx="11" cy="-18" r="5" fill="#57caff" filter="url(#glow-s)"/><path d="M-7 -8 Q0 -3 7 -8" fill="none" stroke="#57caff" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M-24 14 H24 C28 14 26 42 0 46 C-26 42 -28 14 -24 14 Z" fill="#cfd4dc" stroke="#57caff" stroke-width="2.2"/>
    <circle cx="0" cy="28" r="6" fill="#57caff" opacity="0.9"/>
  </g>
  <text x="138" y="72" class="t" font-size="18">Support Agent</text>
  <rect x="138" y="84" width="154" height="32" rx="8" fill="#17181b" stroke="#57caff" stroke-width="1.5"/>
  <text x="215" y="105" text-anchor="middle" class="m" font-size="12.5" fill="#57caff">issue_refund($)</text>
  <text x="138" y="142" class="sub" font-size="13">Plans refund tool call</text>

  <!-- Arrow to Policy Gate -->
  <path d="M308 96 H386" stroke="#57caff" stroke-width="3" marker-end="url(#arr-b)"/>

  <!-- Center: $200 Policy Gate Diamond -->
  <g transform="translate(476, 96)">
    <polygon points="0,-68 82,0 0,68 -82,0" fill="url(#glass-hi)" stroke="#ffd427" stroke-width="2.8" filter="url(#glow-s)"/>
    <text x="0" y="-8" text-anchor="middle" class="m" font-size="12" fill="#ffd427">POLICY GATE</text>
    <text x="0" y="18" text-anchor="middle" class="t" font-size="24" fill="#fff">≤ $200?</text>
  </g>

  <!-- Branch 1: Upper Green Express Lane -->
  <path d="M558 76 C604 54 610 48 666 48" fill="none" stroke="#5cdb6d" stroke-width="3" marker-end="url(#arr-g)"/>
  <rect x="572" y="24" width="66" height="22" rx="11" fill="#202124" stroke="#5cdb6d" stroke-width="1.6"/>
  <text x="605" y="39" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d">YES</text>

  <rect x="676" y="14" width="394" height="72" rx="16" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2"/>
  <circle cx="716" cy="50" r="21" fill="#5cdb6d" fill-opacity="0.16" stroke="#5cdb6d" stroke-width="2.2"/>
  <path d="M706 50 L713 57 L727 42" fill="none" stroke="#5cdb6d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="752" y="44" class="t" font-size="17" fill="#5cdb6d">Express Auto-Refund</text>
  <text x="752" y="66" class="m" font-size="12.5" fill="#bdc1c6">$50 · $120 · $200 → API runs immediately</text>

  <!-- Branch 2: Lower Pink/Yellow Supervisor Approval -->
  <path d="M558 116 C604 138 610 144 666 144" fill="none" stroke="#ff7daf" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arr-r)"/>
  <rect x="572" y="144" width="66" height="22" rx="11" fill="#202124" stroke="#ff7daf" stroke-width="1.6"/>
  <text x="605" y="159" text-anchor="middle" class="m" font-size="11.5" fill="#ff7daf">NO</text>

  <rect x="676" y="106" width="394" height="72" rx="16" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.2"/>
    <g transform="translate(718,144) scale(0.56)">
    <circle cx="0" cy="-18" r="19" fill="#ffe0b2" stroke="#ffd427" stroke-width="2.5"/>
    <path d="M-19 -22 C-16 -38 16 -38 19 -22 C12 -28 -12 -28 -19 -22 Z" fill="#3c4043"/>
    <circle cx="-6" cy="-17" r="2.3" fill="#202124"/>
    <circle cx="6" cy="-17" r="2.3" fill="#202124"/>
    <path d="M-5 -9 Q0 -4.5 5 -9" fill="none" stroke="#202124" stroke-width="2.2" stroke-linecap="round"/>
    
    <path d="M-27 42 C-27 16 -16 8 0 8 C16 8 27 16 27 42 Z" fill="url(#glass)" stroke="#ffd427" stroke-width="2.5"/>
    
  </g>
  <text x="756" y="136" class="t" font-size="17" fill="#ff7daf">Pause for Supervisor</text>
  <text x="756" y="158" class="m" font-size="12.5" fill="#bdc1c6">$350 · $900 → Approve exact amount first</text>

</svg>
