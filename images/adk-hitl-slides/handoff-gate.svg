<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 399 410" width="399" height="410">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7daf"/>
      <stop offset="35%" stop-color="#ffd427"/>
      <stop offset="70%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#57caff"/></marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/></marker>
    <marker id="arr-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ffd427"/></marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ff7daf"/></marker>
    <marker id="arr-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#e8eaed"/></marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="399" height="410" fill="#202124"/>

  <circle cx="200" cy="155" r="115" fill="url(#amb-y)"/>
  <circle cx="105" cy="310" r="85" fill="url(#amb-r)"/>
  <circle cx="295" cy="310" r="85" fill="url(#amb-g)"/>

  <!-- Top: Customer message -->
  <rect x="22" y="14" width="355" height="68" rx="16" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
    <g transform="translate(64,50) scale(0.5)">
    <circle cx="0" cy="-18" r="19" fill="#ffe0b2" stroke="#57caff" stroke-width="2.5"/>
    <path d="M-19 -22 C-16 -38 16 -38 19 -22 C12 -28 -12 -28 -19 -22 Z" fill="#3c4043"/>
    <circle cx="-6" cy="-17" r="2.3" fill="#202124"/>
    <circle cx="6" cy="-17" r="2.3" fill="#202124"/>
    <path d="M-5 -9 Q0 -4.5 5 -9" fill="none" stroke="#202124" stroke-width="2.2" stroke-linecap="round"/>
    
    <path d="M-27 42 C-27 16 -16 8 0 8 C16 8 27 16 27 42 Z" fill="url(#glass)" stroke="#57caff" stroke-width="2.5"/>
    
  </g>
  <text x="104" y="42" class="m" font-size="11.5" fill="#57caff">USER MESSAGE</text>
  <text x="104" y="64" class="t" font-size="15.5">"I want a real person!"</text>

  <line x1="200" y1="82" x2="200" y2="112" stroke="#ffd427" stroke-width="3" marker-end="url(#arr-y)"/>

  <!-- Middle: before_model_callback Gate -->
  <rect x="22" y="120" width="355" height="78" rx="18" fill="url(#glass-hi)" stroke="#ffd427" stroke-width="2.5" filter="url(#glow-s)"/>
    <g transform="translate(68,159) scale(0.72)">
    <path d="M0 -34 L28 -22 V2 C28 20 14 31 0 37 C-14 31 -28 20 -28 2 V-22 Z" fill="url(#glass)" stroke="#ffd427" stroke-width="2.8" filter="url(#glow-s)"/>
    <path d="M0 -27 L21 -17 V1 C21 15 10 24 0 29 C-10 24 -21 15 -21 1 V-17 Z" fill="#ffd427" fill-opacity="0.12"/>
    <path d="M-9 -6 H9 M-9 2 H9 M-9 10 H3" stroke="#ffd427" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <text x="110" y="150" class="t" font-size="17" fill="#ffd427">handoff_gate</text>
  <text x="110" y="172" class="m" font-size="12" fill="#fff">keyword OR handoff on?</text>

  <!-- Split arrows -->
  <path d="M135 198 L104 238" stroke="#ff7daf" stroke-width="2.8" marker-end="url(#arr-r)"/>
  <path d="M265 198 L296 238" stroke="#5cdb6d" stroke-width="2.8" marker-end="url(#arr-g)"/>

  <rect x="52" y="206" width="52" height="22" rx="11" fill="#202124" stroke="#ff7daf" stroke-width="1.5"/>
  <text x="78" y="221" text-anchor="middle" class="m" font-size="11.5" fill="#ff7daf">YES</text>

  <rect x="294" y="206" width="52" height="22" rx="11" fill="#202124" stroke="#5cdb6d" stroke-width="1.5"/>
  <text x="320" y="221" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d">NO</text>

  <!-- Left Red: LLM Skipped -->
  <rect x="16" y="246" width="178" height="114" rx="16" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.2"/>
    <g transform="translate(105,286) scale(0.42)">
    <line x1="0" y1="-44" x2="0" y2="-56" stroke="#ff7daf" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-60" r="5.5" fill="#ff7daf" filter="url(#glow-s)"/>
    <rect x="-36" y="-44" width="72" height="54" rx="22" fill="#e8eaed" stroke="#ff7daf" stroke-width="2.8"/>
    <rect x="-25" y="-33" width="50" height="32" rx="13" fill="#1b1d22"/>
    <path d="M-16 -17 Q-11 -13 -6 -17 M6 -17 Q11 -13 16 -17" fill="none" stroke="#ff7daf" stroke-width="2.6" stroke-linecap="round"/><line x1="-5" y1="-7" x2="5" y2="-7" stroke="#ff7daf" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M-24 14 H24 C28 14 26 42 0 46 C-26 42 -28 14 -24 14 Z" fill="#cfd4dc" stroke="#ff7daf" stroke-width="2.2"/>
    <circle cx="0" cy="28" r="6" fill="#ff7daf" opacity="0.9"/>
  </g>
  <text x="105" y="324" text-anchor="middle" class="t" font-size="14.5" fill="#ff7daf">LLM Skipped</text>
  <text x="105" y="344" text-anchor="middle" class="m" font-size="10.5" fill="#bdc1c6">notify queue · reply</text>

  <!-- Right Green: Normal Turn -->
  <rect x="206" y="246" width="177" height="114" rx="16" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2"/>
    <g transform="translate(294,286) scale(0.42)">
    <line x1="0" y1="-44" x2="0" y2="-56" stroke="#5cdb6d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-60" r="5.5" fill="#5cdb6d" filter="url(#glow-s)"/>
    <rect x="-36" y="-44" width="72" height="54" rx="22" fill="#e8eaed" stroke="#5cdb6d" stroke-width="2.8"/>
    <rect x="-25" y="-33" width="50" height="32" rx="13" fill="#1b1d22"/>
    <circle cx="-11" cy="-18" r="5" fill="#5cdb6d" filter="url(#glow-s)"/><circle cx="11" cy="-18" r="5" fill="#5cdb6d" filter="url(#glow-s)"/><path d="M-7 -8 Q0 -3 7 -8" fill="none" stroke="#5cdb6d" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M-24 14 H24 C28 14 26 42 0 46 C-26 42 -28 14 -24 14 Z" fill="#cfd4dc" stroke="#5cdb6d" stroke-width="2.2"/>
    <circle cx="0" cy="28" r="6" fill="#5cdb6d" opacity="0.9"/>
  </g>
  <text x="294" y="324" text-anchor="middle" class="t" font-size="14.5" fill="#5cdb6d">LLM Answers</text>
  <text x="294" y="344" text-anchor="middle" class="m" font-size="10.5" fill="#bdc1c6">return None</text>

  <!-- Bottom note -->
  <rect x="22" y="374" width="355" height="26" rx="13" fill="#17181b" stroke="#5f6368" stroke-width="1.4"/>
  <text x="200" y="391" text-anchor="middle" class="m" font-size="11.5" fill="#ffd427">before_model_callback=handoff_gate</text>

</svg>
