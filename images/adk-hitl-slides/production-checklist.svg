<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 390" width="424" height="390">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7daf"/>
      <stop offset="35%" stop-color="#ffd427"/>
      <stop offset="70%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#57caff"/></marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/></marker>
    <marker id="arr-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ffd427"/></marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ff7daf"/></marker>
    <marker id="arr-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#e8eaed"/></marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="424" height="390" fill="#202124"/>

  <circle cx="212" cy="185" r="155" fill="url(#amb-g)"/>
  <circle cx="95" cy="90" r="80" fill="url(#amb-r)"/>
  <circle cx="330" cy="295" r="80" fill="url(#amb-b)"/>

  <!-- Orbital ring -->
  <circle cx="212" cy="185" r="134" fill="none" stroke="#5f6368" stroke-width="1.8" stroke-dasharray="6 6"/>

  <!-- Center Shield + Robot -->
    <g transform="translate(212,178) scale(1.85)">
    <path d="M0 -34 L28 -22 V2 C28 20 14 31 0 37 C-14 31 -28 20 -28 2 V-22 Z" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.8" filter="url(#glow-s)"/>
    <path d="M0 -27 L21 -17 V1 C21 15 10 24 0 29 C-10 24 -21 15 -21 1 V-17 Z" fill="#5cdb6d" fill-opacity="0.12"/>
    
  </g>
    <g transform="translate(212,184) scale(0.62)">
    <line x1="0" y1="-44" x2="0" y2="-56" stroke="#5cdb6d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-60" r="5.5" fill="#5cdb6d" filter="url(#glow-s)"/>
    <rect x="-36" y="-44" width="72" height="54" rx="22" fill="#e8eaed" stroke="#5cdb6d" stroke-width="2.8"/>
    <rect x="-25" y="-33" width="50" height="32" rx="13" fill="#1b1d22"/>
    <circle cx="-11" cy="-18" r="5" fill="#5cdb6d" filter="url(#glow-s)"/><circle cx="11" cy="-18" r="5" fill="#5cdb6d" filter="url(#glow-s)"/><path d="M-7 -8 Q0 -3 7 -8" fill="none" stroke="#5cdb6d" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M-24 14 H24 C28 14 26 42 0 46 C-26 42 -28 14 -24 14 Z" fill="#cfd4dc" stroke="#5cdb6d" stroke-width="2.2"/>
    <circle cx="0" cy="28" r="6" fill="#5cdb6d" opacity="0.9"/>
  </g>

  <!-- 5 Floating Pillar Badges around the shield -->
  <g filter="url(#glow-s)">
    <rect x="16" y="24" width="156" height="44" rx="14" fill="url(#glass)" stroke="#ff7daf" stroke-width="2"/>
    <text x="94" y="44" text-anchor="middle" class="m" font-size="11" fill="#ff7daf" font-weight="600">01 · CODE GATE</text>
    <text x="94" y="60" text-anchor="middle" class="sub" font-size="11.5">Hard limits in code</text>

    <rect x="252" y="24" width="156" height="44" rx="14" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
    <text x="330" y="44" text-anchor="middle" class="m" font-size="11" fill="#ffd427" font-weight="600">02 · THRESHOLD</text>
    <text x="330" y="60" text-anchor="middle" class="sub" font-size="11.5">No alert fatigue</text>

    <rect x="10" y="164" width="122" height="44" rx="14" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
    <text x="71" y="184" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d" font-weight="600">03 · MIN() CAP</text>
    <text x="71" y="200" text-anchor="middle" class="sub" font-size="11.5">Human payload</text>

    <rect x="292" y="164" width="122" height="44" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
    <text x="353" y="184" text-anchor="middle" class="m" font-size="11" fill="#57caff" font-weight="600">04 · IDEMPOTENT</text>
    <text x="353" y="200" text-anchor="middle" class="sub" font-size="11.5">Safe on resume</text>

    <rect x="92" y="302" width="240" height="44" rx="14" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
    <text x="212" y="322" text-anchor="middle" class="m" font-size="11" fill="#ffd427" font-weight="600">05 · SESSION + AUDIT LOG</text>
    <text x="212" y="338" text-anchor="middle" class="sub" font-size="11.5">Who approved what, and when</text>
  </g>

  <text x="212" y="376" text-anchor="middle" class="m" font-size="12" fill="#5cdb6d">✓ PRODUCTION HITL READY</text>

</svg>
