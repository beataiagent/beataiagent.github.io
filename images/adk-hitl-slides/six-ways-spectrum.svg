<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 88" width="1088" height="88">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7daf"/>
      <stop offset="35%" stop-color="#ffd427"/>
      <stop offset="70%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#57caff"/></marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/></marker>
    <marker id="arr-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ffd427"/></marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ff7daf"/></marker>
    <marker id="arr-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#e8eaed"/></marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="88" fill="#202124"/>

  <rect x="2" y="2" width="1084" height="84" rx="16" fill="url(#glass)" stroke="#5f6368" stroke-width="1.5"/>
  <circle cx="150" cy="44" r="70" fill="url(#amb-r)"/>
  <circle cx="938" cy="44" r="70" fill="url(#amb-g)"/>
  <line x1="160" y1="34" x2="928" y2="34" stroke="url(#grad-by)" stroke-width="4" stroke-linecap="round"/>
  <rect x="14" y="18" width="90" height="52" rx="12" fill="#17181b" stroke="#ff7daf" stroke-width="1.6"/>
  <text x="59" y="40" text-anchor="middle" class="m" font-size="10.5" fill="#ff7daf">CODE ONLY</text>
  <text x="59" y="57" text-anchor="middle" class="m" font-size="10" fill="#bdc1c6">0% human</text>
  <rect x="984" y="18" width="90" height="52" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="1.6"/>
  <text x="1029" y="40" text-anchor="middle" class="m" font-size="10.5" fill="#5cdb6d">JUDGMENT</text>
  <text x="1029" y="57" text-anchor="middle" class="m" font-size="10" fill="#bdc1c6">full human</text>
  
  <circle cx="160" cy="34" r="18" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.6" filter="url(#glow-s)"/>
  <text x="160" y="40" text-anchor="middle" class="t" font-size="15" fill="#ff7daf">1</text>
  <text x="160" y="72" text-anchor="middle" class="m" font-size="12" fill="#e8eaed">Hard Gate</text>
  <circle cx="314" cy="34" r="18" fill="url(#glass)" stroke="#ffd427" stroke-width="2.6" filter="url(#glow-s)"/>
  <text x="314" y="40" text-anchor="middle" class="t" font-size="15" fill="#ffd427">2</text>
  <text x="314" y="72" text-anchor="middle" class="m" font-size="12" fill="#e8eaed">Yes / No</text>
  <circle cx="467" cy="34" r="18" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.6" filter="url(#glow-s)"/>
  <text x="467" y="40" text-anchor="middle" class="t" font-size="15" fill="#5cdb6d">3</text>
  <text x="467" y="72" text-anchor="middle" class="m" font-size="12" fill="#e8eaed">Edit Args</text>
  <circle cx="621" cy="34" r="18" fill="url(#glass)" stroke="#ffd427" stroke-width="2.6" filter="url(#glow-s)"/>
  <text x="621" y="40" text-anchor="middle" class="t" font-size="15" fill="#ffd427">4</text>
  <text x="621" y="72" text-anchor="middle" class="m" font-size="12" fill="#e8eaed">Async Wait</text>
  <circle cx="774" cy="34" r="18" fill="url(#glass)" stroke="#57caff" stroke-width="2.6" filter="url(#glow-s)"/>
  <text x="774" y="40" text-anchor="middle" class="t" font-size="15" fill="#57caff">5</text>
  <text x="774" y="72" text-anchor="middle" class="m" font-size="12" fill="#e8eaed">Takeover</text>
  <circle cx="928" cy="34" r="18" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.6" filter="url(#glow-s)"/>
  <text x="928" y="40" text-anchor="middle" class="t" font-size="15" fill="#5cdb6d">6</text>
  <text x="928" y="72" text-anchor="middle" class="m" font-size="12" fill="#e8eaed">Graph Input</text>

</svg>
