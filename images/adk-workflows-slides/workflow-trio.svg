<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 240" width="1088" height="240">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/><stop offset="100%" stop-color="#57caff" stop-opacity="0"/></radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/><stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/></radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/><stop offset="100%" stop-color="#ffd427" stop-opacity="0"/></radialGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#57caff"/></marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/></marker>
    <marker id="arr-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ffd427"/></marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ff7daf"/></marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="240" fill="#202124"/>
  <circle cx="185" cy="120" r="120" fill="url(#amb-b)"/>
  <circle cx="544" cy="120" r="120" fill="url(#amb-g)"/>
  <circle cx="902" cy="120" r="120" fill="url(#amb-y)"/>

  <!-- 1. SEQUENTIAL -->
  <rect x="14" y="14" width="342" height="212" rx="18" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/>
  <rect x="30" y="28" width="166" height="24" rx="12" fill="#17181b" stroke="#57caff" stroke-width="1.4"/>
  <text x="113" y="44" text-anchor="middle" class="m" font-size="11.5" fill="#57caff" font-weight="600">SequentialAgent</text>
  <text x="338" y="44" text-anchor="end" class="m" font-size="11" fill="#9aa0a6">A → B → C</text>

  <g transform="translate(30, 86)">
    <rect x="0" y="0" width="84" height="58" rx="12" fill="#17181b" stroke="#57caff" stroke-width="2"/>
    <text x="42" y="27" text-anchor="middle" class="t" font-size="16" fill="#fff">Step A</text>
    <text x="42" y="45" text-anchor="middle" class="m" font-size="10.5" fill="#57caff">→ notes</text>

    <path d="M84 29 H108" stroke="#57caff" stroke-width="2.6" marker-end="url(#arr-b)"/>

    <rect x="112" y="0" width="84" height="58" rx="12" fill="#17181b" stroke="#57caff" stroke-width="2"/>
    <text x="154" y="27" text-anchor="middle" class="t" font-size="16" fill="#fff">Step B</text>
    <text x="154" y="45" text-anchor="middle" class="m" font-size="10.5" fill="#57caff">→ draft</text>

    <path d="M196 29 H220" stroke="#57caff" stroke-width="2.6" marker-end="url(#arr-b)"/>

    <rect x="224" y="0" width="84" height="58" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="2"/>
    <text x="266" y="27" text-anchor="middle" class="t" font-size="16" fill="#fff">Step C</text>
    <text x="266" y="45" text-anchor="middle" class="m" font-size="10.5" fill="#5cdb6d">→ final</text>
  </g>
  <text x="185" y="198" text-anchor="middle" class="m" font-size="11.5" fill="#bdc1c6">Strict order · passes data via output_key</text>

  <!-- 2. PARALLEL -->
  <rect x="373" y="14" width="342" height="212" rx="18" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2"/>
  <rect x="389" y="28" width="150" height="24" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="1.4"/>
  <text x="464" y="44" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d" font-weight="600">ParallelAgent</text>
  <text x="698" y="44" text-anchor="end" class="m" font-size="11" fill="#9aa0a6">Fan-out / Fan-in</text>

  <g transform="translate(389, 64)">
    <rect x="0" y="34" width="60" height="42" rx="10" fill="#17181b" stroke="#57caff" stroke-width="1.8"/>
    <text x="30" y="59" text-anchor="middle" class="m" font-size="11.5" fill="#57caff">Input</text>

    <!-- Fan-out lines -->
    <path d="M60 55 H78 M78 16 V94 M78 16 H98 M78 55 H98 M78 94 H98" fill="none" stroke="#5cdb6d" stroke-width="2.2"/>

    <!-- 3 concurrent branches -->
    <rect x="100" y="2" width="108" height="28" rx="8" fill="#17181b" stroke="#5cdb6d" stroke-width="1.8"/>
    <text x="154" y="20" text-anchor="middle" class="m" font-size="11" fill="#fff">Branch 1 → k1</text>

    <rect x="100" y="41" width="108" height="28" rx="8" fill="#17181b" stroke="#5cdb6d" stroke-width="1.8"/>
    <text x="154" y="59" text-anchor="middle" class="m" font-size="11" fill="#fff">Branch 2 → k2</text>

    <rect x="100" y="80" width="108" height="28" rx="8" fill="#17181b" stroke="#5cdb6d" stroke-width="1.8"/>
    <text x="154" y="98" text-anchor="middle" class="m" font-size="11" fill="#fff">Branch 3 → k3</text>

    <!-- Fan-in lines -->
    <path d="M208 16 H228 M208 55 H228 M208 94 H228 M228 16 V94 M228 55 H244" fill="none" stroke="#ffd427" stroke-width="2.2" marker-end="url(#arr-y)"/>

    <rect x="248" y="34" width="62" height="42" rx="10" fill="#17181b" stroke="#ffd427" stroke-width="2"/>
    <text x="279" y="59" text-anchor="middle" class="m" font-size="11.5" fill="#ffd427">Merge</text>
  </g>
  <text x="544" y="198" text-anchor="middle" class="m" font-size="11.5" fill="#bdc1c6">Concurrent execution · distinct keys</text>

  <!-- 3. LOOP -->
  <rect x="732" y="14" width="342" height="212" rx="18" fill="url(#glass)" stroke="#ffd427" stroke-width="2.2"/>
  <rect x="748" y="28" width="126" height="24" rx="12" fill="#17181b" stroke="#ffd427" stroke-width="1.4"/>
  <text x="811" y="44" text-anchor="middle" class="m" font-size="11.5" fill="#ffd427" font-weight="600">LoopAgent</text>
  <text x="1057" y="44" text-anchor="end" class="m" font-size="11" fill="#9aa0a6">max_iterations</text>

  <g transform="translate(748, 72)">
    <rect x="0" y="12" width="96" height="54" rx="12" fill="#17181b" stroke="#57caff" stroke-width="2"/>
    <text x="48" y="36" text-anchor="middle" class="t" font-size="15.5" fill="#fff">Draft</text>
    <text x="48" y="54" text-anchor="middle" class="m" font-size="10.5" fill="#57caff">Generator</text>

    <path d="M96 39 H126" stroke="#ffd427" stroke-width="2.6" marker-end="url(#arr-y)"/>

    <rect x="130" y="12" width="96" height="54" rx="12" fill="#17181b" stroke="#ffd427" stroke-width="2"/>
    <text x="178" y="36" text-anchor="middle" class="t" font-size="15.5" fill="#fff">Critic</text>
    <text x="178" y="54" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">Rubric check</text>

    <!-- Escalate exit -->
    <path d="M226 39 H258" stroke="#5cdb6d" stroke-width="2.6" marker-end="url(#arr-g)"/>
    <rect x="262" y="21" width="48" height="36" rx="10" fill="#17181b" stroke="#5cdb6d" stroke-width="2" filter="url(#glow-s)"/>
    <text x="286" y="43" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d" font-weight="600">PASS</text>

    <!-- Retry arc back -->
    <path d="M178 66 C178 102 48 102 48 70" fill="none" stroke="#ff7daf" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#arr-r)"/>
    <rect x="76" y="84" width="76" height="20" rx="10" fill="#202124" stroke="#ff7daf" stroke-width="1.3"/>
    <text x="114" y="98" text-anchor="middle" class="m" font-size="10" fill="#ff7daf">retry + fix</text>
  </g>
  <text x="903" y="198" text-anchor="middle" class="m" font-size="11.5" fill="#bdc1c6">Repeats until escalate=True or ceiling</text>
</svg>
