<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="256" height="256" fill="#202124"/>
  <circle cx="128" cy="108" r="92" fill="url(#amb-r)"/>
  <circle cx="164" cy="148" r="70" fill="url(#amb-g)"/>
  <circle cx="128" cy="122" r="98" fill="none" stroke="#ff7daf" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.38"/>

  <!-- Pydantic Schema Shield -->
  <g transform="translate(128, 96)">
    <path d="M0 -62 L52 -42 V4 C52 38 28 58 0 68 C-28 58 -52 38 -52 4 V-42 Z" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.8" filter="url(#glow-s)"/>
    <text x="0" y="-12" text-anchor="middle" class="m" font-size="13" fill="#ff7daf" font-weight="600">PYDANTIC</text>
    <text x="0" y="14" text-anchor="middle" class="m" font-size="22" fill="#fff" font-weight="600">{ }</text>
    <circle cx="34" cy="36" r="16" fill="#202124" stroke="#5cdb6d" stroke-width="2.5" filter="url(#glow-s)"/>
    <path d="M27 36 L32 41 L42 30" fill="none" stroke="#5cdb6d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Mini Marathon Coach pipeline strip -->
  <g transform="translate(26, 178)">
    <rect x="0" y="0" width="56" height="26" rx="8" fill="url(#glass)" stroke="#57caff" stroke-width="1.8"/>
    <text x="28" y="17" text-anchor="middle" class="m" font-size="10" fill="#57caff">PAR</text>
    <path d="M58 13 H70" stroke="#bdc1c6" stroke-width="2"/>
    <rect x="72" y="0" width="60" height="26" rx="8" fill="url(#glass)" stroke="#ffd427" stroke-width="1.8"/>
    <text x="102" y="17" text-anchor="middle" class="m" font-size="10" fill="#ffd427">LOOP</text>
    <path d="M134 13 H146" stroke="#bdc1c6" stroke-width="2"/>
    <rect x="148" y="0" width="56" height="26" rx="8" fill="url(#glass)" stroke="#5cdb6d" stroke-width="1.8"/>
    <text x="176" y="17" text-anchor="middle" class="m" font-size="10" fill="#5cdb6d">JSON</text>
  </g>

  <text x="128" y="232" text-anchor="middle" class="m" font-size="11.5" fill="#ff7daf">PRODUCTION PATTERNS</text>
</svg>
