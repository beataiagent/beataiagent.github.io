<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="256" height="256" fill="#202124"/>
  <circle cx="80" cy="84" r="82" fill="url(#amb-b)"/>
  <circle cx="176" cy="84" r="76" fill="url(#amb-g)"/>
  <circle cx="80" cy="168" r="76" fill="url(#amb-y)"/>
  <circle cx="176" cy="168" r="76" fill="url(#amb-r)"/>
  <circle cx="128" cy="122" r="98" fill="none" stroke="#57caff" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.38"/>

  <!-- Interlocking connectors -->
  <path d="M114 78 H142 M128 112 V134 M114 166 H142 M82 112 V134 M174 112 V134" stroke="#5f6368" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="128" cy="122" r="10" fill="#202124" stroke="#57caff" stroke-width="2.2" filter="url(#glow-s)"/>
  <circle cx="128" cy="122" r="3.5" fill="#57caff"/>

  <!-- Block 1: LLM (Blue) -->
  <g transform="translate(36, 38)">
    <rect width="80" height="74" rx="16" fill="url(#glass)" stroke="#57caff" stroke-width="2.4"/>
    <!-- Mini robot face -->
    <rect x="20" y="12" width="40" height="26" rx="10" fill="#17181b" stroke="#57caff" stroke-width="1.8"/>
    <circle cx="32" cy="24" r="3.2" fill="#57caff" filter="url(#glow-s)"/>
    <circle cx="48" cy="24" r="3.2" fill="#57caff" filter="url(#glow-s)"/>
    <path d="M35 31 Q40 35 45 31" fill="none" stroke="#57caff" stroke-width="2" stroke-linecap="round"/>
    <text x="40" y="59" text-anchor="middle" class="m" font-size="13" fill="#57caff" font-weight="600">LLM</text>
  </g>

  <!-- Block 2: SEQ (Green) -->
  <g transform="translate(140, 38)">
    <rect width="80" height="74" rx="16" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.4"/>
    <circle cx="22" cy="26" r="5" fill="#5cdb6d"/>
    <path d="M29 26 H37" stroke="#5cdb6d" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="41" cy="26" r="5" fill="#5cdb6d" opacity="0.8"/>
    <path d="M48 26 H56" stroke="#5cdb6d" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="60" cy="26" r="5" fill="#5cdb6d" filter="url(#glow-s)"/>
    <text x="40" y="59" text-anchor="middle" class="m" font-size="13" fill="#5cdb6d" font-weight="600">SEQ</text>
  </g>

  <!-- Block 3: PAR (Yellow) -->
  <g transform="translate(36, 132)">
    <rect width="80" height="74" rx="16" fill="url(#glass)" stroke="#ffd427" stroke-width="2.4"/>
    <path d="M18 26 H30 M30 16 V36 M30 16 H52 M30 26 H52 M30 36 H52 M52 16 V36 M52 26 H62" fill="none" stroke="#ffd427" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="41" cy="16" r="3" fill="#ffd427"/>
    <circle cx="41" cy="26" r="3" fill="#ffd427"/>
    <circle cx="41" cy="36" r="3" fill="#ffd427"/>
    <text x="40" y="59" text-anchor="middle" class="m" font-size="13" fill="#ffd427" font-weight="600">PAR</text>
  </g>

  <!-- Block 4: LOOP (Pink) -->
  <g transform="translate(140, 132)">
    <rect width="80" height="74" rx="16" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.4"/>
    <path d="M26 24 A14 14 0 1 1 54 24" fill="none" stroke="#ff7daf" stroke-width="2.4" stroke-linecap="round"/>
    <polygon points="54,28 49,21 58,21" fill="#ff7daf"/>
    <path d="M54 28 A14 14 0 1 1 26 28" fill="none" stroke="#ff7daf" stroke-width="2.4" stroke-linecap="round" opacity="0.65"/>
    <text x="40" y="59" text-anchor="middle" class="m" font-size="13" fill="#ff7daf" font-weight="600">LOOP</text>
  </g>

  <text x="128" y="232" text-anchor="middle" class="m" font-size="11.5" fill="#57caff">AGENT BUILDING BLOCKS</text>
</svg>
