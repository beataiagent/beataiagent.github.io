<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 240" width="1088" height="240">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/><stop offset="100%" stop-color="#57caff" stop-opacity="0"/></radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/><stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/></radialGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#57caff"/></marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/></marker>
    <marker id="arr-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ffd427"/></marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="240" fill="#202124"/>
  <circle cx="278" cy="120" r="150" fill="url(#amb-b)"/>
  <circle cx="810" cy="120" r="150" fill="url(#amb-g)"/>

  <!-- LEFT: sub_agents (Baton Handoff) -->
  <rect x="14" y="14" width="522" height="212" rx="18" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/>
  <rect x="30" y="26" width="236" height="24" rx="12" fill="#17181b" stroke="#57caff" stroke-width="1.4"/>
  <text x="148" y="42" text-anchor="middle" class="m" font-size="11.5" fill="#57caff" font-weight="600">sub_agents=[...] · HANDOFF</text>
  <text x="518" y="42" text-anchor="end" class="m" font-size="11" fill="#9aa0a6">transfer_to_agent</text>

  <!-- User icon -->
  <g transform="translate(64, 118)">
    <circle cx="0" cy="-14" r="13" fill="#ffe0b2" stroke="#ffd427" stroke-width="2"/>
    <path d="M-18 22 C-18 6 -10 2 0 2 C10 2 18 6 18 22 Z" fill="#1b1d22" stroke="#ffd427" stroke-width="2"/>
    <text x="0" y="38" text-anchor="middle" class="m" font-size="11" fill="#ffd427">User</text>
  </g>
  <path d="M88 108 H134" stroke="#ffd427" stroke-width="2.4" marker-end="url(#arr-y)"/>

  <!-- Coordinator -->
  <rect x="140" y="76" width="128" height="68" rx="14" fill="#17181b" stroke="#57caff" stroke-width="2"/>
  <text x="204" y="106" text-anchor="middle" class="t" font-size="15">Coordinator</text>
  <text x="204" y="126" text-anchor="middle" class="m" font-size="10.5" fill="#57caff">passes baton →</text>

  <!-- Baton transfer arrow -->
  <path d="M268 110 H352" stroke="#57caff" stroke-width="3" marker-end="url(#arr-b)"/>
  <rect x="278" y="82" width="64" height="20" rx="10" fill="#202124" stroke="#57caff" stroke-width="1.4"/>
  <text x="310" y="96" text-anchor="middle" class="m" font-size="10" fill="#57caff">HANDOFF</text>

  <!-- Specialist -->
  <rect x="358" y="76" width="156" height="68" rx="14" fill="#17181b" stroke="#57caff" stroke-width="2.4" filter="url(#glow-s)"/>
  <text x="436" y="106" text-anchor="middle" class="t" font-size="15" fill="#57caff">Specialist</text>
  <text x="436" y="126" text-anchor="middle" class="m" font-size="10.5" fill="#e8eaed">owns conversation</text>

  <!-- Direct reply arrow from Specialist to User -->
  <path d="M436 144 C436 178 88 178 82 146" fill="none" stroke="#57caff" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#arr-b)"/>
  <rect x="202" y="160" width="152" height="20" rx="10" fill="#202124" stroke="#57caff" stroke-width="1.3"/>
  <text x="278" y="174" text-anchor="middle" class="m" font-size="10.5" fill="#57caff">Replies directly to User</text>
  <text x="275" y="210" text-anchor="middle" class="m" font-size="11.5" fill="#bdc1c6">Full session history shared · Specialist handles follow-ups</text>

  <!-- RIGHT: AgentTool (Call & Return) -->
  <rect x="552" y="14" width="522" height="212" rx="18" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2"/>
  <rect x="568" y="26" width="246" height="24" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="1.4"/>
  <text x="691" y="42" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d" font-weight="600">AgentTool(...) · CALL &amp; RETURN</text>
  <text x="1056" y="42" text-anchor="end" class="m" font-size="11" fill="#9aa0a6">tools=[...]</text>

  <!-- User icon -->
  <g transform="translate(602, 118)">
    <circle cx="0" cy="-14" r="13" fill="#ffe0b2" stroke="#ffd427" stroke-width="2"/>
    <path d="M-18 22 C-18 6 -10 2 0 2 C10 2 18 6 18 22 Z" fill="#1b1d22" stroke="#ffd427" stroke-width="2"/>
    <text x="0" y="38" text-anchor="middle" class="m" font-size="11" fill="#ffd427">User</text>
  </g>
  <!-- Bidirectional User <-> Parent -->
  <path d="M626 102 H674" stroke="#ffd427" stroke-width="2.4" marker-end="url(#arr-y)"/>
  <path d="M674 122 H626" stroke="#5cdb6d" stroke-width="2.4" marker-end="url(#arr-g)"/>

  <!-- Parent Agent -->
  <rect x="680" y="76" width="136" height="68" rx="14" fill="#17181b" stroke="#5cdb6d" stroke-width="2.4" filter="url(#glow-s)"/>
  <text x="748" y="106" text-anchor="middle" class="t" font-size="15" fill="#5cdb6d">Parent Agent</text>
  <text x="748" y="126" text-anchor="middle" class="m" font-size="10.5" fill="#e8eaed">keeps control</text>

  <!-- Call & Return arrows -->
  <path d="M816 96 H898" stroke="#5cdb6d" stroke-width="2.4" marker-end="url(#arr-g)"/>
  <text x="857" y="88" text-anchor="middle" class="m" font-size="10" fill="#5cdb6d">call(args)</text>
  <path d="M898 124 H816" stroke="#ffd427" stroke-width="2.4" stroke-dasharray="5 3" marker-end="url(#arr-y)"/>
  <text x="857" y="140" text-anchor="middle" class="m" font-size="10" fill="#ffd427">return data</text>

  <!-- Helper AgentTool -->
  <rect x="904" y="76" width="148" height="68" rx="14" fill="#17181b" stroke="#ffd427" stroke-width="2"/>
  <text x="978" y="106" text-anchor="middle" class="t" font-size="15">Helper Agent</text>
  <text x="978" y="126" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">scoped tool call</text>

  <rect x="646" y="160" width="222" height="20" rx="10" fill="#202124" stroke="#5cdb6d" stroke-width="1.3"/>
  <text x="757" y="174" text-anchor="middle" class="m" font-size="10.5" fill="#5cdb6d">Parent synthesizes final reply</text>
  <text x="813" y="210" text-anchor="middle" class="m" font-size="11.5" fill="#bdc1c6">Only explicit args passed · Parent stays single front door</text>
</svg>
