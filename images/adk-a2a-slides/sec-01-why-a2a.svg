<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#57caff"/></marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/></marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="256" height="256" fill="#202124"/>

  <circle cx="72" cy="132" r="88" fill="url(#amb-b)"/>
  <circle cx="186" cy="132" r="88" fill="url(#amb-g)"/>

  <!-- Two cloud silo containers -->
  <rect x="18" y="64" width="88" height="128" rx="18" fill="url(#glass)" stroke="#57caff" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.9"/>
  <rect x="150" y="64" width="88" height="128" rx="18" fill="url(#glass)" stroke="#5cdb6d" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.9"/>
  <text x="62" y="84" text-anchor="middle" class="m" font-size="10" fill="#57caff">CLOUD A</text>
  <text x="194" y="84" text-anchor="middle" class="m" font-size="10" fill="#5cdb6d">CLOUD B</text>

  <!-- Glowing A2A Bridge Arcs -->
  <path d="M96 122 C116 96 140 96 160 122" fill="none" stroke="#57caff" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-b)" filter="url(#glow-s)"/>
  <path d="M160 150 C140 176 116 176 96 150" fill="none" stroke="#5cdb6d" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-g)" filter="url(#glow-s)"/>

  <!-- Left Robot (Blue) -->
  <g transform="translate(62,140) scale(0.62)">
    <line x1="0" y1="-44" x2="0" y2="-56" stroke="#57caff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-60" r="5.5" fill="#57caff" filter="url(#glow-s)"/>
    <rect x="-36" y="-44" width="72" height="54" rx="22" fill="#e8eaed" stroke="#57caff" stroke-width="2.8"/>
    <rect x="-25" y="-33" width="50" height="32" rx="13" fill="#1b1d22"/>
    <circle cx="-11" cy="-18" r="5" fill="#57caff" filter="url(#glow-s)"/>
    <circle cx="11" cy="-18" r="5" fill="#57caff" filter="url(#glow-s)"/>
    <path d="M-7 -8 Q0 -3 7 -8" fill="none" stroke="#57caff" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M-24 14 H24 C28 14 26 42 0 46 C-26 42 -28 14 -24 14 Z" fill="#cfd4dc" stroke="#57caff" stroke-width="2.2"/>
    <circle cx="0" cy="28" r="6" fill="#57caff" opacity="0.9"/>
  </g>

  <!-- Right Robot (Green) -->
  <g transform="translate(194,140) scale(0.62)">
    <line x1="0" y1="-44" x2="0" y2="-56" stroke="#5cdb6d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-60" r="5.5" fill="#5cdb6d" filter="url(#glow-s)"/>
    <rect x="-36" y="-44" width="72" height="54" rx="22" fill="#e8eaed" stroke="#5cdb6d" stroke-width="2.8"/>
    <rect x="-25" y="-33" width="50" height="32" rx="13" fill="#1b1d22"/>
    <circle cx="-11" cy="-18" r="5" fill="#5cdb6d" filter="url(#glow-s)"/>
    <circle cx="11" cy="-18" r="5" fill="#5cdb6d" filter="url(#glow-s)"/>
    <path d="M-7 -8 Q0 -3 7 -8" fill="none" stroke="#5cdb6d" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M-24 14 H24 C28 14 26 42 0 46 C-26 42 -28 14 -24 14 Z" fill="#cfd4dc" stroke="#5cdb6d" stroke-width="2.2"/>
    <circle cx="0" cy="28" r="6" fill="#5cdb6d" opacity="0.9"/>
  </g>

  <!-- Center A2A pill -->
  <g transform="translate(128, 42)">
    <rect x="-44" y="-15" width="88" height="30" rx="15" fill="url(#glass-hi)" stroke="url(#grad-bg)" stroke-width="2.2" filter="url(#glow-s)"/>
    <text x="0" y="5" text-anchor="middle" class="m" font-size="13" fill="#ffffff" font-weight="600">A2A</text>
  </g>

  <text x="128" y="228" text-anchor="middle" class="m" font-size="12" fill="#57caff">BRIDGE AGENT SILOS</text>
</svg>
