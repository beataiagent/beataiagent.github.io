<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 260" width="1088" height="260">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.99"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#57caff"/></marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/></marker>
    <marker id="arr-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ffd427"/></marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ff7daf"/></marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="260" fill="#202124"/>

  <circle cx="170" cy="130" r="120" fill="url(#amb-b)"/>
  <circle cx="720" cy="64" r="100" fill="url(#amb-g)"/>
  <circle cx="720" cy="196" r="100" fill="url(#amb-r)"/>
  <circle cx="960" cy="130" r="100" fill="url(#amb-y)"/>

  <!-- Left: ADK Coordinator Hub -->
  <rect x="24" y="34" width="280" height="192" rx="20" fill="url(#glass-hi)" stroke="#57caff" stroke-width="2.5" filter="url(#glow-s)"/>
  <g transform="translate(164, 102) scale(0.62)">
    <line x1="0" y1="-44" x2="0" y2="-56" stroke="#57caff" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="0" cy="-60" r="6" fill="#57caff" filter="url(#glow-s)"/>
    <rect x="-36" y="-44" width="72" height="54" rx="22" fill="#e8eaed" stroke="#57caff" stroke-width="3"/>
    <rect x="-25" y="-33" width="50" height="32" rx="13" fill="#1b1d22"/>
    <circle cx="-11" cy="-18" r="5" fill="#57caff"/><circle cx="11" cy="-18" r="5" fill="#57caff"/>
    <path d="M-7 -8 Q0 -3 7 -8" fill="none" stroke="#57caff" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M-24 14 H24 C28 14 26 40 0 44 C-26 40 -28 14 -24 14 Z" fill="#cfd4dc" stroke="#57caff" stroke-width="2.2"/>
  </g>
  <text x="164" y="160" text-anchor="middle" class="t" font-size="18">ADK Coordinator</text>
  <text x="164" y="182" text-anchor="middle" class="m" font-size="12" fill="#57caff">sub_agents = [local, remote...]</text>
  <rect x="78" y="194" width="172" height="22" rx="11" fill="#17181b" stroke="#57caff" stroke-width="1.3"/>
  <text x="164" y="209" text-anchor="middle" class="m" font-size="10.5" fill="#ffffff">LlmAgent + RemoteA2aAgent</text>

  <!-- Fan-out paths -->
  <!-- Local in-process -->
  <path d="M304 82 C360 52 385 48 446 48" fill="none" stroke="#5cdb6d" stroke-width="2.8" marker-end="url(#arr-g)"/>
  <rect x="330" y="34" width="82" height="20" rx="10" fill="#17181b" stroke="#5cdb6d" stroke-width="1.3"/>
  <text x="371" y="48" text-anchor="middle" class="m" font-size="10" fill="#5cdb6d">in-process</text>

  <!-- Remote A2A #1 -->
  <path d="M304 114 C368 102 392 102 446 102" fill="none" stroke="#57caff" stroke-width="2.8" stroke-dasharray="6 4" marker-end="url(#arr-b)"/>
  <!-- Remote A2A #2 -->
  <path d="M304 146 C368 158 392 158 446 158" fill="none" stroke="#ffd427" stroke-width="2.8" stroke-dasharray="6 4" marker-end="url(#arr-y)"/>
  <!-- Remote A2A #3 -->
  <path d="M304 178 C360 208 385 212 446 212" fill="none" stroke="#ff7daf" stroke-width="2.8" stroke-dasharray="6 4" marker-end="url(#arr-r)"/>

  <rect x="342" y="120" width="60" height="22" rx="11" fill="#17181b" stroke="#57caff" stroke-width="1.5"/>
  <text x="372" y="135" text-anchor="middle" class="m" font-size="11" fill="#57caff" font-weight="600">A2A</text>

  <!-- Right 4 Target Cards (2x2 or 4 stacked rows — 4 crisp rows on right for max clarity!) -->
  <!-- Row 1: Local LlmAgent -->
  <rect x="454" y="20" width="610" height="48" rx="12" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
  <rect x="468" y="32" width="76" height="24" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="1.4"/>
  <text x="506" y="48" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d">LOCAL</text>
  <text x="558" y="49" class="t" font-size="16">ADK LlmAgent</text>
  <text x="706" y="49" class="m" font-size="12.5" fill="#bdc1c6">Same Python process · shared session state</text>

  <!-- Row 2: Remote ADK Service -->
  <rect x="454" y="78" width="610" height="48" rx="12" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <rect x="468" y="90" width="76" height="24" rx="12" fill="#17181b" stroke="#57caff" stroke-width="1.4"/>
  <text x="506" y="106" text-anchor="middle" class="m" font-size="11" fill="#57caff">ADK</text>
  <text x="558" y="107" class="t" font-size="16">ADK Remote Service</text>
  <text x="742" y="107" class="m" font-size="12.5" fill="#bdc1c6">to_a2a() · Cloud Run · Python / Go / Java</text>

  <!-- Row 3: Remote LangGraph -->
  <rect x="454" y="136" width="610" height="48" rx="12" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  <rect x="468" y="148" width="76" height="24" rx="12" fill="#17181b" stroke="#ffd427" stroke-width="1.4"/>
  <text x="506" y="164" text-anchor="middle" class="m" font-size="11" fill="#ffd427">A2A SDK</text>
  <text x="558" y="165" class="t" font-size="16">LangGraph Agent</text>
  <text x="720" y="165" class="m" font-size="12.5" fill="#bdc1c6">Stateful graph &amp; checkpoints behind A2A</text>

  <!-- Row 4: Remote CrewAI / Vertex AI -->
  <rect x="454" y="194" width="610" height="48" rx="12" fill="url(#glass)" stroke="#ff7daf" stroke-width="2"/>
  <rect x="468" y="206" width="76" height="24" rx="12" fill="#17181b" stroke="#ff7daf" stroke-width="1.4"/>
  <text x="506" y="222" text-anchor="middle" class="m" font-size="11" fill="#ff7daf">MANAGED</text>
  <text x="558" y="223" class="t" font-size="16">CrewAI / Vertex AI Agent Engine</text>
  <text x="830" y="223" class="m" font-size="12.5" fill="#bdc1c6">Multi-agent crew or SaaS</text>
</svg>
