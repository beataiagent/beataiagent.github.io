<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 260" width="1088" height="260">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.99"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#57caff"/></marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/></marker>
    <marker id="arr-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ffd427"/></marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ff7daf"/></marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="260" fill="#202124"/>

  <circle cx="544" cy="54" r="140" fill="url(#amb-b)"/>
  <circle cx="195" cy="195" r="110" fill="url(#amb-g)"/>
  <circle cx="544" cy="195" r="110" fill="url(#amb-y)"/>
  <circle cx="893" cy="195" r="110" fill="url(#amb-r)"/>

  <!-- Top Row: Web UI -> Orchestrator on Cloud Run -->
  <rect x="26" y="18" width="214" height="68" rx="14" fill="url(#glass)" stroke="#9aa0a6" stroke-width="1.8"/>
  <text x="133" y="48" text-anchor="middle" class="t" font-size="16">Web / App UI</text>
  <text x="133" y="69" text-anchor="middle" class="m" font-size="11.5">User Prompt &amp; SSE</text>

  <line x1="240" y1="52" x2="316" y2="52" stroke="#57caff" stroke-width="2.8" marker-end="url(#arr-b)"/>

  <rect x="324" y="14" width="738" height="76" rx="16" fill="url(#glass-hi)" stroke="#57caff" stroke-width="2.4" filter="url(#glow-s)"/>
  <g transform="translate(364, 52) scale(0.45)">
    <line x1="0" y1="-44" x2="0" y2="-56" stroke="#57caff" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="0" cy="-60" r="6" fill="#57caff"/>
    <rect x="-36" y="-44" width="72" height="54" rx="22" fill="#e8eaed" stroke="#57caff" stroke-width="3"/>
    <rect x="-25" y="-33" width="50" height="32" rx="13" fill="#1b1d22"/>
    <circle cx="-11" cy="-18" r="5" fill="#57caff"/><circle cx="11" cy="-18" r="5" fill="#57caff"/>
    <path d="M-7 -8 Q0 -3 7 -8" fill="none" stroke="#57caff" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M-24 14 H24 C28 14 26 40 0 44 C-26 40 -28 14 -24 14 Z" fill="#cfd4dc" stroke="#57caff" stroke-width="2.2"/>
  </g>
  <text x="400" y="45" class="t" font-size="17.5">Orchestrator Agent (ADK on Cloud Run)</text>
  <text x="400" y="68" class="m" font-size="12" fill="#bdc1c6">Plans workflow · delegates via RemoteA2aAgent + Cloud Trace</text>
  <rect x="896" y="34" width="146" height="32" rx="16" fill="#17181b" stroke="#57caff" stroke-width="1.6"/>
  <text x="969" y="55" text-anchor="middle" class="m" font-size="12" fill="#57caff">HTTPS + OIDC</text>

  <!-- A2A Bus connectors from Orchestrator to 3 Microservices -->
  <path d="M544 90 V110 H190 V132" fill="none" stroke="#5cdb6d" stroke-width="2.6" marker-end="url(#arr-g)"/>
  <path d="M544 90 V132" fill="none" stroke="#ffd427" stroke-width="2.6" marker-end="url(#arr-y)"/>
  <path d="M544 90 V110 H898 V132" fill="none" stroke="#ff7daf" stroke-width="2.6" marker-end="url(#arr-r)"/>

  <rect x="424" y="98" width="240" height="22" rx="11" fill="#17181b" stroke="#57caff" stroke-width="1.4"/>
  <text x="544" y="113" text-anchor="middle" class="m" font-size="10.5" fill="#57caff">A2A · JSON-RPC 2.0 + SSE</text>

  <!-- Bottom 3 Specialist Microservices -->
  <!-- Service 1: Telemetry & Weather -->
  <rect x="26" y="140" width="328" height="106" rx="16" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2"/>
  <text x="46" y="168" class="t" font-size="16" fill="#5cdb6d">Telemetry &amp; Weather Agent</text>
  <text x="46" y="190" class="sub" font-size="13">Formula E track &amp; sensor data via MCP</text>
  <rect x="46" y="206" width="84" height="24" rx="7" fill="#17181b" stroke="#5cdb6d" stroke-width="1.2"/>
  <text x="88" y="222" text-anchor="middle" class="m" font-size="10.5" fill="#e8eaed">Cloud Run</text>
  <rect x="138" y="206" width="76" height="24" rx="7" fill="#17181b" stroke="#5f6368" stroke-width="1.2"/>
  <text x="176" y="222" text-anchor="middle" class="m" font-size="10.5" fill="#e8eaed">IAM SA-1</text>
  <rect x="222" y="206" width="54" height="24" rx="7" fill="#17181b" stroke="#ffd427" stroke-width="1.2"/>
  <text x="249" y="222" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">MCP</text>

  <!-- Service 2: Strategy & Data -->
  <rect x="380" y="140" width="328" height="106" rx="16" fill="url(#glass)" stroke="#ffd427" stroke-width="2.2"/>
  <text x="400" y="168" class="t" font-size="16" fill="#ffd427">Strategy &amp; Data Agent</text>
  <text x="400" y="190" class="sub" font-size="13">Queries BigQuery · returns JSON DataPart</text>
  <rect x="400" y="206" width="106" height="24" rx="7" fill="#17181b" stroke="#ffd427" stroke-width="1.2"/>
  <text x="453" y="222" text-anchor="middle" class="m" font-size="10.5" fill="#e8eaed">Agent Engine</text>
  <rect x="514" y="206" width="76" height="24" rx="7" fill="#17181b" stroke="#5f6368" stroke-width="1.2"/>
  <text x="552" y="222" text-anchor="middle" class="m" font-size="10.5" fill="#e8eaed">IAM SA-2</text>
  <rect x="598" y="206" width="84" height="24" rx="7" fill="#17181b" stroke="#57caff" stroke-width="1.2"/>
  <text x="640" y="222" text-anchor="middle" class="m" font-size="10.5" fill="#57caff">BigQuery</text>

  <!-- Service 3: Creative Studio -->
  <rect x="734" y="140" width="328" height="106" rx="16" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.2"/>
  <text x="754" y="168" class="t" font-size="16" fill="#ff7daf">Creative Studio Agent</text>
  <text x="754" y="190" class="sub" font-size="13">Generates media · returns FilePart artifacts</text>
  <rect x="754" y="206" width="84" height="24" rx="7" fill="#17181b" stroke="#ff7daf" stroke-width="1.2"/>
  <text x="796" y="222" text-anchor="middle" class="m" font-size="10.5" fill="#e8eaed">Cloud Run</text>
  <rect x="846" y="206" width="76" height="24" rx="7" fill="#17181b" stroke="#5f6368" stroke-width="1.2"/>
  <text x="884" y="222" text-anchor="middle" class="m" font-size="10.5" fill="#e8eaed">IAM SA-3</text>
  <rect x="930" y="206" width="74" height="24" rx="7" fill="#17181b" stroke="#57caff" stroke-width="1.2"/>
  <text x="967" y="222" text-anchor="middle" class="m" font-size="10.5" fill="#57caff">Gemini</text>
</svg>
