<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.99"/>
    </linearGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="256" height="256" fill="#202124"/>

  <circle cx="128" cy="122" r="102" fill="url(#amb-r)"/>
  <circle cx="128" cy="122" r="70" fill="url(#amb-b)"/>

  <!-- Mesh ring & corner agent nodes -->
  <circle cx="128" cy="120" r="84" fill="none" stroke="#ff7daf" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.5"/>
  <line x1="60" y1="68" x2="128" y2="120" stroke="#57caff" stroke-width="2" opacity="0.65"/>
  <line x1="196" y1="68" x2="128" y2="120" stroke="#5cdb6d" stroke-width="2" opacity="0.65"/>
  <line x1="60" y1="172" x2="128" y2="120" stroke="#ffd427" stroke-width="2" opacity="0.65"/>
  <line x1="196" y1="172" x2="128" y2="120" stroke="#ff7daf" stroke-width="2" opacity="0.65"/>

  <circle cx="60" cy="68" r="14" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <circle cx="60" cy="68" r="5" fill="#57caff"/>
  <circle cx="196" cy="68" r="14" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
  <circle cx="196" cy="68" r="5" fill="#5cdb6d"/>
  <circle cx="60" cy="172" r="14" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  <circle cx="60" cy="172" r="5" fill="#ffd427"/>
  <circle cx="196" cy="172" r="14" fill="url(#glass)" stroke="#ff7daf" stroke-width="2"/>
  <circle cx="196" cy="172" r="5" fill="#ff7daf"/>

  <!-- Center Shield + Padlock -->
  <g transform="translate(128, 120)">
    <path d="M0 -52 L44 -34 V4 C44 34 24 52 0 60 C-24 52 -44 34 -44 4 V-34 Z" fill="url(#glass-hi)" stroke="#ff7daf" stroke-width="2.8" filter="url(#glow-s)"/>
    <!-- Lock -->
    <path d="M-12 -4 V-14 A12 12 0 0 1 12 -14 V-4" fill="none" stroke="#ffd427" stroke-width="3.2" stroke-linecap="round"/>
    <rect x="-18" y="-4" width="36" height="28" rx="7" fill="#17181b" stroke="#ffd427" stroke-width="2.4"/>
    <circle cx="0" cy="8" r="3.8" fill="#ffd427"/>
    <line x1="0" y1="11" x2="0" y2="17" stroke="#ffd427" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Top badge -->
  <rect x="78" y="20" width="100" height="24" rx="12" fill="#17181b" stroke="#ff7daf" stroke-width="1.6"/>
  <text x="128" y="36" text-anchor="middle" class="m" font-size="10.5" fill="#ff7daf">OIDC · IAM</text>

  <text x="128" y="232" text-anchor="middle" class="m" font-size="12" fill="#ff7daf">ZERO-TRUST MESH</text>
</svg>
