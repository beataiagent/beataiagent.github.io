<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.99"/>
    </linearGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="256" height="256" fill="#202124"/>

  <circle cx="110" cy="112" r="96" fill="url(#amb-g)"/>
  <circle cx="172" cy="156" r="80" fill="url(#amb-y)"/>

  <!-- Glowing Agent Card -->
  <rect x="26" y="34" width="166" height="114" rx="18" fill="url(#glass-hi)" stroke="#5cdb6d" stroke-width="2.4" filter="url(#glow-s)"/>
  <rect x="40" y="50" width="40" height="40" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="1.8"/>
  <!-- Mini robot face inside badge -->
  <rect x="48" y="60" width="24" height="18" rx="6" fill="#e8eaed"/>
  <rect x="52" y="64" width="16" height="10" rx="3.5" fill="#1b1d22"/>
  <circle cx="57" cy="69" r="2.2" fill="#5cdb6d"/>
  <circle cx="63" cy="69" r="2.2" fill="#5cdb6d"/>
  <!-- Card lines -->
  <text x="90" y="65" class="t" font-size="13" fill="#ffffff">agent.json</text>
  <rect x="90" y="74" width="84" height="6" rx="3" fill="#5cdb6d" opacity="0.55"/>
  <rect x="90" y="85" width="62" height="6" rx="3" fill="#57caff" opacity="0.5"/>
  <!-- Skill pills -->
  <rect x="40" y="106" width="54" height="22" rx="11" fill="#17181b" stroke="#57caff" stroke-width="1.4"/>
  <text x="67" y="121" text-anchor="middle" class="m" font-size="9.5" fill="#57caff">skills</text>
  <rect x="102" y="106" width="72" height="22" rx="11" fill="#17181b" stroke="#ffd427" stroke-width="1.4"/>
  <text x="138" y="121" text-anchor="middle" class="m" font-size="9.5" fill="#ffd427">stream:true</text>

  <!-- Task State Wheel (bottom right) -->
  <g transform="translate(174, 154)">
    <circle cx="0" cy="0" r="46" fill="url(#glass)" stroke="#3c4043" stroke-width="2"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#5cdb6d" stroke-width="3.5" stroke-dasharray="48 166" stroke-dashoffset="0" filter="url(#glow-s)"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#ffd427" stroke-width="3.5" stroke-dasharray="48 166" stroke-dashoffset="-70"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#57caff" stroke-width="3.5" stroke-dasharray="48 166" stroke-dashoffset="-140"/>
    <circle cx="0" cy="-34" r="5" fill="#57caff"/>
    <circle cx="29" cy="17" r="5" fill="#ffd427"/>
    <circle cx="-29" cy="17" r="5" fill="#5cdb6d"/>
    <text x="0" y="-2" text-anchor="middle" class="m" font-size="10.5" fill="#ffffff" font-weight="600">TASK</text>
    <text x="0" y="12" text-anchor="middle" class="m" font-size="9" fill="#5cdb6d">STATES</text>
  </g>

  <text x="128" y="230" text-anchor="middle" class="m" font-size="12" fill="#5cdb6d">CARDS + TASK LIFECYCLE</text>
</svg>
