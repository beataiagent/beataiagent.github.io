<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130">
  <defs>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #1e1e1e; font-weight: 700; }
      .s { font-family: "Google Sans", system-ui, sans-serif; fill: #3c4043; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #1e1e1e; font-weight: 500; }
      .ink { stroke: #1e1e1e; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Left: Token-by-token slow typing -->
  <rect x="2" y="4" width="482" height="122" rx="22" fill="#f0f0f0" class="ink"/>
  <rect x="18" y="22" width="120" height="86" rx="16" fill="#fff" class="ink"/>
  <text x="78" y="58" text-anchor="middle" class="t" font-size="16">Prompt</text>
  <text x="78" y="80" text-anchor="middle" class="m" font-size="12" fill="#5f6368">+ input</text>
  <path d="M146 65 H176 M168 58 L176 65 L168 72" fill="none" class="ink"/>
  <rect x="184" y="22" width="176" height="86" rx="16" fill="#f8d8d8" class="ink"/>
  <text x="272" y="47" text-anchor="middle" class="m" font-size="12">t1 → t2 → t3 → ...</text>
  <rect x="200" y="58" width="144" height="10" rx="5" fill="#fff" stroke="#1e1e1e" stroke-width="1.8"/>
  <rect x="200" y="76" width="102" height="10" rx="5" fill="#fff" stroke="#1e1e1e" stroke-width="1.8"/>
  <line x1="310" y1="73" x2="310" y2="90" stroke="#ea4335" stroke-width="3"/>
  <path d="M368 65 H396 M388 58 L396 65 L388 72" fill="none" class="ink"/>
  <circle cx="436" cy="65" r="32" fill="#fff" class="ink"/>
  <text x="436" y="73" text-anchor="middle" class="t" font-size="28" fill="#ea4335">?</text>

  <!-- Right: Single pass calibrated bars -->
  <rect x="516" y="4" width="482" height="122" rx="22" fill="#ccf6c5" class="ink"/>
  <rect x="532" y="22" width="120" height="86" rx="16" fill="#fff" class="ink"/>
  <text x="592" y="56" text-anchor="middle" class="t" font-size="15">1 Forward</text>
  <text x="592" y="78" text-anchor="middle" class="t" font-size="15">Pass ⚡</text>
  <path d="M660 65 H690 M682 58 L690 65 L682 72" fill="none" class="ink"/>
  <rect x="698" y="18" width="194" height="94" rx="16" fill="#fff" class="ink"/>
  <text x="712" y="42" class="m" font-size="12.5">A</text>
  <rect x="730" y="32" width="110" height="11" rx="5.5" fill="#e8eaed"/><rect x="730" y="32" width="104" height="11" rx="5.5" fill="#34a853" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="848" y="42" class="m" font-size="12">0.95</text>
  <text x="712" y="70" class="m" font-size="12.5">B</text>
  <rect x="730" y="60" width="110" height="11" rx="5.5" fill="#e8eaed"/><rect x="730" y="60" width="84" height="11" rx="5.5" fill="#4285f4" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="848" y="70" class="m" font-size="12">0.82</text>
  <text x="712" y="98" class="m" font-size="12.5">C</text>
  <rect x="730" y="88" width="110" height="11" rx="5.5" fill="#e8eaed"/><rect x="730" y="88" width="18" height="11" rx="5.5" fill="#fbbc04" stroke="#1e1e1e" stroke-width="1.5"/>
  <text x="848" y="98" class="m" font-size="12">0.12</text>
  <rect x="904" y="34" width="80" height="62" rx="16" fill="#ffd427" class="ink"/>
  <text x="944" y="62" text-anchor="middle" class="t" font-size="22">$0</text>
  <text x="944" y="82" text-anchor="middle" class="m" font-size="11">output</text>
</svg>