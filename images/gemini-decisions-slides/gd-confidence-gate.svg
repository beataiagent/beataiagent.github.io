<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 175" width="350" height="175">
  <defs>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #1e1e1e; font-weight: 700; }
      .s { font-family: "Google Sans", system-ui, sans-serif; fill: #3c4043; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #1e1e1e; font-weight: 500; }
      .ink { stroke: #1e1e1e; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="2" y="2" width="346" height="171" rx="20" fill="#fff" class="ink"/>
  <text x="18" y="28" class="m" font-size="12" fill="#5f6368">CONFIDENCE GATE (0.00 → 0.99)</text>
  <!-- Bar zones -->
  <rect x="18" y="44" width="214" height="32" rx="10" fill="#ffe7a5" class="ink"/>
  <text x="125" y="65" text-anchor="middle" class="t" font-size="13">Human / Big LLM</text>
  <rect x="236" y="44" width="96" height="32" rx="10" fill="#ccf6c5" class="ink"/>
  <text x="284" y="65" text-anchor="middle" class="t" font-size="13">Auto ✓</text>
  <!-- Threshold dashed line -->
  <line x1="234" y1="36" x2="234" y2="100" stroke="#ea4335" stroke-width="3" stroke-dasharray="5 3"/>
  <rect x="196" y="102" width="76" height="24" rx="12" fill="#f8d8d8" class="ink"/>
  <text x="234" y="119" text-anchor="middle" class="m" font-size="12">0.70</text>
  <!-- Scale markers -->
  <text x="20" y="96" class="m" font-size="11.5">0.0</text>
  <text x="332" y="96" text-anchor="end" class="m" font-size="11.5">0.99 max</text>
  <text x="175" y="152" text-anchor="middle" class="s" font-size="13.5">Act fast when sure · escalate when unsure</text>
</svg>