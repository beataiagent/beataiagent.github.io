<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 104" width="290" height="104">
  <defs>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #1e1e1e; font-weight: 700; }
      .s { font-family: "Google Sans", system-ui, sans-serif; fill: #3c4043; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #1e1e1e; font-weight: 500; }
      .ink { stroke: #1e1e1e; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="2" y="2" width="286" height="100" rx="16" fill="#fff" class="ink"/>
  <!-- Bell curve distribution over levels 0, 1, 2 -->
  <path d="M28 68 C70 68 100 18 145 18 C190 18 220 68 262 68" fill="#c3ecf6" stroke="#4285f4" stroke-width="2.5"/>
  <line x1="28" y1="68" x2="262" y2="68" class="ink"/>
  <circle cx="48" cy="68" r="6" fill="#fff" class="ink"/><text x="48" y="90" text-anchor="middle" class="m" font-size="12">0</text>
  <circle cx="145" cy="68" r="6" fill="#fff" class="ink"/><text x="145" y="90" text-anchor="middle" class="m" font-size="12">1</text>
  <circle cx="242" cy="68" r="6" fill="#fff" class="ink"/><text x="242" y="90" text-anchor="middle" class="m" font-size="12">2</text>
  <!-- Weighted marker at 1.19 -->
  <line x1="165" y1="22" x2="165" y2="68" stroke="#ea4335" stroke-width="2.5" stroke-dasharray="4 3"/>
  <circle cx="165" cy="68" r="7" fill="#ffd427" class="ink"/>
  <rect x="176" y="14" width="84" height="24" rx="12" fill="#ffd427" class="ink"/>
  <text x="218" y="31" text-anchor="middle" class="m" font-size="12.5">1.19</text>
</svg>