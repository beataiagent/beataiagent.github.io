<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 180" width="1088" height="180">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; font-weight: 400; }
      .mb { font-family: "Roboto Mono", ui-monospace, monospace; fill: #ffffff; font-weight: 600; }
    </style>
  </defs>
  <rect width="1088" height="180" fill="#202124"/>
  <rect width="1088" height="180" fill="url(#dots)"/>

  <circle cx="190" cy="90" r="120" fill="url(#amb-b)"/>
  <circle cx="544" cy="90" r="125" fill="url(#amb-g)"/>
  <circle cx="898" cy="90" r="120" fill="url(#amb-y)"/>
  <!-- Glowing bridge line -->
  <path d="M190 90 H898" stroke="url(#grad-by)" stroke-width="4" stroke-dasharray="10 6" opacity="0.85"/>

  <!-- Node 1: Cloud Run Instance -->
  <circle cx="190" cy="90" r="58" fill="url(#glass)" stroke="#57caff" stroke-width="3" filter="url(#glow-s)"/>
  <rect x="160" y="64" width="60" height="48" rx="10" fill="#17181b" stroke="#57caff" stroke-width="2"/>
  <path d="M168 92 H178 L184 80 L192 100 L198 88 H212" fill="none" stroke="#5cdb6d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="190" y="132" text-anchor="middle" class="m" font-size="10.5" fill="#57caff">7 DAYS</text>

  <!-- Pill 1 -->
  <rect x="304" y="73" width="124" height="34" rx="17" fill="#202124" stroke="#57caff" stroke-width="2"/>
  <text x="366" y="95" text-anchor="middle" class="m" font-size="12.5" fill="#57caff">/opt/data</text>

  <!-- Node 2: GCS FUSE -->
  <circle cx="544" cy="90" r="64" fill="url(#glass)" stroke="#5cdb6d" stroke-width="3" filter="url(#glow-s)"/>
  <path d="M512 96 A16 16 0 0 1 518 68 A22 22 0 0 1 564 68 A16 16 0 0 1 576 96 Z" fill="#17181b" stroke="#5cdb6d" stroke-width="2.4"/>
  <text x="544" y="122" text-anchor="middle" class="mb" font-size="12" fill="#5cdb6d">GCS FUSE</text>

  <!-- Pill 2 -->
  <rect x="658" y="73" width="128" height="34" rx="17" fill="#202124" stroke="#ffd427" stroke-width="2"/>
  <text x="722" y="95" text-anchor="middle" class="m" font-size="12.5" fill="#ffd427">sync 5s</text>

  <!-- Node 3: Local /tmp SQLite -->
  <circle cx="898" cy="90" r="58" fill="url(#glass)" stroke="#ffd427" stroke-width="3" filter="url(#glow-s)"/>
  <ellipse cx="898" cy="70" rx="28" ry="9" fill="#303238" stroke="#ffd427" stroke-width="2"/>
  <path d="M870 70 V102 A28 9 0 0 0 926 102 V70" fill="#17181b" stroke="#ffd427" stroke-width="2"/>
  <text x="898" y="95" text-anchor="middle" class="mb" font-size="11.5" fill="#ffffff">/tmp</text>
  <text x="898" y="132" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">TRUNCATE</text>

</svg>
