<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 172" width="1088" height="172">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; font-weight: 400; }
      .mb { font-family: "Roboto Mono", ui-monospace, monospace; fill: #ffffff; font-weight: 600; }
    </style>
  </defs>
  <rect width="1088" height="172" fill="#202124"/>
  <rect width="1088" height="172" fill="url(#dots)"/>

  <circle cx="544" cy="86" r="200" fill="url(#amb-b)"/>
  <!-- Header bar -->
  <rect x="18" y="14" width="1052" height="34" rx="10" fill="#17181b" stroke="#5f6368" stroke-width="1.4"/>
  <text x="36" y="36" class="mb" font-size="12" fill="#57caff">PROJECT FOUNDATION · gcloud beta</text>
  <text x="1050" y="36" text-anchor="end" class="m" font-size="11.5" fill="#5cdb6d">● 5 REQUIRED APIS ENABLED</text>

  <!-- 5 API Toggle Cards -->
  <rect x="18" y="62" width="198" height="96" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <rect x="158" y="74" width="42" height="20" rx="10" fill="#5cdb6d"/>
  <circle cx="190" cy="84" r="7" fill="#202124"/>
  <text x="34" y="90" class="mb" font-size="11" fill="#57caff">API 1</text>
  <text x="34" y="118" class="t" font-size="16">Cloud Run</text>
  <text x="34" y="140" class="m" font-size="10.5">run.googleapis</text>

  <rect x="232" y="62" width="198" height="96" rx="14" fill="url(#glass)" stroke="#ff7daf" stroke-width="2"/>
  <rect x="372" y="74" width="42" height="20" rx="10" fill="#5cdb6d"/>
  <circle cx="404" cy="84" r="7" fill="#202124"/>
  <text x="248" y="90" class="mb" font-size="11" fill="#ff7daf">API 2</text>
  <text x="248" y="118" class="t" font-size="16">Secret Mgr</text>
  <text x="248" y="140" class="m" font-size="10.5">secretmanager</text>

  <rect x="446" y="62" width="198" height="96" rx="14" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
  <rect x="586" y="74" width="42" height="20" rx="10" fill="#5cdb6d"/>
  <circle cx="618" cy="84" r="7" fill="#202124"/>
  <text x="462" y="90" class="mb" font-size="11" fill="#5cdb6d">API 3</text>
  <text x="462" y="118" class="t" font-size="16">Cloud Storage</text>
  <text x="462" y="140" class="m" font-size="10.5">storage.google</text>

  <rect x="660" y="62" width="198" height="96" rx="14" fill="url(#glass)" stroke="#9aa0a6" stroke-width="2"/>
  <rect x="800" y="74" width="42" height="20" rx="10" fill="#5cdb6d"/>
  <circle cx="832" cy="84" r="7" fill="#202124"/>
  <text x="676" y="90" class="mb" font-size="11" fill="#bdc1c6">API 4</text>
  <text x="676" y="118" class="t" font-size="16">Compute</text>
  <text x="676" y="140" class="m" font-size="10.5">compute.google</text>

  <rect x="874" y="62" width="196" height="96" rx="14" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  <rect x="1012" y="74" width="42" height="20" rx="10" fill="#5cdb6d"/>
  <circle cx="1044" cy="84" r="7" fill="#202124"/>
  <text x="890" y="90" class="mb" font-size="11" fill="#ffd427">API 5</text>
  <text x="890" y="118" class="t" font-size="16">Vertex AI</text>
  <text x="890" y="140" class="m" font-size="10.5">aiplatform</text>

</svg>
