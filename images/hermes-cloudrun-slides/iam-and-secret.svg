<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 110" width="1088" height="110">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; font-weight: 400; }
      .mb { font-family: "Roboto Mono", ui-monospace, monospace; fill: #ffffff; font-weight: 600; }
    </style>
  </defs>
  <rect width="1088" height="110" fill="#202124"/>
  <rect width="1088" height="110" fill="url(#dots)"/>

  <circle cx="240" cy="55" r="110" fill="url(#amb-b)"/>
  <circle cx="820" cy="55" r="110" fill="url(#amb-r)"/>

  <!-- Identity Card -->
  <rect x="16" y="14" width="246" height="82" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/>
  <circle cx="52" cy="55" r="18" fill="#17181b" stroke="#57caff" stroke-width="2"/>
  <circle cx="52" cy="50" r="6" fill="#57caff"/>
  <path d="M40 65 A12 10 0 0 1 64 65" fill="none" stroke="#57caff" stroke-width="2.5"/>
  <text x="82" y="48" class="t" font-size="15" fill="#57caff">hermes-sa</text>
  <text x="82" y="68" class="m" font-size="11">least-privilege SA</text>

  <!-- Arrow 1 -> Vertex AI -->
  <path d="M266 55 H318" stroke="#ffd427" stroke-width="2.8"/>
  <polygon points="314,49 326,55 314,61" fill="#ffd427"/>

  <rect x="330" y="14" width="232" height="82" rx="14" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  <text x="446" y="46" text-anchor="middle" class="t" font-size="15" fill="#ffd427">Vertex AI User</text>
  <text x="446" y="68" text-anchor="middle" class="m" font-size="11">roles/aiplatform.user</text>

  <!-- Separator -->
  <line x1="582" y1="22" x2="582" y2="88" stroke="#3c4043" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Secret Vault -->
  <rect x="602" y="14" width="224" height="82" rx="14" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.2"/>
  <text x="714" y="44" text-anchor="middle" class="t" font-size="15" fill="#ff7daf">Secret Manager</text>
  <text x="714" y="66" text-anchor="middle" class="m" font-size="10.5">hermes-dashboard-password</text>
  <text x="714" y="84" text-anchor="middle" class="m" font-size="10" fill="#5cdb6d">openssl rand -hex 16</text>

  <!-- Arrow 2 -> Runtime env -->
  <path d="M830 55 H878" stroke="#5cdb6d" stroke-width="2.8"/>
  <polygon points="874,49 886,55 874,61" fill="#5cdb6d"/>

  <rect x="890" y="14" width="182" height="82" rx="14" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
  <text x="981" y="46" text-anchor="middle" class="t" font-size="15" fill="#5cdb6d">Injected at Boot</text>
  <text x="981" y="68" text-anchor="middle" class="m" font-size="11">zero passwords</text>
  <text x="981" y="84" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">in code or CLI</text>

</svg>
