<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 164" width="1088" height="164">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; font-weight: 400; }
      .mb { font-family: "Roboto Mono", ui-monospace, monospace; fill: #ffffff; font-weight: 600; }
    </style>
  </defs>
  <rect width="1088" height="164" fill="#202124"/>
  <rect width="1088" height="164" fill="url(#dots)"/>

  <circle cx="544" cy="82" r="210" fill="url(#amb-r)"/>
  <text x="20" y="30" class="mb" font-size="12" fill="#ff7daf">TEARDOWN ORDER · STOP ONGOING CHARGES</text>
  <rect x="920" y="12" width="150" height="24" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="1.4"/>
  <text x="995" y="28" text-anchor="middle" class="mb" font-size="11" fill="#5cdb6d">Target: $0 / mo</text>

  <!-- 4 Teardown Cards -->
  <rect x="18" y="46" width="248" height="104" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <text x="36" y="72" class="mb" font-size="11.5" fill="#57caff">1 · COMPUTE</text>
  <text x="36" y="100" class="t" font-size="16">hermes-instance</text>
  <text x="36" y="122" class="m" font-size="11">runs until deleted</text>
  <text x="36" y="140" class="m" font-size="10.5" fill="#5cdb6d">stops billing first</text>

  <rect x="286" y="46" width="248" height="104" rx="14" fill="url(#glass)" stroke="#ff7daf" stroke-width="2"/>
  <text x="304" y="72" class="mb" font-size="11.5" fill="#ff7daf">2 · SECRET</text>
  <text x="304" y="100" class="t" font-size="16">dashboard-password</text>
  <text x="304" y="122" class="m" font-size="11">Secret Manager</text>
  <text x="304" y="140" class="m" font-size="10.5" fill="#bdc1c6">removes stored creds</text>

  <rect x="554" y="46" width="248" height="104" rx="14" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  <text x="572" y="72" class="mb" font-size="11.5" fill="#ffd427">3 · STORAGE (⚠)</text>
  <text x="572" y="100" class="t" font-size="16">gs://$BUCKET_NAME</text>
  <text x="572" y="122" class="m" font-size="11">chats + workspace</text>
  <text x="572" y="140" class="m" font-size="10.5" fill="#ffd427">back up first!</text>

  <rect x="822" y="46" width="248" height="104" rx="14" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
  <text x="840" y="72" class="mb" font-size="11.5" fill="#5cdb6d">4 · IDENTITY</text>
  <text x="840" y="100" class="t" font-size="16">hermes-sa</text>
  <text x="840" y="122" class="m" font-size="11">IAM service account</text>
  <text x="840" y="140" class="m" font-size="10.5" fill="#bdc1c6">clean project state</text>

</svg>
