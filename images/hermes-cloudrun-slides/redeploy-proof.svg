<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 208" width="1088" height="208">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; font-weight: 400; }
      .mb { font-family: "Roboto Mono", ui-monospace, monospace; fill: #ffffff; font-weight: 600; }
    </style>
  </defs>
  <rect width="1088" height="208" fill="#202124"/>
  <rect width="1088" height="208" fill="url(#dots)"/>

  <circle cx="544" cy="54" r="160" fill="url(#amb-y)"/>
  <circle cx="880" cy="148" r="120" fill="url(#amb-g)"/>

  <!-- Persistent GCS Vault sitting safely ABOVE container lifecycle -->
  <rect x="264" y="12" width="560" height="68" rx="16" fill="url(#glass)" stroke="#ffd427" stroke-width="2.4" filter="url(#glow-s)"/>
  <text x="288" y="38" class="mb" font-size="12.5" fill="#ffd427">CLOUD STORAGE BUCKET · UNTOUCHED ACROSS REDEPLOYS</text>
  <rect x="288" y="47" width="160" height="22" rx="6" fill="#17181b" stroke="#57caff" stroke-width="1.2"/>
  <text x="368" y="62" text-anchor="middle" class="m" font-size="11" fill="#57caff">state.db (chats)</text>
  <rect x="462" y="47" width="174" height="22" rx="6" fill="#17181b" stroke="#5cdb6d" stroke-width="1.2"/>
  <text x="549" y="62" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d">workspace/hello.txt</text>
  <rect x="650" y="47" width="154" height="22" rx="6" fill="#17181b" stroke="#ffd427" stroke-width="1.2"/>
  <text x="727" y="62" text-anchor="middle" class="m" font-size="11" fill="#ffd427">config + scripts</text>

  <!-- Autosave up from Container v1 -->
  <path d="M180 116 V46 H258" fill="none" stroke="#5cdb6d" stroke-width="2.6" stroke-dasharray="6 4"/>
  <polygon points="254,40 264,46 254,52" fill="#5cdb6d"/>
  <text x="166" y="76" text-anchor="end" class="m" font-size="10.5" fill="#5cdb6d">saved</text>

  <!-- Restore down to Container v2 -->
  <path d="M828 46 H908 V110" fill="none" stroke="#57caff" stroke-width="2.8"/>
  <polygon points="902,106 908,116 914,106" fill="#57caff"/>
  <text x="920" y="76" class="m" font-size="10.5" fill="#57caff">restore</text>

  <!-- Bottom Row: Container v1 -> Redeploy -> Container v2 -->
  <rect x="24" y="118" width="292" height="76" rx="14" fill="url(#glass)" stroke="#9aa0a6" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="170" y="148" text-anchor="middle" class="t" font-size="16" fill="#bdc1c6">Container v1 (stopped)</text>
  <text x="170" y="172" text-anchor="middle" class="m" font-size="11.5">/tmp wiped on redeploy</text>

  <!-- Redeploy Event -->
  <path d="M322 156 H430" stroke="#ff7daf" stroke-width="3"/>
  <polygon points="426,150 438,156 426,162" fill="#ff7daf"/>
  <rect x="442" y="128" width="204" height="56" rx="28" fill="#17181b" stroke="#ff7daf" stroke-width="2"/>
  <text x="544" y="152" text-anchor="middle" class="mb" font-size="13" fill="#ff7daf">REDEPLOY / RESTART</text>
  <text x="544" y="170" text-anchor="middle" class="m" font-size="10.5">fresh container boot</text>
  <path d="M650 156 H758" stroke="#5cdb6d" stroke-width="3"/>
  <polygon points="754,150 766,156 754,162" fill="#5cdb6d"/>

  <!-- Container v2 Alive with Memory -->
  <rect x="770" y="118" width="294" height="76" rx="14" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.4" filter="url(#glow-s)"/>
  <text x="917" y="148" text-anchor="middle" class="t" font-size="16" fill="#5cdb6d">Container v2 (live ✓)</text>
  <text x="917" y="172" text-anchor="middle" class="m" font-size="11.5">Old chats + "hello world"</text>

</svg>
