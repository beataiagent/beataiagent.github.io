<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 224" width="1088" height="224">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; font-weight: 400; }
      .mb { font-family: "Roboto Mono", ui-monospace, monospace; fill: #ffffff; font-weight: 600; }
    </style>
  </defs>
  <rect width="1088" height="224" fill="#202124"/>
  <rect width="1088" height="224" fill="url(#dots)"/>

  <circle cx="265" cy="112" r="145" fill="url(#amb-r)"/>
  <circle cx="820" cy="112" r="145" fill="url(#amb-g)"/>

  <!-- LEFT: Problem (Direct SQLite WAL on FUSE) -->
  <rect x="14" y="14" width="516" height="196" rx="18" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.2"/>
  <rect x="32" y="28" width="204" height="24" rx="12" fill="#17181b" stroke="#ff7daf" stroke-width="1.4"/>
  <text x="134" y="44" text-anchor="middle" class="mb" font-size="11" fill="#ff7daf">✗ THE PROBLEM · DIRECT FUSE</text>

  <rect x="34" y="72" width="144" height="74" rx="12" fill="#17181b" stroke="#ffd427" stroke-width="1.8"/>
  <text x="106" y="102" text-anchor="middle" class="t" font-size="15">SQLite WAL</text>
  <text x="106" y="124" text-anchor="middle" class="m" font-size="11">+ busy caches</text>

  <!-- Broken lock arrow -->
  <path d="M182 109 H248" stroke="#ff7daf" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="215" cy="109" r="16" fill="#202124" stroke="#ff7daf" stroke-width="2.2"/>
  <path d="M208 102 L222 116 M222 102 L208 116" stroke="#ff7daf" stroke-width="2.8" stroke-linecap="round"/>

  <rect x="252" y="72" width="132" height="74" rx="12" fill="#17181b" stroke="#5f6368" stroke-width="1.8"/>
  <text x="318" y="102" text-anchor="middle" class="t" font-size="14.5">GCS FUSE</text>
  <text x="318" y="122" text-anchor="middle" class="m" font-size="10.5" fill="#ff7daf">no byte locks</text>

  <path d="M388 109 H412" stroke="#ff7daf" stroke-width="2.5"/>
  <polygon points="408,103 418,109 408,115" fill="#ff7daf"/>

  <rect x="420" y="72" width="94" height="74" rx="12" fill="#17181b" stroke="#ff7daf" stroke-width="2"/>
  <text x="467" y="102" text-anchor="middle" class="mb" font-size="13" fill="#ff7daf">RISK</text>
  <text x="467" y="124" text-anchor="middle" class="m" font-size="10.5">corrupt DB</text>

  <text x="272" y="186" text-anchor="middle" class="m" font-size="11.5" fill="#ff7daf">Object storage is not POSIX → blocked I/O &amp; corrupted state.db</text>

  <!-- RIGHT: Fix (Work local in /tmp, copy back every 5s) -->
  <rect x="558" y="14" width="516" height="196" rx="18" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.4" filter="url(#glow-s)"/>
  <rect x="576" y="28" width="212" height="24" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="1.4"/>
  <text x="682" y="44" text-anchor="middle" class="mb" font-size="11" fill="#5cdb6d">✓ THE FIX · LOCAL /TMP + SYNC</text>

  <!-- Hermes -> /tmp -->
  <rect x="578" y="70" width="184" height="84" rx="12" fill="#17181b" stroke="#57caff" stroke-width="2"/>
  <text x="670" y="96" text-anchor="middle" class="mb" font-size="13.5" fill="#57caff">Local /tmp (RAM)</text>
  <text x="670" y="118" text-anchor="middle" class="m" font-size="11">state.db (TRUNCATE)</text>
  <text x="670" y="138" text-anchor="middle" class="m" font-size="10.5" fill="#5cdb6d">full POSIX locks ✓</text>

  <!-- Smooth 5s copy arrow -->
  <path d="M768 98 H870" stroke="#5cdb6d" stroke-width="3"/>
  <polygon points="866,92 878,98 866,104" fill="#5cdb6d"/>
  <text x="822" y="88" text-anchor="middle" class="mb" font-size="11" fill="#5cdb6d">copy2 · 5s</text>

  <path d="M874 128 H774" stroke="#ffd427" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="778,122 766,128 778,134" fill="#ffd427"/>
  <text x="822" y="146" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">restore boot</text>

  <!-- GCS Bucket -->
  <rect x="882" y="70" width="172" height="84" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="2"/>
  <text x="968" y="98" text-anchor="middle" class="t" font-size="15" fill="#5cdb6d">GCS Bucket</text>
  <text x="968" y="118" text-anchor="middle" class="m" font-size="11">/opt/data/.hermes</text>
  <text x="968" y="138" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">1 clean file copy</text>

  <text x="816" y="186" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d">Fast local SQLite + uv/XDG caches · safe durable backup in GCS</text>

</svg>
