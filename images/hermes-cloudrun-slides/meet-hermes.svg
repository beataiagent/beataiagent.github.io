<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 124" width="1088" height="124">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; font-weight: 400; }
      .mb { font-family: "Roboto Mono", ui-monospace, monospace; fill: #ffffff; font-weight: 600; }
    </style>
  </defs>
  <rect width="1088" height="124" fill="#202124"/>
  <rect width="1088" height="124" fill="url(#dots)"/>

  <circle cx="544" cy="62" r="200" fill="url(#amb-b)"/>
  <!-- Outer official container frame -->
  <rect x="14" y="12" width="1060" height="100" rx="16" fill="url(#glass)" stroke="#5f6368" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="30" y="2" width="286" height="20" rx="10" fill="#202124" stroke="#57caff" stroke-width="1.3"/>
  <text x="173" y="16" text-anchor="middle" class="m" font-size="10.5" fill="#57caff">nousresearch/hermes-agent:latest</text>

  <!-- 4 internal boxes wired -->
  <rect x="34" y="34" width="222" height="62" rx="12" fill="#17181b" stroke="#57caff" stroke-width="2"/>
  <text x="145" y="60" text-anchor="middle" class="t" font-size="15" fill="#57caff">Gateway</text>
  <text x="145" y="80" text-anchor="middle" class="m" font-size="11">LLM + tool loop</text>

  <path d="M260 65 H298" stroke="#5cdb6d" stroke-width="2.5"/>
  <polygon points="294,59 306,65 294,71" fill="#5cdb6d"/>
  <polygon points="264,59 254,65 264,71" fill="#57caff"/>

  <rect x="310" y="34" width="222" height="62" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="2"/>
  <text x="421" y="60" text-anchor="middle" class="t" font-size="15" fill="#5cdb6d">Web Dashboard</text>
  <text x="421" y="80" text-anchor="middle" class="m" font-size="11">Chat UI · basic auth</text>

  <path d="M536 65 H574" stroke="#ffd427" stroke-width="2.5"/>
  <polygon points="570,59 582,65 570,71" fill="#ffd427"/>

  <rect x="586" y="34" width="214" height="62" rx="12" fill="#17181b" stroke="#ffd427" stroke-width="2"/>
  <text x="693" y="60" text-anchor="middle" class="t" font-size="15" fill="#ffd427">Skills Scanner</text>
  <text x="693" y="80" text-anchor="middle" class="m" font-size="11">boot + background jobs</text>

  <path d="M804 65 H842" stroke="#ff7daf" stroke-width="2.5"/>
  <polygon points="838,59 850,65 838,71" fill="#ff7daf"/>

  <rect x="854" y="34" width="202" height="62" rx="12" fill="#17181b" stroke="#ff7daf" stroke-width="2"/>
  <text x="955" y="60" text-anchor="middle" class="t" font-size="15" fill="#ff7daf">SQLite State</text>
  <text x="955" y="80" text-anchor="middle" class="m" font-size="11">state.db · config · .env</text>

</svg>
