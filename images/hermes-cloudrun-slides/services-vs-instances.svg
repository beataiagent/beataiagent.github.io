<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 188" width="1088" height="188">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; font-weight: 400; }
      .mb { font-family: "Roboto Mono", ui-monospace, monospace; fill: #ffffff; font-weight: 600; }
    </style>
  </defs>
  <rect width="1088" height="188" fill="#202124"/>
  <rect width="1088" height="188" fill="url(#dots)"/>

  <circle cx="265" cy="94" r="130" fill="url(#amb-r)"/>
  <circle cx="820" cy="94" r="135" fill="url(#amb-g)"/>

  <!-- LEFT: Cloud Run Service (Multiple stateless copies + conflict) -->
  <rect x="14" y="14" width="516" height="160" rx="18" fill="url(#glass)" stroke="#5f6368" stroke-width="2"/>
  <text x="34" y="40" class="mb" font-size="12.5" fill="#9aa0a6">CLOUD RUN SERVICE · AUTO-SCALING CLONES</text>
  <!-- Load balancer -->
  <rect x="34" y="76" width="84" height="46" rx="10" fill="#17181b" stroke="#57caff" stroke-width="1.6"/>
  <text x="76" y="103" text-anchor="middle" class="m" font-size="11.5" fill="#57caff">HTTP LB</text>
  <!-- Fan out to 3 clones -->
  <path d="M118 99 L158 64 M118 99 H158 M118 99 L158 134" stroke="#9aa0a6" stroke-width="2"/>
  <rect x="160" y="48" width="110" height="30" rx="8" fill="#17181b" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="215" y="67" text-anchor="middle" class="m" font-size="11">Copy #1</text>
  <rect x="160" y="84" width="110" height="30" rx="8" fill="#17181b" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="215" y="103" text-anchor="middle" class="m" font-size="11">Copy #2</text>
  <rect x="160" y="120" width="110" height="30" rx="8" fill="#17181b" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="215" y="139" text-anchor="middle" class="m" font-size="11">Copy #3</text>
  <!-- Conflict into shared state -->
  <path d="M272 64 L322 99 M272 99 H322 M272 134 L322 99" stroke="#ff7daf" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="328" y="60" width="182" height="78" rx="12" fill="#17181b" stroke="#ff7daf" stroke-width="2"/>
  <text x="419" y="88" text-anchor="middle" class="mb" font-size="13" fill="#ff7daf">⚠ Write Clash!</text>
  <text x="419" y="108" text-anchor="middle" class="m" font-size="11">2+ gateways on</text>
  <text x="419" y="124" text-anchor="middle" class="m" font-size="11">same data folder</text>

  <!-- RIGHT: Cloud Run Instance (1 dedicated long-lived home) -->
  <rect x="558" y="14" width="516" height="160" rx="18" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.4" filter="url(#glow-s)"/>
  <text x="578" y="40" class="mb" font-size="12.5" fill="#5cdb6d">CLOUD RUN INSTANCE · ONE DEDICATED HOME</text>
  <!-- Single addressable instance -->
  <rect x="578" y="56" width="246" height="96" rx="14" fill="#17181b" stroke="#5cdb6d" stroke-width="2"/>
  <circle cx="600" cy="76" r="5" fill="#5cdb6d" filter="url(#glow-s)"/>
  <text x="614" y="80" class="t" font-size="14">hermes-instance</text>
  <rect x="594" y="92" width="98" height="24" rx="6" fill="#2a2b2f" stroke="#57caff" stroke-width="1.2"/>
  <text x="643" y="108" text-anchor="middle" class="m" font-size="10.5" fill="#57caff">1 Address</text>
  <rect x="700" y="92" width="108" height="24" rx="6" fill="#2a2b2f" stroke="#ffd427" stroke-width="1.2"/>
  <text x="754" y="108" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">Bg Workers</text>
  <text x="701" y="139" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d">Up to 7 days · auto-restart</text>

  <!-- Clean exclusive link to Storage -->
  <path d="M828 104 H884" stroke="#5cdb6d" stroke-width="3"/>
  <polygon points="880,98 892,104 880,110" fill="#5cdb6d"/>
  <rect x="896" y="64" width="158" height="80" rx="14" fill="#17181b" stroke="#ffd427" stroke-width="2"/>
  <text x="975" y="94" text-anchor="middle" class="mb" font-size="13" fill="#ffd427">GCS Bucket</text>
  <text x="975" y="114" text-anchor="middle" class="m" font-size="11">1 writer · safe</text>
  <text x="975" y="131" text-anchor="middle" class="m" font-size="10.5" fill="#5cdb6d">✓ state intact</text>

</svg>
