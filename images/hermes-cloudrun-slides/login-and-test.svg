<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 156" width="1088" height="156">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; font-weight: 400; }
      .mb { font-family: "Roboto Mono", ui-monospace, monospace; fill: #ffffff; font-weight: 600; }
    </style>
  </defs>
  <rect width="1088" height="156" fill="#202124"/>
  <rect width="1088" height="156" fill="url(#dots)"/>

  <circle cx="180" cy="78" r="105" fill="url(#amb-b)"/>
  <circle cx="544" cy="78" r="105" fill="url(#amb-g)"/>
  <circle cx="908" cy="78" r="105" fill="url(#amb-y)"/>

  <!-- Step 1: Browser Basic Auth -->
  <rect x="14" y="14" width="326" height="128" rx="16" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <rect x="14" y="14" width="326" height="26" rx="16" fill="#17181b"/>
  <rect x="14" y="28" width="326" height="12" fill="#17181b"/>
  <text x="177" y="31" text-anchor="middle" class="m" font-size="10.5" fill="#57caff">https://hermes-instance-xxx.run.app</text>
  <rect x="34" y="52" width="286" height="28" rx="7" fill="#17181b" stroke="#5f6368" stroke-width="1.3"/>
  <text x="48" y="70" class="m" font-size="11.5">user: <tspan fill="#ffffff">admin</tspan></text>
  <rect x="34" y="88" width="286" height="28" rx="7" fill="#17181b" stroke="#ff7daf" stroke-width="1.3"/>
  <text x="48" y="106" class="m" font-size="11.5">pass: <tspan fill="#ff7daf">••••••••••••••••</tspan></text>
  <text x="177" y="133" text-anchor="middle" class="m" font-size="10" fill="#57caff">1 · SIGN IN</text>

  <path d="M344 78 H372" stroke="#57caff" stroke-width="2.6"/>
  <polygon points="368,72 378,78 368,84" fill="#57caff"/>

  <!-- Step 2: Chat Ping -->
  <rect x="382" y="14" width="324" height="128" rx="16" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
  <rect x="400" y="30" width="166" height="34" rx="12" fill="#17181b" stroke="#57caff" stroke-width="1.5"/>
  <text x="414" y="52" class="m" font-size="12" fill="#57caff">&gt; echo "hello"</text>
  <rect x="466" y="74" width="222" height="40" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="1.6"/>
  <text x="480" y="99" class="t" font-size="13" fill="#5cdb6d">Gemini (Vertex): hello!</text>
  <text x="544" y="133" text-anchor="middle" class="m" font-size="10" fill="#5cdb6d">2 · VERIFY VERTEX AI</text>

  <path d="M710 78 H738" stroke="#5cdb6d" stroke-width="2.6"/>
  <polygon points="734,72 744,78 734,84" fill="#5cdb6d"/>

  <!-- Step 3: Workspace File -> Bucket -->
  <rect x="748" y="14" width="326" height="128" rx="16" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  <rect x="766" y="34" width="128" height="72" rx="10" fill="#17181b" stroke="#ffd427" stroke-width="1.6"/>
  <text x="830" y="60" text-anchor="middle" class="mb" font-size="12" fill="#ffd427">hello.txt</text>
  <text x="830" y="82" text-anchor="middle" class="m" font-size="11">"hello world"</text>
  <path d="M898 70 H926" stroke="#ffd427" stroke-width="2.5"/>
  <polygon points="922,64 932,70 922,76" fill="#ffd427"/>
  <rect x="936" y="34" width="120" height="72" rx="10" fill="#17181b" stroke="#5cdb6d" stroke-width="1.8"/>
  <text x="996" y="62" text-anchor="middle" class="mb" font-size="11.5" fill="#5cdb6d">gs://$BUCKET</text>
  <text x="996" y="84" text-anchor="middle" class="m" font-size="10.5">✓ verified</text>
  <text x="911" y="133" text-anchor="middle" class="m" font-size="10" fill="#ffd427">3 · WORKSPACE IN GCS</text>

</svg>
