<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="256" height="256" fill="#202124"/>

  <circle cx="96" cy="112" r="94" fill="url(#amb-r)"/>
  <circle cx="168" cy="148" r="90" fill="url(#amb-y)"/>
  <circle cx="128" cy="128" r="98" fill="none" stroke="#ffd427" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Top barge-in wave card -->
  <rect x="28" y="42" width="136" height="72" rx="16" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.2"/>
  <g stroke-linecap="round">
    <line x1="46" y1="70" x2="46" y2="86" stroke="#5cdb6d" stroke-width="4"/>
    <line x1="58" y1="60" x2="58" y2="96" stroke="#5cdb6d" stroke-width="4"/>
    <line x1="70" y1="66" x2="70" y2="90" stroke="#5cdb6d" stroke-width="4"/>
    <!-- Cut-in flash -->
    <line x1="88" y1="52" x2="88" y2="104" stroke="#ff7daf" stroke-width="3" stroke-dasharray="4 3" filter="url(#glow-s)"/>
    <line x1="106" y1="64" x2="106" y2="92" stroke="#57caff" stroke-width="4" filter="url(#glow-s)"/>
    <line x1="118" y1="54" x2="118" y2="102" stroke="#57caff" stroke-width="4" filter="url(#glow-s)"/>
    <line x1="130" y1="62" x2="130" y2="94" stroke="#57caff" stroke-width="4"/>
    <line x1="142" y1="70" x2="142" y2="86" stroke="#57caff" stroke-width="4"/>
  </g>
  <rect x="44" y="28" width="96" height="22" rx="11" fill="#17181b" stroke="#ff7daf" stroke-width="1.5"/>
  <text x="92" y="43" text-anchor="middle" class="m" font-size="10.5" fill="#ff7daf" font-weight="600">BARGE-IN</text>

  <!-- Bottom-right Live Tool Gear card -->
  <circle cx="174" cy="154" r="46" fill="url(#glass)" stroke="#ffd427" stroke-width="2.5" filter="url(#glow-s)"/>
  <g transform="translate(174,154)" fill="none" stroke="#ffd427" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="0" r="14"/>
    <circle cx="0" cy="0" r="5" fill="#ffd427"/>
    <line x1="0" y1="-24" x2="0" y2="-18"/>
    <line x1="0" y1="18" x2="0" y2="24"/>
    <line x1="-24" y1="0" x2="-18" y2="0"/>
    <line x1="18" y1="0" x2="24" y2="0"/>
    <line x1="-17" y1="-17" x2="-13" y2="-13"/>
    <line x1="13" y1="13" x2="17" y2="17"/>
    <line x1="17" y1="-17" x2="13" y2="-13"/>
    <line x1="-13" y1="13" x2="-17" y2="17"/>
  </g>
  <!-- Live green dot -->
  <circle cx="208" cy="122" r="7" fill="#5cdb6d" stroke="#202124" stroke-width="2" filter="url(#glow-s)"/>

  <!-- Connector arc -->
  <path d="M96 114 C96 146 110 156 126 156" fill="none" stroke="#ffd427" stroke-width="2.5" stroke-dasharray="5 4"/>

  <text x="128" y="232" text-anchor="middle" class="m" font-size="11.5" fill="#ffd427">VOICE UX + TOOLS</text>
</svg>
