<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 250" width="1088" height="250">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="lantern" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#57caff"/></marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/></marker>
    <marker id="arr-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ffd427"/></marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="250" fill="#202124"/>

  <circle cx="136" cy="108" r="105" fill="url(#amb-b)"/>
  <circle cx="410" cy="108" r="105" fill="url(#amb-g)"/>
  <circle cx="682" cy="108" r="110" fill="url(#amb-y)"/>
  <circle cx="954" cy="108" r="105" fill="url(#amb-r)"/>

  <!-- Node 1: Visitor Voice + Camera -->
  <rect x="18" y="20" width="232" height="168" rx="16" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/>
  <circle cx="50" cy="52" r="16" fill="#57caff" fill-opacity="0.16" stroke="#57caff" stroke-width="1.8"/>
  <rect x="46" y="44" width="8" height="12" rx="4" fill="#57caff"/>
  <path d="M42 54 A8 8 0 0 0 58 54" fill="none" stroke="#57caff" stroke-width="1.8"/>
  <text x="76" y="50" class="t" font-size="16.5" fill="#57caff">Market Visitor</text>
  <text x="76" y="68" class="m" font-size="11" fill="#bdc1c6">Voice + Camera</text>
  <rect x="32" y="84" width="204" height="32" rx="8" fill="#17181b" stroke="#3c4043" stroke-width="1.2"/>
  <text x="134" y="104" text-anchor="middle" class="m" font-size="11.5" fill="#57caff">16kHz PCM + 1fps JPEG</text>
  <text x="134" y="140" text-anchor="middle" class="sub" font-size="12.5">Points phone at stall &amp;</text>
  <text x="134" y="160" text-anchor="middle" class="sub" font-size="12.5">talks naturally over WS</text>

  <path d="M254 90 H282" stroke="#57caff" stroke-width="2.8" marker-end="url(#arr-b)"/>
  <path d="M286 126 H258" stroke="#5cdb6d" stroke-width="2.8" marker-end="url(#arr-g)"/>

  <!-- Node 2: ADK Live Runner -->
  <rect x="288" y="20" width="238" height="168" rx="16" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2"/>
  <circle cx="320" cy="52" r="16" fill="#5cdb6d" fill-opacity="0.16" stroke="#5cdb6d" stroke-width="1.8"/>
  <polygon points="320,41 323,49 331,52 323,55 320,63 317,55 309,52 317,49" fill="#5cdb6d" filter="url(#glow-s)"/>
  <text x="346" y="50" class="t" font-size="16.5" fill="#5cdb6d">ADK Live Runner</text>
  <text x="346" y="68" class="m" font-size="11" fill="#bdc1c6">Gemini Native Audio</text>
  <rect x="302" y="84" width="210" height="32" rx="8" fill="#17181b" stroke="#5cdb6d" stroke-width="1.2"/>
  <text x="407" y="104" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d">StreamingMode.BIDI</text>
  <text x="407" y="140" text-anchor="middle" class="sub" font-size="12.5">Expressive vendor voice</text>
  <text x="407" y="160" text-anchor="middle" class="sub" font-size="12.5">+ instant barge-in VAD</text>

  <path d="M530 90 H558" stroke="#ffd427" stroke-width="2.8" marker-end="url(#arr-y)"/>
  <path d="M562 126 H534" stroke="#5cdb6d" stroke-width="2.8" marker-end="url(#arr-g)"/>

  <!-- Node 3: Vendor & Order Tools -->
  <rect x="564" y="20" width="238" height="168" rx="16" fill="url(#glass)" stroke="#ffd427" stroke-width="2.2"/>
  <!-- Mini night-market lantern icon -->
  <ellipse cx="596" cy="52" rx="13" ry="15" fill="url(#lantern)" fill-opacity="0.25" stroke="url(#lantern)" stroke-width="2" filter="url(#glow-s)"/>
  <text x="620" y="50" class="t" font-size="16.5" fill="#ffd427">Vendor Tools</text>
  <text x="620" y="68" class="m" font-size="11" fill="#bdc1c6">Agent Valley Stalls</text>
  <rect x="578" y="84" width="210" height="32" rx="8" fill="#17181b" stroke="#ffd427" stroke-width="1.2"/>
  <text x="683" y="104" text-anchor="middle" class="m" font-size="11" fill="#ffd427">browse · haggle · buy</text>
  <text x="683" y="140" text-anchor="middle" class="sub" font-size="12.5">Live wallet &amp; basket state</text>
  <text x="683" y="160" text-anchor="middle" class="m" font-size="11" fill="#9aa0a6">SessionService state</text>

  <path d="M806 106 H834" stroke="#5cdb6d" stroke-width="2.8" marker-end="url(#arr-g)"/>

  <!-- Node 4: Cloud Run Live Reply -->
  <rect x="840" y="20" width="230" height="168" rx="16" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.2"/>
  <circle cx="872" cy="52" r="16" fill="#ff7daf" fill-opacity="0.16" stroke="#ff7daf" stroke-width="1.8"/>
  <path d="M866 56 L872 44 L878 56 Z" fill="#ff7daf"/>
  <text x="898" y="50" class="t" font-size="16.5" fill="#ff7daf">Cloud Run Live</text>
  <text x="898" y="68" class="m" font-size="11" fill="#bdc1c6">Real-time Audio + UI</text>
  <rect x="854" y="84" width="202" height="32" rx="8" fill="#17181b" stroke="#ff7daf" stroke-width="1.2"/>
  <text x="955" y="104" text-anchor="middle" class="m" font-size="11.5" fill="#ff7daf">24kHz PCM + Captions</text>
  <text x="955" y="140" text-anchor="middle" class="m" font-size="11.5" fill="#e8eaed">--timeout=3600</text>
  <text x="955" y="160" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d">--session-affinity</text>

  <!-- Bottom Night Market live dialogue strip -->
  <rect x="18" y="204" width="1052" height="30" rx="15" fill="#17181b" stroke="#ffd427" stroke-width="1.4"/>
  <text x="544" y="223" text-anchor="middle" class="m" font-size="12" fill="#ffd427">LIVE FLOW:  "How much for Mango Sticky Rice?"  ⇄  haggle_price()  ⇄  "80 THB — added to your basket!"</text>
</svg>
