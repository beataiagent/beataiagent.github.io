<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 260" width="1088" height="260">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="grad-live" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ff7daf"/></marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/></marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="260" fill="#202124"/>

  <circle cx="520" cy="70" r="140" fill="url(#amb-r)"/>
  <circle cx="320" cy="176" r="130" fill="url(#amb-g)"/>

  <!-- Gridlines for time axis (0ms at x=210, 2000ms at x=910 => 350px per 1000ms) -->
  <g stroke="#3c4043" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="210" y1="22" x2="210" y2="226"/>
    <line x1="385" y1="22" x2="385" y2="226"/>
    <line x1="560" y1="22" x2="560" y2="226"/>
    <line x1="735" y1="22" x2="735" y2="226"/>
    <line x1="910" y1="22" x2="910" y2="226"/>
  </g>

  <!-- LANE 1: Cascade Pipeline -->
  <rect x="16" y="18" width="1056" height="94" rx="16" fill="url(#glass)" stroke="#ff7daf" stroke-width="2"/>
  <text x="34" y="54" class="t" font-size="18" fill="#ff7daf">Cascade Pipeline</text>
  <text x="34" y="76" class="m" font-size="12" fill="#bdc1c6">3 serial hops</text>
  <text x="34" y="95" class="sub" font-size="12" fill="#ff7daf">Tone lost at STT</text>

  <!-- STT: 400ms (140px: 210..350) -->
  <rect x="210" y="36" width="144" height="58" rx="12" fill="#17181b" stroke="#ff7daf" stroke-width="1.8"/>
  <text x="282" y="61" text-anchor="middle" class="t" font-size="15.5">STT</text>
  <text x="282" y="80" text-anchor="middle" class="m" font-size="12" fill="#ff7daf">400 ms</text>

  <path d="M356 65 H374" stroke="#ff7daf" stroke-width="2.4" marker-end="url(#arr-r)"/>

  <!-- LLM: 900ms (300px: 380..680) -->
  <rect x="380" y="36" width="300" height="58" rx="12" fill="#17181b" stroke="#ffd427" stroke-width="1.8"/>
  <text x="530" y="61" text-anchor="middle" class="t" font-size="15.5">LLM (Text → Text)</text>
  <text x="530" y="80" text-anchor="middle" class="m" font-size="12" fill="#ffd427">900 ms · waits for full transcript</text>

  <path d="M682 65 H700" stroke="#ff7daf" stroke-width="2.4" marker-end="url(#arr-r)"/>

  <!-- TTS: 500ms (176px: 706..882) -->
  <rect x="706" y="36" width="176" height="58" rx="12" fill="#17181b" stroke="#ff7daf" stroke-width="1.8"/>
  <text x="794" y="61" text-anchor="middle" class="t" font-size="15.5">TTS</text>
  <text x="794" y="80" text-anchor="middle" class="m" font-size="12" fill="#ff7daf">500 ms</text>

  <!-- Total badge -->
  <rect x="900" y="42" width="154" height="46" rx="12" fill="#ff7daf" fill-opacity="0.16" stroke="#ff7daf" stroke-width="1.8"/>
  <text x="977" y="63" text-anchor="middle" class="t" font-size="17" fill="#ff7daf">~2.0s total</text>
  <text x="977" y="80" text-anchor="middle" class="m" font-size="11" fill="#e8eaed">awkward silence</text>

  <!-- LANE 2: Gemini Live Native S2S -->
  <rect x="16" y="126" width="1056" height="94" rx="16" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2"/>
  <text x="34" y="162" class="t" font-size="18" fill="#5cdb6d">Gemini Live API</text>
  <text x="34" y="184" class="m" font-size="12" fill="#bdc1c6">Native S2S</text>
  <text x="34" y="203" class="sub" font-size="12" fill="#57caff">1 WebSocket pass</text>

  <!-- Native bar: 350ms (~145px: 210..355) -->
  <rect x="210" y="144" width="150" height="58" rx="12" fill="#5cdb6d" fill-opacity="0.16" stroke="url(#grad-live)" stroke-width="2.4" filter="url(#glow-s)"/>
  <text x="285" y="169" text-anchor="middle" class="t" font-size="15.5" fill="#5cdb6d">Audio → Audio</text>
  <text x="285" y="188" text-anchor="middle" class="m" font-size="12.5" fill="#ffffff" font-weight="600">~350 ms</text>

  <!-- Streaming reply arrow + benefits -->
  <path d="M364 173 H412" stroke="#5cdb6d" stroke-width="3" marker-end="url(#arr-g)"/>
  <rect x="420" y="146" width="462" height="54" rx="12" fill="#17181b" stroke="#57caff" stroke-width="1.6"/>
  <!-- Mini live waveform -->
  <g stroke="#5cdb6d" stroke-width="3" stroke-linecap="round">
    <line x1="440" y1="168" x2="440" y2="178"/>
    <line x1="449" y1="160" x2="449" y2="186"/>
    <line x1="458" y1="156" x2="458" y2="190"/>
    <line x1="467" y1="163" x2="467" y2="183"/>
    <line x1="476" y1="169" x2="476" y2="177"/>
  </g>
  <text x="494" y="169" class="t" font-size="15" fill="#ffffff">Streaming 24 kHz voice + barge-in</text>
  <text x="494" y="188" class="m" font-size="12" fill="#57caff">Preserves tone, emotion, pace &amp; async tools</text>

  <!-- Speedup badge -->
  <rect x="900" y="150" width="154" height="46" rx="12" fill="#5cdb6d" fill-opacity="0.18" stroke="#5cdb6d" stroke-width="2" filter="url(#glow-s)"/>
  <text x="977" y="171" text-anchor="middle" class="t" font-size="17" fill="#5cdb6d">~5× faster</text>
  <text x="977" y="188" text-anchor="middle" class="m" font-size="11" fill="#e8eaed">human-like reply</text>

  <!-- Timeline axis labels -->
  <text x="210" y="246" text-anchor="middle" class="m" font-size="12" fill="#9aa0a6">0 ms</text>
  <text x="385" y="246" text-anchor="middle" class="m" font-size="12" fill="#5cdb6d">500 ms</text>
  <text x="560" y="246" text-anchor="middle" class="m" font-size="12" fill="#9aa0a6">1.0 s</text>
  <text x="735" y="246" text-anchor="middle" class="m" font-size="12" fill="#9aa0a6">1.5 s</text>
  <text x="910" y="246" text-anchor="middle" class="m" font-size="12" fill="#ff7daf">2.0 s</text>
</svg>
