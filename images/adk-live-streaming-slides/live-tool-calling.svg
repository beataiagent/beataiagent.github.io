<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 240" width="1088" height="240">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#57caff"/></marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/></marker>
    <marker id="arr-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ffd427"/></marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="240" fill="#202124"/>

  <circle cx="220" cy="68" r="110" fill="url(#amb-b)"/>
  <circle cx="544" cy="176" r="120" fill="url(#amb-y)"/>
  <circle cx="880" cy="68" r="110" fill="url(#amb-g)"/>

  <!-- TOP LANE: Continuous Voice Stream -->
  <rect x="16" y="16" width="1056" height="92" rx="16" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <text x="34" y="54" class="t" font-size="16" fill="#57caff">VOICE STREAM</text>
  <text x="34" y="75" class="m" font-size="11.5" fill="#5cdb6d">Never freezes!</text>

  <!-- Voice Step 1 -->
  <rect x="178" y="30" width="234" height="64" rx="12" fill="#17181b" stroke="#57caff" stroke-width="1.6"/>
  <text x="295" y="56" text-anchor="middle" class="t" font-size="14.5" fill="#ffffff">"Order 2 Pad Thai"</text>
  <text x="295" y="77" text-anchor="middle" class="m" font-size="11.5" fill="#57caff">User speaks live audio</text>

  <path d="M416 62 H446" stroke="#57caff" stroke-width="2.6" marker-end="url(#arr-b)"/>

  <!-- Voice Step 2: Natural filler continues -->
  <rect x="452" y="30" width="268" height="64" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="586" y="56" text-anchor="middle" class="t" font-size="14.5" fill="#5cdb6d">"Sure, checking the stall…"</text>
  <text x="586" y="77" text-anchor="middle" class="m" font-size="11.5" fill="#bdc1c6">Voice &amp; mic stay active while tool runs</text>

  <path d="M724 62 H754" stroke="#5cdb6d" stroke-width="2.6" marker-end="url(#arr-g)"/>

  <!-- Voice Step 3: Natural confirmation -->
  <rect x="760" y="30" width="294" height="64" rx="12" fill="#5cdb6d" fill-opacity="0.14" stroke="#5cdb6d" stroke-width="2" filter="url(#glow-s)"/>
  <text x="907" y="56" text-anchor="middle" class="t" font-size="14.5" fill="#ffffff">"Added! 120 THB in basket."</text>
  <text x="907" y="77" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d">24 kHz audio reply + live UI sync</text>

  <!-- Vertical async handoff arrows between lanes -->
  <path d="M366 94 V142" stroke="#ffd427" stroke-width="2.4" stroke-dasharray="4 3" marker-end="url(#arr-y)"/>
  <path d="M812 146 V98" stroke="#5cdb6d" stroke-width="2.4" stroke-dasharray="4 3" marker-end="url(#arr-g)"/>

  <!-- BOTTOM LANE: Async ADK Tool Execution -->
  <rect x="16" y="132" width="1056" height="92" rx="16" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  <text x="34" y="170" class="t" font-size="16" fill="#ffd427">ADK TOOL LANE</text>
  <text x="34" y="191" class="m" font-size="11.5" fill="#bdc1c6">Async · Non-blocking</text>

  <!-- Tool Call 1 -->
  <rect x="260" y="146" width="224" height="64" rx="12" fill="#17181b" stroke="#ffd427" stroke-width="1.8"/>
  <text x="372" y="172" text-anchor="middle" class="m" font-size="12.5" fill="#ffd427" font-weight="600">check_menu("Pad Thai")</text>
  <text x="372" y="194" text-anchor="middle" class="sub" font-size="12">ADK intercepts function_call</text>

  <path d="M488 178 H518" stroke="#ffd427" stroke-width="2.6" marker-end="url(#arr-y)"/>

  <!-- Tool Call 2 -->
  <rect x="524" y="146" width="234" height="64" rx="12" fill="#17181b" stroke="#ff7daf" stroke-width="1.8"/>
  <text x="641" y="172" text-anchor="middle" class="m" font-size="12.5" fill="#ff7daf" font-weight="600">place_order("Pad Thai", 2)</text>
  <text x="641" y="194" text-anchor="middle" class="sub" font-size="12">Mutates tool_context.state</text>

  <path d="M762 178 H792" stroke="#5cdb6d" stroke-width="2.6" marker-end="url(#arr-g)"/>

  <!-- Tool Result -->
  <rect x="798" y="146" width="256" height="64" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="1.8"/>
  <text x="926" y="172" text-anchor="middle" class="m" font-size="12" fill="#5cdb6d">{"status":"added","qty":2}</text>
  <text x="926" y="194" text-anchor="middle" class="sub" font-size="12">Auto-injected into Live session</text>
</svg>
