<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#57caff"/></marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/></marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="256" height="256" fill="#202124"/>

  <circle cx="88" cy="110" r="92" fill="url(#amb-b)"/>
  <circle cx="172" cy="146" r="92" fill="url(#amb-g)"/>
  <circle cx="128" cy="128" r="98" fill="none" stroke="#5cdb6d" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Top pill -->
  <rect x="66" y="24" width="124" height="26" rx="13" fill="url(#glass)" stroke="#57caff" stroke-width="1.8"/>
  <text x="128" y="41" text-anchor="middle" class="m" font-size="11.5" fill="#57caff" font-weight="600">WS · ASYNCIO</text>

  <!-- Left Client Node -->
  <rect x="22" y="92" width="60" height="72" rx="16" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/>
  <circle cx="52" cy="118" r="11" fill="#57caff" fill-opacity="0.18" stroke="#57caff" stroke-width="2"/>
  <line x1="47" y1="118" x2="57" y2="118" stroke="#57caff" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="113" x2="52" y2="123" stroke="#57caff" stroke-width="2" stroke-linecap="round"/>
  <text x="52" y="150" text-anchor="middle" class="m" font-size="10.5" fill="#ffffff">CLIENT</text>

  <!-- Right Live Node -->
  <rect x="174" y="92" width="60" height="72" rx="16" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2"/>
  <polygon points="204,105 208,114 217,118 208,122 204,131 200,122 191,118 200,114" fill="#5cdb6d" filter="url(#glow-s)"/>
  <text x="204" y="150" text-anchor="middle" class="m" font-size="10.5" fill="#ffffff">LIVE</text>

  <!-- Bidirectional arrows -->
  <path d="M88 108 H164" fill="none" stroke="#57caff" stroke-width="3.6" stroke-linecap="round" marker-end="url(#arr-b)" filter="url(#glow-s)"/>
  <text x="128" y="98" text-anchor="middle" class="m" font-size="10" fill="#57caff">PCM + JPG</text>

  <path d="M168 148 H92" fill="none" stroke="#5cdb6d" stroke-width="3.6" stroke-linecap="round" marker-end="url(#arr-g)" filter="url(#glow-s)"/>
  <text x="128" y="168" text-anchor="middle" class="m" font-size="10" fill="#5cdb6d">24kHz OUT</text>

  <!-- Center BIDI chip -->
  <rect x="103" y="118" width="50" height="20" rx="10" fill="#17181b" stroke="#ffd427" stroke-width="1.5"/>
  <text x="128" y="132" text-anchor="middle" class="m" font-size="10" fill="#ffd427" font-weight="600">BIDI</text>

  <text x="128" y="232" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d">FULL-DUPLEX STREAM</text>
</svg>
