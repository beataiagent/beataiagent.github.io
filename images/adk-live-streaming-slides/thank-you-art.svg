<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="320" height="320" fill="#202124"/>

  <circle cx="160" cy="148" r="138" fill="url(#amb-y)"/>
  <circle cx="110" cy="148" r="88" fill="url(#amb-b)"/>
  <circle cx="212" cy="148" r="88" fill="url(#amb-r)"/>

  <!-- Orbital rings -->
  <circle cx="160" cy="148" r="120" fill="none" stroke="#5f6368" stroke-width="2" stroke-dasharray="7 7"/>
  <circle cx="160" cy="148" r="90" fill="none" stroke="#57caff" stroke-width="1.6" opacity="0.4"/>
  <circle cx="160" cy="148" r="66" fill="none" stroke="#ffd427" stroke-width="1.6" opacity="0.45"/>

  <!-- Halftone satellite dots -->
  <circle cx="160" cy="28" r="8.5" fill="#ffd427" filter="url(#glow-s)"/>
  <circle cx="280" cy="148" r="8" fill="#5cdb6d"/>
  <circle cx="40" cy="148" r="8" fill="#57caff"/>
  <circle cx="245" cy="64" r="6.5" fill="#ff7daf"/>

  <!-- Glowing horizontal audio waveform flanking the Gemini Live orb -->
  <g stroke-linecap="round" filter="url(#glow-s)">
    <line x1="60" y1="140" x2="60" y2="156" stroke="#57caff" stroke-width="4.5" opacity="0.7"/>
    <line x1="74" y1="126" x2="74" y2="170" stroke="#57caff" stroke-width="4.5"/>
    <line x1="88" y1="114" x2="88" y2="182" stroke="#57caff" stroke-width="4.5"/>
    <line x1="102" y1="130" x2="102" y2="166" stroke="#5cdb6d" stroke-width="4.5"/>

    <line x1="218" y1="130" x2="218" y2="166" stroke="#ffd427" stroke-width="4.5"/>
    <line x1="232" y1="114" x2="232" y2="182" stroke="#ff7daf" stroke-width="4.5"/>
    <line x1="246" y1="126" x2="246" y2="170" stroke="#ff7daf" stroke-width="4.5"/>
    <line x1="260" y1="140" x2="260" y2="156" stroke="#ff7daf" stroke-width="4.5" opacity="0.7"/>
  </g>

  <!-- Center Gemini Live Orb -->
  <circle cx="160" cy="148" r="46" fill="url(#glass)" stroke="url(#orb)" stroke-width="3" filter="url(#glow-s)"/>
  <polygon points="160,114 169,139 194,148 169,157 160,182 151,157 126,148 151,139" fill="url(#orb)" filter="url(#glow-s)"/>

  <!-- Bottom ribbon -->
  <rect x="46" y="250" width="228" height="34" rx="17" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  <text x="160" y="271" text-anchor="middle" class="m" font-size="12.5" fill="#ffd427" font-weight="600">LISTEN · THINK · SPEAK</text>
</svg>
