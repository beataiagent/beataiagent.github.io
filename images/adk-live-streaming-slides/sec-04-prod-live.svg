<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="lantern" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="256" height="256" fill="#202124"/>

  <circle cx="96" cy="130" r="90" fill="url(#amb-r)"/>
  <circle cx="176" cy="126" r="88" fill="url(#amb-y)"/>
  <circle cx="128" cy="128" r="98" fill="none" stroke="#ff7daf" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Left: Cloud Run Live Stream Gauge -->
  <rect x="24" y="64" width="124" height="118" rx="18" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/>
  <path d="M46 132 A40 40 0 0 1 126 132" fill="none" stroke="#3c4043" stroke-width="8" stroke-linecap="round"/>
  <path d="M46 132 A40 40 0 0 1 114 104" fill="none" stroke="#5cdb6d" stroke-width="8" stroke-linecap="round" filter="url(#glow-s)"/>
  <line x1="86" y1="132" x2="108" y2="108" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="86" cy="132" r="5" fill="#57caff"/>
  <text x="86" y="154" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d" font-weight="600">60m WS</text>
  <text x="86" y="170" text-anchor="middle" class="m" font-size="9.5" fill="#bdc1c6">CLOUD RUN</text>

  <!-- Right: Night Market Lantern -->
  <line x1="194" y1="44" x2="194" y2="70" stroke="#ffd427" stroke-width="2.4"/>
  <rect x="180" y="68" width="28" height="8" rx="3" fill="#ffd427"/>
  <ellipse cx="194" cy="112" rx="32" ry="38" fill="url(#lantern)" fill-opacity="0.22" stroke="url(#lantern)" stroke-width="2.8" filter="url(#glow-s)"/>
  <ellipse cx="194" cy="112" rx="16" ry="36" fill="none" stroke="#ffd427" stroke-width="1.4" opacity="0.7"/>
  <line x1="164" y1="112" x2="224" y2="112" stroke="#ff7daf" stroke-width="1.4" opacity="0.7"/>
  <rect x="180" y="148" width="28" height="8" rx="3" fill="#ff7daf"/>
  <line x1="194" y1="156" x2="194" y2="180" stroke="#ff7daf" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="194" cy="184" r="4" fill="#ffd427"/>

  <text x="128" y="232" text-anchor="middle" class="m" font-size="11.5" fill="#ff7daf">PRODUCTION LIVE</text>
</svg>
