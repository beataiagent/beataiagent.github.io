<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 356" width="390" height="356">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-bgy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-full" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="35%" stop-color="#5cdb6d"/>
      <stop offset="70%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5f6368" opacity="0.28"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #e8eaed; font-weight: 500; }
      .ms { font-family: "Roboto Mono", ui-monospace, monospace; fill: #9aa0a6; font-weight: 400; }
    </style>
  </defs>
  <rect width="390" height="356" fill="#202124"/>
  <rect width="390" height="356" fill="url(#dots)"/>

  <circle cx="195" cy="80" r="120" fill="url(#amb-b)"/>
  <circle cx="195" cy="276" r="120" fill="url(#amb-g)"/>
  <!-- Step 1 -->
  <rect x="22" y="18" width="346" height="58" rx="13" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <circle cx="52" cy="47" r="15" fill="#17181b" stroke="#57caff" stroke-width="2"/><text x="52" y="52" text-anchor="middle" class="t" font-size="14" fill="#57caff">1</text>
  <text x="80" y="42" class="t" font-size="15">Install CLI + 7 Skills</text>
  <text x="80" y="61" class="ms" font-size="11.5">uvx google-agents-cli setup</text>
  <path d="M195 76 V92" stroke="#57caff" stroke-width="2.5"/><polygon points="190,88 195,96 200,88" fill="#57caff"/>
  <!-- Step 2 -->
  <rect x="22" y="96" width="346" height="58" rx="13" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  <circle cx="52" cy="125" r="15" fill="#17181b" stroke="#ffd427" stroke-width="2"/><text x="52" y="130" text-anchor="middle" class="t" font-size="14" fill="#ffd427">2</text>
  <text x="80" y="120" class="t" font-size="15">Auth &amp; GCP Project</text>
  <text x="80" y="139" class="ms" font-size="11.5">gcloud login → agents-cli login -i</text>
  <path d="M195 154 V170" stroke="#ffd427" stroke-width="2.5"/><polygon points="190,166 195,174 200,166" fill="#ffd427"/>
  <!-- Step 3 -->
  <rect x="22" y="174" width="346" height="58" rx="13" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
  <circle cx="52" cy="203" r="15" fill="#17181b" stroke="#5cdb6d" stroke-width="2"/><text x="52" y="208" text-anchor="middle" class="t" font-size="14" fill="#5cdb6d">3</text>
  <text x="80" y="198" class="t" font-size="15">Scaffold Project</text>
  <text x="80" y="217" class="ms" font-size="11.5">ADK app + evals + Agent Runtime</text>
  <path d="M195 232 V248" stroke="#5cdb6d" stroke-width="2.5"/><polygon points="190,244 195,252 200,244" fill="#5cdb6d"/>
  <!-- Step 4: Playground preview -->
  <rect x="22" y="252" width="346" height="86" rx="14" fill="url(#glass-hi)" stroke="#ff7daf" stroke-width="2.2" filter="url(#glow-s)"/>
  <circle cx="52" cy="284" r="15" fill="#17181b" stroke="#ff7daf" stroke-width="2"/><text x="52" y="289" text-anchor="middle" class="t" font-size="14" fill="#ff7daf">4</text>
  <text x="80" y="279" class="t" font-size="15" fill="#ff7daf">ADK Web Playground</text>
  <rect x="80" y="290" width="268" height="34" rx="9" fill="#17181b" stroke="#5f6368" stroke-width="1.4"/>
  <circle cx="98" cy="307" r="5" fill="#5cdb6d"/>
  <text x="112" y="311" class="m" font-size="11.5" fill="#e8eaed">Chat live · inspect tool calls</text>

</svg>
