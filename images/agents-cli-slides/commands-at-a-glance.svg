<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 390" width="310" height="390">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-bgy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-full" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="35%" stop-color="#5cdb6d"/>
      <stop offset="70%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5f6368" opacity="0.28"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #e8eaed; font-weight: 500; }
      .ms { font-family: "Roboto Mono", ui-monospace, monospace; fill: #9aa0a6; font-weight: 400; }
    </style>
  </defs>
  <rect width="310" height="390" fill="#202124"/>
  <rect width="310" height="390" fill="url(#dots)"/>

  <circle cx="155" cy="90" r="110" fill="url(#amb-b)"/>
  <circle cx="155" cy="295" r="110" fill="url(#amb-g)"/>
  <!-- Terminal header -->
  <rect x="18" y="16" width="274" height="58" rx="14" fill="url(#glass-hi)" stroke="#57caff" stroke-width="2"/>
  <circle cx="38" cy="34" r="4" fill="#ff7daf"/><circle cx="52" cy="34" r="4" fill="#ffd427"/><circle cx="66" cy="34" r="4" fill="#5cdb6d"/>
  <text x="38" y="59" class="m" font-size="14" fill="#57caff">$ agents-cli --help</text>
  <!-- Vertical lifecycle rail -->
  <line x1="50" y1="88" x2="50" y2="352" stroke="url(#grad-full)" stroke-width="3" stroke-dasharray="5 5"/>
  <!-- 5 grouped visual pills -->
  <g transform="translate(26,92)">
    <circle cx="24" cy="22" r="12" fill="#202124" stroke="#bdc1c6" stroke-width="2"/><text x="24" y="26" text-anchor="middle" class="m" font-size="11">1</text>
    <rect x="48" y="2" width="218" height="40" rx="10" fill="url(#glass)" stroke="#5f6368" stroke-width="1.6"/>
    <text x="62" y="20" class="t" font-size="13.5">Install &amp; Auth</text>
    <text x="62" y="34" class="ms" font-size="10.5">setup · login --status</text>
  </g>
  <g transform="translate(26,146)">
    <circle cx="24" cy="22" r="12" fill="#202124" stroke="#57caff" stroke-width="2"/><text x="24" y="26" text-anchor="middle" class="m" font-size="11" fill="#57caff">2</text>
    <rect x="48" y="2" width="218" height="40" rx="10" fill="url(#glass)" stroke="#57caff" stroke-width="1.8"/>
    <text x="62" y="20" class="t" font-size="13.5" fill="#57caff">Create &amp; Run</text>
    <text x="62" y="34" class="ms" font-size="10.5">scaffold · playground</text>
  </g>
  <g transform="translate(26,200)">
    <circle cx="24" cy="22" r="12" fill="#202124" stroke="#ffd427" stroke-width="2.2" filter="url(#glow-s)"/><text x="24" y="26" text-anchor="middle" class="m" font-size="11" fill="#ffd427">3</text>
    <rect x="48" y="2" width="218" height="40" rx="10" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
    <text x="62" y="20" class="t" font-size="13.5" fill="#ffd427">Evaluate Loop</text>
    <text x="62" y="34" class="ms" font-size="10.5">run · grade · compare</text>
  </g>
  <g transform="translate(26,254)">
    <circle cx="24" cy="22" r="12" fill="#202124" stroke="#5cdb6d" stroke-width="2"/><text x="24" y="26" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d">4</text>
    <rect x="48" y="2" width="218" height="40" rx="10" fill="url(#glass)" stroke="#5cdb6d" stroke-width="1.8"/>
    <text x="62" y="20" class="t" font-size="13.5" fill="#5cdb6d">Ship to Cloud</text>
    <text x="62" y="34" class="ms" font-size="10.5">infra cicd · deploy</text>
  </g>
  <g transform="translate(26,308)">
    <circle cx="24" cy="22" r="12" fill="#202124" stroke="#ff7daf" stroke-width="2"/><text x="24" y="26" text-anchor="middle" class="m" font-size="11" fill="#ff7daf">5</text>
    <rect x="48" y="2" width="218" height="40" rx="10" fill="url(#glass)" stroke="#ff7daf" stroke-width="1.8"/>
    <text x="62" y="20" class="t" font-size="13.5" fill="#ff7daf">Share &amp; Inspect</text>
    <text x="62" y="34" class="ms" font-size="10.5">publish · info</text>
  </g>
  <text x="155" y="376" text-anchor="middle" class="ms" font-size="11">One CLI · zero boilerplate scripts</text>

</svg>
