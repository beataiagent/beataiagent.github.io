<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 166" width="1088" height="166">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-bgy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-full" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="35%" stop-color="#5cdb6d"/>
      <stop offset="70%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5f6368" opacity="0.28"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #e8eaed; font-weight: 500; }
      .ms { font-family: "Roboto Mono", ui-monospace, monospace; fill: #9aa0a6; font-weight: 400; }
    </style>
  </defs>
  <rect width="1088" height="166" fill="#202124"/>
  <rect width="1088" height="166" fill="url(#dots)"/>

  <circle cx="230" cy="83" r="120" fill="url(#amb-b)"/>
  <circle cx="544" cy="83" r="130" fill="url(#amb-g)"/>
  <circle cx="880" cy="83" r="120" fill="url(#amb-r)"/>
  <!-- Left: 3-tier Pyramid -->
  <polygon points="184,18 276,62 92,62" fill="#223b2c" stroke="#5cdb6d" stroke-width="2.2" filter="url(#glow-s)"/>
  <text x="184" y="51" text-anchor="middle" class="t" font-size="13" fill="#5cdb6d">EVAL</text>
  <polygon points="84,68 284,68 312,108 56,108" fill="#1f3142" stroke="#57caff" stroke-width="2"/>
  <text x="184" y="93" text-anchor="middle" class="t" font-size="13.5" fill="#57caff">PYTEST (UNIT)</text>
  <polygon points="48,114 320,114 348,150 20,150" fill="url(#glass)" stroke="#bdc1c6" stroke-width="2"/>
  <text x="184" y="137" text-anchor="middle" class="t" font-size="13.5">SMOKE TEST (RUN)</text>
  <!-- Right: Spectrum mapping -->
  <rect x="382" y="16" width="684" height="134" rx="16" fill="url(#glass)" stroke="#5f6368" stroke-width="1.8"/>
  <!-- Row 1: Eval -->
  <circle cx="412" cy="44" r="11" fill="#5cdb6d"/>
  <text x="436" y="49" class="m" font-size="13.5" fill="#5cdb6d">agents-cli eval</text>
  <text x="616" y="49" class="sub" font-size="14">LLM Judge · non-deterministic quality &amp; safety</text>
  <rect x="954" y="31" width="96" height="26" rx="13" fill="#223b2c" stroke="#5cdb6d" stroke-width="1.5"/>
  <text x="1002" y="48" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d">Behavior</text>
  <line x1="402" y1="67" x2="1048" y2="67" stroke="#3c4043" stroke-width="1.2"/>
  <!-- Row 2: Pytest -->
  <circle cx="412" cy="86" r="11" fill="#57caff"/>
  <text x="436" y="91" class="m" font-size="13.5" fill="#57caff">uv run pytest</text>
  <text x="616" y="91" class="sub" font-size="14">Deterministic code · imports, types, APIs</text>
  <rect x="954" y="73" width="96" height="26" rx="13" fill="#1f3142" stroke="#57caff" stroke-width="1.5"/>
  <text x="1002" y="90" text-anchor="middle" class="m" font-size="11" fill="#57caff">Code</text>
  <line x1="402" y1="109" x2="1048" y2="109" stroke="#3c4043" stroke-width="1.2"/>
  <!-- Row 3: Smoke -->
  <circle cx="412" cy="128" r="11" fill="#bdc1c6"/>
  <text x="436" y="133" class="m" font-size="13.5" fill="#fff">agents-cli run</text>
  <text x="616" y="133" class="sub" font-size="14">Instant check while coding · 1 prompt → 1 reply</text>
  <rect x="954" y="115" width="96" height="26" rx="13" fill="#2a2b2f" stroke="#bdc1c6" stroke-width="1.5"/>
  <text x="1002" y="132" text-anchor="middle" class="m" font-size="11" fill="#e8eaed">Sanity</text>

</svg>
