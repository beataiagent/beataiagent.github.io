<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 404 138" width="404" height="138">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-bgy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-full" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="35%" stop-color="#5cdb6d"/>
      <stop offset="70%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5f6368" opacity="0.28"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #e8eaed; font-weight: 500; }
      .ms { font-family: "Roboto Mono", ui-monospace, monospace; fill: #9aa0a6; font-weight: 400; }
    </style>
  </defs>
  <rect width="404" height="138" fill="#202124"/>
  <rect width="404" height="138" fill="url(#dots)"/>

  <circle cx="202" cy="69" r="110" fill="url(#amb-g)"/>
  <!-- Prompt bubble -->
  <rect x="12" y="34" width="96" height="70" rx="12" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <text x="60" y="58" text-anchor="middle" class="m" font-size="10" fill="#57caff">PROMPT</text>
  <text x="60" y="78" text-anchor="middle" class="t" font-size="12.5">"Weather in</text>
  <text x="60" y="94" text-anchor="middle" class="t" font-size="12.5">Bangkok?"</text>
  <path d="M112 69 H142" stroke="#57caff" stroke-width="2.6"/><polygon points="138,64 146,69 138,74" fill="#57caff"/>
  <!-- Center ADK Agent -->
  <rect x="148" y="18" width="112" height="102" rx="16" fill="url(#glass-hi)" stroke="#5cdb6d" stroke-width="2.2" filter="url(#glow-s)"/>
    <g transform="translate(204,62) scale(0.56)">
    <line x1="0" y1="-34" x2="0" y2="-45" stroke="#5cdb6d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-49" r="4.5" fill="#5cdb6d" filter="url(#glow-s)"/>
    <rect x="-28" y="-34" width="56" height="42" rx="16" fill="url(#glass-hi)" stroke="#5cdb6d" stroke-width="2.4"/>
    <rect x="-19" y="-25" width="38" height="24" rx="10" fill="#17181b"/>
    <circle cx="-8.5" cy="-13" r="4.2" fill="#5cdb6d" filter="url(#glow-s)"/>
    <circle cx="8.5" cy="-13" r="4.2" fill="#5cdb6d" filter="url(#glow-s)"/>
    <path d="M-6 -5 Q0 -1 6 -5" fill="none" stroke="#5cdb6d" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M-19 11 H19 C22 11 20 34 0 38 C-20 34 -22 11 -19 11 Z" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
    <circle cx="0" cy="23" r="5" fill="#5cdb6d" opacity="0.9"/>
  </g>
  <text x="204" y="109" text-anchor="middle" class="m" font-size="10.5" fill="#5cdb6d">ADK Agent</text>
  <!-- Bidirectional arrow to Tool -->
  <path d="M264 62 H290" stroke="#ffd427" stroke-width="2.4"/><polygon points="286,57 294,62 286,67" fill="#ffd427"/>
  <path d="M292 78 H266" stroke="#ffd427" stroke-width="2.4"/><polygon points="270,73 262,78 270,83" fill="#ffd427"/>
  <!-- Right Tool box -->
  <rect x="296" y="26" width="96" height="86" rx="12" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  <text x="344" y="48" text-anchor="middle" class="m" font-size="10" fill="#ffd427">TOOL</text>
  <text x="344" y="69" text-anchor="middle" class="m" font-size="11" fill="#fff">get_weather</text>
  <rect x="306" y="79" width="76" height="22" rx="7" fill="#17181b" stroke="#ffd427" stroke-width="1.2"/>
  <text x="344" y="94" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">22°C sunny</text>

</svg>
