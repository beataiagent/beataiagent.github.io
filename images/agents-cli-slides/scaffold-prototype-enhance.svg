<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-bgy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-full" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="35%" stop-color="#5cdb6d"/>
      <stop offset="70%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5f6368" opacity="0.28"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #e8eaed; font-weight: 500; }
      .ms { font-family: "Roboto Mono", ui-monospace, monospace; fill: #9aa0a6; font-weight: 400; }
    </style>
  </defs>
  <rect width="640" height="120" fill="#202124"/>
  <rect width="640" height="120" fill="url(#dots)"/>

  <circle cx="145" cy="60" r="95" fill="url(#amb-b)"/>
  <circle cx="495" cy="60" r="105" fill="url(#amb-g)"/>
  <!-- Phase 1: prototype mode -->
  <rect x="18" y="16" width="246" height="88" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/>
  <text x="36" y="40" class="m" font-size="11.5" fill="#57caff">1 · FAST PROTOTYPE</text>
  <rect x="36" y="50" width="62" height="38" rx="8" fill="#17181b" stroke="#57caff" stroke-width="1.5"/>
  <text x="67" y="74" text-anchor="middle" class="m" font-size="11.5">app/</text>
  <rect x="106" y="50" width="76" height="38" rx="8" fill="#17181b" stroke="#5cdb6d" stroke-width="1.5"/>
  <text x="144" y="74" text-anchor="middle" class="m" font-size="11.5">eval/</text>
  <rect x="190" y="50" width="58" height="38" rx="8" fill="#17181b" stroke="#ff7daf" stroke-width="1.5"/>
  <text x="219" y="74" text-anchor="middle" class="m" font-size="11">guide</text>
  <!-- Transition arrow -->
  <path d="M272 60 H352" stroke="url(#grad-bg)" stroke-width="3.5"/>
  <polygon points="347,53 359,60 347,67" fill="#5cdb6d"/>
  <rect x="276" y="26" width="74" height="22" rx="11" fill="#202124" stroke="#ffd427" stroke-width="1.5"/>
  <text x="313" y="41" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">enhance</text>
  <!-- Phase 2: Production Armor -->
  <rect x="364" y="16" width="258" height="88" rx="14" fill="url(#glass-hi)" stroke="#5cdb6d" stroke-width="2.2" filter="url(#glow-s)"/>
  <text x="382" y="40" class="m" font-size="11.5" fill="#5cdb6d">2 · PRODUCTION READY</text>
  <rect x="382" y="50" width="72" height="38" rx="8" fill="#17181b" stroke="#57caff" stroke-width="1.5"/>
  <text x="418" y="74" text-anchor="middle" class="m" font-size="11">core</text>
  <rect x="462" y="50" width="72" height="38" rx="8" fill="#17181b" stroke="#ffd427" stroke-width="1.6"/>
  <text x="498" y="74" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">+IaC</text>
  <rect x="542" y="50" width="66" height="38" rx="8" fill="#17181b" stroke="#5cdb6d" stroke-width="1.6"/>
  <text x="575" y="74" text-anchor="middle" class="m" font-size="10.5" fill="#5cdb6d">+CI/CD</text>

</svg>
