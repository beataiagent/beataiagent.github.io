<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 132" width="1088" height="132">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-bgy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-full" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="35%" stop-color="#5cdb6d"/>
      <stop offset="70%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5f6368" opacity="0.28"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #e8eaed; font-weight: 500; }
      .ms { font-family: "Roboto Mono", ui-monospace, monospace; fill: #9aa0a6; font-weight: 400; }
    </style>
  </defs>
  <rect width="1088" height="132" fill="#202124"/>
  <rect width="1088" height="132" fill="url(#dots)"/>

  <circle cx="150" cy="66" r="110" fill="url(#amb-y)"/>
  <circle cx="560" cy="66" r="150" fill="url(#amb-b)"/>
  <circle cx="960" cy="66" r="120" fill="url(#amb-r)"/>
  <!-- Spine line -->
  <path d="M180 66 H1030" stroke="url(#grad-full)" stroke-width="3.5" stroke-dasharray="8 6" opacity="0.85"/>
  <!-- Hub: workflow -->
  <rect x="24" y="24" width="176" height="84" rx="16" fill="url(#glass-hi)" stroke="#ffffff" stroke-width="2.4" filter="url(#glow-s)"/>
  <text x="112" y="52" text-anchor="middle" class="m" font-size="11" fill="#ffd427">ORCHESTRATOR</text>
  <text x="112" y="76" text-anchor="middle" class="t" font-size="18">workflow</text>
  <text x="112" y="96" text-anchor="middle" class="ms" font-size="11">guides all phases</text>
  <!-- 6 lifecycle skill nodes -->
  <g transform="translate(226,28)">
    <rect width="124" height="76" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
    <text x="62" y="28" text-anchor="middle" class="m" font-size="11" fill="#57caff">BUILD</text>
    <text x="62" y="52" text-anchor="middle" class="t" font-size="15">adk-code</text>
    <text x="62" y="68" text-anchor="middle" class="ms" font-size="10">ADK Python API</text>
  </g>
  <g transform="translate(366,28)">
    <rect width="124" height="76" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
    <text x="62" y="28" text-anchor="middle" class="m" font-size="11" fill="#57caff">STRUCTURE</text>
    <text x="62" y="52" text-anchor="middle" class="t" font-size="15">scaffold</text>
    <text x="62" y="68" text-anchor="middle" class="ms" font-size="10">create · enhance</text>
  </g>
  <g transform="translate(506,28)">
    <rect width="124" height="76" rx="14" fill="url(#glass)" stroke="#ffd427" stroke-width="2.2" filter="url(#glow-s)"/>
    <text x="62" y="28" text-anchor="middle" class="m" font-size="11" fill="#ffd427">QUALITY</text>
    <text x="62" y="52" text-anchor="middle" class="t" font-size="15">eval</text>
    <text x="62" y="68" text-anchor="middle" class="ms" font-size="10">judge · compare</text>
  </g>
  <g transform="translate(646,28)">
    <rect width="124" height="76" rx="14" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
    <text x="62" y="28" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d">SHIP</text>
    <text x="62" y="52" text-anchor="middle" class="t" font-size="15">deploy</text>
    <text x="62" y="68" text-anchor="middle" class="ms" font-size="10">Runtime·Run·GKE</text>
  </g>
  <g transform="translate(786,28)">
    <rect width="124" height="76" rx="14" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
    <text x="62" y="28" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d">SHARE</text>
    <text x="62" y="52" text-anchor="middle" class="t" font-size="15">publish</text>
    <text x="62" y="68" text-anchor="middle" class="ms" font-size="10">Gemini Ent.</text>
  </g>
  <g transform="translate(926,28)">
    <rect width="138" height="76" rx="14" fill="url(#glass)" stroke="#ff7daf" stroke-width="2"/>
    <text x="69" y="28" text-anchor="middle" class="m" font-size="11" fill="#ff7daf">MONITOR</text>
    <text x="69" y="52" text-anchor="middle" class="t" font-size="15">observability</text>
    <text x="69" y="68" text-anchor="middle" class="ms" font-size="10">Trace · BigQuery</text>
  </g>

</svg>
