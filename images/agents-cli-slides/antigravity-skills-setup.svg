<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 142" width="1088" height="142">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-bgy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-full" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="35%" stop-color="#5cdb6d"/>
      <stop offset="70%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5f6368" opacity="0.28"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #e8eaed; font-weight: 500; }
      .ms { font-family: "Roboto Mono", ui-monospace, monospace; fill: #9aa0a6; font-weight: 400; }
    </style>
  </defs>
  <rect width="1088" height="142" fill="#202124"/>
  <rect width="1088" height="142" fill="url(#dots)"/>

  <circle cx="150" cy="71" r="110" fill="url(#amb-b)"/>
  <circle cx="520" cy="71" r="120" fill="url(#amb-g)"/>
  <circle cx="920" cy="71" r="120" fill="url(#amb-y)"/>
  <!-- Box 1: setup command -->
  <rect x="20" y="26" width="234" height="90" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/>
  <text x="38" y="52" class="m" font-size="11.5" fill="#57caff">1 · SETUP CLI</text>
  <rect x="36" y="64" width="202" height="36" rx="9" fill="#17181b" stroke="#57caff" stroke-width="1.5"/>
  <text x="137" y="87" text-anchor="middle" class="m" font-size="11.5" fill="#fff">uvx google-agents-cli</text>
  <!-- Arrow -->
  <path d="M258 71 H298" stroke="#57caff" stroke-width="3"/><polygon points="293,65 303,71 293,77" fill="#57caff"/>
  <!-- Box 2: Central skills vault -->
  <rect x="306" y="22" width="230" height="98" rx="14" fill="url(#glass-hi)" stroke="#5cdb6d" stroke-width="2.2"/>
  <text x="421" y="48" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d">2 · STORED ONCE</text>
  <text x="421" y="73" text-anchor="middle" class="m" font-size="13.5" fill="#fff">~/.agents/skills</text>
  <text x="421" y="98" text-anchor="middle" class="ms" font-size="11.5">7 google-agents-cli-* folders</text>
  <!-- Forking symlink arrows -->
  <path d="M540 71 C574 71, 574 44, 608 44" fill="none" stroke="#5cdb6d" stroke-width="2.5"/>
  <polygon points="603,39 613,44 603,49" fill="#5cdb6d"/>
  <path d="M540 71 C574 71, 574 98, 608 98" fill="none" stroke="#5cdb6d" stroke-width="2.5"/>
  <polygon points="603,93 613,98 603,103" fill="#5cdb6d"/>
  <!-- Symlink targets -->
  <rect x="616" y="20" width="212" height="46" rx="11" fill="#17181b" stroke="#5cdb6d" stroke-width="1.6"/>
  <text x="722" y="40" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d">~/.gemini/config/skills</text>
  <text x="722" y="56" text-anchor="middle" class="ms" font-size="10.5">Antigravity IDE</text>
  <rect x="616" y="76" width="212" height="46" rx="11" fill="#17181b" stroke="#57caff" stroke-width="1.6"/>
  <text x="722" y="96" text-anchor="middle" class="m" font-size="11" fill="#57caff">~/.gemini/antigravity-cli</text>
  <text x="722" y="112" text-anchor="middle" class="ms" font-size="10.5">Antigravity CLI</text>
  <!-- Merge into Agent Panel -->
  <path d="M832 44 C852 44, 852 71, 872 71" fill="none" stroke="#ffd427" stroke-width="2.5"/>
  <path d="M832 98 C852 98, 852 71, 872 71" fill="none" stroke="#ffd427" stroke-width="2.5"/>
  <polygon points="868,65 878,71 868,77" fill="#ffd427"/>
  <!-- Box 4: Agent Panel Ready -->
  <rect x="880" y="22" width="188" height="98" rx="14" fill="url(#glass-hi)" stroke="#ffd427" stroke-width="2.2" filter="url(#glow-s)"/>
  <text x="974" y="48" text-anchor="middle" class="m" font-size="11.5" fill="#ffd427">3 · READY TO USE</text>
  <text x="974" y="75" text-anchor="middle" class="t" font-size="16">Antigravity</text>
  <text x="974" y="99" text-anchor="middle" class="ms" font-size="11.5">7 skills active ✓</text>

</svg>
