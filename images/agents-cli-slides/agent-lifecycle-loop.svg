<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 136" width="1088" height="136">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-bgy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-full" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="35%" stop-color="#5cdb6d"/>
      <stop offset="70%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5f6368" opacity="0.28"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #e8eaed; font-weight: 500; }
      .ms { font-family: "Roboto Mono", ui-monospace, monospace; fill: #9aa0a6; font-weight: 400; }
    </style>
  </defs>
  <rect width="1088" height="136" fill="#202124"/>
  <rect width="1088" height="136" fill="url(#dots)"/>

  <circle cx="590" cy="68" r="135" fill="url(#amb-y)"/>
  <circle cx="240" cy="68" r="100" fill="url(#amb-b)"/>
  <circle cx="920" cy="68" r="100" fill="url(#amb-r)"/>
  <!-- Main horizontal pipeline track -->
  <path d="M56 76 H1032" stroke="url(#grad-full)" stroke-width="4" stroke-linecap="round"/>
  <!-- Eval-Fix loop arc from 4 back to 3 -->
  <path d="M598 48 C598 10, 466 10, 466 48" fill="none" stroke="#ffd427" stroke-width="2.6" stroke-dasharray="5 4" filter="url(#glow-s)"/>
  <polygon points="461,44 466,54 471,44" fill="#ffd427"/>
  <rect x="478" y="8" width="108" height="22" rx="11" fill="#202124" stroke="#ffd427" stroke-width="1.5"/>
  <text x="532" y="23" text-anchor="middle" class="m" font-size="11" fill="#ffd427">5–10+ loops</text>
  <!-- Feedback loop arc from 7 back to 4 -->
  <path d="M1006 104 C1006 128, 598 128, 598 104" fill="none" stroke="#ff7daf" stroke-width="2" stroke-dasharray="5 5" opacity="0.8"/>
  <polygon points="593,109 598,99 603,109" fill="#ff7daf"/>
  <text x="802" y="126" text-anchor="middle" class="ms" font-size="11" fill="#ff7daf">production traces feed new eval cases</text>
  <!-- 8 step circles -->
  <g text-anchor="middle">
    <circle cx="72" cy="76" r="24" fill="url(#glass)" stroke="#bdc1c6" stroke-width="2"/><text x="72" y="81" class="t" font-size="15">0</text><text x="72" y="114" class="ms" font-size="11">Spec</text>
    <circle cx="204" cy="76" r="24" fill="url(#glass)" stroke="#bdc1c6" stroke-width="2"/><text x="204" y="81" class="t" font-size="15">1</text><text x="204" y="114" class="ms" font-size="11">Samples</text>
    <circle cx="336" cy="76" r="24" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/><text x="336" y="81" class="t" font-size="15" fill="#57caff">2</text><text x="336" y="114" class="m" font-size="11" fill="#57caff">Scaffold</text>
    <circle cx="466" cy="76" r="24" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/><text x="466" y="81" class="t" font-size="15" fill="#57caff">3</text><text x="466" y="114" class="m" font-size="11" fill="#57caff">Build</text>
    <circle cx="598" cy="76" r="28" fill="#2c291b" stroke="#ffd427" stroke-width="3" filter="url(#glow-s)"/><text x="598" y="82" class="t" font-size="17" fill="#ffd427">4</text><text x="598" y="116" class="m" font-size="11.5" fill="#ffd427">Evaluate</text>
    <circle cx="734" cy="76" r="24" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2"/><text x="734" y="81" class="t" font-size="15" fill="#5cdb6d">5</text><text x="734" y="114" class="m" font-size="11" fill="#5cdb6d">Deploy</text>
    <circle cx="870" cy="76" r="24" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2"/><text x="870" y="81" class="t" font-size="15" fill="#5cdb6d">6</text><text x="870" y="114" class="m" font-size="11" fill="#5cdb6d">Publish</text>
    <circle cx="1006" cy="76" r="24" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.2"/><text x="1006" y="81" class="t" font-size="15" fill="#ff7daf">7</text><text x="1006" y="114" class="m" font-size="11" fill="#ff7daf">Observe</text>
  </g>

</svg>
