<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 156" width="1088" height="156">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-bgy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-full" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="35%" stop-color="#5cdb6d"/>
      <stop offset="70%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5f6368" opacity="0.28"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #e8eaed; font-weight: 500; }
      .ms { font-family: "Roboto Mono", ui-monospace, monospace; fill: #9aa0a6; font-weight: 400; }
    </style>
  </defs>
  <rect width="1088" height="156" fill="#202124"/>
  <rect width="1088" height="156" fill="url(#dots)"/>

  <circle cx="250" cy="78" r="130" fill="url(#amb-b)"/>
  <circle cx="838" cy="78" r="130" fill="url(#amb-g)"/>
  <!-- Left panel: Human -> Terminal -> CLI -->
  <rect x="20" y="16" width="496" height="124" rx="16" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/>
  <text x="42" y="42" class="m" font-size="12" fill="#57caff">WAY 1 · DIRECT TERMINAL CONTROL</text>
  <!-- Dev icon -->
  <circle cx="72" cy="84" r="24" fill="#17181b" stroke="#57caff" stroke-width="2"/>
  <circle cx="72" cy="76" r="7" fill="#57caff"/>
  <path d="M58 98 c3-8 9-11 14-11 s11 3 14 11" fill="none" stroke="#57caff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="72" y="124" text-anchor="middle" class="ms" font-size="11">You</text>
  <!-- Arrow -->
  <path d="M104 84 H142" stroke="#57caff" stroke-width="2.8"/>
  <polygon points="137,78 147,84 137,90" fill="#57caff"/>
  <!-- Terminal box -->
  <rect x="152" y="54" width="184" height="62" rx="12" fill="#17181b" stroke="#57caff" stroke-width="1.8"/>
  <text x="166" y="77" class="m" font-size="12.5" fill="#57caff">$ agents-cli scaffold</text>
  <text x="166" y="99" class="m" font-size="12.5" fill="#bdc1c6">$ agents-cli eval run</text>
  <!-- Arrow -->
  <path d="M342 84 H378" stroke="#57caff" stroke-width="2.8"/>
  <polygon points="373,78 383,84 373,90" fill="#57caff"/>
  <!-- Cloud output -->
  <rect x="388" y="54" width="110" height="62" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="1.8"/>
  <text x="443" y="81" text-anchor="middle" class="t" font-size="14">ADK Agent</text>
  <text x="443" y="101" text-anchor="middle" class="ms" font-size="11">step by step</text>
  <!-- Center OR pill -->
  <circle cx="544" cy="78" r="22" fill="#202124" stroke="#ffd427" stroke-width="2.2"/>
  <text x="544" y="83" text-anchor="middle" class="m" font-size="13" fill="#ffd427">OR</text>
  <!-- Right panel: Human -> AI Coding Agent (+Skills) -> CLI -->
  <rect x="572" y="16" width="496" height="124" rx="16" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2"/>
  <text x="594" y="42" class="m" font-size="12" fill="#5cdb6d">WAY 2 · AI CODING AGENT + AGENT SKILLS</text>
  <!-- Prompt bubble -->
  <rect x="592" y="54" width="128" height="62" rx="12" fill="#17181b" stroke="#ffd427" stroke-width="1.8"/>
  <text x="656" y="78" text-anchor="middle" class="t" font-size="13" fill="#ffd427">"Build me an</text>
  <text x="656" y="97" text-anchor="middle" class="t" font-size="13" fill="#ffd427">agent that…"</text>
  <path d="M726 84 H758" stroke="#ffd427" stroke-width="2.8"/>
  <polygon points="753,78 763,84 753,90" fill="#ffd427"/>
  <!-- AI Coding Agent + Skills -->
  <rect x="768" y="50" width="144" height="70" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="2.2" filter="url(#glow-s)"/>
  <text x="840" y="75" text-anchor="middle" class="t" font-size="14" fill="#fff">Coding Agent</text>
  <rect x="782" y="85" width="116" height="24" rx="12" fill="#263b2d" stroke="#5cdb6d" stroke-width="1.4"/>
  <text x="840" y="101" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d">+ 7 Agent Skills</text>
  <path d="M918 84 H948" stroke="#5cdb6d" stroke-width="2.8"/>
  <polygon points="943,78 953,84 943,90" fill="#5cdb6d"/>
  <!-- Runs CLI automatically -->
  <rect x="958" y="54" width="94" height="62" rx="12" fill="#17181b" stroke="#57caff" stroke-width="1.8"/>
  <text x="1005" y="79" text-anchor="middle" class="m" font-size="12" fill="#57caff">agents-cli</text>
  <text x="1005" y="99" text-anchor="middle" class="ms" font-size="11">auto-run</text>

</svg>
