<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 148" width="1088" height="148">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-bgy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-full" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="35%" stop-color="#5cdb6d"/>
      <stop offset="70%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#5f6368" opacity="0.28"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #e8eaed; font-weight: 500; }
      .ms { font-family: "Roboto Mono", ui-monospace, monospace; fill: #9aa0a6; font-weight: 400; }
    </style>
  </defs>
  <rect width="1088" height="148" fill="#202124"/>
  <rect width="1088" height="148" fill="url(#dots)"/>

  <circle cx="170" cy="74" r="110" fill="url(#amb-b)"/>
  <circle cx="544" cy="74" r="130" fill="url(#amb-y)"/>
  <circle cx="930" cy="74" r="110" fill="url(#amb-g)"/>
  <!-- Glowing railway track -->
  <path d="M58 76 H1030" stroke="url(#grad-full)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Repeat arc on eval -->
  <path d="M510 50 C510 14, 578 14, 578 50" fill="none" stroke="#ffd427" stroke-width="2.4" stroke-dasharray="4 4"/>
  <text x="544" y="20" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">loop</text>
  <!-- 7 stations -->
  <g transform="translate(22,42)"><rect width="128" height="68" rx="13" fill="url(#glass)" stroke="#bdc1c6" stroke-width="2"/><text x="64" y="28" text-anchor="middle" class="m" font-size="11" fill="#bdc1c6">1 · SETUP</text><text x="64" y="52" text-anchor="middle" class="t" font-size="14">CLI + Skills</text></g>
  <g transform="translate(174,42)"><rect width="128" height="68" rx="13" fill="url(#glass)" stroke="#57caff" stroke-width="2"/><text x="64" y="28" text-anchor="middle" class="m" font-size="11" fill="#57caff">2 · SCAFFOLD</text><text x="64" y="52" text-anchor="middle" class="t" font-size="14">--prototype</text></g>
  <g transform="translate(326,42)"><rect width="128" height="68" rx="13" fill="url(#glass)" stroke="#57caff" stroke-width="2"/><text x="64" y="28" text-anchor="middle" class="m" font-size="11" fill="#57caff">3 · SMOKE</text><text x="64" y="52" text-anchor="middle" class="t" font-size="14">run / chat</text></g>
  <g transform="translate(478,38)"><rect width="132" height="76" rx="14" fill="#2c291b" stroke="#ffd427" stroke-width="2.6" filter="url(#glow-s)"/><text x="66" y="30" text-anchor="middle" class="m" font-size="11.5" fill="#ffd427">4 · EVALUATE</text><text x="66" y="56" text-anchor="middle" class="t" font-size="15">eval run</text></g>
  <g transform="translate(634,42)"><rect width="128" height="68" rx="13" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/><text x="64" y="28" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d">5 · ENHANCE</text><text x="64" y="52" text-anchor="middle" class="t" font-size="14">add target</text></g>
  <g transform="translate(786,42)"><rect width="128" height="68" rx="13" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2" filter="url(#glow-s)"/><text x="64" y="28" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d">6 · DEPLOY ✓</text><text x="64" y="52" text-anchor="middle" class="t" font-size="14">Human OK</text></g>
  <g transform="translate(938,42)"><rect width="128" height="68" rx="13" fill="url(#glass)" stroke="#ff7daf" stroke-width="2"/><text x="64" y="28" text-anchor="middle" class="m" font-size="11" fill="#ff7daf">7 · PUBLISH</text><text x="64" y="52" text-anchor="middle" class="t" font-size="14">Gemini Ent.</text></g>

</svg>
