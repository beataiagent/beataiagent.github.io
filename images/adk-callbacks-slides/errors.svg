<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 444 290" width="444" height="290" role="img" aria-label="on_model_error turns a 429 quota error into a friendly reply; on_tool_error turns a tool timeout into an error dict the model can act on">
<defs>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#303238"/><stop offset="1" stop-color="#1d1e22"/></linearGradient>
  <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8df7"/><stop offset=".55" stop-color="#a77bf3"/><stop offset="1" stop-color="#57caff"/></linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glow-s" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="amb-b" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#57caff" stop-opacity=".26"/><stop offset="1" stop-color="#57caff" stop-opacity="0"/></radialGradient><radialGradient id="amb-g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5cdb6d" stop-opacity=".26"/><stop offset="1" stop-color="#5cdb6d" stop-opacity="0"/></radialGradient><radialGradient id="amb-y" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd427" stop-opacity=".26"/><stop offset="1" stop-color="#ffd427" stop-opacity="0"/></radialGradient><radialGradient id="amb-r" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff7daf" stop-opacity=".26"/><stop offset="1" stop-color="#ff7daf" stop-opacity="0"/></radialGradient>
  <marker id="a-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#57caff"/></marker><marker id="a-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/></marker><marker id="a-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#ffd427"/></marker><marker id="a-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#ff7daf"/></marker><marker id="a-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#e8eaed"/></marker><marker id="a-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#80868b"/></marker>
</defs>
<circle cx="120" cy="70" r="110" fill="url(#amb-r)"/>
<circle cx="120" cy="220" r="110" fill="url(#amb-r)"/>
<text x="8" y="16" font-family='"Roboto Mono", ui-monospace, monospace' font-size="11" font-weight="700" fill="#ff7daf" text-anchor="start">MODEL ERROR</text>
<path d="M36 42 C36 56.4 41.6 62 56 62 C41.6 62 36 67.6 36 82 C36 67.6 30.4 62 16 62 C30.4 62 36 56.4 36 42 Z" fill="url(#gem)" opacity="1" filter="url(#glow-s)"/>
<g transform="translate(50,30) scale(0.9167)" fill="rgba(255,125,175,.3)" stroke="#ff7daf" stroke-width="2.182" stroke-linecap="round" stroke-linejoin="round" opacity="1" filter="url(#glow-s)"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></g>
<text x="36" y="104" font-family='"Roboto Mono", ui-monospace, monospace' font-size="11.5" font-weight="600" fill="#ff7daf" text-anchor="middle">429 quota</text>
<path d="M70 62 H94" fill="none" stroke="#ff7daf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-r)"/>
<rect x="98" y="47" width="124.8" height="28" rx="14.0" fill="#17181b" stroke="#ff7daf" stroke-width="1.8" stroke-dasharray="6 5"/><text x="160.4" y="65.32" font-family='"Roboto Mono", ui-monospace, monospace' font-size="12" font-weight="600" fill="#ff7daf" text-anchor="middle">on_model_error</text>
<path d="M228 62 H250" fill="none" stroke="#5cdb6d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-g)"/>
<rect x="254" y="36" width="182" height="51.75" rx="12" fill="url(#glass)" stroke="#5cdb6d" stroke-width="1.8"/><text x="268" y="57.75" font-family='"Google Sans", "Product Sans", system-ui, sans-serif' font-size="12.5" font-weight="500" fill="#e8eaed" text-anchor="start">Busy now.</text><text x="268" y="74.625" font-family='"Google Sans", "Product Sans", system-ui, sans-serif' font-size="12.5" font-weight="500" fill="#e8eaed" text-anchor="start">Try again soon.</text>
<text x="254" y="120" font-family='"Roboto Mono", ui-monospace, monospace' font-size="11" font-weight="500" fill="#bdc1c6" text-anchor="start">no crash · user gets a reply</text>
<path d="M8 146 H436" fill="none" stroke="#3c4043" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5" opacity="1"/>
<text x="8" y="172" font-family='"Roboto Mono", ui-monospace, monospace' font-size="11" font-weight="700" fill="#ff7daf" text-anchor="start">TOOL ERROR</text>
<g transform="translate(22,202) scale(1.1667)" fill="none" stroke="#ffd427" stroke-width="1.886" stroke-linecap="round" stroke-linejoin="round" opacity="1"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4Z"/></g>
<g transform="translate(44,186) scale(0.8333)" fill="rgba(255,125,175,.3)" stroke="#ff7daf" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" opacity="1" filter="url(#glow-s)"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></g>
<text x="36" y="256" font-family='"Roboto Mono", ui-monospace, monospace' font-size="11.5" font-weight="600" fill="#ff7daf" text-anchor="middle">Timeout</text>
<path d="M70 216 H94" fill="none" stroke="#ff7daf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-r)"/>
<rect x="98" y="201" width="117.6" height="28" rx="14.0" fill="#17181b" stroke="#ff7daf" stroke-width="1.8" stroke-dasharray="6 5"/><text x="156.8" y="219.32" font-family='"Roboto Mono", ui-monospace, monospace' font-size="12" font-weight="600" fill="#ff7daf" text-anchor="middle">on_tool_error</text>
<path d="M220 216 H240" fill="none" stroke="#5cdb6d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-g)"/>
<rect x="244" y="186" width="116" height="74.5" rx="12" fill="url(#glass)" stroke="#ffd427" stroke-width="1.8"/><rect x="244" y="186" width="116" height="26" rx="12" fill="rgba(255,255,255,.04)"/><text x="256" y="204" font-family='"Roboto Mono", ui-monospace, monospace' font-size="12" font-weight="700" fill="#ffd427" text-anchor="start">result</text><text x="256" y="231.5" font-family='"Roboto Mono", ui-monospace, monospace' font-size="11.5" font-weight="400" fill="#ffd427" text-anchor="start">{"status":</text><text x="256" y="248.75" font-family='"Roboto Mono", ui-monospace, monospace' font-size="11.5" font-weight="400" fill="#ffd427" text-anchor="start"> "error"}</text>
<path d="M364 216 H394" fill="none" stroke="#e8eaed" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-w)"/>
<path d="M416 200 C416 211.52 420.48 216 432 216 C420.48 216 416 220.48 416 232 C416 220.48 411.52 216 400 216 C411.52 216 416 211.52 416 200 Z" fill="url(#gem)" opacity="1" filter="url(#glow-s)"/>
<text x="440" y="256" font-family='"Roboto Mono", ui-monospace, monospace' font-size="11" font-weight="500" fill="#bdc1c6" text-anchor="end">retries or</text>
<text x="440" y="270" font-family='"Roboto Mono", ui-monospace, monospace' font-size="11" font-weight="500" fill="#bdc1c6" text-anchor="end">explains</text>
</svg>
