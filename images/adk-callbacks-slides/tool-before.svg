<path d="M194 60 H216" fill="none" stroke="#e8eaed" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-w)"/>
<circle cx="240" cy="60" r="20" fill="#202124" stroke="#ffd427" stroke-width="2" filter="url(#glow-s)"/><g transform="translate(229.0,49.0) scale(0.9167)" fill="none" stroke="#ffd427" stroke-width="2.182" stroke-linecap="round" stroke-linejoin="round" opacity="1"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"/></g>
<g transform="translate(232,52) scale(0.6667)" fill="none" stroke="#ff7daf" stroke-width="3.900" stroke-linecap="round" stroke-linejoin="round" opacity="1"><path d="M7 7l10 10M17 7 7 17"/></g>
<path d="M262 60 H282" fill="none" stroke="#ff7daf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-r)"/>
<rect x="286" y="24" width="150" height="76.0" rx="12" fill="url(#glass)" stroke="#ff7daf" stroke-width="1.8"/><rect x="286" y="24" width="150" height="26" rx="12" fill="rgba(255,255,255,.04)"/><text x="298" y="42" font-family='"Roboto Mono", ui-monospace, monospace' font-size="12" font-weight="700" fill="#ff7daf" text-anchor="start">returns dict</text><text x="298" y="70.0" font-family='"Roboto Mono", ui-monospace, monospace' font-size="12" font-weight="400" fill="#ff7daf" text-anchor="start">{"error":</text><text x="298" y="88.0" font-family='"Roboto Mono", ui-monospace, monospace' font-size="12" font-weight="400" fill="#ff7daf" text-anchor="start"> "Over limit"}</text>
<g transform="translate(300,104) scale(0.8333)" fill="none" stroke="#80868b" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4Z"/></g>
<text x="326" y="119" font-family='"Roboto Mono", ui-monospace, monospace' font-size="11.5" font-weight="500" fill="#80868b" text-anchor="start">tool not run</text>
<path d="M8 146 H436" fill="none" stroke="#3c4043" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5" opacity="1"/>
