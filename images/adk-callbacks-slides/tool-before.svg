<rect x="8" y="180" width="182" height="94.0" rx="12" fill="url(#glass)" stroke="#5cdb6d" stroke-width="1.8"/><rect x="8" y="180" width="182" height="26" rx="12" fill="rgba(255,255,255,.04)"/><text x="20" y="198" font-family='"Roboto Mono", ui-monospace, monospace' font-size="12" font-weight="700" fill="#5cdb6d" text-anchor="start">model calls</text><text x="20" y="226.0" font-family='"Roboto Mono", ui-monospace, monospace' font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">transfer_money(</text><text x="20" y="244.0" font-family='"Roboto Mono", ui-monospace, monospace' font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">  amount=800,</text><text x="20" y="262.0" font-family='"Roboto Mono", ui-monospace, monospace' font-size="12" font-weight="400" fill="#ffd427" text-anchor="start">  currency="thb")</text>
<path d="M194 226 H216" fill="none" stroke="#e8eaed" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-w)"/>
<circle cx="240" cy="226" r="20" fill="#202124" stroke="#ffd427" stroke-width="2" filter="url(#glow-s)"/><g transform="translate(229.0,215.0) scale(0.9167)" fill="none" stroke="#ffd427" stroke-width="2.182" stroke-linecap="round" stroke-linejoin="round" opacity="1"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"/></g>
<g transform="translate(232,218) scale(0.6667)" fill="none" stroke="#ffd427" stroke-width="3.000" stroke-linecap="round" stroke-linejoin="round" opacity="1"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></g>
<path d="M262 226 H282" fill="none" stroke="#5cdb6d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-g)"/>
<rect x="286" y="196" width="150" height="64" rx="12" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2" filter="url(#glow-s)"/>
<g transform="translate(298,206) scale(0.9167)" fill="none" stroke="#5cdb6d" stroke-width="2.400" stroke-linecap="round" stroke-linejoin="round" opacity="1"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4Z"/></g>
<text x="328" y="222" font-family='"Google Sans", "Product Sans", system-ui, sans-serif' font-size="13" font-weight="600" fill="#e8eaed" text-anchor="start">tool runs</text>
<text x="298" y="248" font-family='"Roboto Mono", ui-monospace, monospace' font-size="11.5" font-weight="500" fill="#5cdb6d" text-anchor="start">currency="THB"</text>
