<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 444 290" width="444" height="290" role="img" aria-label="An LlmAgent with six callbacks plugged in by keyword: before_agent, before_model (a list), before_tool, after_model, after_tool and on_tool_error">
