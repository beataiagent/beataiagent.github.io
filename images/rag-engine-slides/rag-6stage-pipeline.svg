<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 220" width="1088" height="220" role="img" aria-label="Six RAG Engine stages: indexing (ingest, chunk, embed, index into the corpus) then query time (retrieve top-K, generate with Gemini)">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34363c"/><stop offset="1" stop-color="#1d1e22"/></linearGradient>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1 L10 5 L0 9 Z" fill="#9aa0a6"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1 L10 5 L0 9 Z" fill="#5cdb6d"/></marker>
    <style>.m{font-family:"Roboto Mono",ui-monospace,monospace}.t{font-family:"Google Sans","Product Sans",system-ui,sans-serif;font-weight:700}.s{font-family:"Google Sans","Product Sans",system-ui,sans-serif}</style>
  </defs>
  <rect width="1088" height="220" fill="#202124"/>
  <rect x="12" y="10" width="696" height="198" rx="16" fill="#18191c" stroke="#57caff" stroke-width="1.5" stroke-opacity=".5"/>
  <rect x="28" y="22" width="206" height="24" rx="12" fill="#57caff" fill-opacity=".14"/>
  <text x="131" y="38" text-anchor="middle" class="m" font-size="11" font-weight="600" fill="#57caff">INDEXING · INGEST → CORPUS</text>
  <rect x="724" y="10" width="352" height="198" rx="16" fill="#18191c" stroke="#5cdb6d" stroke-width="1.5" stroke-opacity=".55"/>
  <rect x="740" y="22" width="206" height="24" rx="12" fill="#5cdb6d" fill-opacity=".14"/>
  <text x="843" y="38" text-anchor="middle" class="m" font-size="11" font-weight="600" fill="#5cdb6d">QUERY · RETRIEVE → GEMINI</text>

  <rect x="28" y="58" width="148" height="132" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <text x="102" y="82" text-anchor="middle" class="m" font-size="11" font-weight="600" fill="#57caff">01 · INGEST</text>
  <text x="102" y="108" text-anchor="middle" class="t" font-size="16" fill="#ffffff">Data Sources</text>
  <line x1="52" y1="120" x2="152" y2="120" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="102" y="140" text-anchor="middle" class="s" font-size="12.5" fill="#bdc1c6" xml:space="preserve">Local files</text>
  <text x="102" y="158" text-anchor="middle" class="s" font-size="12.5" fill="#bdc1c6" xml:space="preserve">Cloud Storage</text>
  <text x="102" y="176" text-anchor="middle" class="s" font-size="12.5" fill="#bdc1c6" xml:space="preserve">Google Drive</text>
  <path d="M179 124 H197" stroke="#9aa0a6" stroke-width="2.2" marker-end="url(#ag)"/>

  <rect x="200" y="58" width="148" height="132" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <text x="274" y="82" text-anchor="middle" class="m" font-size="11" font-weight="600" fill="#57caff">02 · TRANSFORM</text>
  <text x="274" y="108" text-anchor="middle" class="t" font-size="16" fill="#ffffff">Chunking</text>
  <line x1="224" y1="120" x2="324" y2="120" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="274" y="140" text-anchor="middle" class="m" font-size="11.5" fill="#57caff" xml:space="preserve">chunk_size</text>
  <text x="274" y="158" text-anchor="middle" class="m" font-size="11.5" fill="#57caff" xml:space="preserve">chunk_overlap</text>
  <text x="274" y="176" text-anchor="middle" class="s" font-size="12.5" fill="#bdc1c6" xml:space="preserve">Split for recall</text>
  <path d="M351 124 H369" stroke="#9aa0a6" stroke-width="2.2" marker-end="url(#ag)"/>

  <rect x="372" y="58" width="148" height="132" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <text x="446" y="82" text-anchor="middle" class="m" font-size="11" font-weight="600" fill="#57caff">03 · EMBED</text>
  <text x="446" y="108" text-anchor="middle" class="t" font-size="16" fill="#ffffff">Vectorize</text>
  <line x1="396" y1="120" x2="496" y2="120" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="446" y="140" text-anchor="middle" class="m" font-size="11.5" fill="#57caff" xml:space="preserve">[0.12, -0.44,</text>
  <text x="446" y="158" text-anchor="middle" class="m" font-size="11.5" fill="#57caff" xml:space="preserve"> 0.89, …]</text>
  <text x="446" y="176" text-anchor="middle" class="s" font-size="12.5" fill="#bdc1c6" xml:space="preserve">Semantic meaning</text>
  <path d="M523 124 H541" stroke="#9aa0a6" stroke-width="2.2" marker-end="url(#ag)"/>

  <rect x="544" y="58" width="148" height="132" rx="14" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
  <text x="618" y="82" text-anchor="middle" class="m" font-size="11" font-weight="600" fill="#5cdb6d">04 · INDEX</text>
  <text x="618" y="108" text-anchor="middle" class="t" font-size="16" fill="#ffffff">RAG Corpus</text>
  <line x1="568" y1="120" x2="668" y2="120" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="618" y="140" text-anchor="middle" class="s" font-size="12.5" fill="#bdc1c6" xml:space="preserve">Managed corpus</text>
  <text x="618" y="158" text-anchor="middle" class="s" font-size="12.5" fill="#bdc1c6" xml:space="preserve">Vector index</text>
  <text x="618" y="176" text-anchor="middle" class="s" font-size="12.5" fill="#bdc1c6" xml:space="preserve">Fast lookup</text>
  <path d="M695 124 H737" stroke="#5cdb6d" stroke-width="2.2" marker-end="url(#an)"/>

  <rect x="740" y="58" width="148" height="132" rx="14" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
  <text x="814" y="82" text-anchor="middle" class="m" font-size="11" font-weight="600" fill="#5cdb6d">05 · RETRIEVE</text>
  <text x="814" y="108" text-anchor="middle" class="t" font-size="16" fill="#ffffff">Top-K Search</text>
  <line x1="764" y1="120" x2="864" y2="120" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="814" y="140" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d" xml:space="preserve">top_k = 10</text>
  <text x="814" y="158" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d" xml:space="preserve">dist ≤ 0.5</text>
  <text x="814" y="176" text-anchor="middle" class="s" font-size="12.5" fill="#bdc1c6" xml:space="preserve">Filter by relevance</text>
  <path d="M891 124 H909" stroke="#9aa0a6" stroke-width="2.2" marker-end="url(#ag)"/>

  <rect x="912" y="58" width="148" height="132" rx="14" fill="url(#glass)" stroke="#ff7daf" stroke-width="2" filter="url(#glow)"/>
  <text x="986" y="82" text-anchor="middle" class="m" font-size="11" font-weight="600" fill="#ff7daf">06 · GENERATE</text>
  <text x="986" y="108" text-anchor="middle" class="t" font-size="16" fill="#ffffff">Gemini</text>
  <line x1="936" y1="120" x2="1036" y2="120" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="986" y="140" text-anchor="middle" class="s" font-size="12.5" fill="#bdc1c6" xml:space="preserve">Query + context</text>
  <text x="986" y="158" text-anchor="middle" class="s" font-size="12.5" fill="#bdc1c6" xml:space="preserve">Grounded reply</text>
  <text x="986" y="176" text-anchor="middle" class="s" font-size="12.5" fill="#bdc1c6" xml:space="preserve">with citations</text>
</svg>
