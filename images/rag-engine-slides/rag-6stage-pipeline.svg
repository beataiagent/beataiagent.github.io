<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 220" width="1088" height="220">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#57caff"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ffd427"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ff7daf"/></marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .s { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="220" fill="#202124"/>

  <!-- Offline Indexing Zone -->
  <rect x="12" y="10" width="706" height="198" rx="16" fill="#17181b" stroke="#57caff" stroke-width="1.6" stroke-opacity="0.55"/>
  <rect x="26" y="20" width="236" height="22" rx="11" fill="#57caff" fill-opacity="0.14"/>
  <text x="38" y="35" class="m" font-size="11" fill="#57caff" font-weight="600">INDEXING PIPELINE (INGEST → CORPUS)</text>

  <!-- Online Query Zone -->
  <rect x="732" y="10" width="344" height="198" rx="16" fill="#17181b" stroke="#5cdb6d" stroke-width="1.6" stroke-opacity="0.65"/>
  <rect x="746" y="20" width="218" height="22" rx="11" fill="#5cdb6d" fill-opacity="0.14"/>
  <text x="758" y="35" class="m" font-size="11" fill="#5cdb6d" font-weight="600">QUERY TIME (RETRIEVE → GEMINI)</text>

  <!-- Stage 1: Ingest -->
  <rect x="26" y="56" width="152" height="134" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <text x="102" y="80" text-anchor="middle" class="m" font-size="11" fill="#57caff" font-weight="600">01 · INGEST</text>
  <text x="102" y="106" text-anchor="middle" class="t" font-size="15.5">Data Sources</text>
  <text x="102" y="130" text-anchor="middle" class="s" font-size="12.5">Local files</text>
  <text x="102" y="148" text-anchor="middle" class="s" font-size="12.5">Cloud Storage</text>
  <text x="102" y="166" text-anchor="middle" class="s" font-size="12.5">Google Drive</text>

  <path d="M178 123 H198" stroke="#57caff" stroke-width="2.4" marker-end="url(#ab)"/>

  <!-- Stage 2: Transform -->
  <rect x="204" y="56" width="152" height="134" rx="14" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  <text x="280" y="80" text-anchor="middle" class="m" font-size="11" fill="#ffd427" font-weight="600">02 · TRANSFORM</text>
  <text x="280" y="106" text-anchor="middle" class="t" font-size="15.5">Chunking</text>
  <text x="280" y="132" text-anchor="middle" class="m" font-size="11.5" fill="#ffd427">chunk_size</text>
  <text x="280" y="152" text-anchor="middle" class="m" font-size="11.5" fill="#ffd427">chunk_overlap</text>
  <text x="280" y="172" text-anchor="middle" class="s" font-size="12">Split for recall</text>

  <path d="M356 123 H376" stroke="#ffd427" stroke-width="2.4" marker-end="url(#ay)"/>

  <!-- Stage 3: Embed -->
  <rect x="382" y="56" width="152" height="134" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <text x="458" y="80" text-anchor="middle" class="m" font-size="11" fill="#57caff" font-weight="600">03 · EMBED</text>
  <text x="458" y="106" text-anchor="middle" class="t" font-size="15.5">Vectorize</text>
  <text x="458" y="132" text-anchor="middle" class="m" font-size="11.5">[0.12, -0.44,</text>
  <text x="458" y="150" text-anchor="middle" class="m" font-size="11.5"> 0.89, ...]</text>
  <text x="458" y="172" text-anchor="middle" class="s" font-size="12">Semantic meaning</text>

  <path d="M534 123 H554" stroke="#57caff" stroke-width="2.4" marker-end="url(#ab)"/>

  <!-- Stage 4: Index -->
  <rect x="560" y="56" width="144" height="134" rx="14" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2"/>
  <text x="632" y="80" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d" font-weight="600">04 · INDEX</text>
  <text x="632" y="106" text-anchor="middle" class="t" font-size="15.5">RAG Corpus</text>
  <text x="632" y="132" text-anchor="middle" class="s" font-size="12.5">Managed index</text>
  <text x="632" y="150" text-anchor="middle" class="s" font-size="12.5">Fast vector</text>
  <text x="632" y="168" text-anchor="middle" class="s" font-size="12.5">lookup</text>

  <path d="M704 123 H742" stroke="#5cdb6d" stroke-width="2.6" marker-end="url(#ag)"/>

  <!-- Stage 5: Retrieve -->
  <rect x="748" y="56" width="148" height="134" rx="14" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
  <text x="822" y="80" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d" font-weight="600">05 · RETRIEVE</text>
  <text x="822" y="106" text-anchor="middle" class="t" font-size="15.5">Top-K Search</text>
  <text x="822" y="132" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d">top_k=10</text>
  <text x="822" y="152" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d">dist &lt;= 0.5</text>
  <text x="822" y="172" text-anchor="middle" class="s" font-size="12">Filter by relevance</text>

  <path d="M896 123 H914" stroke="#ff7daf" stroke-width="2.4" marker-end="url(#ar)"/>

  <!-- Stage 6: Generate -->
  <rect x="920" y="56" width="142" height="134" rx="14" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.4" filter="url(#glow-s)"/>
  <text x="991" y="80" text-anchor="middle" class="m" font-size="11" fill="#ff7daf" font-weight="600">06 · GENERATE</text>
  <text x="991" y="106" text-anchor="middle" class="t" font-size="15.5">Gemini LLM</text>
  <text x="991" y="132" text-anchor="middle" class="s" font-size="12.5">Query + Context</text>
  <text x="991" y="150" text-anchor="middle" class="s" font-size="12.5">Grounded reply</text>
  <text x="991" y="168" text-anchor="middle" class="s" font-size="12.5">&amp; citations</text>
</svg>
