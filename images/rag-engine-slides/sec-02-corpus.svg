<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Managed RAG Corpus: a vector store holding embedded chunks with nearest-neighbour links">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34363c"/><stop offset="1" stop-color="#1d1e22"/></linearGradient>
    <linearGradient id="spark" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#9168c0"/><stop offset=".45" stop-color="#5684d1"/><stop offset="1" stop-color="#1ba1e3"/></linearGradient>
    <path id="gem" d="M0 -20 C2 -6 6 -2 20 0 C6 2 2 6 0 20 C-2 6 -6 2 -20 0 C-6 -2 -2 -6 0 -20 Z"/>
    <style>.m{font-family:"Roboto Mono",ui-monospace,monospace;letter-spacing:.06em}.t{font-family:"Google Sans","Product Sans",system-ui,sans-serif;font-weight:700}.s{font-family:"Google Sans","Product Sans",system-ui,sans-serif}</style>
    <radialGradient id="amb" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5cdb6d" stop-opacity=".26"/><stop offset="1" stop-color="#5cdb6d" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="256" height="256" fill="#202124"/>
  <circle cx="128" cy="116" r="104" fill="url(#amb)"/>
  <circle cx="128" cy="116" r="92" fill="none" stroke="#5cdb6d" stroke-width="1.6" stroke-dasharray="4 7" stroke-linecap="round" stroke-opacity=".5"/>
  <!-- cylinder body first, lid on top -->
  <path d="M66 62 V160 A62 18 0 0 0 190 160 V62" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.4"/>
  <path d="M66 112 A62 18 0 0 0 190 112" fill="none" stroke="#5cdb6d" stroke-width="1.6" stroke-opacity=".45"/>
  <ellipse cx="128" cy="62" rx="62" ry="18" fill="#263a2b" stroke="#5cdb6d" stroke-width="2.4"/>
  <!-- vectors -->
  <g stroke="#9aa0a6" stroke-width="1.4" stroke-opacity=".7">
    <path d="M94 96 L124 104 L158 94"/>
    <path d="M100 146 L132 152 L162 142"/>
    <path d="M124 104 L132 152" stroke-dasharray="3 4"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="94" cy="96" r="4.5" fill="#57caff"/>
    <circle cx="124" cy="104" r="5.5" fill="#ffd427"/>
    <circle cx="158" cy="94" r="4.5" fill="#ff7daf"/>
    <circle cx="100" cy="146" r="4.5" fill="#5cdb6d"/>
    <circle cx="132" cy="152" r="5.5" fill="#57caff"/>
    <circle cx="162" cy="142" r="4.5" fill="#ffd427"/>
  </g>
  <text x="128" y="238" text-anchor="middle" class="m" font-size="11" font-weight="600" fill="#5cdb6d">MANAGED RAG CORPUS</text>
</svg>
