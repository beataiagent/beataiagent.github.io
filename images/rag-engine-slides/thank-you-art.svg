<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="RAG Engine corpus crowned by a Gemini spark">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34363c"/><stop offset="1" stop-color="#1d1e22"/></linearGradient>
    <linearGradient id="spark" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#9168c0"/><stop offset=".45" stop-color="#5684d1"/><stop offset="1" stop-color="#1ba1e3"/></linearGradient>
    <path id="gem" d="M0 -20 C2 -6 6 -2 20 0 C6 2 2 6 0 20 C-2 6 -6 2 -20 0 C-6 -2 -2 -6 0 -20 Z"/>
    <style>.m{font-family:"Roboto Mono",ui-monospace,monospace;letter-spacing:.06em}.t{font-family:"Google Sans","Product Sans",system-ui,sans-serif;font-weight:700}.s{font-family:"Google Sans","Product Sans",system-ui,sans-serif}</style>
    <radialGradient id="amb" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd427" stop-opacity=".24"/><stop offset="1" stop-color="#ffd427" stop-opacity="0"/></radialGradient>
    <radialGradient id="amb2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#57caff" stop-opacity=".22"/><stop offset="1" stop-color="#57caff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="320" height="320" fill="#202124"/>
  <circle cx="160" cy="150" r="130" fill="url(#amb)"/>
  <circle cx="160" cy="170" r="90" fill="url(#amb2)"/>
  <circle cx="160" cy="150" r="116" fill="none" stroke="#ffd427" stroke-width="1.6" stroke-dasharray="4 8" stroke-linecap="round" stroke-opacity=".5"/>
  <!-- cylinder: body then lid -->
  <path d="M86 122 V206 A74 22 0 0 0 234 206 V122" fill="url(#glass)" stroke="#57caff" stroke-width="2.6"/>
  <path d="M86 166 A74 22 0 0 0 234 166" fill="none" stroke="#5cdb6d" stroke-width="2"/>
  <ellipse cx="160" cy="122" rx="74" ry="22" fill="#2c3a44" stroke="#57caff" stroke-width="2.6"/>
  <use href="#gem" fill="url(#spark)" transform="translate(160 122) scale(.62)"/>
  <!-- crown spark -->
  <use href="#gem" fill="#ffd427" transform="translate(160 66) scale(.9)" filter="url(#glow)"/>
  <text x="160" y="172" text-anchor="middle" class="t" font-size="18" fill="#ffffff">RAG Engine</text>
  <text x="160" y="214" text-anchor="middle" class="m" font-size="10.5" font-weight="600" fill="#5cdb6d">GROUNDED · MODULAR</text>
  <text x="160" y="298" text-anchor="middle" class="m" font-size="12" font-weight="600" fill="#ffd427">AGENT PLATFORM</text>
</svg>
