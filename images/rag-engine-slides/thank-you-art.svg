<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="320" height="320" fill="#202124"/>
  <circle cx="160" cy="145" r="120" fill="url(#amb-y)"/>
  <circle cx="220" cy="100" r="80" fill="url(#amb-b)"/>
  <circle cx="160" cy="160" r="126" fill="none" stroke="#ffd427" stroke-width="2" stroke-dasharray="7 7" opacity="0.45"/>

  <!-- Central Corpus + Gemini Spark -->
  <ellipse cx="160" cy="112" rx="74" ry="24" fill="url(#glass)" stroke="#57caff" stroke-width="2.8"/>
  <path d="M86 112 v84 c0 13 33 24 74 24 s74-11 74-24 v-84" fill="url(#glass)" stroke="#57caff" stroke-width="2.8"/>
  <path d="M86 154 c0 13 33 24 74 24 s74-11 74-24" fill="none" stroke="#5cdb6d" stroke-width="2.2"/>

  <polygon points="160,54 166,72 184,78 166,84 160,102 154,84 136,78 154,72" fill="#ffd427" filter="url(#glow-s)"/>
  <text x="160" y="148" text-anchor="middle" class="t" font-size="16">RAG Engine</text>
  <text x="160" y="196" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d">GROUNDED · MODULAR</text>
  <text x="160" y="274" text-anchor="middle" class="m" font-size="12" fill="#ffd427">AGENT PLATFORM</text>
</svg>
