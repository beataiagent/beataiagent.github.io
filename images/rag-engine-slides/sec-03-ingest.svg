<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Local, GCS and Drive sources merge into one document that is split into chunks">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34363c"/><stop offset="1" stop-color="#1d1e22"/></linearGradient>
    <linearGradient id="spark" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#9168c0"/><stop offset=".45" stop-color="#5684d1"/><stop offset="1" stop-color="#1ba1e3"/></linearGradient>
    <path id="gem" d="M0 -20 C2 -6 6 -2 20 0 C6 2 2 6 0 20 C-2 6 -6 2 -20 0 C-6 -2 -2 -6 0 -20 Z"/>
    <style>.m{font-family:"Roboto Mono",ui-monospace,monospace;letter-spacing:.06em}.t{font-family:"Google Sans","Product Sans",system-ui,sans-serif;font-weight:700}.s{font-family:"Google Sans","Product Sans",system-ui,sans-serif}</style>
    <radialGradient id="amb" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd427" stop-opacity=".26"/><stop offset="1" stop-color="#ffd427" stop-opacity="0"/></radialGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1 L10 5 L0 9 Z" fill="#ffd427"/></marker>
  </defs>
  <rect width="256" height="256" fill="#202124"/>
  <circle cx="128" cy="116" r="104" fill="url(#amb)"/>
  <circle cx="128" cy="116" r="92" fill="none" stroke="#ffd427" stroke-width="1.6" stroke-dasharray="4 7" stroke-linecap="round" stroke-opacity=".5"/>
  <!-- sources -->
  <g class="m" font-size="10" font-weight="600" text-anchor="middle">
    <rect x="38" y="40" width="56" height="28" rx="9" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
    <text x="66" y="58" fill="#57caff">LOCAL</text>
    <rect x="100" y="40" width="56" height="28" rx="9" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
    <text x="128" y="58" fill="#ffd427">GCS</text>
    <rect x="162" y="40" width="56" height="28" rx="9" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
    <text x="190" y="58" fill="#5cdb6d">DRIVE</text>
  </g>
  <!-- merge -->
  <path d="M66 68 V78 Q66 84 72 84 H184 Q190 84 190 78 V68 M128 68 V84" fill="none" stroke="#ffd427" stroke-width="2" stroke-opacity=".8"/>
  <path d="M128 84 V96" stroke="#ffd427" stroke-width="2" marker-end="url(#ah)"/>
  <!-- one document, cut lines -->
  <rect x="58" y="100" width="140" height="22" rx="7" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  <g stroke="#ffd427" stroke-width="1.6" stroke-dasharray="3 3"><line x1="104" y1="96" x2="104" y2="126"/><line x1="152" y1="96" x2="152" y2="126"/></g>
  <g stroke="#5f6368" stroke-width="3" stroke-linecap="round"><line x1="68" y1="111" x2="96" y2="111"/><line x1="114" y1="111" x2="144" y2="111"/><line x1="160" y1="111" x2="188" y2="111"/></g>
  <!-- chunks -->
  <g stroke="#ffd427" stroke-width="2" fill="none" stroke-opacity=".6"><path d="M80 122 L74 138"/><path d="M128 122 V138"/><path d="M176 122 L182 138"/></g>
  <g filter="url(#glow)">
    <rect x="52" y="142" width="44" height="40" rx="10" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
    <rect x="106" y="142" width="44" height="40" rx="10" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
    <rect x="160" y="142" width="44" height="40" rx="10" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  </g>
  <g class="m" font-size="11" font-weight="600" text-anchor="middle" fill="#ffd427">
    <text x="74" y="166">C1</text><text x="128" y="166">C2</text><text x="182" y="166">C3</text>
  </g>
  <text x="128" y="238" text-anchor="middle" class="m" font-size="11" font-weight="600" fill="#ffd427">INGEST &amp; CHUNKING</text>
</svg>
