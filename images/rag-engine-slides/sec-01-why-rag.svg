<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <style>
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="256" height="256" fill="#202124"/>
  <circle cx="110" cy="126" r="96" fill="url(#amb-b)"/>
  <circle cx="182" cy="96" r="72" fill="url(#amb-g)"/>
  <circle cx="128" cy="128" r="100" fill="none" stroke="#57caff" stroke-width="2" stroke-dasharray="6 6" opacity="0.45"/>

  <!-- Stacked Knowledge Docs -->
  <rect x="44" y="68" width="94" height="114" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/>
  <line x1="60" y1="92" x2="122" y2="92" stroke="#57caff" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="110" x2="112" y2="110" stroke="#5f6368" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="126" x2="120" y2="126" stroke="#5f6368" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="142" x2="102" y2="142" stroke="#5cdb6d" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="158" x2="116" y2="158" stroke="#5f6368" stroke-width="3" stroke-linecap="round"/>

  <!-- Retrieval Lens + Gemini Spark -->
  <g transform="translate(166, 134)">
    <circle cx="0" cy="0" r="36" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.8" filter="url(#glow-s)"/>
    <line x1="25" y1="25" x2="44" y2="44" stroke="#5cdb6d" stroke-width="5" stroke-linecap="round"/>
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="#ffd427"/>
  </g>

  <polygon points="196,56 199,64 207,67 199,70 196,78 193,70 185,67 193,64" fill="#57caff" filter="url(#glow-s)"/>
  <text x="128" y="226" text-anchor="middle" class="m" font-size="11.5" fill="#57caff">GROUNDED KNOWLEDGE</text>
</svg>
