<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Knowledge documents searched by a retrieval lens that finds the grounding passage">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34363c"/><stop offset="1" stop-color="#1d1e22"/></linearGradient>
    <linearGradient id="spark" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#9168c0"/><stop offset=".45" stop-color="#5684d1"/><stop offset="1" stop-color="#1ba1e3"/></linearGradient>
    <path id="gem" d="M0 -20 C2 -6 6 -2 20 0 C6 2 2 6 0 20 C-2 6 -6 2 -20 0 C-6 -2 -2 -6 0 -20 Z"/>
    <style>.m{font-family:"Roboto Mono",ui-monospace,monospace;letter-spacing:.06em}.t{font-family:"Google Sans","Product Sans",system-ui,sans-serif;font-weight:700}.s{font-family:"Google Sans","Product Sans",system-ui,sans-serif}</style>
    <radialGradient id="amb" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#57caff" stop-opacity=".26"/><stop offset="1" stop-color="#57caff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="256" height="256" fill="#202124"/>
  <circle cx="128" cy="116" r="104" fill="url(#amb)"/>
  <circle cx="128" cy="116" r="92" fill="none" stroke="#57caff" stroke-width="1.6" stroke-dasharray="4 7" stroke-linecap="round" stroke-opacity=".5"/>
  <!-- back sheet (stack) -->
  <rect x="58" y="44" width="90" height="112" rx="14" fill="#26272b" stroke="#57caff" stroke-width="1.6" stroke-opacity=".4"/>
  <!-- front doc -->
  <rect x="46" y="56" width="90" height="112" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/>
  <g stroke-width="4" stroke-linecap="round">
    <line x1="62" y1="80" x2="110" y2="80" stroke="#57caff"/>
    <line x1="62" y1="98" x2="120" y2="98" stroke="#5f6368"/>
    <line x1="62" y1="114" x2="104" y2="114" stroke="#5f6368"/>
    <line x1="62" y1="130" x2="120" y2="130" stroke="#5cdb6d"/>
    <line x1="62" y1="146" x2="96" y2="146" stroke="#5f6368"/>
  </g>
  <!-- lens on the matching line -->
  <circle cx="150" cy="130" r="32" fill="url(#glass)" fill-opacity=".92" stroke="#5cdb6d" stroke-width="2.6" filter="url(#glow)"/>
  <line x1="173" y1="153" x2="190" y2="170" stroke="#5cdb6d" stroke-width="6" stroke-linecap="round"/>
  <use href="#gem" fill="url(#spark)" transform="translate(150 130) scale(.8)"/>
  <!-- accent spark -->
  <use href="#gem" fill="#ffd427" transform="translate(184 60) scale(.42)" filter="url(#glow)"/>
  <text x="128" y="238" text-anchor="middle" class="m" font-size="11" font-weight="600" fill="#57caff">GROUNDED KNOWLEDGE</text>
</svg>
