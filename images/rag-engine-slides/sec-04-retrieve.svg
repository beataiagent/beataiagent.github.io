<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="256" height="256" fill="#202124"/>
  <circle cx="128" cy="124" r="96" fill="url(#amb-r)"/>
  <circle cx="128" cy="128" r="100" fill="none" stroke="#ff7daf" stroke-width="2" stroke-dasharray="6 6" opacity="0.45"/>

  <!-- Top-K Bars -->
  <rect x="52" y="68" width="152" height="24" rx="8" fill="url(#glass)" stroke="#57caff" stroke-width="1.8"/>
  <rect x="60" y="75" width="98" height="10" rx="5" fill="#57caff" opacity="0.85"/>
  <text x="194" y="84" text-anchor="end" class="m" font-size="10" fill="#57caff">0.18</text>

  <rect x="52" y="100" width="152" height="24" rx="8" fill="url(#glass)" stroke="#5cdb6d" stroke-width="1.8"/>
  <rect x="60" y="107" width="76" height="10" rx="5" fill="#5cdb6d" opacity="0.85"/>
  <text x="194" y="116" text-anchor="end" class="m" font-size="10" fill="#5cdb6d">0.31</text>

  <!-- Gemini Output Card -->
  <rect x="52" y="138" width="152" height="46" rx="12" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.4" filter="url(#glow-s)"/>
  <polygon points="74,151 77,158 84,161 77,164 74,171 71,164 64,161 71,158" fill="#ffd427"/>
  <text x="94" y="158" class="m" font-size="11" fill="#ffffff" font-weight="600">Gemini</text>
  <text x="94" y="173" class="m" font-size="9.5" fill="#ff7daf">Grounded Answer</text>

  <text x="128" y="226" text-anchor="middle" class="m" font-size="11.5" fill="#ff7daf">RETRIEVE &amp; GENERATE</text>
</svg>
