<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" font-family="Roboto Mono, monospace">
  <defs>
    <linearGradient id="cam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4250"/><stop offset="1" stop-color="#1e2229"/></linearGradient>
    <clipPath id="win"><rect x="1" y="1" width="318" height="138" rx="11"/></clipPath>
