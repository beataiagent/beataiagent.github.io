    <clipPath id="win"><rect x="1" y="1" width="318" height="138" rx="11"/></clipPath>
  </defs>
  <g clip-path="url(#win)">
    <rect width="320" height="140" fill="url(#bg)"/>
    <!-- shoulders + neck -->
    <path d="M100 145c6-26 30-36 60-36s54 10 60 36z" fill="#4285f4"/>
    <rect x="150" y="96" width="20" height="16" fill="#e8b48f"/>
