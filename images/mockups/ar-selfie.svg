    <!-- face mesh dots -->
    <g fill="#fff" opacity=".8"><circle cx="140" cy="62" r="1"/><circle cx="150" cy="58" r="1"/><circle cx="160" cy="56" r="1"/><circle cx="170" cy="58" r="1"/><circle cx="180" cy="62" r="1"/><circle cx="136" cy="80" r="1"/><circle cx="184" cy="80" r="1"/><circle cx="142" cy="96" r="1"/><circle cx="178" cy="96" r="1"/><circle cx="160" cy="108" r="1"/><circle cx="150" cy="104" r="1"/><circle cx="170" cy="104" r="1"/><circle cx="160" cy="84" r="1"/></g>
    <!-- party hat -->
    <path d="M136 46 L162 2 L184 44 Z" fill="#fbbc04" stroke="#1e1e1e" stroke-width="1.8" stroke-linejoin="round"/>
