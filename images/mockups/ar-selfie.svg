    <!-- confetti -->
    <g><rect x="92" y="40" width="6" height="3" fill="#ea4335" transform="rotate(30 95 41)"/><rect x="215" y="34" width="6" height="3" fill="#34a853" transform="rotate(-25 218 35)"/><rect x="226" y="70" width="6" height="3" fill="#4285f4" transform="rotate(50 229 71)"/><rect x="84" y="86" width="6" height="3" fill="#fbbc04" transform="rotate(-40 87 87)"/><circle cx="110" cy="62" r="2.5" fill="#4285f4"/><circle cx="208" cy="54" r="2.5" fill="#ea4335"/><circle cx="240" cy="96" r="2.5" fill="#fbbc04"/><circle cx="72" cy="58" r="2.5" fill="#34a853"/><rect x="120" y="28" width="5" height="3" fill="#4285f4" transform="rotate(15 122 29)"/><rect x="198" y="88" width="5" height="3" fill="#ea4335" transform="rotate(-15 200 89)"/></g>
    <!-- title bar -->
    <rect width="320" height="18" fill="#fff"/>
    <circle cx="10" cy="9" r="3" fill="#ea4335"/><circle cx="20" cy="9" r="3" fill="#fbbc04"/><circle cx="30" cy="9" r="3" fill="#34a853"/>
    <text x="44" y="12.5" font-size="8" fill="#1e1e1e">AR Selfie Filter</text>
