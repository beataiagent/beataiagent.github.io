<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 176" width="360" height="176" role="img">
  <defs>
    <filter id="cardShadow" x="-6%" y="-8%" width="112%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3c4043" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#1a73e8"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="360" height="176" rx="16" fill="#f4f8fe"/>
  <!-- Stage 1 -->
  <g filter="url(#cardShadow)">
    <rect x="18" y="46" width="88" height="84" rx="12" fill="#ffffff" stroke="#dadce0"/>
    <rect x="38" y="60" width="48" height="28" rx="6" fill="#f1f3f4"/>
    <circle cx="52" cy="74" r="5" fill="#5f6368"/>
    <path d="M 60 80 L 68 70 L 78 80 Z" fill="#80868b"/>
    <text x="62" y="106" text-anchor="middle" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#202124">Pre-process</text>
    <text x="62" y="119" text-anchor="middle" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#5f6368">Resize · Norm</text>
  </g>
  <line x1="108" y1="88" x2="128" y2="88" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Stage 2: CPU & GPU -->
  <g filter="url(#cardShadow)">
    <rect x="132" y="34" width="104" height="108" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <rect x="164" y="48" width="40" height="40" rx="9" fill="#1a73e8"/>
    <rect x="174" y="58" width="20" height="20" rx="3" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 179 44 V 48 M 189 44 V 48 M 179 88 V 92 M 189 88 V 92 M 160 63 H 164 M 160 73 H 164 M 204 63 H 208 M 204 73 H 208" stroke="#1a73e8" stroke-width="2" stroke-linecap="round"/>
    <text x="184" y="108" text-anchor="middle" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#174ea6">LiteRT Accel</text>
    <text x="184" y="122" text-anchor="middle" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="500" fill="#1a73e8">CPU · GPU</text>
  </g>
  <line x1="238" y1="88" x2="258" y2="88" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <!-- Stage 3 -->
  <g filter="url(#cardShadow)">
    <rect x="262" y="46" width="80" height="84" rx="12" fill="#ffffff" stroke="#dadce0"/>
    <rect x="280" y="60" width="44" height="8" rx="4" fill="#1a73e8"/>
    <rect x="280" y="73" width="32" height="8" rx="4" fill="#8ab4f8"/>
    <rect x="280" y="86" width="20" height="8" rx="4" fill="#d2e3fc"/>
    <text x="302" y="112" text-anchor="middle" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#202124">Outputs</text>
    <text x="302" y="124" text-anchor="middle" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#5f6368">Real-time</text>
  </g>
</svg>
