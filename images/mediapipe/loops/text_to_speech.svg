<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="400" height="225" role="img" aria-label="Text-to-Speech preview">
  <defs>
    <linearGradient id="stageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f5ff"/>
      <stop offset="50%" stop-color="#edf3fc"/>
      <stop offset="100%" stop-color="#e9f1f4"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-5%" width="108%" height="114%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1a73e8" flood-opacity="0.07"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#3c4043" flood-opacity="0.05"/>
    </filter>
  </defs>
  <style>

    .w-a { animation: ttsWordA 3.6s ease-in-out infinite; }
    .w-b { animation: ttsWordB 3.6s ease-in-out infinite; }
    .wave1 { transform-box: fill-box; transform-origin: center; animation: ttsWave1 2.2s ease-in-out infinite; }
    .wave2 { transform-box: fill-box; transform-origin: center; animation: ttsWave2 2.2s ease-in-out infinite; }
    @keyframes ttsWordA {
      0%, 15%, 55%, 100% { fill: #202124; }
      25%, 45% { fill: #1a73e8; }
    }
    @keyframes ttsWordB {
      0%, 45%, 90%, 100% { fill: #202124; }
      55%, 78% { fill: #1a73e8; }
    }
    @keyframes ttsWave1 {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.68); }
    }
    @keyframes ttsWave2 {
      0%, 100% { transform: scaleY(0.75); }
      50% { transform: scaleY(1.18); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
  <rect width="800" height="450" fill="url(#stageBg)"/>

  <g filter="url(#cardShadow)">
    <rect x="56" y="66" width="688" height="318" rx="16" fill="#ffffff" stroke="#e3e9f1" stroke-width="1.2"/>
  </g>
  <rect x="84" y="94" width="632" height="96" rx="12" fill="#f8fafd" stroke="#e3eaf3" stroke-width="1.2"/>
  <text x="110" y="128" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#5f6368" letter-spacing="0.6">TEXT INPUT</text>
  <text x="110" y="162" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="19.5" font-weight="500" fill="#202124">“Turn right onto <tspan class="w-a">Market Street</tspan> in <tspan class="w-b">300 feet.”</tspan></text>

  <rect x="84" y="210" width="632" height="146" rx="12" fill="#f3f7fe" stroke="#dde7f5" stroke-width="1.2"/>
  <text x="110" y="244" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a73e8" letter-spacing="0.6">SYNTHESIZED PCM AUDIO · 24 kHz</text>
  <rect x="596" y="226" width="94" height="26" rx="13" fill="#e6f4ea" stroke="#cce8d4" stroke-width="1.1"/>
  <text x="643" y="243.5" text-anchor="middle" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#188038">RTF 0.08×</text>

