<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="400" height="225" role="img" aria-label="Decision Maker preview">
  <defs>
    <linearGradient id="stageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f5ff"/>
      <stop offset="50%" stop-color="#edf3fc"/>
      <stop offset="100%" stop-color="#e9f1f4"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-5%" width="108%" height="114%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1a73e8" flood-opacity="0.07"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#3c4043" flood-opacity="0.05"/>
    </filter>
  </defs>
  <style>

    .p1 { animation: dmPulse 3.6s ease-in-out infinite; }
    .p2 { animation: dmPulse 3.6s ease-in-out 0.2s infinite; }
    .p3 { animation: dmPulse 3.6s ease-in-out 0.4s infinite; }
    @keyframes dmPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.78; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
  <rect width="800" height="450" fill="url(#stageBg)"/>

  <g filter="url(#cardShadow)">
    <rect x="56" y="66" width="688" height="318" rx="16" fill="#ffffff" stroke="#e3e9f1" stroke-width="1.2"/>
  </g>
  <rect x="84" y="90" width="632" height="62" rx="12" fill="#f8fafd" stroke="#e3eaf3" stroke-width="1.2"/>
  <text x="106" y="127" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#202124">Context: “Flight delayed 4 hrs — passenger missed connection”</text>

  <rect x="84" y="172" width="198" height="184" rx="14" fill="#e6f4ea" stroke="#cce8d4" stroke-width="1.2"/>
  <text x="104" y="208" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12" font-weight="700" fill="#188038" letter-spacing="0.6">CHOICE</text>
  <text x="104" y="242" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="19" font-weight="500" fill="#202124">Rebook flight</text>
  <g class="p1">
    <rect x="104" y="304" width="102" height="30" rx="15" fill="#ffffff" stroke="#cce8d4" stroke-width="1.2"/>
    <text x="155" y="324" text-anchor="middle" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#188038">p = 0.80</text>
  </g>

  <rect x="301" y="172" width="198" height="184" rx="14" fill="#f3f7fe" stroke="#d8e5f8" stroke-width="1.2"/>
  <text x="321" y="208" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12" font-weight="700" fill="#1a73e8" letter-spacing="0.6">BOOLEAN</text>
  <text x="321" y="242" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="19" font-weight="500" fill="#202124">Meal voucher</text>
  <g class="p2">
    <rect x="321" y="304" width="124" height="30" rx="15" fill="#ffffff" stroke="#d2e3fc" stroke-width="1.2"/>
    <text x="383" y="324" text-anchor="middle" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#1a73e8">true (0.78)</text>
  </g>

  <rect x="518" y="172" width="198" height="184" rx="14" fill="#fef7e0" stroke="#f5e2a8" stroke-width="1.2"/>
  <text x="538" y="208" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12" font-weight="700" fill="#b06000" letter-spacing="0.6">RUBRIC SCORE</text>
  <text x="538" y="242" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="19" font-weight="500" fill="#202124">Urgency level</text>
  <g class="p3">
    <rect x="538" y="304" width="108" height="30" rx="15" fill="#ffffff" stroke="#f2d98c" stroke-width="1.2"/>
    <text x="592" y="324" text-anchor="middle" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#b06000">4.0 / 5.0</text>
  </g>
</svg>
