<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="400" height="225" role="img" aria-label="Language Detector preview">
  <defs>
    <linearGradient id="stageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f5ff"/>
      <stop offset="50%" stop-color="#edf3fc"/>
      <stop offset="100%" stop-color="#e9f1f4"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-5%" width="108%" height="114%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1a73e8" flood-opacity="0.07"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#3c4043" flood-opacity="0.05"/>
    </filter>
  </defs>
  <style>

    .res-pulse { animation: ldPulse 3.6s ease-in-out infinite; }
    @keyframes ldPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.84; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
  <rect width="800" height="450" fill="url(#stageBg)"/>

  <g filter="url(#cardShadow)">
    <rect x="56" y="66" width="688" height="318" rx="16" fill="#ffffff" stroke="#e3e9f1" stroke-width="1.2"/>
  </g>
  <text x="88" y="104" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a73e8" letter-spacing="0.6">LANGUAGE DETECTOR · 110 LANGUAGES</text>

  <rect x="88" y="120" width="624" height="70" rx="10" fill="#f8fafd" stroke="#e3eaf3" stroke-width="1.2"/>
  <text x="110" y="162" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="18" font-weight="500" fill="#202124">“Bonjour, où se trouve la gare centrale ?”</text>

