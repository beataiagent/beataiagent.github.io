<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="spark-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="55%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <style>
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="320" height="320" fill="#202124"/>

  <circle cx="160" cy="150" r="142" fill="url(#amb-y)"/>
  <circle cx="120" cy="180" r="95" fill="url(#amb-b)"/>
  <circle cx="206" cy="130" r="85" fill="url(#amb-g)"/>

  <!-- Orbital rings -->
  <circle cx="160" cy="160" r="126" fill="none" stroke="#5f6368" stroke-width="2" stroke-dasharray="7 7"/>
  <circle cx="160" cy="160" r="96" fill="none" stroke="#ffd427" stroke-width="1.6" opacity="0.4"/>

  <!-- Halftone satellite dots -->
  <circle cx="160" cy="34" r="9" fill="#ffd427" filter="url(#glow-s)"/>
  <circle cx="286" cy="160" r="8" fill="#5cdb6d"/>
  <circle cx="160" cy="286" r="8" fill="#ff7daf"/>
  <circle cx="34" cy="160" r="8" fill="#57caff"/>

  <!-- Glowing Data Warehouse Cylinder -->
  <g transform="translate(148, 174)">
    <!-- Cylinder body -->
    <path d="M-58 -36 V32 C-58 46 -32 56 0 56 C32 56 58 46 58 32 V-36 Z" fill="url(#glass)" stroke="#57caff" stroke-width="2.6"/>
    <!-- Middle ring -->
    <path d="M-58 -2 C-58 12 -32 22 0 22 C32 22 58 12 58 -2" fill="none" stroke="#57caff" stroke-width="1.8" opacity="0.65"/>
    <!-- Top ellipse -->
    <ellipse cx="0" cy="-36" rx="58" ry="20" fill="url(#glass-hi)" stroke="#57caff" stroke-width="2.6"/>

    <!-- Analytics Bars emerging from warehouse -->
    <rect x="-32" y="-32" width="14" height="24" rx="4" fill="#57caff" opacity="0.9"/>
    <rect x="-10" y="-48" width="14" height="40" rx="4" fill="#5cdb6d" opacity="0.95"/>
    <rect x="12" y="-38" width="14" height="30" rx="4" fill="#ffd427" opacity="0.95"/>

    <!-- Neon trend line across bars -->
    <path d="M-26 -28 L-3 -46 L20 -36 L40 -58" fill="none" stroke="#ff7daf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-s)"/>
    <circle cx="40" cy="-58" r="4.5" fill="#ff7daf"/>
  </g>

  <!-- Gemini Analytics Spark (top-right) -->
  <polygon points="214,68 222,92 246,100 222,108 214,132 206,108 182,100 206,92" fill="url(#spark-grad)" filter="url(#glow-s)"/>
  <polygon points="94,96 97,104 105,107 97,110 94,118 91,110 83,107 91,104" fill="#ffd427" filter="url(#glow-s)"/>

  <!-- Bottom ribbon -->
  <rect x="48" y="240" width="224" height="32" rx="16" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  <text x="160" y="261" text-anchor="middle" class="m" font-size="12" fill="#ffd427" font-weight="600">QUERY · ANALYZE · VERIFY</text>
</svg>
