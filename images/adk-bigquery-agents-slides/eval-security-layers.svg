<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 240" width="1088" height="240">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#57caff"/></marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/></marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ff7daf"/></marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="240" fill="#202124"/>

  <circle cx="240" cy="120" r="130" fill="url(#amb-b)"/>
  <circle cx="540" cy="120" r="120" fill="url(#amb-r)"/>
  <circle cx="900" cy="120" r="130" fill="url(#amb-g)"/>

  <!-- LEFT PANEL: 3-Layer BigQuery Security Defense -->
  <rect x="14" y="14" width="676" height="212" rx="18" fill="#17181b" stroke="#ff7daf" stroke-width="1.8" stroke-opacity="0.7"/>
  <rect x="28" y="24" width="254" height="22" rx="11" fill="#ff7daf" fill-opacity="0.16"/>
  <text x="155" y="39" text-anchor="middle" class="m" font-size="11" fill="#ff7daf" font-weight="600">3-LAYER BIGQUERY DATA DEFENSE</text>

  <!-- Layer 1: IAM -->
  <rect x="28" y="60" width="192" height="148" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <circle cx="60" cy="88" r="16" fill="#57caff" fill-opacity="0.18" stroke="#57caff" stroke-width="1.8"/>
  <text x="60" y="93" text-anchor="middle" class="m" font-size="13" fill="#57caff" font-weight="600">1</text>
  <text x="84" y="88" class="t" font-size="15" fill="#57caff">Least-Privilege</text>
  <text x="84" y="105" class="t" font-size="15" fill="#57caff">IAM</text>
  <rect x="42" y="122" width="164" height="26" rx="8" fill="#17181b" stroke="#57caff" stroke-width="1.2"/>
  <text x="124" y="139" text-anchor="middle" class="m" font-size="11" fill="#e8eaed">jobUser + dataViewer</text>
  <text x="42" y="170" class="sub" font-size="12">Scoped to approved</text>
  <text x="42" y="187" class="sub" font-size="12">datasets only</text>

  <path d="M220 134 H248" stroke="#57caff" stroke-width="2.6" marker-end="url(#arr-b)"/>

  <!-- Layer 2: Authorized Views -->
  <rect x="256" y="60" width="192" height="148" rx="14" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
  <circle cx="288" cy="88" r="16" fill="#5cdb6d" fill-opacity="0.18" stroke="#5cdb6d" stroke-width="1.8"/>
  <text x="288" y="93" text-anchor="middle" class="m" font-size="13" fill="#5cdb6d" font-weight="600">2</text>
  <text x="312" y="88" class="t" font-size="15" fill="#5cdb6d">Authorized</text>
  <text x="312" y="105" class="t" font-size="15" fill="#5cdb6d">Views</text>
  <rect x="270" y="122" width="164" height="26" rx="8" fill="#17181b" stroke="#5cdb6d" stroke-width="1.2"/>
  <text x="352" y="139" text-anchor="middle" class="m" font-size="11" fill="#e8eaed">Drops email, ssn</text>
  <text x="270" y="170" class="sub" font-size="12">No direct read on</text>
  <text x="270" y="187" class="sub" font-size="12">raw PII tables</text>

  <path d="M448 134 H476" stroke="#5cdb6d" stroke-width="2.6" marker-end="url(#arr-g)"/>

  <!-- Layer 3: Row & Column Policies -->
  <rect x="484" y="60" width="192" height="148" rx="14" fill="url(#glass)" stroke="#ff7daf" stroke-width="2"/>
  <circle cx="516" cy="88" r="16" fill="#ff7daf" fill-opacity="0.18" stroke="#ff7daf" stroke-width="1.8"/>
  <text x="516" y="93" text-anchor="middle" class="m" font-size="13" fill="#ff7daf" font-weight="600">3</text>
  <text x="540" y="88" class="t" font-size="15" fill="#ff7daf">Row &amp; Column</text>
  <text x="540" y="105" class="t" font-size="15" fill="#ff7daf">Policies (RLS)</text>
  <rect x="498" y="122" width="164" height="26" rx="8" fill="#17181b" stroke="#ff7daf" stroke-width="1.2"/>
  <text x="580" y="139" text-anchor="middle" class="m" font-size="11" fill="#e8eaed">Per-User OAuth</text>
  <text x="498" y="170" class="sub" font-size="12">Filters rows by caller</text>
  <text x="498" y="187" class="sub" font-size="12">+ Data Masking</text>

  <!-- RIGHT PANEL: GenAI Eval Gate -->
  <rect x="708" y="14" width="366" height="212" rx="18" fill="url(#glass-hi)" stroke="#5cdb6d" stroke-width="2.2" filter="url(#glow-s)"/>
  <rect x="724" y="24" width="206" height="22" rx="11" fill="#5cdb6d" fill-opacity="0.18"/>
  <text x="827" y="39" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d" font-weight="600">VERTEX AI GENAI EVAL GATE</text>

  <!-- Eval Check Rows -->
  <g transform="translate(724, 60)">
    <rect x="0" y="0" width="334" height="32" rx="9" fill="#17181b" stroke="#57caff" stroke-width="1.4"/>
    <circle cx="18" cy="16" r="8" fill="#57caff" fill-opacity="0.22"/>
    <path d="M14 16 L17 19 L22 13" fill="none" stroke="#57caff" stroke-width="2" stroke-linecap="round"/>
    <text x="34" y="20" class="t" font-size="13">Tool Trajectory</text>
    <text x="322" y="20" text-anchor="end" class="m" font-size="11" fill="#57caff">schema → sql</text>

    <rect x="0" y="40" width="334" height="32" rx="9" fill="#17181b" stroke="#5cdb6d" stroke-width="1.4"/>
    <circle cx="18" cy="56" r="8" fill="#5cdb6d" fill-opacity="0.22"/>
    <path d="M14 56 L17 59 L22 53" fill="none" stroke="#5cdb6d" stroke-width="2" stroke-linecap="round"/>
    <text x="34" y="60" class="t" font-size="13">Result Equivalence</text>
    <text x="322" y="60" text-anchor="end" class="m" font-size="11" fill="#5cdb6d">row-set match</text>

    <rect x="0" y="80" width="334" height="32" rx="9" fill="#17181b" stroke="#ffd427" stroke-width="1.4"/>
    <circle cx="18" cy="96" r="8" fill="#ffd427" fill-opacity="0.22"/>
    <path d="M14 96 L17 99 L22 93" fill="none" stroke="#ffd427" stroke-width="2" stroke-linecap="round"/>
    <text x="34" y="100" class="t" font-size="13">Answer Faithfulness</text>
    <text x="322" y="100" text-anchor="end" class="m" font-size="11" fill="#ffd427">grounded KPIs</text>

    <!-- Bottom CI/CD gate pill -->
    <rect x="0" y="122" width="334" height="28" rx="14" fill="#5cdb6d" fill-opacity="0.16" stroke="#5cdb6d" stroke-width="1.6"/>
    <text x="167" y="140" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d" font-weight="600">$ adk eval · CI/CD RELEASE PASS</text>
  </g>
</svg>
