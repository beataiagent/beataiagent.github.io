<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="256" height="256" fill="#202124"/>

  <circle cx="110" cy="130" r="96" fill="url(#amb-b)"/>
  <circle cx="184" cy="94" r="76" fill="url(#amb-g)"/>
  <circle cx="72" cy="78" r="64" fill="url(#amb-r)"/>
  <circle cx="128" cy="128" r="100" fill="none" stroke="#57caff" stroke-width="2" stroke-dasharray="6 6" opacity="0.45"/>

  <!-- Glowing Database Table Card -->
  <rect x="44" y="84" width="128" height="104" rx="16" fill="url(#glass)" stroke="#57caff" stroke-width="2.4"/>
  <!-- Table header -->
  <rect x="44" y="84" width="128" height="26" rx="16" fill="#57caff" fill-opacity="0.18"/>
  <line x1="44" y1="110" x2="172" y2="110" stroke="#57caff" stroke-width="1.6" opacity="0.7"/>
  <circle cx="60" cy="97" r="3.5" fill="#ff7daf"/>
  <circle cx="72" cy="97" r="3.5" fill="#ffd427"/>
  <circle cx="84" cy="97" r="3.5" fill="#5cdb6d"/>
  <text x="158" y="101" text-anchor="end" class="m" font-size="9.5" fill="#57caff">BQ_TABLE</text>

  <!-- Table grid rows -->
  <rect x="56" y="120" width="38" height="10" rx="4" fill="#57caff" opacity="0.75"/>
  <rect x="102" y="120" width="58" height="10" rx="4" fill="#3c4043"/>
  <rect x="56" y="138" width="38" height="10" rx="4" fill="#5cdb6d" opacity="0.7"/>
  <rect x="102" y="138" width="44" height="10" rx="4" fill="#3c4043"/>
  <rect x="56" y="156" width="38" height="10" rx="4" fill="#ffd427" opacity="0.7"/>
  <rect x="102" y="156" width="52" height="10" rx="4" fill="#3c4043"/>
  <line x1="98" y1="116" x2="98" y2="178" stroke="#5f6368" stroke-width="1.2" opacity="0.6"/>

  <!-- SQL Query Spark Pill (top-left) -->
  <g transform="translate(88, 60)">
    <rect x="-46" y="-15" width="92" height="30" rx="15" fill="url(#glass-hi)" stroke="#ffd427" stroke-width="2" filter="url(#glow-s)"/>
    <polygon points="-30,-7 -28,-2 -23,0 -28,2 -30,7 -32,2 -37,0 -32,-2" fill="#ffd427"/>
    <text x="8" y="4.5" text-anchor="middle" class="m" font-size="11.5" fill="#ffd427" font-weight="600">SELECT *</text>
  </g>

  <!-- Guardrail Shield (right overlapping) -->
  <g transform="translate(178, 128)">
    <path d="M0 -42 L34 -28 V4 C34 27 18 42 0 48 C-18 42 -34 27 -34 4 V-28 Z" fill="url(#glass-hi)" stroke="#5cdb6d" stroke-width="2.6" filter="url(#glow-s)"/>
    <path d="M0 -32 L24 -22 V3 C24 20 12 31 0 36 C-12 31 -24 20 -24 3 V-22 Z" fill="#5cdb6d" fill-opacity="0.14"/>
    <path d="M-11 3 L-3 11 L13 -7" fill="none" stroke="#5cdb6d" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating spark accent -->
  <polygon points="196,62 199,70 207,73 199,76 196,84 193,76 185,73 193,70" fill="#57caff" filter="url(#glow-s)"/>

  <text x="128" y="226" text-anchor="middle" class="m" font-size="11.5" fill="#57caff">GROUNDED AGENTIC SQL</text>
</svg>
