<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <style>
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="256" height="256" fill="#202124"/>

  <circle cx="108" cy="126" r="94" fill="url(#amb-r)"/>
  <circle cx="174" cy="148" r="74" fill="url(#amb-g)"/>
  <circle cx="128" cy="128" r="100" fill="none" stroke="#ff7daf" stroke-width="2" stroke-dasharray="6 6" opacity="0.45"/>

  <!-- IAM Row-Level Lock Shield -->
  <g transform="translate(114, 122)">
    <path d="M0 -64 L54 -44 V4 C54 40 29 63 0 74 C-29 63 -54 40 -54 4 V-44 Z" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.6" filter="url(#glow-s)"/>
    <path d="M0 -52 L42 -36 V3 C42 31 22 49 0 58 C-22 49 -42 31 -42 3 V-36 Z" fill="#ff7daf" fill-opacity="0.1"/>
    <!-- Padlock inside shield -->
    <path d="M-12 -10 V-22 A12 12 0 0 1 12 -22 V-10" fill="none" stroke="#ffd427" stroke-width="3.2" stroke-linecap="round"/>
    <rect x="-18" y="-10" width="36" height="26" rx="6" fill="url(#glass-hi)" stroke="#ffd427" stroke-width="2.2"/>
    <circle cx="0" cy="1" r="3.5" fill="#ffd427"/>
    <line x1="0" y1="4" x2="0" y2="10" stroke="#ffd427" stroke-width="2.4" stroke-linecap="round"/>
    <!-- RLS bars -->
    <rect x="-24" y="26" width="48" height="6" rx="3" fill="#57caff" opacity="0.8"/>
    <rect x="-16" y="36" width="32" height="5" rx="2.5" fill="#5f6368"/>
  </g>

  <!-- Evaluation Checkmark Badge (bottom-right overlapping) -->
  <g transform="translate(174, 158)">
    <circle cx="0" cy="0" r="32" fill="url(#glass-hi)" stroke="#5cdb6d" stroke-width="2.8" filter="url(#glow-s)"/>
    <circle cx="0" cy="0" r="24" fill="#5cdb6d" fill-opacity="0.15"/>
    <path d="M-12 1 L-3 10 L13 -9" fill="none" stroke="#5cdb6d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Eval Score Pill (top-right) -->
  <g transform="translate(178, 72)">
    <rect x="-32" y="-13" width="64" height="26" rx="13" fill="url(#glass-hi)" stroke="#57caff" stroke-width="1.8"/>
    <text x="0" y="4" text-anchor="middle" class="m" font-size="10.5" fill="#57caff" font-weight="600">EVAL OK</text>
  </g>

  <text x="128" y="226" text-anchor="middle" class="m" font-size="11.5" fill="#ff7daf">EVAL + IAM · RLS</text>
</svg>
