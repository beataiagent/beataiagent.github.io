<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 240" width="1088" height="240">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#57caff"/></marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#5cdb6d"/></marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ff7daf"/></marker>
    <marker id="arr-y" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#ffd427"/></marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="240" fill="#202124"/>

  <circle cx="155" cy="112" r="115" fill="url(#amb-b)"/>
  <circle cx="472" cy="112" r="115" fill="url(#amb-y)"/>
  <circle cx="880" cy="60" r="100" fill="url(#amb-g)"/>
  <circle cx="880" cy="168" r="100" fill="url(#amb-r)"/>

  <!-- Left: Generated SQL Card -->
  <rect x="18" y="34" width="286" height="154" rx="18" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/>
  <rect x="34" y="48" width="128" height="22" rx="11" fill="#57caff" fill-opacity="0.16"/>
  <text x="98" y="63" text-anchor="middle" class="m" font-size="11" fill="#57caff" font-weight="600">GENERATED SQL</text>
  <text x="34" y="94" class="t" font-size="18">ADK SQL Agent</text>
  <rect x="34" y="106" width="254" height="36" rx="10" fill="#17181b" stroke="#57caff" stroke-width="1.5"/>
  <text x="161" y="129" text-anchor="middle" class="m" font-size="12.5" fill="#57caff">execute_sql(SELECT ...)</text>
  <text x="34" y="168" class="sub" font-size="13">Intercepted by before_tool_callback</text>

  <!-- Arrow to Policy Gate -->
  <path d="M304 111 H376" stroke="#57caff" stroke-width="3" marker-end="url(#arr-b)"/>

  <!-- Center: dry_run=True Policy Gate Diamond -->
  <g transform="translate(474, 111)">
    <polygon points="0,-74 90,0 0,74 -90,0" fill="url(#glass-hi)" stroke="#ffd427" stroke-width="2.8" filter="url(#glow-s)"/>
    <text x="0" y="-20" text-anchor="middle" class="m" font-size="11.5" fill="#ffd427" font-weight="600">dry_run=True</text>
    <text x="0" y="-3" text-anchor="middle" class="m" font-size="10.5" fill="#bdc1c6">$0 SCAN CHECK</text>
    <text x="0" y="25" text-anchor="middle" class="t" font-size="24" fill="#fff">≤ 10 GB?</text>
  </g>

  <!-- Branch 1: Upper Green Safe Execution -->
  <path d="M564 90 C606 64 614 58 672 58" fill="none" stroke="#5cdb6d" stroke-width="3" marker-end="url(#arr-g)"/>
  <rect x="578" y="34" width="74" height="22" rx="11" fill="#202124" stroke="#5cdb6d" stroke-width="1.6"/>
  <text x="615" y="49" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d" font-weight="600">≤ 10 GB</text>

  <rect x="682" y="18" width="388" height="80" rx="16" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2"/>
  <circle cx="722" cy="58" r="21" fill="#5cdb6d" fill-opacity="0.16" stroke="#5cdb6d" stroke-width="2.2"/>
  <path d="M712 58 L719 65 L733 50" fill="none" stroke="#5cdb6d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="758" y="50" class="t" font-size="17" fill="#5cdb6d">Executes Safely in BigQuery</text>
  <text x="758" y="72" class="m" font-size="12" fill="#bdc1c6">2.4 GB scanned → returns rows to agent</text>

  <!-- Branch 2: Lower Pink Blocked & Rewritten -->
  <path d="M564 132 C606 158 614 164 672 164" fill="none" stroke="#ff7daf" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arr-r)"/>
  <rect x="578" y="164" width="74" height="22" rx="11" fill="#202124" stroke="#ff7daf" stroke-width="1.6"/>
  <text x="615" y="179" text-anchor="middle" class="m" font-size="11" fill="#ff7daf" font-weight="600">&gt; 10 GB</text>

  <rect x="682" y="122" width="388" height="80" rx="16" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.2"/>
  <circle cx="722" cy="162" r="21" fill="#ff7daf" fill-opacity="0.16" stroke="#ff7daf" stroke-width="2.2"/>
  <path d="M713 153 L731 171 M731 153 L713 171" stroke="#ff7daf" stroke-width="3" stroke-linecap="round"/>
  <text x="758" y="152" class="t" font-size="17" fill="#ff7daf">Blocked &amp; Rewritten</text>
  <text x="758" y="174" class="m" font-size="12" fill="#bdc1c6">840 GB blocked → add WHERE event_date</text>

  <!-- Self-correction retry loop back to Generated SQL -->
  <path d="M876 202 V224 H161 V194" fill="none" stroke="#ffd427" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arr-y)"/>
  <rect x="372" y="213" width="328" height="20" rx="10" fill="#202124" stroke="#ffd427" stroke-width="1.5"/>
  <text x="536" y="227" text-anchor="middle" class="m" font-size="11" fill="#ffd427">GEMINI REWRITES WITH PARTITION FILTER &amp; RETRIES</text>
</svg>
