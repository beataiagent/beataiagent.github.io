<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 182" width="1088" height="182">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2026" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <linearGradient id="grad-br" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; font-weight: 400; }
      .mb { font-family: "Roboto Mono", ui-monospace, monospace; fill: #ffffff; font-weight: 600; }
    </style>
  </defs>
  <rect width="1088" height="182" fill="#202124"/>
  <rect width="1088" height="182" fill="url(#dots)"/>

  <circle cx="165" cy="91" r="105" fill="url(#amb-b)"/>
  <circle cx="545" cy="91" r="125" fill="url(#amb-g)"/>
  <circle cx="920" cy="91" r="110" fill="url(#amb-r)"/>

  <!-- Panel 1: Frozen Model -->
  <rect x="18" y="18" width="290" height="146" rx="18" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/>
  <rect x="34" y="32" width="110" height="24" rx="12" fill="#17181b" stroke="#57caff" stroke-width="1.4"/>
  <text x="89" y="48" text-anchor="middle" class="m" font-size="11" fill="#57caff">FROZEN WEIGHTS</text>
  <!-- Neural chip icon -->
  <g transform="translate(82,108)">
    <rect x="-30" y="-30" width="60" height="60" rx="12" fill="#17181b" stroke="#57caff" stroke-width="2.2" filter="url(#glow-s)"/>
    <path d="M-38 -14 H-30 M-38 0 H-30 M-38 14 H-30 M30 -14 H38 M30 0 H38 M30 14 H38 M-14 -38 V-30 M0 -38 V-30 M14 -38 V-30 M-14 30 V38 M0 30 V38 M14 30 V38" stroke="#57caff" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M0 -14 V14 M-14 0 H14 M-10 -10 L10 10 M10 -10 L-10 10" stroke="#57caff" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="136" y="96" class="t" font-size="24">Model</text>
  <text x="136" y="120" class="sub" font-size="14">Never retrained</text>
  <text x="136" y="140" class="m" font-size="12" fill="#57caff">Gemini / API LLM</text>

  <!-- Plus operator -->
  <circle cx="342" cy="91" r="20" fill="#17181b" stroke="#5f6368" stroke-width="2"/>
  <path d="M333 91 H351 M342 82 V100" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Panel 2: Editable Harness -->
  <rect x="376" y="18" width="356" height="146" rx="18" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2"/>
  <rect x="392" y="32" width="136" height="24" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="1.4"/>
  <text x="460" y="48" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d">8 EDITABLE PARTS</text>
  <text x="646" y="49" text-anchor="middle" class="t" font-size="21" fill="#5cdb6d">Harness</text>
  <!-- 4 modular chips inside -->
  <rect x="392" y="68" width="156" height="36" rx="10" fill="#17181b" stroke="#57caff" stroke-width="1.6"/>
  <text x="470" y="91" text-anchor="middle" class="m" font-size="12.5" fill="#57caff">1. Context (4)</text>
  <rect x="560" y="68" width="156" height="36" rx="10" fill="#17181b" stroke="#5cdb6d" stroke-width="1.6"/>
  <text x="638" y="91" text-anchor="middle" class="m" font-size="12.5" fill="#5cdb6d">2. Tools (2)</text>
  <rect x="392" y="114" width="156" height="36" rx="10" fill="#17181b" stroke="#ffd427" stroke-width="1.6"/>
  <text x="470" y="137" text-anchor="middle" class="m" font-size="12.5" fill="#ffd427">3. Subagents (1)</text>
  <rect x="560" y="114" width="156" height="36" rx="10" fill="#17181b" stroke="#ff7daf" stroke-width="1.6"/>
  <text x="638" y="137" text-anchor="middle" class="m" font-size="12.5" fill="#ff7daf">4. Plugins (1)</text>

  <!-- Equals operator -->
  <circle cx="766" cy="91" r="20" fill="#17181b" stroke="#5f6368" stroke-width="2"/>
  <path d="M757 86 H775 M757 96 H775" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Panel 3: Capable Agent -->
  <rect x="800" y="18" width="270" height="146" rx="18" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.2"/>
  <rect x="816" y="32" width="124" height="24" rx="12" fill="#17181b" stroke="#ff7daf" stroke-width="1.4"/>
  <text x="878" y="48" text-anchor="middle" class="m" font-size="11" fill="#ff7daf">SELF-IMPROVING</text>
    <g transform="translate(866,114) scale(0.72)">
    <line x1="0" y1="-44" x2="0" y2="-56" stroke="#ff7daf" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-60" r="5" fill="#ff7daf" filter="url(#glow-s)"/>
    <rect x="-36" y="-44" width="72" height="54" rx="22" fill="#e8eaed" stroke="#ff7daf" stroke-width="2.5"/>
    <rect x="-25" y="-33" width="50" height="32" rx="13" fill="#17181b"/>
    <circle cx="-11" cy="-18" r="5.5" fill="#ff7daf" filter="url(#glow-s)"/>
    <circle cx="11" cy="-18" r="5.5" fill="#ff7daf" filter="url(#glow-s)"/>
    <path d="M-7 -8 Q0 -2 7 -8" fill="none" stroke="#ff7daf" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-24 14 H24 C28 14 26 42 0 46 C-26 42 -28 14 -24 14 Z" fill="#cfd4dc" stroke="#ff7daf" stroke-width="2"/>
    <circle cx="0" cy="28" r="6" fill="#ff7daf" opacity="0.9"/>
  </g>
  <text x="922" y="96" class="t" font-size="24">Agent</text>
  <text x="922" y="120" class="sub" font-size="14">Adapts per task</text>
  <text x="922" y="140" class="m" font-size="12" fill="#ffd427">Higher pass rate</text>

</svg>
