<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 434 230" width="434" height="230">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2026" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <linearGradient id="grad-br" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; font-weight: 400; }
      .mb { font-family: "Roboto Mono", ui-monospace, monospace; fill: #ffffff; font-weight: 600; }
    </style>
  </defs>
  <rect width="434" height="230" fill="#202124"/>
  <rect width="434" height="230" fill="url(#dots)"/>

  <circle cx="330" cy="115" r="130" fill="url(#amb-g)"/>
  <text x="20" y="28" class="mb" font-size="12" fill="#57caff">AVG SCORE PROGRESSION (OUT OF 100)</text>
  <!-- Gridlines (scale: 68 to 84 -> x=138 to 398, 260px span -> 16.25px/pt) -->
  <line x1="170" y1="40" x2="170" y2="200" stroke="#3c4043" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="252" y1="40" x2="252" y2="200" stroke="#3c4043" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="333" y1="40" x2="333" y2="200" stroke="#3c4043" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="170" y="218" text-anchor="middle" class="m" font-size="10.5">70</text>
  <text x="252" y="218" text-anchor="middle" class="m" font-size="10.5">75</text>
  <text x="333" y="218" text-anchor="middle" class="m" font-size="10.5">80</text>

  <!-- Bars -->
  <!-- Base 72.4 -> w = (72.4-68)*16.25 = 71.5 -->
  <text x="130" y="61" text-anchor="end" class="sub" font-size="12">Base harness</text>
  <rect x="138" y="48" width="72" height="16" rx="8" fill="#5f6368"/>
  <text x="218" y="61" class="m" font-size="11.5">72.4</text>

  <!-- ReasoningBank 73.4 -> w = 88 -->
  <text x="130" y="88" text-anchor="end" class="sub" font-size="12">ReasoningBank</text>
  <rect x="138" y="75" width="88" height="16" rx="8" fill="#70757a"/>
  <text x="234" y="88" class="m" font-size="11.5">73.4</text>

  <!-- Harness Scaling 75.3 -> w = 119 -->
  <text x="130" y="115" text-anchor="end" class="sub" font-size="12">Harness Scaling</text>
  <rect x="138" y="102" width="119" height="16" rx="8" fill="#57caff" opacity="0.75"/>
  <text x="265" y="115" class="m" font-size="11.5">75.3</text>

  <!-- Meta-Harness 76.4 -> w = 136 -->
  <text x="130" y="142" text-anchor="end" class="sub" font-size="12">Meta-Harness</text>
  <rect x="138" y="129" width="136" height="16" rx="8" fill="#ffd427" opacity="0.85"/>
  <text x="282" y="142" class="m" font-size="11.5">76.4</text>

  <!-- Harness2 k=1 77.5 -> w = 154 -->
  <text x="130" y="169" text-anchor="end" class="t" font-size="12" fill="#5cdb6d">Harness² k=1</text>
  <rect x="138" y="156" width="154" height="18" rx="9" fill="#5cdb6d" opacity="0.82"/>
  <text x="300" y="170" class="mb" font-size="12" fill="#5cdb6d">77.5</text>

  <!-- Harness2 k=5 80.8 -> w = 208 -->
  <text x="130" y="197" text-anchor="end" class="t" font-size="12.5" fill="#ffffff">Harness² k=5</text>
  <rect x="138" y="183" width="208" height="20" rx="10" fill="url(#grad-bg)" filter="url(#glow-s)"/>
  <text x="354" y="198" class="mb" font-size="12.5" fill="#ffffff">80.8</text>

</svg>
