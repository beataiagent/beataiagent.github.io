<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 172" width="1088" height="172">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2026" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <linearGradient id="grad-br" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; font-weight: 400; }
      .mb { font-family: "Roboto Mono", ui-monospace, monospace; fill: #ffffff; font-weight: 600; }
    </style>
  </defs>
  <rect width="1088" height="172" fill="#202124"/>
  <rect width="1088" height="172" fill="url(#dots)"/>

  <circle cx="180" cy="86" r="105" fill="url(#amb-r)"/>
  <circle cx="544" cy="86" r="105" fill="url(#amb-y)"/>
  <circle cx="908" cy="86" r="115" fill="url(#amb-g)"/>

  <!-- 1. Retrain (Blocked) -->
  <rect x="12" y="14" width="336" height="144" rx="16" fill="url(#glass)" stroke="#ff7daf" stroke-width="2"/>
  <text x="32" y="42" class="m" font-size="11.5" fill="#ff7daf">PATH 1 · RETRAIN</text>
  <!-- GPU rack + red X -->
  <rect x="32" y="58" width="84" height="76" rx="10" fill="#17181b" stroke="#5f6368" stroke-width="1.8"/>
  <line x1="44" y1="78" x2="104" y2="78" stroke="#5f6368" stroke-width="4" stroke-linecap="round"/>
  <line x1="44" y1="96" x2="104" y2="96" stroke="#5f6368" stroke-width="4" stroke-linecap="round"/>
  <line x1="44" y1="114" x2="104" y2="114" stroke="#5f6368" stroke-width="4" stroke-linecap="round"/>
  <circle cx="104" cy="64" r="15" fill="#202124" stroke="#ff7daf" stroke-width="2.2"/>
  <path d="M98 58 L110 70 M110 58 L98 70" stroke="#ff7daf" stroke-width="2.6" stroke-linecap="round"/>
  <text x="136" y="84" class="t" font-size="17">Heavy &amp; Slow</text>
  <text x="136" y="107" class="sub" font-size="13.5">GPUs + labeled data</text>
  <text x="136" y="128" class="m" font-size="12" fill="#ff7daf">✗ Closed API models</text>

  <!-- 2. Hand-tune (Bottleneck) -->
  <rect x="376" y="14" width="336" height="144" rx="16" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  <text x="396" y="42" class="m" font-size="11.5" fill="#ffd427">PATH 2 · MANUAL TUNING</text>
  <!-- Wrench & scattered notes -->
  <rect x="396" y="58" width="84" height="76" rx="10" fill="#17181b" stroke="#ffd427" stroke-width="1.6"/>
  <rect x="408" y="70" width="32" height="24" rx="4" fill="#2a2b2f" stroke="#ffd427" stroke-width="1.4"/>
  <rect x="434" y="84" width="34" height="24" rx="4" fill="#2a2b2f" stroke="#5f6368" stroke-width="1.4"/>
  <path d="M416 116 L456 96" stroke="#ffd427" stroke-width="3" stroke-linecap="round"/>
  <circle cx="460" cy="94" r="6" fill="#ffd427"/>
  <text x="498" y="84" class="t" font-size="17">Doesn't Scale</text>
  <text x="498" y="107" class="sub" font-size="13.5">One engineer per task</text>
  <text x="498" y="128" class="m" font-size="12" fill="#ffd427">! Tribal knowledge</text>

  <!-- 3. Harness2 (Auto-adapts) -->
  <rect x="740" y="14" width="336" height="144" rx="16" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.4" filter="url(#glow-s)"/>
  <text x="760" y="42" class="m" font-size="11.5" fill="#5cdb6d">PATH 3 · HARNESS²</text>
  <!-- Glowing self-loop + library -->
  <rect x="760" y="58" width="84" height="76" rx="10" fill="#17181b" stroke="#5cdb6d" stroke-width="1.8"/>
  <circle cx="802" cy="96" r="22" fill="none" stroke="#5cdb6d" stroke-width="3" stroke-dasharray="95 20"/>
  <polygon points="824,88 830,101 816,99" fill="#5cdb6d"/>
  <circle cx="802" cy="96" r="8" fill="#57caff"/>
  <text x="862" y="84" class="t" font-size="17" fill="#5cdb6d">Auto-Adapts</text>
  <text x="862" y="107" class="sub" font-size="13.5">Edits own harness</text>
  <text x="862" y="128" class="m" font-size="12" fill="#5cdb6d">✓ Frozen weights</text>

</svg>
