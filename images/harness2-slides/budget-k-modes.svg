<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 196" width="1088" height="196">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2026" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <linearGradient id="grad-br" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; font-weight: 400; }
      .mb { font-family: "Roboto Mono", ui-monospace, monospace; fill: #ffffff; font-weight: 600; }
    </style>
  </defs>
  <rect width="1088" height="196" fill="#202124"/>
  <rect width="1088" height="196" fill="url(#dots)"/>

  <circle cx="270" cy="98" r="135" fill="url(#amb-b)"/>
  <circle cx="818" cy="98" r="135" fill="url(#amb-g)"/>

  <!-- LEFT: Parallel Mode -->
  <rect x="14" y="14" width="516" height="168" rx="18" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/>
  <text x="34" y="40" class="mb" font-size="13" fill="#57caff">PARALLEL (DEFAULT) · WIDE SEARCH</text>
  <!-- H0 node -->
  <rect x="34" y="80" width="66" height="44" rx="10" fill="#17181b" stroke="#9aa0a6" stroke-width="1.8"/>
  <text x="67" y="107" text-anchor="middle" class="mb" font-size="14">H₀</text>
  <!-- Fan out lines -->
  <path d="M100 102 C128 102 128 66 156 66" fill="none" stroke="#57caff" stroke-width="2.2"/>
  <path d="M100 102 H156" fill="none" stroke="#57caff" stroke-width="2.2"/>
  <path d="M100 102 C128 102 128 138 156 138" fill="none" stroke="#ffd427" stroke-width="2.2"/>
  <!-- Probes stacked -->
  <rect x="158" y="50" width="138" height="30" rx="8" fill="#17181b" stroke="#57caff" stroke-width="1.6"/>
  <text x="227" y="69" text-anchor="middle" class="m" font-size="11.5" fill="#57caff">k × General probes</text>
  <rect x="158" y="87" width="138" height="30" rx="8" fill="#17181b" stroke="#57caff" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="227" y="106" text-anchor="middle" class="m" font-size="11.5" fill="#bdc1c6">run simultaneously</text>
  <rect x="158" y="124" width="138" height="30" rx="8" fill="#17181b" stroke="#ffd427" stroke-width="1.6"/>
  <text x="227" y="143" text-anchor="middle" class="m" font-size="11.5" fill="#ffd427">k × Domain probes</text>
  <!-- Fan in to Compose -->
  <path d="M298 66 C326 66 326 102 354 102" fill="none" stroke="#5cdb6d" stroke-width="2.2"/>
  <path d="M298 102 H354" fill="none" stroke="#5cdb6d" stroke-width="2.2"/>
  <path d="M298 138 C326 138 326 102 354 102" fill="none" stroke="#5cdb6d" stroke-width="2.2"/>
  <polygon points="350,96 362,102 350,108" fill="#5cdb6d"/>
  <!-- Compose box -->
  <rect x="364" y="68" width="146" height="68" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="2"/>
  <text x="437" y="96" text-anchor="middle" class="t" font-size="14.5" fill="#5cdb6d">k Compositions</text>
  <text x="437" y="118" text-anchor="middle" class="m" font-size="11">shared evidence</text>

  <!-- RIGHT: Sequential Mode -->
  <rect x="558" y="14" width="516" height="168" rx="18" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2"/>
  <text x="578" y="40" class="mb" font-size="13" fill="#5cdb6d">SEQUENTIAL · ITERATIVE DEPTH</text>
  <!-- Chain H0 -> H1 -> H2 -> Hk -->
  <rect x="578" y="76" width="66" height="52" rx="10" fill="#17181b" stroke="#9aa0a6" stroke-width="1.8"/>
  <text x="611" y="107" text-anchor="middle" class="mb" font-size="14">H₀</text>

  <path d="M648 102 H682" stroke="#5cdb6d" stroke-width="2.6"/>
  <polygon points="678,96 690,102 678,108" fill="#5cdb6d"/>

  <rect x="692" y="72" width="102" height="60" rx="10" fill="#17181b" stroke="#57caff" stroke-width="1.8"/>
  <text x="743" y="96" text-anchor="middle" class="t" font-size="13.5" fill="#57caff">Step 1</text>
  <text x="743" y="116" text-anchor="middle" class="m" font-size="11">→ H₁</text>

  <path d="M798 102 H832" stroke="#5cdb6d" stroke-width="2.6"/>
  <polygon points="828,96 840,102 828,108" fill="#5cdb6d"/>

  <rect x="842" y="72" width="102" height="60" rx="10" fill="#17181b" stroke="#ffd427" stroke-width="1.8"/>
  <text x="893" y="96" text-anchor="middle" class="t" font-size="13.5" fill="#ffd427">Step 2</text>
  <text x="893" y="116" text-anchor="middle" class="m" font-size="11">→ H₂</text>

  <path d="M948 102 H976" stroke="#5cdb6d" stroke-width="2.6" stroke-dasharray="4 3"/>
  <polygon points="972,96 984,102 972,108" fill="#5cdb6d"/>

  <rect x="986" y="72" width="70" height="60" rx="10" fill="#17181b" stroke="#5cdb6d" stroke-width="2.2" filter="url(#glow-s)"/>
  <text x="1021" y="98" text-anchor="middle" class="t" font-size="15" fill="#5cdb6d">Hₖ</text>
  <text x="1021" y="116" text-anchor="middle" class="m" font-size="10">final</text>

  <text x="816" y="160" text-anchor="middle" class="m" font-size="11.5" fill="#bdc1c6">Each step carries refined harness + prior traces forward</text>

</svg>
