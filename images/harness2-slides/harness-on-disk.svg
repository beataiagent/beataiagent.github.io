<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 142" width="1088" height="142">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2026" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <linearGradient id="grad-br" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; font-weight: 400; }
      .mb { font-family: "Roboto Mono", ui-monospace, monospace; fill: #ffffff; font-weight: 600; }
    </style>
  </defs>
  <rect width="1088" height="142" fill="#202124"/>
  <rect width="1088" height="142" fill="url(#dots)"/>

  <circle cx="290" cy="71" r="120" fill="url(#amb-b)"/>
  <circle cx="790" cy="71" r="120" fill="url(#amb-g)"/>

  <!-- Root Folder -->
  <rect x="18" y="34" width="176" height="74" rx="14" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  <path d="M36 52 H66 L74 60 H102 V92 H36 Z" fill="#17181b" stroke="#ffd427" stroke-width="1.8"/>
  <text x="142" y="69" text-anchor="middle" class="mb" font-size="13.5">runs/</text>
  <text x="142" y="88" text-anchor="middle" class="m" font-size="11">plain files</text>

  <!-- Fork arrows -->
  <path d="M198 71 H238" stroke="#57caff" stroke-width="2.6"/>
  <polygon points="234,65 246,71 234,77" fill="#57caff"/>

  <!-- Always-On Core -->
  <rect x="250" y="16" width="336" height="110" rx="16" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/>
  <text x="270" y="40" class="mb" font-size="12.5" fill="#57caff">ALWAYS-ON CONTEXT (≤ 24K CHARS)</text>
  <rect x="270" y="52" width="144" height="26" rx="7" fill="#17181b" stroke="#57caff" stroke-width="1.3"/>
  <text x="342" y="69" text-anchor="middle" class="m" font-size="11">systemprompt.md</text>
  <rect x="424" y="52" width="144" height="26" rx="7" fill="#17181b" stroke="#57caff" stroke-width="1.3"/>
  <text x="496" y="69" text-anchor="middle" class="m" font-size="11">guardrails.md</text>
  <rect x="270" y="86" width="144" height="26" rx="7" fill="#17181b" stroke="#57caff" stroke-width="1.3"/>
  <text x="342" y="103" text-anchor="middle" class="m" font-size="11">LongTermMEMORY</text>
  <rect x="424" y="86" width="144" height="26" rx="7" fill="#17181b" stroke="#57caff" stroke-width="1.3"/>
  <text x="496" y="103" text-anchor="middle" class="m" font-size="11">tool_guidance.md</text>

  <!-- Plus connector -->
  <path d="M590 71 H628" stroke="#5cdb6d" stroke-width="2.6"/>
  <polygon points="624,65 636,71 624,77" fill="#5cdb6d"/>

  <!-- On-Demand Toolbox -->
  <rect x="640" y="16" width="290" height="110" rx="16" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2"/>
  <text x="660" y="40" class="mb" font-size="12.5" fill="#5cdb6d">ON-DEMAND TOOLBOX</text>
  <rect x="660" y="52" width="120" height="26" rx="7" fill="#17181b" stroke="#5cdb6d" stroke-width="1.3"/>
  <text x="720" y="69" text-anchor="middle" class="m" font-size="11">AGENT.md</text>
  <rect x="790" y="52" width="120" height="26" rx="7" fill="#17181b" stroke="#5cdb6d" stroke-width="1.3"/>
  <text x="850" y="69" text-anchor="middle" class="m" font-size="11">SKILL.md</text>
  <rect x="660" y="86" width="120" height="26" rx="7" fill="#17181b" stroke="#ffd427" stroke-width="1.3"/>
  <text x="720" y="103" text-anchor="middle" class="m" font-size="11">scripts/*.py</text>
  <rect x="790" y="86" width="120" height="26" rx="7" fill="#17181b" stroke="#ff7daf" stroke-width="1.3"/>
  <text x="850" y="103" text-anchor="middle" class="m" font-size="11">plugin/*.ts</text>

  <!-- Git Diff Badge -->
  <rect x="948" y="28" width="124" height="86" rx="14" fill="url(#glass)" stroke="#ff7daf" stroke-width="2"/>
  <text x="1010" y="56" text-anchor="middle" class="mb" font-size="12" fill="#5cdb6d">+ diffable</text>
  <text x="1010" y="78" text-anchor="middle" class="mb" font-size="12" fill="#57caff">✓ auditable</text>
  <text x="1010" y="100" text-anchor="middle" class="mb" font-size="12" fill="#ffd427">↻ reusable</text>

</svg>
