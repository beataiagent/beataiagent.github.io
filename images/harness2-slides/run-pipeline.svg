<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 118" width="1088" height="118">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2026" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <linearGradient id="grad-br" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; font-weight: 400; }
      .mb { font-family: "Roboto Mono", ui-monospace, monospace; fill: #ffffff; font-weight: 600; }
    </style>
  </defs>
  <rect width="1088" height="118" fill="#202124"/>
  <rect width="1088" height="118" fill="url(#dots)"/>

  <circle cx="544" cy="59" r="190" fill="url(#amb-b)"/>
  <!-- 4 CLI stages -->
  <rect x="16" y="18" width="218" height="82" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <text x="125" y="42" text-anchor="middle" class="m" font-size="11" fill="#57caff">1 · PREPARE</text>
  <text x="125" y="66" text-anchor="middle" class="mb" font-size="13.5">harness2-setup</text>
  <text x="125" y="86" text-anchor="middle" class="m" font-size="11">+ harness2-check</text>

  <path d="M238 59 H278" stroke="#57caff" stroke-width="2.8"/>
  <polygon points="274,53 286,59 274,65" fill="#57caff"/>

  <rect x="290" y="18" width="234" height="82" rx="14" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2" filter="url(#glow-s)"/>
  <text x="407" y="42" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d">2 · REFINE &amp; SOLVE</text>
  <text x="407" y="66" text-anchor="middle" class="mb" font-size="13.5">harness2 --k 1</text>
  <text x="407" y="86" text-anchor="middle" class="m" font-size="11" fill="#ffd427">try --dry-run first</text>

  <path d="M528 59 H568" stroke="#5cdb6d" stroke-width="2.8"/>
  <polygon points="564,53 576,59 564,65" fill="#5cdb6d"/>

  <rect x="580" y="18" width="218" height="82" rx="14" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  <text x="689" y="42" text-anchor="middle" class="m" font-size="11" fill="#ffd427">3 · EVALUATE</text>
  <text x="689" y="66" text-anchor="middle" class="mb" font-size="13.5">harness2-judge</text>
  <text x="689" y="86" text-anchor="middle" class="m" font-size="11">same flags as run</text>

  <path d="M802 59 H842" stroke="#ffd427" stroke-width="2.8"/>
  <polygon points="838,53 850,59 838,65" fill="#ffd427"/>

  <rect x="854" y="18" width="218" height="82" rx="14" fill="url(#glass)" stroke="#ff7daf" stroke-width="2"/>
  <text x="963" y="42" text-anchor="middle" class="m" font-size="11" fill="#ff7daf">4 · SUMMARIZE</text>
  <text x="963" y="66" text-anchor="middle" class="mb" font-size="13.5">harness2-report</text>
  <text x="963" y="86" text-anchor="middle" class="m" font-size="11">scores + diff</text>

</svg>
