<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 152" width="1088" height="152">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2026" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <linearGradient id="grad-br" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; font-weight: 400; }
      .mb { font-family: "Roboto Mono", ui-monospace, monospace; fill: #ffffff; font-weight: 600; }
    </style>
  </defs>
  <rect width="1088" height="152" fill="#202124"/>
  <rect width="1088" height="152" fill="url(#dots)"/>

  <circle cx="180" cy="76" r="105" fill="url(#amb-y)"/>
  <circle cx="544" cy="76" r="105" fill="url(#amb-r)"/>
  <circle cx="908" cy="76" r="105" fill="url(#amb-b)"/>

  <!-- Card 1: Cost multiplier meter -->
  <rect x="14" y="14" width="336" height="124" rx="16" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  <text x="34" y="40" class="mb" font-size="12" fill="#ffd427">COMPUTE MULTIPLIER</text>
  <rect x="34" y="54" width="134" height="32" rx="8" fill="#17181b" stroke="#ffd427" stroke-width="1.5"/>
  <text x="101" y="75" text-anchor="middle" class="mb" font-size="13.5" fill="#ffd427">4 × k exec</text>
  <text x="182" y="75" text-anchor="middle" class="t" font-size="16">+</text>
  <rect x="196" y="54" width="134" height="32" rx="8" fill="#17181b" stroke="#5cdb6d" stroke-width="1.5"/>
  <text x="263" y="75" text-anchor="middle" class="mb" font-size="13.5" fill="#5cdb6d">3 × k edit</text>
  <rect x="34" y="98" width="296" height="24" rx="12" fill="#17181b" stroke="#5f6368" stroke-width="1.2"/>
  <text x="182" y="114" text-anchor="middle" class="m" font-size="11" fill="#bdc1c6">Full LAB @ k=5 ≈ 22,860 runs</text>

  <!-- Card 2: Network Firewall Shield -->
  <rect x="376" y="14" width="336" height="124" rx="16" fill="url(#glass)" stroke="#ff7daf" stroke-width="2"/>
  <text x="396" y="40" class="mb" font-size="12" fill="#ff7daf">NETWORK FIREWALL</text>
  <!-- Shield -->
  <path d="M430 56 L462 66 V94 C462 112 446 122 430 128 C414 122 398 112 398 94 V66 Z" fill="#17181b" stroke="#ff7daf" stroke-width="2.2" filter="url(#glow-s)"/>
  <path d="M420 82 L440 102 M440 82 L420 102" stroke="#ff7daf" stroke-width="2.8" stroke-linecap="round"/>
  <rect x="480" y="56" width="212" height="28" rx="7" fill="#17181b" stroke="#ff7daf" stroke-width="1.4"/>
  <text x="586" y="74" text-anchor="middle" class="m" font-size="11.5" fill="#ff7daf">BLOCK huggingface.co</text>
  <rect x="480" y="92" width="212" height="28" rx="7" fill="#17181b" stroke="#ff7daf" stroke-width="1.4"/>
  <text x="586" y="110" text-anchor="middle" class="m" font-size="11.5" fill="#ff7daf">BLOCK github.com</text>

  <!-- Card 3: Safe launch guardrails -->
  <rect x="738" y="14" width="336" height="124" rx="16" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
  <text x="758" y="40" class="mb" font-size="12" fill="#57caff">SAFE LAUNCH CHECKLIST</text>
  <rect x="758" y="54" width="296" height="26" rx="7" fill="#17181b" stroke="#5cdb6d" stroke-width="1.3"/>
  <text x="772" y="71" class="m" font-size="11.5" fill="#5cdb6d">✓ Set GCP budget alert (no cap)</text>
  <rect x="758" y="88" width="296" height="26" rx="7" fill="#17181b" stroke="#57caff" stroke-width="1.3"/>
  <text x="772" y="105" class="m" font-size="11.5" fill="#57caff">✓ Offline tasks + --max-tasks 1</text>

</svg>
