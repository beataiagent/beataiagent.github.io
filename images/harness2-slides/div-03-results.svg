  <text x="166" y="38" text-anchor="middle" class="mb" font-size="14" fill="#5cdb6d">+8.4 pts</text>
  <text x="128" y="208" text-anchor="middle" class="m" font-size="11" fill="#bdc1c6">WORKBUDDY · LAB</text>

