<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 200" width="1088" height="200">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#363942" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1e2026" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-by" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ffd427"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <linearGradient id="grad-br" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="50%" stop-color="#5cdb6d"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7daf" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff7daf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <style>
      .t { font-family: "Google Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .sub { font-family: "Google Sans", system-ui, sans-serif; fill: #bdc1c6; font-weight: 400; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; font-weight: 400; }
      .mb { font-family: "Roboto Mono", ui-monospace, monospace; fill: #ffffff; font-weight: 600; }
    </style>
  </defs>
  <rect width="1088" height="200" fill="#202124"/>
  <rect width="1088" height="200" fill="url(#dots)"/>

  <circle cx="290" cy="100" r="140" fill="url(#amb-b)"/>
  <circle cx="800" cy="100" r="140" fill="url(#amb-g)"/>

  <!-- Level 1 Box: Inner Task Loop -->
  <rect x="16" y="18" width="510" height="164" rx="18" fill="url(#glass)" stroke="#57caff" stroke-width="2.2"/>
  <rect x="34" y="32" width="166" height="24" rx="12" fill="#17181b" stroke="#57caff" stroke-width="1.5"/>
  <text x="117" y="48" text-anchor="middle" class="mb" font-size="11" fill="#57caff">LEVEL 1 · THIS TASK</text>
  <text x="380" y="48" text-anchor="middle" class="m" font-size="11" fill="#ff7daf">NO SCORE / RUBRIC</text>
  <!-- 3 cycle nodes -->
  <rect x="36" y="76" width="128" height="58" rx="12" fill="#17181b" stroke="#57caff" stroke-width="1.8"/>
  <text x="100" y="102" text-anchor="middle" class="t" font-size="15">Propose</text>
  <text x="100" y="122" text-anchor="middle" class="m" font-size="11">draft edits</text>

  <path d="M168 105 H196" stroke="#57caff" stroke-width="2.5"/>
  <polygon points="193,99 205,105 193,111" fill="#57caff"/>

  <rect x="208" y="76" width="128" height="58" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="1.8"/>
  <text x="272" y="102" text-anchor="middle" class="t" font-size="15">Probe</text>
  <text x="272" y="122" text-anchor="middle" class="m" font-size="11">compare runs</text>

  <path d="M340 105 H368" stroke="#5cdb6d" stroke-width="2.5"/>
  <polygon points="365,99 377,105 365,111" fill="#5cdb6d"/>

  <rect x="380" y="76" width="128" height="58" rx="12" fill="#17181b" stroke="#ffd427" stroke-width="1.8"/>
  <text x="444" y="102" text-anchor="middle" class="t" font-size="15">Compose</text>
  <text x="444" y="122" text-anchor="middle" class="m" font-size="11">merge winners</text>

  <!-- Behavior contrast feedback arc -->
  <path d="M444 138 Q272 174 100 138" fill="none" stroke="#57caff" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="104,132 95,137 104,144" fill="#57caff"/>
  <text x="272" y="169" text-anchor="middle" class="m" font-size="11" fill="#57caff">behavior contrasts</text>

  <!-- Bidirectional bridge between Level 1 & Level 2 -->
  <path d="M532 76 H604" stroke="#5cdb6d" stroke-width="3"/>
  <polygon points="600,69 614,76 600,83" fill="#5cdb6d"/>
  <text x="572" y="66" text-anchor="middle" class="m" font-size="11" fill="#5cdb6d">save</text>

  <path d="M610 124 H538" stroke="#ffd427" stroke-width="3" stroke-dasharray="7 4"/>
  <polygon points="542,117 528,124 542,131" fill="#ffd427"/>
  <text x="572" y="145" text-anchor="middle" class="m" font-size="11" fill="#ffd427">reuse</text>

  <!-- Level 2 Box: Persistent Improvement Library -->
  <rect x="618" y="18" width="454" height="164" rx="18" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2"/>
  <rect x="636" y="32" width="194" height="24" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="1.5"/>
  <text x="733" y="48" text-anchor="middle" class="mb" font-size="11" fill="#5cdb6d">LEVEL 2 · FUTURE TASKS</text>
  <text x="954" y="48" text-anchor="middle" class="m" font-size="11" fill="#ffd427">1 PER DOMAIN</text>
  <!-- Library Shelves -->
  <rect x="636" y="72" width="200" height="92" rx="12" fill="#17181b" stroke="#5cdb6d" stroke-width="1.6"/>
  <text x="736" y="95" text-anchor="middle" class="t" font-size="14.5" fill="#5cdb6d">Improvement Library</text>
  <rect x="650" y="106" width="172" height="18" rx="5" fill="#2a2b2f" stroke="#57caff" stroke-width="1.2"/>
  <text x="736" y="119" text-anchor="middle" class="m" font-size="10.5" fill="#57caff">adopted harnesses</text>
  <rect x="650" y="132" width="172" height="18" rx="5" fill="#2a2b2f" stroke="#ffd427" stroke-width="1.2"/>
  <text x="736" y="145" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">evidence-backed lessons</text>

  <!-- Domain tags on right -->
  <rect x="854" y="72" width="200" height="26" rx="8" fill="#17181b" stroke="#57caff" stroke-width="1.4"/>
  <text x="954" y="89" text-anchor="middle" class="m" font-size="11.5" fill="#e8eaed">Code · Web · Office</text>
  <rect x="854" y="105" width="200" height="26" rx="8" fill="#17181b" stroke="#ffd427" stroke-width="1.4"/>
  <text x="954" y="122" text-anchor="middle" class="m" font-size="11.5" fill="#e8eaed">Legal (LAB domains)</text>
  <rect x="854" y="138" width="200" height="26" rx="8" fill="#17181b" stroke="#ff7daf" stroke-width="1.4"/>
  <text x="954" y="155" text-anchor="middle" class="m" font-size="11.5" fill="#e8eaed">Enterprise (JobBench)</text>

</svg>
