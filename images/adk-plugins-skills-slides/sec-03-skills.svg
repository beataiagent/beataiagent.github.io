<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3d45" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1f2126" stop-opacity="0.99"/>
    </linearGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="256" height="256" fill="#202124"/>
  <circle cx="128" cy="118" r="105" fill="url(#amb-y)"/>
  <circle cx="176" cy="86" r="72" fill="url(#amb-b)"/>

  <!-- Back layered card: scripts/ (Green) -->
  <g transform="translate(150,48) rotate(8)">
    <rect x="-48" y="-12" width="96" height="72" rx="12" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2"/>
    <text x="0" y="10" text-anchor="middle" class="m" font-size="10.5" fill="#5cdb6d">scripts/</text>
    <line x1="-30" y1="22" x2="26" y2="22" stroke="#5cdb6d" stroke-width="2" opacity="0.6"/>
    <line x1="-30" y1="34" x2="16" y2="34" stroke="#5f6368" stroke-width="2"/>
  </g>

  <!-- Mid layered card: references/ (Blue) -->
  <g transform="translate(106,56) rotate(-7)">
    <rect x="-50" y="-12" width="100" height="74" rx="12" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
    <text x="0" y="10" text-anchor="middle" class="m" font-size="10.5" fill="#57caff">references/</text>
    <line x1="-32" y1="22" x2="28" y2="22" stroke="#57caff" stroke-width="2" opacity="0.6"/>
    <line x1="-32" y1="34" x2="20" y2="34" stroke="#5f6368" stroke-width="2"/>
  </g>

  <!-- Foreground Folder Base -->
  <path d="M40 108 C40 100 46 94 54 94 H102 L116 108 H202 C210 108 216 114 216 122 V186 C216 194 210 200 202 200 H54 C46 200 40 194 40 186 Z"
        fill="url(#glass-hi)" stroke="#ffd427" stroke-width="2.6" filter="url(#glow-s)"/>

  <!-- SKILL.md badge inside folder -->
  <rect x="64" y="124" width="128" height="32" rx="9" fill="#17181b" stroke="#ffd427" stroke-width="1.8"/>
  <text x="128" y="145" text-anchor="middle" class="m" font-size="14" fill="#ffd427" font-weight="600">SKILL.md</text>

  <!-- Progressive tier dots -->
  <circle cx="96" cy="176" r="5" fill="#57caff"/>
  <line x1="106" y1="176" x2="120" y2="176" stroke="#5f6368" stroke-width="2"/>
  <circle cx="128" cy="176" r="5" fill="#ffd427"/>
  <line x1="138" y1="176" x2="152" y2="176" stroke="#5f6368" stroke-width="2"/>
  <circle cx="160" cy="176" r="5" fill="#5cdb6d"/>

  <!-- Bottom pill -->
  <rect x="56" y="216" width="144" height="24" rx="12" fill="url(#glass)" stroke="#ffd427" stroke-width="1.6"/>
  <text x="128" y="232" text-anchor="middle" class="m" font-size="11" fill="#ffd427" font-weight="600">AGENT SKILLS</text>
</svg>
