<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57caff"/>
      <stop offset="100%" stop-color="#5cdb6d"/>
    </linearGradient>
    <linearGradient id="grad-yr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd427"/>
      <stop offset="100%" stop-color="#ff7daf"/>
    </linearGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="320" height="320" fill="#202124"/>
  <circle cx="160" cy="154" r="142" fill="url(#amb-y)"/>
  <circle cx="105" cy="160" r="88" fill="url(#amb-b)"/>
  <circle cx="215" cy="160" r="88" fill="url(#amb-g)"/>

  <!-- Orbital rings -->
  <circle cx="160" cy="154" r="126" fill="none" stroke="#5f6368" stroke-width="2" stroke-dasharray="7 7"/>
  <circle cx="160" cy="154" r="96" fill="none" stroke="#ffd427" stroke-width="1.6" opacity="0.4"/>

  <!-- Satellite halftone dots -->
  <circle cx="160" cy="28" r="9" fill="#ffd427" filter="url(#glow-s)"/>
  <circle cx="286" cy="154" r="8" fill="#5cdb6d" filter="url(#glow-s)"/>
  <circle cx="160" cy="280" r="8" fill="#ff7daf" filter="url(#glow-s)"/>
  <circle cx="34" cy="154" r="8" fill="#57caff" filter="url(#glow-s)"/>

  <!-- Left Glowing Plugin Shield -->
  <g transform="translate(114,148)">
    <path d="M0 -56 L48 -36 V8 C48 40 24 62 0 70 C-24 62 -48 40 -48 8 V-36 Z"
          fill="url(#glass)" stroke="url(#grad-bg)" stroke-width="3" filter="url(#glow-s)"/>
    <path d="M-16 4 L-4 16 L20 -10" fill="none" stroke="#5cdb6d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="42" text-anchor="middle" class="m" font-size="10.5" fill="#57caff" font-weight="600">PLUGIN</text>
  </g>

  <!-- Right Modular Skill Puzzle / Cards -->
  <g transform="translate(204,148)">
    <rect x="-42" y="-48" width="84" height="52" rx="14" fill="url(#glass)" stroke="#ffd427" stroke-width="2.6" filter="url(#glow-s)"/>
    <text x="0" y="-26" text-anchor="middle" class="m" font-size="11.5" fill="#ffd427" font-weight="600">SKILL.md</text>
    <line x1="-24" y1="-12" x2="24" y2="-12" stroke="#ffd427" stroke-width="2.2" opacity="0.65"/>
    <!-- Interlocking lower puzzle tile -->
    <rect x="-34" y="12" width="68" height="44" rx="12" fill="url(#glass)" stroke="#ff7daf" stroke-width="2.4"/>
    <circle cx="0" cy="12" r="9" fill="#202124" stroke="#ff7daf" stroke-width="2.2"/>
    <text x="0" y="40" text-anchor="middle" class="m" font-size="10.5" fill="#ff7daf" font-weight="600">REUSE</text>
  </g>

  <!-- Center golden sparkle -->
  <polygon points="160,72 165,86 179,91 165,96 160,110 155,96 141,91 155,86" fill="#ffd427" filter="url(#glow-s)"/>

  <!-- Bottom ribbon -->
  <rect x="60" y="238" width="200" height="32" rx="16" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
  <text x="160" y="259" text-anchor="middle" class="m" font-size="12.5" fill="#ffd427" font-weight="600">PLUGINS + SKILLS</text>
</svg>
