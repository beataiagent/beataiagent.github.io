<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 260" width="1088" height="260">
  <defs>
    <filter id="glow-s" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#303238" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#1d1e22" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="glass-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#383b42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e2025" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="amb-g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cdb6d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cdb6d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#57caff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#57caff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amb-y" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd427" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffd427" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="#57caff"/></marker>
    <style>
      .t { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #ffffff; font-weight: 600; }
      .m { font-family: "Roboto Mono", ui-monospace, monospace; fill: #bdc1c6; }
      .sub { font-family: "Google Sans", "Product Sans", system-ui, sans-serif; fill: #bdc1c6; }
    </style>
  </defs>
  <rect width="1088" height="260" fill="#202124"/>
  <circle cx="544" cy="48" r="150" fill="url(#amb-g)"/>
  <circle cx="240" cy="195" r="110" fill="url(#amb-b)"/>
  <circle cx="848" cy="195" r="110" fill="url(#amb-y)"/>

  <!-- Unified Platform Governance Outer Frame -->
  <rect x="14" y="10" width="1060" height="240" rx="20" fill="none" stroke="#5cdb6d" stroke-width="2.4" stroke-dasharray="8 5"/>

  <!-- Top Bar: Platform Team Plugins -->
  <rect x="28" y="20" width="1032" height="52" rx="14" fill="url(#glass)" stroke="#5cdb6d" stroke-width="2.2" filter="url(#glow-s)"/>
  <text x="46" y="43" class="m" font-size="11.5" fill="#5cdb6d" font-weight="600">PLATFORM TEAM · APP / RUNNER PLUGINS</text>
  <text x="46" y="60" class="sub" font-size="11.5">Enforced across every invocation automatically</text>

  <!-- 4 Plugin Pills -->
  <rect x="430" y="31" width="146" height="30" rx="9" fill="#ff7daf" fill-opacity="0.18" stroke="#ff7daf" stroke-width="1.5"/>
  <text x="503" y="51" text-anchor="middle" class="m" font-size="11.5" fill="#ff7daf" font-weight="600">ModelArmorPlugin</text>

  <rect x="588" y="31" width="148" height="30" rx="9" fill="#5cdb6d" fill-opacity="0.18" stroke="#5cdb6d" stroke-width="1.5"/>
  <text x="662" y="51" text-anchor="middle" class="m" font-size="11.5" fill="#5cdb6d" font-weight="600">GlobalInstruction</text>

  <rect x="748" y="31" width="140" height="30" rx="9" fill="#ffd427" fill-opacity="0.18" stroke="#ffd427" stroke-width="1.5"/>
  <text x="818" y="51" text-anchor="middle" class="m" font-size="11.5" fill="#ffd427" font-weight="600">ReflectAndRetry</text>

  <rect x="900" y="31" width="146" height="30" rx="9" fill="#57caff" fill-opacity="0.18" stroke="#57caff" stroke-width="1.5"/>
  <text x="973" y="51" text-anchor="middle" class="m" font-size="11.5" fill="#57caff" font-weight="600">BigQueryAnalytics</text>

  <!-- Orchestrator Bar -->
  <rect x="274" y="88" width="540" height="36" rx="12" fill="url(#glass-hi)" stroke="#57caff" stroke-width="2"/>
  <text x="544" y="111" text-anchor="middle" class="m" font-size="12.5" fill="#fff" font-weight="600">Orchestrator Agent (root_agent) · Routes to Domain Specialists</text>

  <!-- Fan-out routing arrows -->
  <path d="M400 124 L200 144" stroke="#57caff" stroke-width="2.2" marker-end="url(#arr-b)"/>
  <path d="M544 124 V144" stroke="#57caff" stroke-width="2.2" marker-end="url(#arr-b)"/>
  <path d="M688 124 L888 144" stroke="#57caff" stroke-width="2.2" marker-end="url(#arr-b)"/>

  <!-- Specialist 1: Data Team -->
  <g transform="translate(28,150)">
    <rect width="330" height="88" rx="14" fill="url(#glass)" stroke="#57caff" stroke-width="2"/>
    <text x="16" y="26" class="t" font-size="16" fill="#57caff">Telemetry &amp; Data Agent</text>
    <text x="16" y="45" class="sub" font-size="12">Owned by Data Platform Team</text>
    <rect x="16" y="55" width="102" height="22" rx="7" fill="#17181b" stroke="#ffd427" stroke-width="1.3"/>
    <text x="67" y="70" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">SKILL: bq-query</text>
    <rect x="126" y="55" width="128" height="22" rx="7" fill="#17181b" stroke="#ffd427" stroke-width="1.3"/>
    <text x="190" y="70" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">SKILL: anomaly-sop</text>
  </g>

  <!-- Specialist 2: Creative Studio -->
  <g transform="translate(379,150)">
    <rect width="330" height="88" rx="14" fill="url(#glass)" stroke="#ffd427" stroke-width="2"/>
    <text x="16" y="26" class="t" font-size="16" fill="#ffd427">Creative Studio Agent</text>
    <text x="16" y="45" class="sub" font-size="12">Owned by Brand &amp; Marketing Team</text>
    <rect x="16" y="55" width="126" height="22" rx="7" fill="#17181b" stroke="#ffd427" stroke-width="1.3"/>
    <text x="79" y="70" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">SKILL: brand-voice</text>
    <rect x="150" y="55" width="126" height="22" rx="7" fill="#17181b" stroke="#ffd427" stroke-width="1.3"/>
    <text x="213" y="70" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">SKILL: visual-brief</text>
  </g>

  <!-- Specialist 3: Compliance & Ops -->
  <g transform="translate(730,150)">
    <rect width="330" height="88" rx="14" fill="url(#glass)" stroke="#ff7daf" stroke-width="2"/>
    <text x="16" y="26" class="t" font-size="16" fill="#ff7daf">Compliance &amp; Ops Agent</text>
    <text x="16" y="45" class="sub" font-size="12">Owned by SecOps &amp; SRE Team</text>
    <rect x="16" y="55" width="126" height="22" rx="7" fill="#17181b" stroke="#ffd427" stroke-width="1.3"/>
    <text x="79" y="70" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">SKILL: legal-check</text>
    <rect x="150" y="55" width="130" height="22" rx="7" fill="#17181b" stroke="#ffd427" stroke-width="1.3"/>
    <text x="215" y="70" text-anchor="middle" class="m" font-size="10.5" fill="#ffd427">SKILL: incident-sop</text>
  </g>
</svg>
