    <rect x="70" y="18" width="9" height="16" rx="2" fill="#EA4335" transform="rotate(30 74 26)"/>
    <rect x="236" y="22" width="9" height="16" rx="2" fill="#34A853" transform="rotate(-35 240 30)"/>
    <rect x="288" y="62" width="10" height="18" rx="2" fill="#FBBC04" transform="rotate(20 293 71)"/>
