    <path d="M268 100 C269 106 271 108 277 109 C271 110 269 112 268 118 C267 112 265 110 259 109 C265 108 267 106 268 100Z" fill="#EA4335"/>
    <path d="M40 160 C41 166 43 168 49 169 C43 170 41 172 40 178 C39 172 37 170 31 169 C37 168 39 166 40 160Z" fill="#FBBC04"/>
