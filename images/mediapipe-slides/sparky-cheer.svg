  <g transform="translate(60 132)" fill="#4285F4" opacity=".9"><circle r="9" cx="-6" cy="-6"/><circle r="7" cx="8" cy="6"/></g>
  <g transform="translate(260 132)" fill="#34A853"><use href="#pom"/></g>
  <g transform="translate(260 132)" fill="#4285F4" opacity=".9"><circle r="9" cx="6" cy="-6"/><circle r="7" cx="-8" cy="6"/></g>
