  <path d="M138 220 Q160 222 182 220 Q180 254 160 256 Q140 254 138 220Z" fill="#5D2B12"/>
  <path d="M146 244 Q160 234 174 244 Q168 255 160 255 Q152 255 146 244Z" fill="#F4511E"/>
