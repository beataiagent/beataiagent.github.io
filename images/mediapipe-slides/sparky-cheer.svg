    C73 182 84 160 96 138
    C102 152 110 158 118 152
    C114 118 128 86 152 58
    C154 84 166 98 178 96
    C182 82 186 72 194 62
    C206 92 202 116 210 132
    C220 126 228 116 232 104
    C250 140 250 180 248 214
    C246 262 222 300 160 300Z"/>
