<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 196" width="880" height="196" role="img">
  <defs>
    <filter id="cardShadow" x="-6%" y="-8%" width="112%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3c4043" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#1a73e8"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="880" height="196" rx="16" fill="#f4f8fe"/>
  <text x="26" y="34" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.06em" fill="#1a73e8">REAL-TIME SEMANTIC SEGMENTATION PIPELINE</text>
  <g filter="url(#cardShadow)">
    <rect x="24" y="52" width="184" height="118" rx="13" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
    <text x="40" y="82" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="600" fill="#202124">Image / Video Frame</text>
    <text x="40" y="110" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.8" fill="#3c4043">Portrait, hair, or scene</text>
    <text x="40" y="129" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.8" fill="#5f6368">256x256 / 512x512</text>
  </g>
  <line x1="212" y1="111" x2="234" y2="111" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <g filter="url(#cardShadow)">
    <rect x="240" y="52" width="184" height="118" rx="13" fill="#ffffff" stroke="#dadce0" stroke-width="1.5"/>
    <text x="256" y="82" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="600" fill="#202124">Encoder-Decoder</text>
    <text x="256" y="110" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.8" fill="#3c4043">Selfie, Hair, Multiclass,</text>
    <text x="256" y="129" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.8" fill="#5f6368">or DeepLab-v3</text>
  </g>
  <line x1="428" y1="111" x2="450" y2="111" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <g filter="url(#cardShadow)">
    <rect x="456" y="52" width="184" height="118" rx="13" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
    <text x="472" y="82" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="600" fill="#174ea6">Pixelwise Projection</text>
    <text x="472" y="110" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.8" fill="#3c4043">Per-pixel argmax or</text>
    <text x="472" y="129" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.8" fill="#5f6368">float probabilities</text>
  </g>
  <line x1="644" y1="111" x2="666" y2="111" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <g filter="url(#cardShadow)">
    <rect x="672" y="52" width="184" height="118" rx="13" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
    <text x="688" y="82" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="600" fill="#137333">Segmentation Masks</text>
    <text x="688" y="110" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.8" fill="#3c4043">Uint8 category mask or</text>
    <text x="688" y="129" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.8" fill="#5f6368">float32 confidence masks</text>
