    .b2 { animation: ueBar 2.8s ease-in-out 0.5s infinite; }
    @keyframes ueBar { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.76); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
