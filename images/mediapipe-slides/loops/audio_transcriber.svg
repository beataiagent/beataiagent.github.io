<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="400" height="225" role="img" aria-label="Audio Transcriber preview">
  <defs>
    <linearGradient id="stageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f5ff"/>
      <stop offset="50%" stop-color="#edf3fc"/>
      <stop offset="100%" stop-color="#e9f1f4"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-5%" width="108%" height="114%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1a73e8" flood-opacity="0.07"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#3c4043" flood-opacity="0.05"/>
    </filter>
  </defs>
  <style>

    .wv { transform-box: fill-box; transform-origin: center; }
    .b0 { animation: atWave 1.6s ease-in-out infinite; }
    .b1 { animation: atWave 1.6s ease-in-out 0.25s infinite; }
    .b2 { animation: atWave 1.6s ease-in-out 0.5s infinite; }
    .w2 { animation: atW2 3.8s ease-in-out infinite; }
    .w3 { animation: atW3 3.8s ease-in-out infinite; }
    .cur { animation: atCur 1s steps(2) infinite; }
    @keyframes atWave { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.62); } }
    @keyframes atW2 {
      0%, 15% { fill: #9aa0a6; }
      30%, 50% { fill: #1a73e8; }
      65%, 100% { fill: #202124; }
    }
    @keyframes atW3 {
      0%, 35% { fill: #9aa0a6; }
      55%, 80% { fill: #1a73e8; }
      90%, 100% { fill: #202124; }
    }
    @keyframes atCur { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
  <rect width="800" height="450" fill="url(#stageBg)"/>

