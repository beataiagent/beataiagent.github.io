<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="400" height="225" role="img" aria-label="Text Summarizer preview">
  <defs>
    <linearGradient id="stageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f5ff"/>
      <stop offset="50%" stop-color="#edf3fc"/>
      <stop offset="100%" stop-color="#e9f1f4"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-5%" width="108%" height="114%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1a73e8" flood-opacity="0.07"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#3c4043" flood-opacity="0.05"/>
    </filter>
  </defs>
  <style>

    .l0 { animation: tsLine 3.2s ease-in-out infinite; }
    .l1 { animation: tsLine 3.2s ease-in-out 0.35s infinite; }
    .l2 { animation: tsLine 3.2s ease-in-out 0.7s infinite; }
    .dot-move { animation: tsDot 2.8s ease-in-out infinite; }
    @keyframes tsLine { 0%, 100% { fill: #e8eaed; } 45% { fill: #aecbfa; } }
    @keyframes tsDot { 0% { transform: translateX(0); opacity: 0.4; } 50% { opacity: 1; } 100% { transform: translateX(36px); opacity: 0.4; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
  <rect width="800" height="450" fill="url(#stageBg)"/>

  <g filter="url(#cardShadow)">
    <rect x="44" y="72" width="246" height="308" rx="14" fill="#ffffff" stroke="#e3e9f1" stroke-width="1.2"/>
    <rect x="364" y="72" width="392" height="308" rx="14" fill="#ffffff" stroke="#e3e9f1" stroke-width="1.2"/>
  </g>
  <text x="68" y="108" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="13" font-weight="700" fill="#5f6368" letter-spacing="0.6">SOURCE · 1,420 WORDS</text>
    <rect class="sl l0" x="68" y="132" width="198.0" height="11" rx="5.5" fill="#e8eaed"/>
    <rect class="sl l1" x="68" y="162" width="178.2" height="11" rx="5.5" fill="#e8eaed"/>
    <rect class="sl l2" x="68" y="192" width="198.0" height="11" rx="5.5" fill="#e8eaed"/>
    <rect class="sl l0" x="68" y="222" width="154.4" height="11" rx="5.5" fill="#e8eaed"/>
    <rect class="sl l1" x="68" y="252" width="194.0" height="11" rx="5.5" fill="#e8eaed"/>
    <rect class="sl l2" x="68" y="282" width="178.2" height="11" rx="5.5" fill="#e8eaed"/>
    <rect class="sl l0" x="68" y="312" width="126.7" height="11" rx="5.5" fill="#e8eaed"/>

  <line x1="300" y1="226" x2="346" y2="226" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M340 219 L350 226 L340 233" fill="none" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="dot-move" cx="304" cy="226" r="5" fill="#1e8e3e"/>

  <text x="390" y="108" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a73e8" letter-spacing="0.6">SUMMARY BULLETS</text>

  <rect x="390" y="128" width="340" height="58" rx="10" fill="#e8f0fe" stroke="#b7cdf2" stroke-width="1.2"/>
  <text x="408" y="163" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16" font-weight="700" fill="#202124"><tspan fill="#1a73e8">• </tspan>Keypoints &amp; TL;DR modes</text>

  <rect x="390" y="202" width="340" height="58" rx="10" fill="#ffffff" stroke="#c9d7ef" stroke-width="1.2"/>
  <text x="408" y="237" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16" font-weight="700" fill="#202124"><tspan fill="#1a73e8">• </tspan>Runs locally on CPU &amp; GPU</text>

  <rect x="390" y="276" width="340" height="58" rx="10" fill="#ffffff" stroke="#c9d7ef" stroke-width="1.2"/>
  <text x="408" y="311" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16" font-weight="700" fill="#202124"><tspan fill="#1a73e8">• </tspan>Streaming token callback</text>
</svg>
