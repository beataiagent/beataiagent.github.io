    .b2 { animation: acWaveA 1.8s ease-in-out 0.44s infinite; }
    .b3 { animation: acWaveB 1.8s ease-in-out 0.66s infinite; }
    .fill1 { transform-box: fill-box; transform-origin: left center; animation: acBar 3.6s ease-in-out infinite; }
    .fill2 { transform-box: fill-box; transform-origin: left center; animation: acBar 3.6s ease-in-out 0.12s infinite; }
    .fill3 { transform-box: fill-box; transform-origin: left center; animation: acBar 3.6s ease-in-out 0.24s infinite; }
    @keyframes acWaveA { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.62); } }
    @keyframes acWaveB { 0%, 100% { transform: scaleY(0.76); } 50% { transform: scaleY(1.14); } }
    @keyframes acBar { 0%, 100% { transform: scaleX(1); } 45% { transform: scaleX(0.72); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
