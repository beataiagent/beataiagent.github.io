<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="400" height="225" role="img" aria-label="Text Classifier preview">
  <defs>
    <linearGradient id="stageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f5ff"/>
      <stop offset="50%" stop-color="#edf3fc"/>
      <stop offset="100%" stop-color="#e9f1f4"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-5%" width="108%" height="114%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1a73e8" flood-opacity="0.07"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#3c4043" flood-opacity="0.05"/>
    </filter>
  </defs>
  <style>

    .pos-fill { transform-box: fill-box; transform-origin: left center; animation: tcFill 3.6s ease-in-out infinite; }
    @keyframes tcFill { 0%, 100% { transform: scaleX(1); } 45% { transform: scaleX(0.74); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
  <rect width="800" height="450" fill="url(#stageBg)"/>

  <g filter="url(#cardShadow)">
    <rect x="56" y="66" width="688" height="318" rx="16" fill="#ffffff" stroke="#e3e9f1" stroke-width="1.2"/>
  </g>
  <text x="88" y="104" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a73e8" letter-spacing="0.6">TEXT CLASSIFIER · SENTIMENT</text>

  <rect x="88" y="120" width="624" height="70" rx="10" fill="#f8fafd" stroke="#e3eaf3" stroke-width="1.2"/>
  <text x="110" y="162" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="17" font-weight="500" fill="#202124">“The offline camera filters feel instant and super crisp!”</text>

  <text x="88" y="234" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="15" font-weight="700" fill="#202124">Positive</text>
  <rect x="200" y="224" width="424" height="10" rx="5" fill="#f1f3f4"/>
  <rect class="pos-fill" x="200" y="224" width="411" height="10" rx="5" fill="#1e8e3e"/>
  <text x="712" y="234" text-anchor="end" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#1e8e3e">97.0%</text>

  <text x="88" y="282" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="15" fill="#5f6368">Neutral</text>
  <rect x="200" y="272" width="424" height="10" rx="5" fill="#f1f3f4"/>
  <rect x="200" y="272" width="18" height="10" rx="5" fill="#5f6368"/>
  <text x="712" y="282" text-anchor="end" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#5f6368">2.0%</text>

  <text x="88" y="330" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="15" fill="#5f6368">Negative</text>
  <rect x="200" y="320" width="424" height="10" rx="5" fill="#f1f3f4"/>
  <rect x="200" y="320" width="14" height="10" rx="5" fill="#5f6368"/>
  <text x="712" y="330" text-anchor="end" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#5f6368">1.0%</text>
</svg>
