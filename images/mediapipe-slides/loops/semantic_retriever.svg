<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="400" height="225" role="img" aria-label="Semantic Retriever preview">
  <defs>
    <linearGradient id="stageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f5ff"/>
      <stop offset="50%" stop-color="#edf3fc"/>
      <stop offset="100%" stop-color="#e9f1f4"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-5%" width="108%" height="114%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1a73e8" flood-opacity="0.07"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#3c4043" flood-opacity="0.05"/>
    </filter>
  </defs>
  <style>

    .hit1 { animation: srHit 3.6s ease-in-out infinite; }
    @keyframes srHit { 0%, 100% { opacity: 1; } 50% { opacity: 0.85; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
  <rect width="800" height="450" fill="url(#stageBg)"/>

  <g filter="url(#cardShadow)">
    <rect x="56" y="66" width="688" height="318" rx="16" fill="#ffffff" stroke="#e3e9f1" stroke-width="1.2"/>
  </g>
  <rect x="84" y="90" width="632" height="62" rx="12" fill="#f8fafd" stroke="#e3eaf3" stroke-width="1.2"/>
  <circle cx="115" cy="119" r="6.5" fill="none" stroke="#1a73e8" stroke-width="2.4"/>
  <line x1="120" y1="124" x2="126" y2="130" stroke="#1a73e8" stroke-width="2.4" stroke-linecap="round"/>
  <text x="140" y="127" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="18.5" font-weight="500" fill="#202124">Query: “battery runtime in freezing weather”</text>

  <g class="hit1">
    <rect x="84" y="170" width="632" height="86" rx="12" fill="#e6f4ea" stroke="#81c995" stroke-width="1.5"/>
    <rect x="106" y="184" width="118" height="25" rx="12.5" fill="#ffffff" stroke="#cce8d4" stroke-width="1.1"/>
    <text x="165" y="201" text-anchor="middle" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#188038">Top-1 · 0.94</text>
    <text x="106" y="236" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16" font-weight="500" fill="#202124">Battery saver extends cold-weather runtime up to 14 hours.</text>
  </g>

  <rect x="84" y="270" width="632" height="86" rx="12" fill="#f8fafd" stroke="#e3eaf3" stroke-width="1.2"/>
  <rect x="106" y="284" width="118" height="25" rx="12.5" fill="#ffffff" stroke="#e0e5ec" stroke-width="1.1"/>
  <text x="165" y="301" text-anchor="middle" font-family="'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#5f6368">Top-2 · 0.87</text>
  <text x="106" y="336" font-family="'Google Sans', 'Google Sans Text', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16" font-weight="500" fill="#202124">Pre-condition the battery before sub-zero outdoor flights.</text>
</svg>
