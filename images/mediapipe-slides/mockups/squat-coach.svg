<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" font-family="Roboto Mono, monospace">
  <defs><clipPath id="win"><rect x="1" y="1" width="318" height="138" rx="11"/></clipPath></defs>
  <g clip-path="url(#win)">
    <rect width="320" height="140" fill="#1e2433"/>
    <rect x="0" y="122" width="230" height="18" fill="#2a3245"/>
    <!-- standing ghost (start / end of a rep) -->
    <g stroke="#fff" stroke-width="1.2" stroke-dasharray="3 2" fill="none" opacity=".45"><circle cx="70" cy="40" r="8"/><path d="M70 50 L70 84 M70 58 L60 76 M70 58 L80 76 M70 84 L64 104 L64 122 M70 84 L76 104 L76 122"/></g>
    <!-- live skeleton: squatting, side view -->
    <g stroke="#34a853" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M146 56 L124 90 L156 96 L150 122 M146 56 L170 66 L192 64 M124 90 L132 92"/></g>
    <circle cx="150" cy="44" r="8" fill="none" stroke="#34a853" stroke-width="2.2"/>
    <g fill="#fbbc04"><circle cx="146" cy="56" r="2.2"/><circle cx="170" cy="66" r="2"/><circle cx="192" cy="64" r="2.2"/><circle cx="124" cy="90" r="2.4"/><circle cx="156" cy="96" r="2.6"/><circle cx="150" cy="122" r="2.2"/></g>
    <!-- knee angle -->
    <path d="M144 94 A12 12 0 0 1 153 108" fill="none" stroke="#4285f4" stroke-width="2.4"/>
    <rect x="160" y="100" width="34" height="14" rx="7" fill="#4285f4"/><text x="177" y="109.5" font-size="7.5" fill="#fff" text-anchor="middle" font-weight="700">88°</text>
    <!-- Good rep! -->
    <rect x="96" y="24" width="66" height="16" rx="8" fill="#34a853"/><text x="129" y="35" font-size="8" fill="#fff" text-anchor="middle" font-weight="700">Good rep! ✓</text>
    <!-- HUD -->
    <rect x="236" y="26" width="76" height="50" rx="8" fill="#fff"/>
    <text x="274" y="38" font-size="6.5" fill="#5f6368" text-anchor="middle">squats</text>
    <text x="274" y="62" font-size="22" fill="#1e1e1e" text-anchor="middle" font-weight="700">7</text>
    <rect x="236" y="82" width="76" height="20" rx="7" fill="#fbbc04"/><text x="274" y="95" font-size="7.5" fill="#1e1e1e" text-anchor="middle" font-weight="700">knee 88°</text>
    <rect x="236" y="108" width="36" height="16" rx="6" fill="#34a853"/><text x="254" y="119" font-size="7" fill="#fff" text-anchor="middle" font-weight="700">Start</text>
    <rect x="276" y="108" width="36" height="16" rx="6" fill="#ea4335"/><text x="294" y="119" font-size="7" fill="#fff" text-anchor="middle" font-weight="700">Stop</text>
    <rect width="320" height="18" fill="#fff"/>
    <circle cx="10" cy="9" r="3" fill="#ea4335"/><circle cx="20" cy="9" r="3" fill="#fbbc04"/><circle cx="30" cy="9" r="3" fill="#34a853"/>
    <text x="44" y="12.5" font-size="8" fill="#1e1e1e">Squat Coach</text>
    <text x="312" y="12.5" font-size="7" fill="#5f6368" text-anchor="end">● camera on</text>
  </g>
  <rect x="1" y="1" width="318" height="138" rx="11" fill="none" stroke="#1e1e1e" stroke-width="2"/>
</svg>
